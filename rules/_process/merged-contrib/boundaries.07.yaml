# data/contrib/boundaries.07.yaml
# Purpose: ch.07's owner-block for data/boundaries.yaml. The five handlers 00 reserved for ch.07 are DEFINED in 07
#   (rule ids below) and restated here with their rule ids; seven handlers are added.
# Ordering note: 00.7.5 orders handlers within a phase by owner chapter number, which would run ch.05's rest handlers
#   before h.07.rest_recovery. Rest QUALITY is computed when ch.07 marks the rest boundary and travels in the boundary
#   payload (07.8.1), so no handler depends on the order; ch.05 asked that h.07.rest_recovery run first, which is
#   recorded as `before` below and filed as an Interface request to 00 (a within-phase `before` key).
# Owner: 07-harm-recovery-death. Schema: data/SCHEMAS.md#boundariesyaml. Phases per 00.7.5.

schema_version: 1
blocks:
- owner: '07'
  handlers:

  - {id: h.07.after_conflict, boundary: conflict_end, phase: 3, interrupting: false, effect: 'run the defeat disposition
      if the PC is Down, yielded or captured (PR-07-7); if anyone is Dying keep time in rounds until the ladder resolves;
      write setback facts', rule_id: 07.6.1; PR-07-7, status: reserved by 00; defined}
  - {id: h.07.affliction_onset, boundary: interval, phase: 2, interrupting: false, effect: end onsets that have run out
      (stage 1 begins); run stage checks of afflictions on the interval cadence (PR-07-9), rule_id: 07.9.3; PR-07-9, status: reserved
      by 00; defined}
  - {id: h.07.fatigue, boundary: watch, phase: 4, interrupting: false, effect: 'advance watches_awake; apply cond.exhausted
      at 4, 6, 8; S2 harm each watch beyond 8 (lethal: false)', rule_id: 07.8.10, status: reserved by 00; defined}
  - {id: h.07.natural_recovery, boundary: day, phase: 3, interrupting: false, effect: tick every recovery clock from rested_today
      / treated_today / bed_rest_today (T-07-15); heal completed wounds; write scars; turn an unoperated Catastrophic wound
      into a maim at day 7; clear the three flags, rule_id: 07.8.7; PR-07-10, status: reserved by 00; defined}
  - id: h.07.rest_recovery
    boundary: [breather, rest_short, rest_long]
    phase: 3
    interrupting: false
    effect: restore Vitality by rest type and quality (T-07-14); clear wound load; heal Light and Moderate wounds; remove
      exhausted stacks; ease dread; set rested_today. Reads quality from the boundary payload; requested to run before h.05.focus_recover
      and h.05.rest_recharge
    rule_id: 07.8.5; PR-07-8
    status: reserved by 00; defined
    before: [h.05.focus_recover, h.05.rest_recharge]
  - id: h.07.dying_check
    boundary: [turn_end, round]
    phase: 2
    interrupting: false
    effect: 'turn_end: the dying check of a Dying character whose turn it is (07.2.7); round: the same for a Dying character
      outside a conflict, and +1 on every clk.bleeding_out'
    rule_id: 07.2.7; 07.12.1; PR-07-3
    status: added
  - id: h.07.lethal_scan
    boundary: [scene_start, conflict_start]
    phase: 7
    interrupting: false
    effect: evaluate the lethal-warning rows (07.3.3) and the danger notice (07.3.8) against the framed scene; raise trg.lethal_warning
      / trg.danger_notice. The same rows are also evaluated whenever their state changes
    rule_id: 07.3.3; 07.3.8; PR-07-4
    status: added
  - {id: h.07.load_clear, boundary: scene_end, phase: 1, interrupting: false, effect: clear wound_load; end lethal contexts
      whose `ends` is scene_end; heal Light wounds, rule_id: 07.2.6; 07.3.5, status: added}
  - {id: h.07.affliction_day, boundary: day, phase: 2, interrupting: false, effect: stage checks of afflictions on the day
      cadence; stage harm; contagion exposures; the 7-day wound_rot exposure of an unticked Grievous wound, rule_id: 07.9.3;
      07.9.8; PR-07-9, status: added}
  - {id: h.07.curse_cycle, boundary: week, phase: 2, interrupting: false, effect: stage checks of curses on the week cadence;
      haunt effects keyed to the week; the weekly captivity dread check, rule_id: 07.9.7; 07.11.2, status: added}
  - id: h.07.vitality_max
    boundary: [reflection, season]
    phase: 9
    interrupting: false
    effect: recompute maximum Vitality from base, power_band, effects and wound penalties (07.1.2); raise current by the
      same amount when power_band rose
    rule_id: 07.1.2; DL-00-04
    status: added
  - {id: h.07.career_end, boundary: scene_end, phase: 8, interrupting: false, effect: 'if career_end is written (the fourth
      break, 07.11.6) hand the character to ch.11''s retirement procedure', rule_id: 07.11.6, status: added}
