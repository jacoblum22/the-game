# data/contrib/effects.05.yaml
# Purpose: ch.05's owner-block for data/effects.yaml. Six definitions, each added because no core effect with
#   parameters expresses the mechanic (PR-00-8), each using one of the 20 closed operations and one of the four
#   regimes. Everything else in abilities.yaml, rituals.yaml and composites.yaml references the core library.
# Owner: 05-abilities-focus-magic. Schema: data/SCHEMAS.md#effectsyaml. Decision: DL-05-25.

schema_version: 1
blocks:
- owner: '05'
  entries:
  - id: eff.05.spell_delivery
    op: claim_slot
    slot: slot.spell_delivery
    regime: priority_exclusive
    params: {priority_rank: int, form: touch|bolt|line|burst|cone|chain|zone, duration: duration, cosmetic_merge: bool}
    text: Your workings project as {form}.
    why_not_core: the core library seeds claims for strike delivery, movement, stance, aura and body form but none for slot.spell_delivery
    lifecycle: provisional
    basis: [05.10.4, T-00-14 slot.spell_delivery, DL-05-25]
  - id: eff.05.defense_reaction
    op: claim_slot
    slot: slot.defense_reaction
    regime: priority_exclusive
    hook: on_hit_taken
    params: {priority_rank: int, form: str, effects: '[effect_ref]'}
    text: When you are hit you answer with {form}.
    why_not_core: no core claim exists for slot.defense_reaction; blocks, parries and wards must compete for one slot by rank
    lifecycle: provisional
    basis: [05.10.3, T-00-14 slot.defense_reaction, DL-05-25]
  - id: eff.05.waive
    op: prevent
    regime: additive
    params: {event_kind: 'a named snag, provoked reaction, restriction or cost', applies_when: expr}
    text: '{event_kind} is not applied {applies_when}.'
    why_not_core: the Exception form needs to negate one named rule consequence (a snag, a provoked reaction); eff.prevent_hit only negates hits
    lifecycle: provisional
    basis: [05.3.2 Exception form, DL-05-25]
  - id: eff.05.refresh_use
    op: resource
    regime: independent_trigger
    hook: per ability (refresh_on)
    params: {ability: ab.*|self, uses: 1..2}
    text: '{ability} regains {uses} use.'
    why_not_core: trigger-refreshed recharge (R3 05.8) returns a USE, which eff.restore's quantity list does not include
    lifecycle: provisional
    basis: [05.4.6, 00.3.11 (uses are counted in units), DL-05-25]
  - id: eff.05.counter_working
    op: prevent
    regime: independent_trigger
    hook: on_declare
    params: {applies_when: another entity within band.near declares a working with trait.nature.magical, limits: limits}
    text: Negate one working as it is cast.
    why_not_core: eff.prevent_hit subscribes to on_hit_taken; a counter must cancel a declared working before it resolves
    lifecycle: provisional
    basis: [05.7.7, R5 MG-08, DL-05-25]
  - id: eff.05.end_working
    op: remove_condition
    regime: independent_trigger
    params: {target: one effect_instance or condition with trait.nature.magical, condition_or_category: magical}
    text: Ends {target}.
    why_not_core: eff.cleanse removes conditions; dispelling must also end magical effect instances that are not conditions (wards, summonings, illusions)
    lifecycle: provisional
    basis: [05.7.7, R5 MG-08, DL-05-25]
