# data/contrib/tags.09.yaml -- chapter 09's proposed level-3 creature tags (steward of the creature facet, 00.5.1).
# Owner: 09 proposes; 03 adopts into data/tags.yaml (PR-03-6). Schema: data/SCHEMAS.md#tags.yaml.
# None of these is used by chapter 09's data yet (every tag in archetypes.yaml and adversaries.yaml exists);
#   they let chapter 13 gate regional loot and absorbable pools more finely. Sibling budget: <= 8 children.
# Basis: [00.5.5 rules for adding tags] [DL-09-01]

schema_version: 1
blocks:
  - owner: "09"
    entries:
      - id: creature.spirit.place.water
        name: Spirit of water
        parent: creature.spirit.place
        level: 3
        lifecycle: provisional
        definition: "True only when a spirit of place whose seat is a river, lake, spring, marsh or sea. False for a water elemental (creature.elemental.water: a raw element, not a place's spirit) and for a drowned ghost (undead)."
        distinguish: "vs .wood and .stone: the seat it is bound to; a spirit of a river gorge is water if the river is its seat, stone if the cliffs are."
      - id: creature.spirit.place.wood
        name: Spirit of wood
        parent: creature.spirit.place
        level: 3
        lifecycle: provisional
        definition: "True only when a spirit of place whose seat is a grove, a forest or an ancient tree. False for a dryad (creature.spirit.fey.wild: a fey, not the place itself) and for a treant (creature.horror.plant.treant)."
        distinguish: "vs fey.wild: a spirit of place IS the grove; a dryad lives in it."
      - id: creature.spirit.place.stone
        name: Spirit of stone
        parent: creature.spirit.place
        level: 3
        lifecycle: provisional
        definition: "True only when a spirit of place whose seat is a mountain, a hill, a standing stone or a cave. False for an earth elemental (creature.elemental.earth) and for a cairn's ancestor (creature.spirit.ancestor)."
      - id: creature.fiend.hellbeast.hound
        name: Hell hound
        parent: creature.fiend.hellbeast
        level: 3
        lifecycle: provisional
        definition: "True only when an infernal beast of canine shape that hunts in packs. False for a wolf with a fire power (a beast) and for a nightmare mount (hellbeast, not a hound)."
      - id: creature.dragon.drake.fire
        name: Fire drake
        parent: creature.dragon.drake
        level: 3
        lifecycle: provisional
        definition: "True only when a wingless dragon-kin whose breath or blood is fire. False for a wyvern (creature.dragon.wyvern) and for a great dragon wyrmling (creature.dragon.great.wyrmling)."
      - id: creature.beast.herd.caprine
        name: Caprine
        parent: creature.beast.herd
        level: 3
        lifecycle: provisional
        definition: "True only when goats, sheep, ibex and their wild kin. False for deer (creature.beast.herd.cervine) and cattle (.bovine)."
