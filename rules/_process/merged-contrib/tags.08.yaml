# data/contrib/tags.08.yaml
# Purpose: level-3 item tags proposed by ch.08 (steward of `item` and `material`), per 00.5.5 and PR-03-6.
# Owner: proposed by 08 to 03. Schema: data/SCHEMAS.md#tagsyaml. Sibling budget (8 per parent) respected.

schema_version: 1
proposed_by: 08
tags:
- {id: item.weapon.bludgeon.whip, name: Whip, parent: item.weapon.bludgeon, level: 3, lifecycle: provisional, definition: True only when a lash or whip whose flexible length strikes or entangles at reach.
    False for flails (a rigid haft with a chain) and nets (thrown)., distinguish: 'vs flail: does the whole weapon flex? Whip.'}
- {id: item.shield.light.buckler, name: Buckler, parent: item.shield.light, level: 3, lifecycle: provisional, definition: True only when a fist-sized shield held at arm's length that cannot cover the body.
    False for round shields., distinguish: 'vs round shield: can it cover you from arrows? No -> buckler.'}
- {id: item.shield.light.round, name: Round shield, parent: item.shield.light, level: 3, lifecycle: provisional, definition: True only when a strapped round or oval shield that covers the torso. False for
    bucklers and kite shields.}
- {id: item.shield.heavy.kite, name: Kite shield, parent: item.shield.heavy, level: 3, lifecycle: provisional, definition: 'True only when a long shield covering shoulder to knee, usable on foot or mounted.
    False for tower shields.'}
- {id: item.shield.heavy.tower, name: Tower shield, parent: item.shield.heavy, level: 3, lifecycle: provisional, definition: 'True only when a shield as tall as its bearer, braced on the ground. False for
    kite shields.'}
- {id: item.goods.treasure.gem, name: Gem, parent: item.goods.treasure, level: 3, lifecycle: provisional, definition: True only when a loose cut or uncut gemstone valued for itself. False for jewelry worn
    (item.jewelry).}
- {id: item.goods.treasure.art, name: Art object, parent: item.goods.treasure, level: 3, lifecycle: provisional, definition: 'True only when a made object valued for its art: a statuette, a gilded cup,
    a tapestry. False for jewelry worn and for trade goods sold by weight.'}
- {id: item.goods.treasure.coinage, name: Coinage, parent: item.goods.treasure, level: 3, lifecycle: provisional, definition: 'True only when minted coin, bullion or trade bars carried as wealth. False
    for coin already counted in the coin quantity.'}
- {id: item.goods.document.text, name: Teaching text, parent: item.goods.document, level: 3, lifecycle: provisional, definition: 'True only when a book, scroll or pattern that carries a teaches: fact (an
    ability, rite, training license or recipe). False for maps, letters and ledgers.'}
- {id: item.goods.document.map, name: Map, parent: item.goods.document, level: 3, lifecycle: provisional, definition: 'True only when a map, chart or route-book. False for teaching texts.'}
- {id: item.consumable.oil.weapon, name: Weapon oil, parent: item.consumable.oil, level: 3, lifecycle: provisional, definition: True only when a coating applied to a weapon that changes its Strikes for
    a count of strikes or rounds. False for lamp oil and thrown incendiaries.}
- {id: item.consumable.oil.incendiary, name: Incendiary, parent: item.consumable.oil, level: 3, lifecycle: provisional, definition: 'True only when a flask, pot or charge thrown or set to burn or burst.
    False for weapon oils and lamp oil.'}
- {id: item.consumable.remedy.antidote, name: Antidote, parent: item.consumable.remedy, level: 3, lifecycle: provisional, definition: True only when a remedy that lowers a poison or disease stage (eff.07.affliction_shift).
    False for bandages and salves.}
- {id: item.conveyance.mount.war, name: War mount, parent: item.conveyance.mount, level: 3, lifecycle: provisional, definition: 'True only when a mount trained to bear a rider in a fight (06 flag.mounted,
    combat-trained). False for riding and draft animals.'}
- {id: item.conveyance.vehicle.cart, name: Cart or wagon, parent: item.conveyance.vehicle, level: 3, lifecycle: provisional, definition: True only when a wheeled vehicle drawn by animals or people. False
    for sledges and vessels.}
- {id: item.conveyance.vessel.boat, name: Boat, parent: item.conveyance.vessel, level: 3, lifecycle: provisional, definition: 'True only when a small craft rowed, poled or sailed by its passengers. False
    for ships with a crew of more than six.'}
- {id: item.tool.kit.prosthesis, name: Prosthesis, parent: item.tool.kit, level: 3, lifecycle: provisional, definition: 'True only when a made replacement or support for a lost or ruined part of the body,
    fitted to one bearer (07.7.6). False for armor, a crutch or a walking staff anyone may lean on.', distinguish: 'vs armor: does it stand in for the body rather than cover it? Prosthesis.'}
- {id: item.conveyance.vessel.ship, name: Ship, parent: item.conveyance.vessel, level: 3, lifecycle: provisional, definition: True only when a vessel needing a crew of more than six. False for boats.}
