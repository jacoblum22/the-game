# data/contrib/boundaries.06.yaml
# Purpose: ch.06's owner-block for data/boundaries.yaml. The five handlers 00 reserved for ch.06 are DEFINED in 06
#   (rule ids below) and restated here with their rule ids; two handlers are added.
# Owner: 06-conflict. Schema: data/SCHEMAS.md#boundariesyaml. Phases per 00.7.5.

schema_version: 1
blocks:
- owner: '06'
  handlers:
  - id: h.06.tempo_setup
    boundary: conflict_start
    phase: 9
    interrupting: false
    effect: list participants, sides and objectives; set bands, groups and flags; apply cond.surprised; create the morale
      clock; roll the PC's tempo check and fix the order
    rule_id: 06.2.1; 06.2.2; PR-06-1
    status: reserved by 00; defined
  - id: h.06.turn_effects
    boundary:
    - turn_start
    - turn_end
    phase: 2
    interrupting: false
    effect: 'turn_start: refresh the owner''s reaction, lapse an unfired readied beat, expire defending and fend facts,
      apply turn_start periodics; turn_end: apply turn_end periodics (bleeding, burning, choking), count down durations
      in the owner''s turns, decay cond.frightened one rung'
    rule_id: 06.1.8
    status: reserved by 00; defined
  - id: h.06.ongoing_harm
    boundary: round
    phase: 2
    interrupting: false
    effect: 'apply periodic effects of the place (hazard features: a burning room, rising water) to those in them'
    rule_id: 06.2.3
    status: reserved by 00; defined
  - id: h.06.chase_round
    boundary: round
    phase: 5
    interrupting: false
    effect: 'while a chase runs: the other side''s fortune check against the round''s ground; tick its clock; completion
      effects'
    rule_id: 06.12.4; PR-06-8
    status: added
  - id: h.06.diminishing_window
    boundary: round
    phase: 9
    interrupting: false
    effect: lower each target's control counter by one if it carried no control condition this round
    rule_id: 06.7.4
    status: reserved by 00; defined
  - id: h.06.objective_check
    boundary: round
    phase: 9
    interrupting: false
    effect: test the end conditions of 06.13.1 (also run after any defeat, break, yield, truce or clock completion); mark
      conflict_end when one holds
    rule_id: 06.13.1
    status: added
  - id: h.06.clear_conflict_state
    boundary: conflict_end
    phase: 1
    interrupting: false
    effect: clear bands, links, groups and conflict-only flags; end conflict-duration conditions and effects; end stances;
      end defending, fend, aim, windup, tempo and momentum facts; reset control counters; close morale and chase clocks
    rule_id: 06.13.4; PR-06-10
    status: reserved by 00; defined
