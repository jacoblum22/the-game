# data/contrib/effects.16.yaml -- chapter 16's effect owner-block (merged into data/effects.yaml#blocks).
# Owner: 16-companions-and-allies. Schema: data/SCHEMAS.md#effects.yaml.
# Chapter 16 builds its knacks from CORE effects (eff.grant_license, eff.defense_edge, eff.grant_lever,
#   eff.cleanse, eff.harm_reduction, eff.write_fact, eff.intercept) and moves standing through ch.15's
#   eff.15.standing_step. These three definitions exist so that ITEMS, ABILITIES, RITES, CONDITIONS and CLOCK
#   COMPLETIONS can touch an ally's loyalty, its standing order and a held line through the substrate rather
#   than prose (00.16.4): a bard's gift that warms a companion, a horn that orders the retinue to fall back, a
#   rite that shores a held line.
# Basis: [00.10.1] [PR-00-8] [16.5.3] [16.7.3-16.7.5] [16.7.12] [DL-16-21]

schema_version: 1
blocks:
  - owner: "16"
    entries:
      - id: eff.16.loyalty_tick
        op: tick
        regime: independent_trigger
        hook: "per source (on_boundary for an item's weekly effect; on_clock_complete; on_degree for an ability)"
        params: {target: ally_id, clock: "regard | grievance", ticks: "-2..2"}
        text: "{target}'s {clock} clock moves {ticks}, and its omen is rendered."
        why_not_core: "eff.tick_clock needs a clock id; an ally's regard and grievance clocks are per-ally instances (clk.16.regard.<id>) resolved from the target"
        lifecycle: provisional
        basis: ['16.5.3', '16.5.8 (omen obligation)', DL-16-21]
      - id: eff.16.set_order
        op: set_fact
        regime: independent_trigger
        hook: "per source (on_dying for 16.7.5; on_vitality_threshold or on_defeat for 16.7.4; the conflict_start handler for 16.7.3)"
        params: {target: "ally_id | all_allies", order: "guard_me | hold_him | harry_that_one | hold_this_ground | stay_back", reason: str}
        text: "{target} takes the standing order {order} (no action)."
        why_not_core: "a standing order is a stored field of an ally (06.14.4), not a condition or a position; the engine writes it without a Command only through this effect"
        lifecycle: provisional
        basis: ['06.14.4', '16.7.3', '16.7.4', '16.7.5', DL-16-21]
      - id: eff.16.held_line_step
        op: tick
        regime: independent_trigger
        hook: "per source (on_degree of a PC beat against a held group; a rite or item that shores a line)"
        params: {clock: "clk.16.held_line.<id>", ticks: "-2..2 | delivered_reach"}
        text: "The line at {clock} moves {ticks}."
        why_not_core: "a held line is a tug clock whose ends move foes between fights (16.7.12); naming its step keeps the move-foes link with the tick"
        lifecycle: provisional
        basis: ['16.7.12', 'PR-16-11', DL-16-14]
