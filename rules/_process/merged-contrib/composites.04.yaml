# data/contrib/composites.04.yaml
# Purpose: ch.04's owner-block for data/composites.yaml (owner 05; owner-block 04 per T-00-19): the named
#   synergy composite of every hybrid calling (constitution P6 as used by P5: "a hybrid-only technique requiring
#   both ... to trigger"). One composite per named hybrid: 32 entries. Specialists, vows and dark callings carry
#   no composite (their tier rewards are in callings.yaml: focus_generation and boon).
# Owner: 04-recognition-and-growth. Schema: data/SCHEMAS.md#compositesyaml (keys: exactly two; key_kind
#   deed_branch). Optional fields added by ch.04: name, calling, ranks [{rank, at_tier, effects, text}], rank_rule.
#   `effects` (the required field) holds rank 1; a higher rank REPLACES the lower one (04.5.5: restated, never
#   appended).
# Every effect is a core effect of data/effects.yaml with parameters; none is new. The expression key
#   `secondary_tags` is requested of 00 (04 Interface requests); until it exists the edge applies when the frame
#   records a grounded secondary (03.1.6) under the other branch.
# Bounds (audit): a lever counts toward the two-lever limit and the +/-4 circumstance cap (00.3.9); edge is capped
#   at +2 in total (00.3.5); a reach step is capped by the step family (00.10.6). No composite adds an action.
# Basis: [C:P6] [C:P5] [R2 4c Twinborn / Three Lashings; bounded] [R3 04.19] [DL-04-11]

schema_version: 1
blocks:
  - owner: "04"
    entries:
      - id: comp.04.feint_and_thrust
        name: "Feint and Thrust"
        tags: [deed.martial, deed.guile]
        keys: [deed.martial, deed.guile]
        key_kind: deed_branch
        active_when: "actor holds call.swashbuckler (not suspended by the Fraying, 04.9.3) at the rank's tier or higher"
        calling: call.swashbuckler
        effects: [{effect_id: eff.grant_lever, params: {type: precision, for_tags: [deed.martial], duration: scene}, hook: on_degree, when: "degree >= success and deed_tag under deed.guile", limits: {per: scene_end, uses: 1}}]
        suppresses: []
        rank_rule: "the highest rank whose at_tier <= the calling tier replaces the lower ranks (restated, never added)"
        lifecycle: provisional
        basis: ["04.5.4", "C:P6", "C:P5", DL-04-11]
        ranks:
          - {rank: 1, at_tier: 1, effects: [{effect_id: eff.grant_lever, params: {type: precision, for_tags: [deed.martial], duration: scene}, hook: on_degree, when: "degree >= success and deed_tag under deed.guile", limits: {per: scene_end, uses: 1}}], text: "When a deed of guile succeeds, you gain a precision lever you may cite on one later beat of martial this scene. Once per scene."}
          - {rank: 2, at_tier: 3, effects: [{effect_id: eff.grant_lever, params: {type: precision, for_tags: ["the other branch of the pair"], duration: scene}, hook: on_degree, when: "degree >= success and deed_tag under deed.martial or deed.guile", limits: {per: scene_end, uses: 2}}, {effect_id: eff.check_edge, params: {amount: 1, applies_when: "(deed_tag under deed.martial and secondary_tags under deed.guile) or (deed_tag under deed.guile and secondary_tags under deed.martial)"}}], text: "When a deed of either branch (martial or guile) succeeds, you gain a precision lever you may cite on one later beat of the other branch this scene. Twice per scene. A fused deed (primary tag under one branch with a grounded secondary under the other) gains +1 edge."}
          - {rank: 3, at_tier: 5, effects: [{effect_id: eff.grant_lever, params: {type: precision_or_player_choice_of_type, for_tags: ["the other branch of the pair"], duration: scene}, hook: on_degree, when: "degree >= success and deed_tag under deed.martial or deed.guile", limits: {per: scene_end, uses: 3}}, {effect_id: eff.check_edge, params: {amount: 1, applies_when: "(deed_tag under deed.martial and secondary_tags under deed.guile) or (deed_tag under deed.guile and secondary_tags under deed.martial)"}}, {effect_id: eff.reach_step, params: {ladder: reach, steps: 1, applies_when: "a fused deed as above"}, limits: {per: scene_end, uses: 1}}], text: "When a deed of either branch (martial or guile) succeeds, you gain a precision lever you may cite on one later beat of the other branch this scene. Three times per scene. A fused deed (primary tag under one branch with a grounded secondary under the other) gains +1 edge, and once per scene its reach is one rung higher. You may choose the lever's type each time."}
