schema_version: 1
blocks:
- owner: '15'
  entries:
  - id: lic.15.persona
    name: A maintained false identity
    kind: fact
    tags: [deed.guile.disguise]
    principle: A prepared false name and story that the character can live inside across scenes.
    scope: 'For one named persona (its name, origin and story written as facts at grant): claims consistent with the persona''s recorded story start at plausible (15.5.2); all lies told under it share one lie record and one truth-out clock of 8 segments (15.5.4). Consistency is a [J:flag]: true only when the claim follows from the recorded story.'
    excludes:
    - {what: passing as a specific real person, needs: lic.training.guile_disguise and a deceive against those who know them (15.5.6)}
    - {what: claims outside the persona's story, needs: an ordinary deceive (15.5.1)}
    attribute: by_method
    crude_fallback: {verb: verb.talk, method: "an improvised false name and story, beat by beat", dc_shift: 0, reach_cap: standard, consequence: "each claim is a separate lie with its own truth-out clock"}
    stretch: null
    emulate: null
    acquisition_paths:
    - {type: project, detail: "dt.persona: a downtime week of papers, clothes and a rehearsed story; 1 Unit; forged papers need a forgery beat (deed.guile.disguise.forgery, Hard) or a forger's service", clock: null, requires: null}
    - {type: institution, detail: "an order, guild or crown agent supplies a cover identity with its papers (11)", clock: null, requires: "rank in such an institution"}
    source: the persona fact
    lifecycle: provisional
    basis: ['15.5.6', '15.13.13', DL-15-31]
  - id: lic.15.safe_conduct
    name: Safe conduct
    kind: fact
    tags: [deed.influence.etiquette]
    principle: A recognized authority's written or spoken guarantee of passage.
    scope: 'Within the issuing authority''s domain, guards and officials of that authority treat the bearer''s request to pass, lodge and carry their arms as R1 (certain at Neutral or better, 15.3.10), and a claim to hold the conduct is plausible on sight of it. It does not compel anyone outside the authority, and a Hostile official may still test it (a request, with the conduct as evidence).'
    excludes:
    - {what: passage in another authority's domain, needs: that authority's conduct}
    - {what: requests beyond passage, lodging and arms, needs: ordinary requests}
    attribute: by_method
    crude_fallback: {verb: verb.talk, method: "ask to pass as any traveller", dc_shift: 0, reach_cap: standard, consequence: null}
    stretch: null
    emulate: null
    acquisition_paths:
    - {type: bargain, detail: "a request of R3 to someone who can issue it (a lord, a magistrate, a guild warden), with terms", clock: null, requires: "the issuer's authority (a fact)"}
    - {type: institution, detail: "rank in the issuing faction (11)", clock: null, requires: null}
    source: the conduct's issuer
    lifecycle: provisional
    basis: ['C:VII', '15.4.1', DL-15-31]
  - id: lic.15.audience
    name: Audience
    kind: fact
    tags: [deed.influence.etiquette.courtly]
    principle: Leave to address a lord, a court or a council in person.
    scope: 'The bearer may put a request or a motion directly to the named lord, court or council at its next sitting (15.4.1, 15.8.3). Without it, addressing them is G3: the redirect names a courtier, a petition, or a patron who can grant the audience.'
    excludes:
    - {what: the lord's agreement, needs: the request or debate itself}
    attribute: by_method
    crude_fallback: {verb: verb.talk, method: "petition through a clerk or courtier (a request to them, R2-R3)", dc_shift: 0, reach_cap: limited, consequence: "the petition is heard second-hand: reach Limited"}
    stretch: null
    emulate: null
    acquisition_paths:
    - {type: bargain, detail: "a request to a courtier, chamberlain or council member, R2 (a lesser lord) to R4 (a great one)", clock: null, requires: null}
    - {type: institution, detail: "a rank that sits at the council (11)", clock: null, requires: null}
    - {type: recognition, detail: "a reputation the court has heard (11) may bring a summons (04 V3)", clock: null, requires: null}
    source: the granting courtier or rank
    lifecycle: provisional
    basis: ['C:VII', '15.8.3', DL-15-31]
  - id: lic.15.guest_right
    name: Guest-right
    kind: fact
    tags: [deed.influence.etiquette]
    principle: The protection a host extends to a guest under their roof.
    scope: 'While under the host''s roof and keeping the host''s peace, the bearer is protected by the host''s household: the host''s people will not harm or seize them, and a request to them for food, bed and the household''s protection is R1. A guest who breaks the peace loses it at once and the host takes `betrayed`.'
    excludes:
    - {what: protection outside the host's roof, needs: a safe conduct or an escort}
    attribute: by_method
    crude_fallback: none
    stretch: null
    emulate: null
    acquisition_paths:
    - {type: bargain, detail: "a request R2 to a host (R1 where the custom of the place offers it to all travellers, 13)", clock: null, requires: null}
    source: the host
    lifecycle: provisional
    basis: ['C:VII', '15.1.2', DL-15-31]
