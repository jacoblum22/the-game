# data/contrib/tags.11.yaml -- chapter 11's proposed level-3 situation tags (for rule-card loading, SG-18).
# Owner: 11 proposes; 03 adopts into data/tags.yaml (PR-03-6). Schema: data/SCHEMAS.md#tags.yaml.
# The situation facet has no level-3 content yet (03's note); these three let 11's cards load only where they
#   apply: a battle (11.3.15), a faction's sitting (11.8.3), governing a domain (11.9.8).
# Sibling budgets: each parent has no level-3 children yet (budget 8).
# Basis: [00.5.5 rules for adding tags] [11.3.15] [11.8.3] [11.9.8] [DL-11-14]

schema_version: 1
blocks:
  - owner: "11"
    entries:
      - id: situation.conflict.skirmish.battle
        name: Battle
        parent: situation.conflict.skirmish
        level: 3
        definition: "True only when organized forces too large for 06's mobs clash and the scene is resolved by 11.3.15's breaking clocks. False for a fight the PC resolves as a conflict with mobs (06)."
        distinguish: "vs situation.conflict.skirmish: a skirmish is resolved round by round (06); a battle by faction checks per time unit with the PC's beats as ticks."
        aliases: [battle, siege, clash of armies, muster]
        lifecycle: provisional
        basis: ['11.3.15']
      - id: situation.social.court.sitting
        name: Sitting
        parent: situation.social.court
        level: 3
        definition: "True only when a faction confers ranks or hears petitions at its scheduled sitting (11.8.3). False for an ordinary audience with an officer."
        distinguish: "vs situation.social.court: a court scene of any kind; a sitting is the faction's dated rite of rank."
        aliases: [sitting, investiture, chapter meeting, conclave]
        lifecycle: provisional
        basis: ['11.8.3']
      - id: situation.downtime.project.domain
        name: Governing a domain
        parent: situation.downtime.project
        level: 3
        definition: "True only when the PC heads a faction (11.9.8) and spends the week governing its seat or choosing its action. False for a personal project (15.12)."
        distinguish: "vs situation.downtime.project: a project is one clock; a domain is a faction the player directs."
        aliases: [rule, govern, hold court as lord, run the order]
        lifecycle: provisional
        basis: ['11.9.8']
