# data/contrib/tags.10.yaml -- chapter 10's proposed level-3 terrain tags (ch.10 is steward of the terrain
#   facet, 00.5.1). Owner: 10 proposes; 03 adopts into data/tags.yaml (PR-03-6). Schema: data/SCHEMAS.md#tags.yaml.
# None of these is used by chapter 10's data yet (every tag in hazards/sites/travel/traps/weather exists);
#   they let chapter 13 author places and domains more finely. Sibling budget respected (<= 8 children).
# Basis: [00.5.5 rules for adding tags] [10.1.3, 10.13.2] [DL-10-21]

schema_version: 1
blocks:
  - owner: "10"
    entries:
      - id: terrain.ruin.fortress.tower
        name: Ruined tower
        parent: terrain.ruin.fortress
        level: 3
        lifecycle: provisional
        definition: "True only when a single fallen or abandoned tower standing alone or as the last part of a fort (a wizard's tower, a watchtower, a lighthouse). False for a whole fortress with curtain walls (terrain.ruin.fortress) and for a temple's bell tower (terrain.ruin.temple)."
        distinguish: "vs terrain.ruin.fortress: one vertical building explored floor by floor, not a compound of halls and yards."
        aliases: [watchtower, ruined tower, "wizard's tower"]
      - id: terrain.road.causeway
        name: Causeway
        parent: terrain.road
        level: 3
        lifecycle: provisional
        definition: "True only when a raised way across wet ground or shallow water (a log road over a fen, a stone causeway to a tidal island). False for a bridge over a river or gorge (terrain.road.bridge) and for a track that merely skirts a marsh (terrain.road.track)."
        distinguish: "vs terrain.road.bridge: a causeway runs along the wet ground; a bridge spans a gap."
        aliases: [causeway, log road, corduroy road]
      - id: terrain.water.river.ford
        name: Ford
        parent: terrain.water.river
        level: 3
        lifecycle: provisional
        definition: "True only when a place where a river can be waded or ridden across (haz.ford). False for a bridge (terrain.road.bridge) and for open river reached by boat (terrain.water.river)."
        distinguish: "vs terrain.road.bridge: crossing through the water, not over it."
        aliases: [ford, crossing, wading place]
