# _process/simulation/12-world-seed-example.yaml -- a world seed (12.16) generated by 12-world-seed.py, seed 1, oracle
# mode: every question answered by the engine. A region record of the shape of data/region_*.yaml (SCHEMAS.md#region_yaml).
# Verification's playtests use this world (FINISH-PLAN.md). Regenerate: python 12-world-seed.py --emit 12-world-seed-example.yaml
# [revision: I-028]

schema_version: 1
seed:
  procedure: '12.16'
  seed: 1
  mode: oracle
  answers:
  - {question: ws.q.wound, answer: invasion, source: oracle}
  - {question: ws.q.climate, answer: highland, source: oracle}
  - {question: ws.q.magic_level, answer: rare, source: oracle}
  - {question: ws.q.magic_law, answer: feared, source: oracle}
  - {question: ws.q.spirits, answer: rare, source: oracle}
  - {question: ws.q.arcane_source, answer: anyone_literate, source: oracle}
  - question: ws.q.extra_impossible
    answer: [no_gold_making]
    source: oracle
  - {question: ws.q.regrowth, answer: 'no', source: oracle}
  - {question: ws.q.closed_school, answer: none, source: oracle}
  - {question: ws.q.relics_magic, answer: 'yes', source: oracle}
  - {question: ws.q.hybrid_none, answer: hold, source: oracle}
  - {question: ws.q.keeper_count, answer: '3', source: oracle}
  - question: ws.q.keepers
    answer: [kf.war, kf.knowledge, kf.sky]
    source: oracle
  - {question: ws.q.bargainer, answer: fiend, source: oracle}
  - question: ws.q.presence
    answer: {orig.people.human: uncommon, orig.people.halfling: common, orig.people.dwarf: rare, orig.people.elf: absent, orig.people.orc_kin: uncommon,
      orig.people.goblin_kin: rare, orig.people.giant_kin: rare, orig.people.beastfolk: uncommon}
    source: oracle
  - {question: ws.q.second_tongue, answer: old_tongue, source: oracle}
  - {question: ws.q.haven_site, answer: harbour, source: oracle}
  - question: ws.q.terrain
    answer:
      1: [terrain.plains.farmland, terrain.highland.hills]
      2: [terrain.highland.mountains, terrain.highland.mountains, terrain.highland.mountains]
      3: [terrain.highland.mountains, terrain.highland.hills, terrain.ruin]
      4: [terrain.plains.moor, terrain.highland.hills]
      5: [terrain.forest.woodland, terrain.highland.mountains]
    source: oracle
  - {question: ws.q.haven_tier, answer: town, source: oracle}
  - {question: ws.q.rulers, answer: org.crown.noble, source: oracle}
  - {question: ws.q.fourth_faction, answer: org.crown.civic, source: oracle}
  - {question: ws.q.month_names, answer: named, source: oracle}
  - {question: ws.q.inciting, answer: missing, source: oracle}
  generated_by: _process/simulation/12-world-seed.py
  uses_generic:
  - {key: tables (events), generic: world_turn.yaml#tbl.11.local_events, note: a seed may write tbl.<region>.events to replace it (10.9.4
      V face)}
  - {key: tables (hooks), generic: world_turn.yaml#tbl.11.hook, note: 11.5.10's hook supply}
  - {key: tables (season events), generic: world_turn.yaml#tbl.11.season_events.*}
  - {key: tables (npc), generic: 'oracles.yaml#tbl.npc_role, tbl.npc_detail, tbl.npc_gender and the rest of 12.11.1''s tables', note: the
      seed's name tables replace tbl.name_given / tbl.name_family}
  - {key: tables (omens), generic: oracles.yaml#tbl.twist_* omens (12.6)}
  - {key: tables (chase ground), generic: conflict.yaml#tbl.chase_ground (06.12)}
  - {key: tables (hire quirks), generic: companions.yaml#tbl.16.hire_quirk}
  - {key: cases, generic: PR-15-6 builds a case when a mystery hook arises (15.9.1)}
  - {key: storied_items, generic: none at the start; 08.4.8's storied items are authored when a site's objective or a great deed calls
      for one}
  - {key: bestiary entries, generic: adversaries.yaml (the seed's tables name archetypes; PR-09-1 builds any entry not in the bestiary)}
  - {key: origins, generic: 'origins.yaml (the seed adds no setting origins; a player-guided seed may, under PR-02-9)'}
  - {key: afflictions, generic: afflictions.yaml (no regional afflictions)}
  - {key: weather regimes, generic: weather.yaml#regimes for the seed's climate}
region:
  id: loc.high_fells
  name: The High Fells
  home_band: 1
  danger: settled
  climate: highland
  haven: loc.high_fells_merestead
  wound: invasion
  rings:
  - ring: 0
    words: safe under the walls
    home_band: null
    areas: []
    places: [loc.high_fells_merestead]
  - ring: 1
    words: farm country; trouble is rare and small
    home_band: [1]
    areas: [loc.high_fells_weeping_meads, loc.high_fells_sunken_fells, loc.high_fells_old_downs]
    places: [loc.high_fells_shephollows_undercroft, loc.high_fells_caves_of_crowton, loc.high_fells_whitfields_temple]
  - ring: 2
    words: 'the borderland: wild, but folk pass through'
    home_band: [1, 2]
    areas: [loc.high_fells_hungry_pikes, loc.high_fells_black_crags, loc.high_fells_drowned_ridge]
    places: [loc.high_fells_calmeres_keep, loc.high_fells_whispering_tower, loc.high_fells_hollymores_tower]
  - ring: 3
    words: 'the deep wilds: dangerous things live here'
    home_band: [2, 3]
    areas: [loc.high_fells_red_crags, loc.high_fells_thorny_edge, loc.high_fells_weeping_halls]
    places: [loc.high_fells_wolfcrags_delving, loc.high_fells_oakwalls_warren, loc.high_fells_broken_warren]
  - ring: 4
    words: 'the old lands: only the strong travel here'
    home_band: [3, 4]
    areas: [loc.high_fells_still_heath, loc.high_fells_lonely_ridge]
    places: [loc.high_fells_whitmouths_undercroft]
  - ring: 5
    words: 'the far reaches: legends live here, and so do the things that killed them'
    home_band: [4, 5]
    areas: [loc.high_fells_broken_greenwood, loc.high_fells_tangled_ridge]
    places: [loc.high_fells_delving_of_ashhollow]
  pitch: The horde came down from the passes thirty winters ago and burned The High Fells to the river. It was driven back. The watchfires
    on the passes were lit again this spring.
  truths: [The horde is gathering again beyond the passes., 'Some who fought it are still alive, and some of them took its gold.', 'The
      old forts on the passes are held by too few, or by no one.']
  lifecycle: provisional
  basis: [12.16.4, 12.16.8]
canon_impossible: ['No working, rite or power returns the truly dead to life.', 'No one travels in time, or undoes what has happened.',
  'No one makes a soul; a made thing has none, whatever it says.', No one reads or speaks into a mind that is not present in the scene.,
  'No one destroys a keeper; a keeper may be forgotten, never killed.', 'No working turns one substance into another (lead into gold,
    stone into bread); 08.6''s crafting, not magic, changes what a thing is made of.', 'No working makes gold, silver or gems (08''s
    transmutation canon).']
canon:
  impossible:
  - id: ci.resurrection
    text: No working, rite or power returns the truly dead to life.
    scope: magic
    basis: [05.7.10 item 1]
  - id: ci.time
    text: No one travels in time, or undoes what has happened.
    scope: magic
    basis: [05.7.10 item 1]
  - id: ci.soul_making
    text: No one makes a soul; a made thing has none, whatever it says.
    scope: magic
    basis: [05.7.10 item 1]
  - id: ci.absent_mind
    text: No one reads or speaks into a mind that is not present in the scene.
    scope: magic
    basis: [05.7.10 item 1]
  - id: ci.unmaking_keepers
    text: No one destroys a keeper; a keeper may be forgotten, never killed.
    scope: magic
    basis: [05.7.10 item 1]
  - id: ci.transmutation
    text: No working turns one substance into another (lead into gold, stone into bread); 08.6's crafting, not magic, changes what a
      thing is made of.
    scope: magic
    basis: [08 To 13 (AI-1), '08.6']
  - id: ci.no_gold_making
    text: No working makes gold, silver or gems (08's transmutation canon).
    scope: magic
    basis: [12.16.5, 05.7.10 item 1]
  facts:
  - {id: canon.wound, text: 'an invasion: a horde came over the mountains, was driven back, and is coming again'}
  - {id: canon.magic_level, value: rare}
  - {id: canon.magic_lawful, value: feared, text: 'feared: lawful on paper; any visible working draws a crowd, a priest or a mob (a
      method consequence, 01.11.2)'}
  - {id: canon.default_bargainer, value: arch.tempter, text: 'a tempter answers, and collects (arch.tempter, can_bargain)'}
  - {id: canon.regrowth, value: 'no', text: 'no (the default): prosthetics, healers'' craft and the maim''s other offsets only'}
  - {id: canon.arcane_source, value: anyone_literate, text: anyone literate with a teacher or a text (05.9.4)}
  magic:
    item_1_canon_impossible: [ci.resurrection, ci.time, ci.soul_making, ci.absent_mind, ci.unmaking_keepers, ci.transmutation, ci.no_gold_making]
    item_2_sources: {arcane: anyone literate with a teacher or a text (05.9.4), divine: anyone a keeper accepts (05.7.4), primal: anyone
        a place or a spirit accepts (05.9.4)}
    item_3_keepers: [keeper.oswen, keeper.halda, keeper.ala]
    item_4_places_of_power: [loc.high_fells_calmeres_keep, loc.high_fells_merestead.graveyard, loc.high_fells_merestead.temple, loc.high_fells_shepwell_spring,
      loc.high_fells_whispering_tower, loc.high_fells_whitmouths_undercroft]
    item_5_spirit_frequency: {level: rare, odds: Unlikely in any given place; Likely at a place with resonance}
    item_6_lawfulness: feared
    item_7_components: stock.components; texts and teachers in places[].settlement
    item_8_schools:
      closed: []
      conduct_evidence: [deed.arcane.necromancy.raising, deed.divine.pact]
  components:
  - {band: 1, name: 'a pinch of salt, a candle of beeswax and clean water', price: 2}
  - {band: 2, name: 'silver dust, incense and a written prayer', price: 15}
  - {band: 3, name: 'a gem worth a season''s wages, or a relic of the faith', price: 120}
  - {band: 4, name: 'a part of a creature of band 4, or a gem of the first water', price: 600}
  - {band: 5, name: 'something unique: a keeper''s tear, a dragon''s heart', price: null}
  spirits: Spirits of place exist (rare); they understand heartfelt speech in any tongue, and anything they are owed.
  hybrid_none_pairs: hold
  relics_and_refusal: 'yes: a relic is magic to those who fear magic (the default)'
keepers:
- id: keeper.oswen
  name: Oswen, Lord of the Line
  kind: god
  form: kf.war
  what: the keeper of the shield-wall and the just war, who asks courage and repays it
  axes:
  - {axis: conduct.courage, pole: +}
  - {axis: conduct.loyalty, pole: +}
  despises:
  - {axis: conduct.courage, pole: '-'}
  - {axis: conduct.loyalty, pole: '-'}
  sign: a small iron shield-boss (item.tool.implement.holy_symbol)
  schools: [deed.divine.smiting, deed.divine.oaths, deed.divine.warding]
  faith: fac.high_fells.faith
  death: false
  nature: sacred
  basis: [05.7.4, 04.9.2, 12.16.6]
- id: keeper.halda
  name: Halda, the Keeper of Keys
  kind: god
  form: kf.knowledge
  what: the keeper of letters, measures and hidden things, who rewards the patient seeker
  axes:
  - {axis: conduct.honesty, pole: +}
  - {axis: conduct.humility, pole: +}
  despises:
  - {axis: conduct.honesty, pole: '-'}
  - {axis: conduct.justice, pole: '-'}
  sign: a brass stylus or a key (item.tool.implement.holy_symbol)
  schools: [deed.divine.revelation, deed.divine.warding, deed.divine.oaths]
  faith: fac.high_fells.faith_halda
  death: false
  nature: sacred
  basis: [05.7.4, 04.9.2, 12.16.6]
- id: keeper.ala
  name: Ala, the High One
  kind: god
  form: kf.sky
  what: the keeper of the open sky, of oaths sworn under it and of storms
  axes:
  - {axis: conduct.honesty, pole: +}
  - {axis: conduct.justice, pole: +}
  despises:
  - {axis: conduct.honesty, pole: '-'}
  - {axis: conduct.loyalty, pole: '-'}
  sign: a silver disc on a chain (item.tool.implement.holy_symbol)
  schools: [deed.divine.oaths, deed.divine.smiting, deed.divine.revelation]
  faith: fac.high_fells.faith_ala
  death: false
  nature: sacred
  basis: [05.7.4, 04.9.2, 12.16.6]
