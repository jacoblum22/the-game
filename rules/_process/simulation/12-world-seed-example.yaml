- id: sit.high_fells.wound
  title: War comes
  template: sit_t.war_comes
  region: loc.high_fells_hungry_pikes
  actors: [fac.high_fells.rulers, fac.high_fells.threat]
  roles: {attacker: fac.high_fells.threat, defender: fac.high_fells.rulers}
  what: The horde came down from the passes thirty winters ago and burned the High Fells to the river. It was driven back. The watchfires
    on the passes were lit again this spring.
  premise: []
  cadence: week
  timeline:
  - n: 1
    at: {after: 1 week}
    trigger: null
    requires: []
    prevented_by: []
    key_delta: [relations -3 (war); a muster]
    trace: the levy called
    bang: null
  - n: 2
    at: {after: 4 weeks}
    trigger: null
    requires: [1]
