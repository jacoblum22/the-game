rumor_tables:
- id: tbl.high_fells.rumors
  name: Rumors of the High Fells
  die: d20
  rule: each rumor's truth is SEALED here (11.6.1); 11.6.3's distortion applies as it spreads
  results:
  - {range: '1', text: Word is that the lords of Hawkgate will try to humble the rival house., truth: 'true', points_to: clk.high_fells.rulers.goal,
    source: hearsay}
  - {range: '2', text: Word is that the faithful of Oswen will try to raise a chapter-house in the town., truth: 'true', points_to: clk.high_fells.faith.goal,
    source: hearsay}
  - {range: '3', text: Word is that the Horde of the Millwick will try to break the watch on the passes and burn the lowlands again.,
    truth: 'true', points_to: clk.high_fells.threat.goal, source: hearsay}
  - {range: '4', text: Word is that the council of Merestead will try to rid the streets of the gangs., truth: 'true', points_to: clk.high_fells.fourth.goal,
    source: hearsay}
  - {range: '5', text: The levy called; folk say it is only the beginning., truth: 'true', points_to: sit.high_fells.wound, source: eyewitness}
  - {range: '6', text: A savaged ewe; folk say it is only the beginning., truth: 'true', points_to: sit.high_fells.local, source: eyewitness}
  - {range: '7', text: At Shephollow's Undercroft lies the great beast of the place., truth: 'true', points_to: loc.high_fells_shephollows_undercroft,
    source: hearsay}
  - {range: '8', text: At The Caves of Crowton lies the one dragged down here., truth: 'true', points_to: loc.high_fells_caves_of_crowton,
    source: hearsay}
  - {range: '9', text: Whitfield's Temple is empty now; whatever was there is long gone., truth: 'false', points_to: loc.high_fells_whitfields_temple,
    source: hearsay}
  - {range: '10', text: 'At Calmere''s Keep lies the one taken for the sacrifice, and no one has ever come back from it.', truth: partial,
    points_to: loc.high_fells_calmeres_keep, source: hearsay}
  - {range: '11', text: 'At The Whispering Tower lies the relic everyone seeks, and no one has ever come back from it.', truth: partial,
    points_to: loc.high_fells_whispering_tower, source: hearsay}
  - {range: '12', text: Hollymore's Tower is empty now; whatever was there is long gone., truth: 'false', points_to: loc.high_fells_hollymores_tower,
    source: hearsay}
  - {range: '13', text: 'At Wolfcrag''s Delving lies the seat of The Horde of the Millwick, and its head, and no one has ever come back
      from it.', truth: partial, points_to: loc.high_fells_wolfcrags_delving, source: legend}
  - {range: '14', text: Oakwall's Warren is empty now; whatever was there is long gone., truth: 'false', points_to: loc.high_fells_oakwalls_warren,
    source: legend}
  - {range: '15', text: The Broken Warren is empty now; whatever was there is long gone., truth: 'false', points_to: loc.high_fells_broken_warren,
    source: legend}
  - {range: '16', text: 'At Whitmouth''s Undercroft lies the celestial warden, and no one has ever come back from it.', truth: partial,
    points_to: loc.high_fells_whitmouths_undercroft, source: legend}
  - {range: '17', text: The Delving of Ashhollow is empty now; whatever was there is long gone., truth: 'false', points_to: loc.high_fells_delving_of_ashhollow,
    source: legend}
  - {range: '18', text: Oswen has been seen in a dream by three people this month., truth: partial, points_to: fac.high_fells.faith,
    source: legend}
  - {range: '19', text: 'Word is that the lords of Hawkgate will try to humble the rival house, or so the drovers say.', truth: partial,
    points_to: clk.high_fells.rulers.goal, source: hearsay}
  - {range: '20', text: 'Word is that the faithful of Oswen will try to raise a chapter-house in the town, or so the drovers say.',
    truth: partial, points_to: clk.high_fells.faith.goal, source: hearsay}
