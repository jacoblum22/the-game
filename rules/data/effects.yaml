# data/effects.yaml
# Purpose: the single table of mechanical meanings (the ruleset's ItemStatCost). Abilities, item
#   properties, conditions, adversary powers, composites, hazards and clock completions reference
#   these ids with parameters and never restate a mechanic in prose (00.10.1).
# Owner: 00-architecture (the core library below). Chapters add definitions only in their own
#   owner-block under `blocks:`, only when no core effect with parameters expresses the mechanic,
#   with a DL entry (PR-00-8).
# Schema: data/SCHEMAS.md#effectsyaml. Operations, families, hooks, slots: data/substrate.yaml.
# Parameter conventions: `amount` integers; `severity` S1..S5; `tags` are data/tags.yaml ids matched
#   with cascade; `duration` per substrate.duration_forms; `applies_when` is a state expression over
#   {verb, deed_tag, secondary_tags, harm_tags, situation, target_tags, actor_tags, band, flags, conditions,
#   gate.mode, "your calling key", event, event.target} (00.10.1, amended at integration: 04, 05).
# Integration: chapter owner-blocks from data/contrib/effects.NN.yaml are merged under `blocks:` (fragments kept in
#   _process/merged-contrib/).
# Basis: [R3 §00.1, §6 #2]; [R4 SG-15]; [DL-00A-16]

schema_version: 1

core:
  # ---- checks and defenses ----
  - {id: eff.check_edge, op: modify, quantity: check_total, family: edge, regime: additive, lifecycle: provisional,
     params: {amount: "1..2", applies_when: expr}, text: "+{amount} to checks {applies_when}."}
  - {id: eff.defense_edge, op: modify, quantity: defense, family: edge, regime: additive, lifecycle: provisional,
     params: {amount: "1..2", attribute: attr_id, applies_when: expr}, text: "+{amount} to {attribute} defense {applies_when}."}
  - {id: eff.effect_dc_edge, op: modify, quantity: effect_dc, family: edge, regime: additive, lifecycle: provisional,
     params: {amount: "1..2", applies_when: expr}, text: "+{amount} to the DC of your effects {applies_when}."}
  - {id: eff.status_modifier, op: modify, quantity: check_total, family: status, regime: additive, lifecycle: provisional,
     params: {amount: "-4..2", applies_when: expr}, text: "{amount} to checks {applies_when} (condition)."}
  - {id: eff.defense_status, op: modify, quantity: defense, family: status, regime: additive, lifecycle: provisional,
     params: {amount: "-4..2", applies_when: expr}, text: "{amount} to defenses {applies_when} (condition)."}
  # ---- levers, reach, stakes ----
  - {id: eff.grant_lever, op: lever, regime: additive, lifecycle: provisional,
     params: {type: "precision|protective|amplifying", for_verbs: [verb_id], for_tags: [tag], duration: duration, to: "who may cite it (default self; 06: those acting against the bearer)", engine_cited: bool, applies_when: expr},   # to/engine_cited/applies_when amended (06)
     text: "Counts as an established {type} fact you may cite for {for_verbs} {for_tags}."}
  - {id: eff.reach_step, op: step, regime: additive, lifecycle: provisional,
     params: {ladder: reach, steps: "-1..1", applies_when: expr}, text: "Reach {steps} rung {applies_when}."}
  - {id: eff.stakes_step, op: step, regime: additive, lifecycle: provisional,
     params: {ladder: stakes, steps: "-1..1", applies_when: expr}, text: "Stakes {steps} rung {applies_when}."}
  # ---- harm dealt ----
  - {id: eff.harm_edge, op: modify, quantity: harm_dealt, family: harm_edge, regime: additive, lifecycle: provisional,
     params: {amount: "1..2", applies_when: expr}, text: "+{amount} harm {applies_when}."}
  - {id: eff.harm_severity_step, op: step, regime: additive, lifecycle: provisional,
     params: {ladder: severity, steps: "-2..2", applies_when: expr}, text: "Harm {steps} severity rung {applies_when}."}
  - {id: eff.deal_harm, op: harm, regime: independent_trigger, lifecycle: provisional,
     params: {severity: S1..S5, harm_tags: [tag], target: target_rule}, text: "Deals {severity} {harm_tags} harm to {target}."}
  - {id: eff.strike_delivery, op: claim_slot, slot: slot.strike_delivery, regime: priority_exclusive, lifecycle: provisional,
     params: {priority_rank: int, harm_tags: [tag], harm_edge: "0..2", duration: duration, cosmetic_merge: bool},
     text: "Your Strikes deal {harm_tags} harm, +{harm_edge}."}
  # ---- harm taken ----
  - {id: eff.harm_reduction, op: modify, quantity: harm_taken, family: reduction, regime: additive, lifecycle: provisional,
     params: {amount: "1..4", harm_tags: [tag]}, text: "Reduce {harm_tags} harm you take by {amount}."}
  - {id: eff.harm_resistance, op: multiply, quantity: harm_taken, family: multiplier, regime: additive, lifecycle: provisional,
     params: {factor: 0.5, harm_tags: [tag]}, text: "Halve {harm_tags} harm you take, rounded down."}
  - {id: eff.harm_vulnerability, op: multiply, quantity: harm_taken, family: multiplier, regime: additive, lifecycle: provisional,
     params: {factor: 2, harm_tags: [tag]}, text: "Double {harm_tags} harm you take."}
  - {id: eff.hazard_step, op: step, regime: additive, lifecycle: provisional,
     params: {ladder: severity, steps: "-1..-2", harm_tags: [tag], applies_when: "hazard"}, text: "Hazards of {harm_tags} count {steps} severity rung."}
  - {id: eff.prevent_hit, op: prevent, hook: on_hit_taken, regime: independent_trigger, lifecycle: provisional,
     params: {limits: limits, applies_when: expr}, text: "Negate one hit {applies_when}."}
  - {id: eff.intercept, op: redirect, hook: on_hit_taken, regime: independent_trigger, lifecycle: provisional,
     params: {new_target: "self", applies_when: "an ally engaged with you is hit", limits: limits}, text: "Take a hit meant for an engaged ally."}
  # ---- conditions ----
  - {id: eff.apply_condition, op: apply_condition, regime: independent_trigger, lifecycle: provisional,
     params: {condition: cond_id, severity: S1..S5, duration: duration, target: target_rule}, text: "Applies {condition} ({severity}) to {target} for {duration}."}
  - {id: eff.cleanse, op: remove_condition, regime: independent_trigger, lifecycle: provisional,
     params: {condition_or_category: str, target: target_rule}, text: "Ends {condition_or_category} on {target}."}
  - {id: eff.condition_immunity, op: restrict, regime: additive, lifecycle: provisional,
     params: {forbid: {conditions: [cond_id], flags: [flag_id], effects_with_trait: [tag]}, target: self}, text: "{conditions} cannot be applied to you."}   # flags/effects_with_trait amended (06)
  - {id: eff.restrict, op: restrict, regime: additive, lifecycle: provisional,
     params: {forbid: {verbs: [verb_id], methods: [str], senses: [str], licenses: [license_id]}, target: target_rule, duration: duration},
     text: "{target} cannot {forbid} for {duration}."}
  # ---- resources ----
  - {id: eff.restore, op: resource, regime: independent_trigger, lifecycle: provisional,
     params: {quantity: "vitality|focus|supply|fate", units: int, target: target_rule}, text: "{target} regains {units} {quantity}."}
  - {id: eff.drain, op: resource, regime: independent_trigger, lifecycle: provisional,
     params: {quantity: "focus|supply", units: int, target: target_rule}, text: "{target} loses {units} {quantity}."}
  - {id: eff.max_modify, op: modify, quantity: "vitality_max|focus_max", family: adjust, regime: additive, lifecycle: provisional,
     params: {quantity: str, amount: "1..4"}, text: "+{amount} maximum {quantity} (within its cap)."}
  - {id: eff.focus_cost_step, op: modify, quantity: focus_cost, family: adjust, regime: additive, lifecycle: provisional,
     params: {amount: "-1..2", applies_when: expr}, text: "Focus costs {amount} {applies_when} (never below 0, never above 6)."}
  # ---- licenses and behavior ----
  - {id: eff.grant_license, op: grant_license, regime: additive, lifecycle: provisional,
     params: {license: license_id, grade: str, duration: duration}, text: "You may attempt what {license} licenses, at {grade}, for {duration}."}
  - {id: eff.movement_mode, op: claim_slot, slot: slot.movement_mode, regime: priority_exclusive, lifecycle: provisional,
     params: {priority_rank: int, mode: "climb|swim|fly|burrow", duration: duration}, text: "You move by {mode}."}
  - {id: eff.stance, op: claim_slot, slot: slot.stance, regime: priority_exclusive, lifecycle: provisional,
     params: {priority_rank: int, form: str, effects: [effect_ref]}, text: "You hold the {form} stance."}
  - {id: eff.aura, op: claim_slot, slot: slot.aura, regime: priority_exclusive, lifecycle: provisional,
     params: {priority_rank: int, band: band_id, effects: [effect_ref]}, text: "An aura affects those within {band}."}
  - {id: eff.body_form, op: claim_slot, slot: slot.body_form, regime: priority_exclusive, lifecycle: provisional,
     params: {priority_rank: int, template: str, duration: duration}, text: "You take the form of {template}."}
  - {id: eff.reaction_grant, op: economy, regime: additive, lifecycle: provisional,
     params: {reactions: "1", applies_when: expr}, text: "One additional reaction per round {applies_when} (only where ch.06 allows)."}
  # ---- position ----
  - {id: eff.reposition, op: move, regime: independent_trigger, lifecycle: provisional,
     params: {target: target_rule, band_change: "-2..2", flags_add: [flag_id], flags_remove: [flag_id]}, text: "Moves {target} {band_change} bands."}
  # ---- world ----
  - {id: eff.tick_clock, op: tick, regime: independent_trigger, lifecycle: provisional,
     params: {clock: "clock_id|kind", ticks: "int|delivered_reach|U(severity)"}, text: "Ticks {clock}."}
  - {id: eff.reveal, op: reveal, regime: independent_trigger, lifecycle: provisional,
     params: {sealed_ref: str}, text: "Reveals {sealed_ref}."}
  - {id: eff.summon, op: create, regime: independent_trigger, lifecycle: provisional,
     params: {template: str, location: str, duration: duration}, text: "Brings {template} into being for {duration}."}
  - {id: eff.force_check, op: trigger_check, regime: independent_trigger, lifecycle: provisional,
     params: {verb: "endure|evade", effect_dc_source: str, degree_table: str}, text: "{target} must {verb} against the effect DC."}
  - {id: eff.write_fact, op: set_fact, regime: independent_trigger, lifecycle: provisional,
     params: {subject: str, predicate: str, value: any}, text: "Establishes that {subject} {predicate} {value}."}

blocks:   # owner-blocks merged at integration from _process/merged-contrib/effects.NN.yaml (integration-merge.py)
  # ---- merged from effects.02.yaml ----
  # data/contrib/effects.02.yaml
  # Purpose: ch.02's addition to data/effects.yaml. ONE definition, added because no core effect expresses it
  #   (PR-00-8). T-00-19 lists owner-blocks 04-11, 15, 16 for effects.yaml; ch.02 REQUESTS an owner-block "02"
  #   for this single entry (02 Interface requests, item 00-1).
  # Owner: 02-character. Schema: data/SCHEMAS.md#effectsyaml. Decision: DL-02-11.
  - owner: '02'
    entries:
    - id: eff.02.bent
      op: set_fact
      regime: independent_trigger
      params: {attribute: attr_id, amount: '1'}
      applies_when: "the player ACCEPTED the Bent offer (02.6.6); the attribute is +2 or lower"
      limits: {per: lifetime, uses: 1}
      player_only: true
      text: 'Permanently raises {attribute} by {amount}, never above +3 (00.4.3 a).'
      why_not_core: attributes are not quantities of the evaluation pass (T-00-13) and no modify effect may change them
        (00.4.3); the birth Bent is the one write 00.4.3 a allows, expressed as a recorded fact, as ch.07 did for eff.07.maim
      lifecycle: provisional
      basis: [00.4.3 a, 02.6.5, 02.6.6, 'C:P1', DL-02-11]
  # ---- merged from effects.05.yaml ----
  # data/contrib/effects.05.yaml
  # Purpose: ch.05's owner-block for data/effects.yaml. Six definitions, each added because no core effect with
  #   parameters expresses the mechanic (PR-00-8), each using one of the 20 closed operations and one of the four
  #   regimes. Everything else in abilities.yaml, rituals.yaml and composites.yaml references the core library.
  # Owner: 05-abilities-focus-magic. Schema: data/SCHEMAS.md#effectsyaml. Decision: DL-05-25.
  - owner: '05'
    entries:
    - id: eff.05.spell_delivery
      op: claim_slot
      slot: slot.spell_delivery
      regime: priority_exclusive
      params: {priority_rank: int, form: touch|bolt|line|burst|cone|chain|zone, duration: duration, cosmetic_merge: bool}
      text: Your workings project as {form}.
      why_not_core: the core library seeds claims for strike delivery, movement, stance, aura and body form but none for slot.spell_delivery
      lifecycle: provisional
      basis: [05.10.4, T-00-14 slot.spell_delivery, DL-05-25]
    - id: eff.05.defense_reaction
      op: claim_slot
      slot: slot.defense_reaction
      regime: priority_exclusive
      hook: on_hit_taken
      params: {priority_rank: int, form: str, effects: '[effect_ref]'}
      text: When you are hit you answer with {form}.
      why_not_core: no core claim exists for slot.defense_reaction; blocks, parries and wards must compete for one slot by rank
      lifecycle: provisional
      basis: [05.10.3, T-00-14 slot.defense_reaction, DL-05-25]
    - id: eff.05.waive
      op: prevent
      regime: additive
      params: {event_kind: 'a named snag, provoked reaction, restriction or cost', applies_when: expr}
      text: '{event_kind} is not applied {applies_when}.'
      why_not_core: the Exception form needs to negate one named rule consequence (a snag, a provoked reaction); eff.prevent_hit only negates hits
      lifecycle: provisional
      basis: [05.3.2 Exception form, DL-05-25]
    - id: eff.05.refresh_use
      op: resource
      regime: independent_trigger
      hook: per ability (refresh_on)
      params: {ability: ab.*|self, uses: 1..2}
      text: '{ability} regains {uses} use.'
      why_not_core: trigger-refreshed recharge (R3 05.8) returns a USE, which eff.restore's quantity list does not include
      lifecycle: provisional
      basis: [05.4.6, 00.3.11 (uses are counted in units), DL-05-25]
    - id: eff.05.counter_working
      op: prevent
      regime: independent_trigger
      hook: on_declare
      params: {applies_when: another entity within band.near declares a working with trait.nature.magical, limits: limits}
      text: Negate one working as it is cast.
      why_not_core: eff.prevent_hit subscribes to on_hit_taken; a counter must cancel a declared working before it resolves
      lifecycle: provisional
      basis: [05.7.7, R5 MG-08, DL-05-25]
    - id: eff.05.end_working
      op: remove_condition
      regime: independent_trigger
      params: {target: one effect_instance or condition with trait.nature.magical, condition_or_category: magical}
      text: Ends {target}.
      why_not_core: eff.cleanse removes conditions; dispelling must also end magical effect instances that are not conditions (wards, summonings, illusions)
      lifecycle: provisional
      basis: [05.7.7, R5 MG-08, DL-05-25]
  # ---- merged from effects.06.yaml ----
  # data/contrib/effects.06.yaml
  # Purpose: ch.06's owner-block for data/effects.yaml. Four definitions, each added because no core effect with
  #   parameters expresses the mechanic (PR-00-8), each using one of the 20 closed operations and one regime.
  #   Everything else in conditions.yaml and conflict.yaml references the core library.
  # Owner: 06-conflict. Schema: data/SCHEMAS.md#effectsyaml. Decision: DL-06-24.
  - owner: '06'
    entries:
    - id: eff.06.fewer_actions
      op: economy
      regime: additive
      params:
        actions_delta: -3..-1 (never positive)
        minimum_actions: 0..1
        reactions_delta: -1..0
      text: '{actions_delta} actions each turn (never fewer than {minimum_actions}); {reactions_delta} reactions.'
      why_not_core: no core effect removes actions; eff.reaction_grant only adds a reaction. INV-11 forbids adding actions,
        not removing them; substrate.yaml lists economy with reactions_delta only (Interface request to 00, item 1)
      lifecycle: provisional
      basis:
      - 06.1.2
      - INV-11
      - T-00-15 (cond.dazed, cond.stunned)
      - DL-06-24
    - id: eff.06.pace
      op: modify
      quantity: speed
      family: adjust
      regime: additive
      params:
        amount: -1..1, or a mount's pace
        applies_when: expr
      text: 'Pace {amount}: each band transition costs one action more (negative) or the costs of pace 2 apply (positive).'
      why_not_core: the core library has no modify on the quantity speed (T-00-13 names it as ch.06 bands per move action)
      lifecycle: provisional
      basis:
      - 06.3.3
      - T-00-13
      - DL-06-24
    - id: eff.06.grant_snag
      op: lever
      regime: additive
      params:
        type: precision|protective|amplifying
        sign: snag
        to: who suffers it (those acting against the bearer, or the bearer)
        fact: str
        applies_when: expr
        duration: duration
      text: Counts as an established {type} snag, citing {fact}, {applies_when}.
      why_not_core: eff.grant_lever creates lever facts only; cover, concealment, Defend, Fend and a prone target at range
        need the mirror
      lifecycle: provisional
      basis:
      - 00.3.9
      - 06.3.6
      - 06.4.7
      - DL-06-24
    - id: eff.06.internal_harm
      op: harm
      regime: independent_trigger
      hook: on_turn_end
      params:
        vitality_per_stack: '1'
        harm_tags: '[tag]'
        no_reduction: true
      text: At the end of its turn the bearer loses {vitality_per_stack} Vitality per stack ({harm_tags}); no reduction applies.
      why_not_core: eff.deal_harm passes through the receiver's reduction; bleeding and choking are inside the armor
      lifecycle: provisional
      basis:
      - 06.7 (cond.bleeding, cond.choking)
      - '05 uses apply_harm(no_reduction: true) for strain'
      - DL-06-24
  # ---- merged from effects.07.yaml ----
  # data/contrib/effects.07.yaml
  # Purpose: ch.07's owner-block for data/effects.yaml. Seven definitions, each added because no core effect with
  #   parameters expresses the mechanic (PR-00-8), each using one of the 20 closed operations and one regime.
  #   Everything else in harm.yaml, injuries.yaml, afflictions.yaml and last_chance.yaml references the core library
  #   and ch.06's eff.06.* (fewer_actions, pace, grant_snag, internal_harm).
  # Owner: 07-harm-recovery-death. Schema: data/SCHEMAS.md#effectsyaml. Decision: DL-07-16.
  - owner: '07'
    entries:

    - id: eff.07.vitality_max_penalty
      op: modify
      quantity: vitality_max
      family: adjust
      regime: additive
      params: {amount: -4..-1}
      text: '{amount} maximum Vitality (never below half of base plus band growth, 07.1.2).'
      why_not_core: eff.max_modify takes amount 1..4 only; wounds, brink and some marks lower the maximum
      lifecycle: provisional
      basis: [07.1.2, 07.2.5, 07.2.8, DL-07-16]
    - id: eff.07.dread
      op: resource
      regime: independent_trigger
      hook: per source (on_dying, on_boundary, on_condition_applied, or the calling rule)
      params: {units: 1..4 | U(severity), severity: S1..S5 | null, check: 'bool (true: a dread check at the severity, 07.11.2;
          false: flat)', target: target_rule}
      text: '{target} gains {units} dread (after a dread check when {check}).'
      why_not_core: eff.drain's quantity list is focus | supply; dread is ch.07's own quantity
      lifecycle: provisional
      basis: [07.11.1, 07.11.2, DL-07-16]
    - id: eff.07.maim
      op: set_fact
      regime: independent_trigger
      params: {attribute_order: '[attr_id, attr_id]', amount: '-1'}
      text: Permanently lowers the first attribute in {attribute_order} not maimed before and above -2 by 1 (00.4.3 c).
      why_not_core: attributes are not quantities of the evaluation pass (T-00-13) and no effect may change them; a maim is
        the one write 00.4.3 c allows, expressed as a recorded fact
      lifecycle: provisional
      basis: [00.4.3 c, 07.7.4, DL-07-16]
    - id: eff.07.stabilize
      op: set_fact
      regime: independent_trigger
      params: {target: one Dying being, brink_wound: bool (default true; false for lc.reprieve and a critical Gamble)}
      text: '{target} is stabilized: Dying ends, the harm state is Staggered, on_stabilize fires (07.2.8).'
      why_not_core: harm states are not conditions (00.9.4), so eff.cleanse cannot end Dying
      lifecycle: provisional
      basis: [07.2.8, 05 ab.breath_of_life, DL-07-16]
    - id: eff.07.affliction_shift
      op: remove_condition
      regime: independent_trigger
      params: {affliction: aff.* | kind | family tag, stages: -2..-1, target: target_rule}
      text: Lowers {affliction} on {target} by {stages} stage(s); at stage 0 it is cured and its carrier ends.
      why_not_core: eff.cleanse removes a whole condition; remedies and treatment move an affliction along its stages
      lifecycle: provisional
      basis: [07.9.6, DL-07-16]
    - id: eff.07.rest_cap
      op: restrict
      regime: additive
      params: {rests: '[breather | rest_short | rest_long]', quality: partial | interrupted, applies_when: expr}
      text: The named rests are at best {quality} for the bearer {applies_when}.
      why_not_core: eff.restrict forbids verbs, methods, senses and licenses; rest quality is none of those
      lifecycle: provisional
      basis: [07.8.4, DL-07-16]
    - id: eff.07.block_restore
      op: prevent
      regime: additive
      params: {event_kind: a Vitality-restoring effect on the bearer, source_filter: trait.nature.magical | rest | any, amount: all
          | half}
      text: '{source_filter} restoring of Vitality to the bearer is reduced by {amount}.'
      why_not_core: eff.prevent_hit negates hits only; three curses (deaths_debt, grave_bound, wasting) close a channel of
        recovery
      lifecycle: provisional
      basis: [07.9.7, DL-07-16]
  # ---- merged from effects.08.yaml ----
  # data/contrib/effects.08.yaml
  # Purpose: ch.08's owner-block for data/effects.yaml: three definitions no core effect with parameters expresses (PR-00-8).
  # Owner: 08-items-loot-crafting. Schema: data/SCHEMAS.md#effectsyaml. Decision: DL-08-21.
  - owner: 08
    entries:
    - id: eff.08.adjust
      op: modify
      family: adjust
      regime: additive
      params: {quantity: carry|supply_use|duration|speed|price|clock_ticks, amount: -4..4, applies_when: expr}
      text: '{amount} to {quantity} {applies_when}.'
      why_not_core: the core library has eff.max_modify (Vitality/Focus maxima) and eff.focus_cost_step only; carry, supply use and other adjust-family quantities of T-00-13 have no core effect
      lifecycle: provisional
      basis: ['08.2', '08.4', DL-08-21]
    - id: eff.08.cost_step
      op: step
      regime: additive
      params: {ladder: severity, steps: -1..1, applies_when: cost.gear targets this item}
      text: A cost.gear against this item is taken {steps} severity rung.
      why_not_core: no core effect steps the severity of a COST (eff.harm_severity_step steps harm); sturdiness and fragility of gear must shift cost.gear forms
      lifecycle: provisional
      basis: ['08.2', '08.4', DL-08-21]
    - id: eff.08.bound_ability
      op: grant_license
      regime: additive
      params: {ability: ab.*, rank: 1..3, relic_surcharge: bool (05.6.3 decides when it applies), feeds_evidence: 'false'}
      text: While this item is equipped and attuned, you hold {ability} at rank {rank} through the equipped partition.
      why_not_core: 'eff.grant_license grants a license for a duration; an item-bound ability must also name its rank, occupy an equipped slot (05.2.8) and carry feeds_evidence: false (00.11.5)'
      lifecycle: provisional
      basis: ['08.2', '08.4', DL-08-21]
  # ---- merged from effects.09.yaml ----
  # data/contrib/effects.09.yaml -- chapter 09's effect owner-block (merged into data/effects.yaml#blocks by the
  #   orchestrator).
  # Owner: 09-adversaries. Schema: data/SCHEMAS.md#effects.yaml.
  # Chapter 09 adds NO new effect definition: every adversary power (data/archetypes.yaml#powers, 68 entries) and
  #   every resisted-effect degree table (#degree_tables, 9 entries) is built from core effects (data/effects.yaml)
  #   and the contrib blocks of chapters 05, 06 and 07, with parameters, per PR-00-8 ("expand before you add").
  #   The generator 09-gen_data09.py validates every effect id it uses against those files.
  # Effects used: eff.movement_mode, eff.condition_immunity, eff.check_edge, eff.force_check, eff.apply_condition,
  #   eff.restore, eff.write_fact, eff.harm_severity_step, eff.deal_harm, eff.reposition, eff.drain, eff.summon,
  #   eff.tick_clock, eff.grant_lever, eff.aura, eff.status_modifier, eff.cleanse, eff.harm_edge, eff.defense_status,
  #   eff.defense_edge, eff.harm_resistance, eff.harm_vulnerability.
  # Basis: [00.10.1] [PR-00-8] [DL-09-17]
  - owner: "09"
    entries: []
  # ---- merged from effects.10.yaml ----
