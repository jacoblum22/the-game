  # ---- merged from effects.11.yaml ----
  # data/contrib/effects.11.yaml -- chapter 11's effect owner-block (merged into data/effects.yaml#blocks).
  # Owner: 11-living-world. Schema: data/SCHEMAS.md#effects.yaml.
  # Why: linchpin fates, world reactions, situation steps, world phenomena and great projects must write world
  #   state through the substrate (00.16.4), and no core effect writes a faction's hold or status, a relation, a
  #   reputation entry, a bang, a situation or a hook. Each is engine-applied (boundary handlers, clock
  #   completions, on_fact_set reactions); none is ever a PC ability's effect, so none can touch the PC's person
  #   (11.2.4).
  # Basis: [00.10.1] [PR-00-8] [11.3.4] [11.3.10] [11.3.11] [11.4.1] [11.4.4] [11.5.6] [11.7.3] [DL-11-08]
  - owner: "11"
    entries:
      - id: eff.11.hold_step
        op: set_fact
        regime: independent_trigger
        hook: "per source (on_clock_complete, on_fact_set, on_boundary)"
        params: {faction: fac_id, steps: "-2..2"}
        text: "{faction} gains or loses hold {steps} time(s) (11.3.4)."
        why_not_core: "hold and tier are a two-rung ladder with tier carry (11.3.4), not a quantity or plain fact the core writes"
        lifecycle: provisional
        basis: ['11.3.4', '11.3.10', DL-11-06]
      - id: eff.11.stage_set
        op: set_fact
        regime: independent_trigger
        hook: "per source"
        params: {faction: fac_id, stage: "rising|flourishing|entrenched|declining|collapsed"}
        text: "{faction} is now {stage} (11.3.9)."
        why_not_core: "a stage change carries the collapse procedure (11.3.9)"
        lifecycle: provisional
        basis: ['11.3.9']
      - id: eff.11.status_step
        op: set_fact
        regime: independent_trigger
        hook: "per source"
        params: {faction: fac_id, steps: "-3..3", reason: str}
        text: "{faction}'s status toward the PC moves {steps} ({reason}); its members are recomputed (15.1.3)."
        why_not_core: "a relationship write with the member-standing recompute attached (15's request)"
        lifecycle: provisional
        basis: ['11.3.11', '15.1.3', DL-11-09]
      - id: eff.11.relation_step
        op: set_fact
        regime: independent_trigger
        hook: "per source"
        params: {faction: fac_id, toward: fac_id, steps: "-3..3"}
        text: "{faction}'s relation toward {toward} moves {steps}."
        why_not_core: "a faction-to-faction relationship write"
        lifecycle: provisional
        basis: ['11.3.14']
      - id: eff.11.reputation_points
        op: set_fact
        regime: independent_trigger
        hook: "per source"
        params: {actor: id, key: str, scope: scope_id, points: "1..2", content: str}
        text: "Adds {points} to what {scope} says of {actor} ({key})."
        why_not_core: "reputation entries are an owned record with thresholds (11.7.3)"
        lifecycle: provisional
        basis: ['11.7.2', '11.7.3', DL-11-15]
      - id: eff.11.queue_bang
        op: create
        regime: independent_trigger
        hook: "per source"
        params: {kind: "timeline|fallback|entanglement|kicker|opportunity|world", tag: "threat|social|opportunity", intensity_delta: "0..4", specificity: "pc_deed|npc|faction|region|generic", content: str, ways_out: "[str] (>= 2)", expires: duration}
        text: "Queues a bang: {content}."
        why_not_core: "a bang is a queue entry read by ch.12's pacing director (11.4.4), not an entity eff.summon makes"
        lifecycle: provisional
        basis: ['11.4.4', '12.7.4', DL-11-10]
      - id: eff.11.new_situation
        op: create
        regime: independent_trigger
        hook: "per source"
        params: {template: sit_t_id, region: place_id, roles: map}
        text: "A new situation begins: {template} in {region}."
        why_not_core: "a situation is instantiated from a template with roles bound from state and a sealed timeline (11.4.1)"
        lifecycle: provisional
        basis: ['11.4.1', '11.4.3', DL-11-07]
      - id: eff.11.seed_hook
        op: create
        regime: independent_trigger
        hook: "per source"
        params: {text: str, source: str, entities: "[id]", delivery: "rumor|person|letter"}
        text: "A hook is seeded: {text}."
        why_not_core: "a hook is a thread record at status seeded with a delivery trace (11.5.6)"
        lifecycle: provisional
        basis: ['11.5.6', DL-11-17]
  # ---- merged from effects.15.yaml ----
  # data/contrib/effects.15.yaml -- chapter 15's effect owner-block (merged into data/effects.yaml#blocks).
  # Owner: 15-social-investigation-downtime. Schema: data/SCHEMAS.md#effects.yaml.
  # Chapter 15 builds most of its mechanics as engine rules (standing, terms, ceilings, clue delivery) that
  #   call tools directly; these five definitions exist so that ITEMS, ABILITIES, CONDITIONS and CLOCK
  #   COMPLETIONS (04.9.4's atonement for an NPC grudge; a truth-out clock; a charm; a "silver tongue" talent)
  #   can produce social results through the substrate rather than prose (00.16.4).
  # Pending 00 amendments (15 Interface requests to 00, items 6): (a) the `step` op admits the ladders
  #   `request_size` (R1..R5) and `plausibility` (known_false..plausible); (b) eff.15.standing_step and
  #   eff.15.alertness_step use op set_fact whose write is `set_relationship` / the NPC alertness field.
  #   Until then, a data entry may use them only as clock-completion effects (engine-applied, 15.1.5 source 3/5).
  # Basis: [00.10.1] [PR-00-8] [15.1.5] [15.3.4] [15.5.2] [15.5.4] [15.5.7] [DL-15-30]
  - owner: "15"
    entries:
      - id: eff.15.standing_step
        op: set_fact
        regime: independent_trigger
        hook: per source (on_clock_complete for atonement and campaign clocks; on_boundary for an item's effect)
        params: {target: npc_id, toward: "pc | companion id", steps: "-3..3", cap: "warm | friendly | devoted", reason: str}
        text: "{target}'s standing toward {toward} moves {steps} (not above {cap})."
        why_not_core: no core effect writes a relationship; 15.1.5 requires every standing change to cite a source, which this records
        lifecycle: provisional
        basis: ['15.1.5', '15.1.7', '04.9.4 (an atoned grudge writes a standing step)', DL-15-30]
      - id: eff.15.request_step
        op: step
        regime: additive
        params: {ladder: request_size, steps: "-1..1", applies_when: expr}
        text: "Requests {applies_when} count {steps} rung on the request ladder (15.3.2); the ceiling still applies."
        why_not_core: eff.reach_step and eff.stakes_step cover reach and stakes; the request ladder is 15's
        lifecycle: provisional
        basis: ['15.3.2', '15.3.4', DL-15-30]
      - id: eff.15.plausibility_step
        op: step
        regime: additive
        params: {ladder: plausibility, steps: "-1..1", applies_when: expr}
        text: "Claims {applies_when} are judged {steps} rung on the plausibility ladder (15.5.2); never past known false."
        why_not_core: plausibility is a 4-rung ladder owned by 15
        lifecycle: provisional
        basis: ['15.5.2', DL-15-30]
      - id: eff.15.alertness_step
        op: set_fact
        regime: independent_trigger
        hook: per source (on_boundary, on_condition_applied, on_clock_tick)
        params: {target: target_rule, steps: "-2..2", toward: "id | intruders"}
        text: "{target}'s alertness toward {toward} moves {steps} rung(s) (unaware, suspicious, alert, alarmed)."
        why_not_core: alertness is a stored NPC field (15.5.7), not a quantity or condition
        lifecycle: provisional
        basis: ['15.5.7', '01.13.6', DL-15-30]
      - id: eff.15.expose_lie
        op: reveal
        regime: independent_trigger
        hook: on_clock_complete
        params: {lie: lie_id, believers: "all | id"}
        text: "The lie {lie} is exposed to {believers} (PR-15-3)."
        why_not_core: eff.reveal unseals a fact to the narrator; exposure also supersedes beliefs and writes memories (15.5.5)
        lifecycle: provisional
        basis: ['15.5.4', '15.5.5', DL-15-17]
  # ---- merged from effects.16.yaml ----
  # data/contrib/effects.16.yaml -- chapter 16's effect owner-block (merged into data/effects.yaml#blocks).
  # Owner: 16-companions-and-allies. Schema: data/SCHEMAS.md#effects.yaml.
  # Chapter 16 builds its knacks from CORE effects (eff.grant_license, eff.defense_edge, eff.grant_lever,
  #   eff.cleanse, eff.harm_reduction, eff.write_fact, eff.intercept) and moves standing through ch.15's
  #   eff.15.standing_step. These three definitions exist so that ITEMS, ABILITIES, RITES, CONDITIONS and CLOCK
  #   COMPLETIONS can touch an ally's loyalty, its standing order and a held line through the substrate rather
  #   than prose (00.16.4): a bard's gift that warms a companion, a horn that orders the retinue to fall back, a
  #   rite that shores a held line.
  # Basis: [00.10.1] [PR-00-8] [16.5.3] [16.7.3-16.7.5] [16.7.12] [DL-16-21]
  - owner: "16"
    entries:
      - id: eff.16.loyalty_tick
        op: tick
        regime: independent_trigger
        hook: "per source (on_boundary for an item's weekly effect; on_clock_complete; on_degree for an ability)"
        params: {target: ally_id, clock: "regard | grievance", ticks: "-2..2"}
        text: "{target}'s {clock} clock moves {ticks}, and its omen is rendered."
        why_not_core: "eff.tick_clock needs a clock id; an ally's regard and grievance clocks are per-ally instances (clk.16.regard.<id>) resolved from the target"
        lifecycle: provisional
        basis: ['16.5.3', '16.5.8 (omen obligation)', DL-16-21]
      - id: eff.16.set_order
        op: set_fact
        regime: independent_trigger
        hook: "per source (on_dying for 16.7.5; on_vitality_threshold or on_defeat for 16.7.4; the conflict_start handler for 16.7.3)"
        params: {target: "ally_id | all_allies", order: "guard_me | hold_him | harry_that_one | hold_this_ground | stay_back", reason: str}
        text: "{target} takes the standing order {order} (no action)."
        why_not_core: "a standing order is a stored field of an ally (06.14.4), not a condition or a position; the engine writes it without a Command only through this effect"
        lifecycle: provisional
        basis: ['06.14.4', '16.7.3', '16.7.4', '16.7.5', DL-16-21]
      - id: eff.16.held_line_step
        op: tick
        regime: independent_trigger
        hook: "per source (on_degree of a PC beat against a held group; a rite or item that shores a line)"
        params: {clock: "clk.16.held_line.<id>", ticks: "-2..2 | delivered_reach"}
        text: "The line at {clock} moves {ticks}."
        why_not_core: "a held line is a tug clock whose ends move foes between fights (16.7.12); naming its step keeps the move-foes link with the tick"
        lifecycle: provisional
        basis: ['16.7.12', 'PR-16-11', DL-16-14]
