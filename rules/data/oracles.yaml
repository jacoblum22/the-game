- id: tbl.twist
  name: Twist (dispatcher by severity)
  tags: []
  die: none
  recency: false
  context_filters:
  - severity
  - scene_tags
  - band
  results:
  - range: S1
    result: roll tbl.twist_s1
    sub_table:
    - tbl.twist_s1
  - range: S2
    result: roll tbl.twist_s2
    sub_table:
    - tbl.twist_s2
  - range: S3
    result: roll tbl.twist_s3
    sub_table:
    - tbl.twist_s3
  - range: S4
    result: roll tbl.twist_s4
    sub_table:
    - tbl.twist_s4
  - range: S5
    result: roll tbl.twist_s5
    sub_table:
    - tbl.twist_s5
  lifecycle: provisional
  basis: &id002
  - '[01.13.10 (cost.twist; rows per severity requested of ch.12)]'
  - '[R7 §4.3 Twist row]'
  - '[R5 P-16]'
  - '[12.9.4]'
  context_rule: the severity passed by cost.twist selects the row; no die is rolled on this table
  constraints:
  - a twist never deals harm directly (that is cost.harm) and never kills
  - every creature or hazard a row creates is drawn from the scene's own encounter, hazard or trap tables (ch.10; the region's seed, 12.16.13) filtered
    by the stated band; nothing is invented
  - a row whose prerequisite is absent (no companion present; no existing danger clock) falls to the row named in its fallback
  - the DM chooses the fictional form; the row fixes what enters play
  - clocks created by rows use the templates in data/pacing.yaml#clock_templates (ch.12 owns them; omens included)
  - 'S5 rows are legal only from world events (01.13.10): a twist on a PC frame never rolls S5'
- id: tbl.twist_s1
  name: Twist rows at S1
  tags: []
  die: d8
  recency: true
  context_filters:
  - scene_tags
  - band
  results:
  - range: '1'
    result: 'An unwelcome witness: someone arrives who sees what you are doing.'
    writes:
    - create_entity(npc walk-on, 12.11.1)
    - record_knowledge(witness, the act)
  - range: '2'
    result: 'An interruption: someone needs your attention now.'
    writes:
    - create_entity(npc walk-on with an urgent request)
    - ignoring it is free; it is recorded in that NPC's memory
  - range: '3'
    result: 'A small snag: a stuck latch, a patch of mud, a press of bodies.'
    writes:
    - 'set_fact(snag: Precision -2 on the next beat of this method this scene)'
  - range: '4'
    result: 'Something mislaid: a carried, unequipped, non-unique item is dropped or set down here.'
    writes:
    - set_fact(item.location = this place)
    - a free search after the scene recovers it
  - range: '5'
    result: 'Drawn attention: the nearest observer grows more alert (not hostile).'
    writes:
    - alertness +1 step on the nearest observer (ch.15 ladder)
  - range: '6'
    result: 'A delay: the next activity in this scene takes longer.'
    writes:
    - the next activity's time cost +1 unit of the mode (01 T-01-9)
  - range: '7'
    result: A small false rumor about you starts here.
    writes:
    - create rumor (ch.11), truth false, scope this place
  - range: '8'
    result: The light or weather turns a step worse here.
    writes:
    - set_fact(scene light/weather one step worse) - a snag for sight-based beats this scene
  lifecycle: provisional
  basis: *id002
- id: tbl.twist_s2
  name: Twist rows at S2
  tags: []
  die: d8
  recency: true
  context_filters:
  - scene_tags
  - band
  results:
  - range: '1'
    result: 'A barrier: a door bars, a plank gives, a path floods.'
    writes:
    - create obstacle entity with the tier of the beat's own obstacle; it needs its own beat
  - range: '2'
    result: Someone stands in the way and must be talked past.
    writes:
    - create_entity(npc walk-on)
    - reaction roll (12.11.2)
    - a Talk beat is needed to pass
  - range: '3'
    result: The trail, the target or the quarry is lost for now.
    writes:
    - set_fact(lost)
    - an Observe or tracking beat regains it
  - range: '4'
    result: 'A demand: someone with authority wants payment, papers or an explanation first.'
    writes:
    - create_entity(npc with authority, or use one present)
    - 'set_fact(refusal: will not let you pass until satisfied)'
  - range: '5'
    result: 'Your gear fouls: the tool or item you were using must be freed or fixed before reuse.'
    writes:
    - set_fact(item.state = fouled); a Handle beat clears it (ch.08 defines fouled vs damaged)
  - range: '6'
    result: A rival for the same goal appears.
    writes:
    - create_entity(npc rival)
    - 'create_clock(clk.twist_rival_first: progress 4, sensed, races the PC''s goal clock if one exists)'
  - range: '7'
    result: The way you meant to take is closed; another exists.
    writes:
    - set_fact(route closed)
    - name the alternative route from the place graph
  - range: '8'
    result: Someone now knows what you wanted hidden, and wants something to keep quiet.
    writes:
    - record_knowledge(npc, the hidden fact)
    - 'set_fact(npc want: a price for silence)'
  lifecycle: provisional
  basis: *id002
- id: tbl.twist_s3
  name: Twist rows at S3
  tags: []
  die: d8
  recency: true
  context_filters:
  - scene_tags
  - band
  results:
  - range: '1'
    result: Hostiles arrive.
    writes:
    - roll the scene's encounter table filtered to threat band <= the scene's band
    - they arrive at band.near or farther
    tags:
    - threat
  - range: '2'
    result: 'A hazard wakes: fire spreads, ice cracks, stone begins to fall.'
    writes:
    - a hazard from data/hazards.yaml matching the terrain tags, severity <= S3
    tags:
    - threat
  - range: '3'
    result: Someone has seen you and will report it.
    writes:
    - 'create_clock(clk.twist_word_reaches: danger 6, hidden, 1 tick)'
    tags:
    - threat
  - range: '4'
    result: Pursuit begins.
    writes:
    - 'create_clock(clk.twist_pursuit: danger 4, sensed, 1 tick)'
    tags:
    - threat
  - range: '5'
    result: A trap or snare lies ahead on your path.
    writes:
    - a trap from data/traps.yaml of tier <= the scene's tier, placed on the PC's route
    tags:
    - threat
  - range: '6'
    result: A beast is drawn by noise, blood or food.
    writes:
    - an adversary tagged creature.beast from the scene's encounter table, band <= the scene's
    tags:
    - threat
  - range: '7'
    result: 'Someone with you is put in danger: separated, seized or caught.'
    writes:
    - a companion or friendly NPC present gains a condition or a position change that needs the PC's response
    fallback: row 1 when no companion or friendly NPC is present
    tags:
    - threat
  - range: '8'
    result: The opposition prepares something for you.
    writes:
    - 'create_clock(clk.twist_ambush_prep: danger 6, hidden, 1 tick)'
    tags:
    - threat
  lifecycle: provisional
  basis: *id002
- id: tbl.twist_s4
  name: Twist rows at S4
  tags: []
  die: d8
  recency: true
  context_filters:
  - scene_tags
  - band
  results:
  - range: '1'
    result: 'Reinforcements: the opposition''s allies arrive.'
    writes:
    - add adversaries from the scene's table (band <= the scene's) until ch.09's advisory is one step harder
    tags:
    - threat
  - range: '2'
    result: A greater threat enters.
    writes:
    - one adversary of threat band = the scene's band + 1, at band.far
    tags:
    - threat
  - range: '3'
    result: A danger lurches forward.
    writes:
    - the most advanced existing danger clock that lists cost.twist as a tick source ticks +3
    fallback: row 1 when no such clock exists
    tags:
    - threat
  - range: '4'
    result: 'The ground gives way: collapse, flood or firestorm.'
    writes:
    - a hazard at S4 from data/hazards.yaml matching the terrain; escaping it needs Evade or Exert beats
    tags:
    - threat
  - range: '5'
    result: 'Cornered: your way out closes.'
    writes:
    - the scene's exits are blocked or the PC gains flag.cornered (ch.06)
    tags:
    - threat
  - range: '6'
    result: They seize something or someone you value.
    writes:
    - an NPC ally present is taken, or an unequipped carried item changes possession to the opposition
    fallback: row 2
    tags:
    - threat
  - range: '7'
    result: The alarm is raised.
    writes:
    - advance this place's alarm clock to its imminent stage, or create clk.twist_alarm_raised (danger 6, sensed) at its imminent
      stage
    tags:
    - threat
  - range: '8'
    result: The opposition's champion takes notice and begins to hunt you personally.
    writes:
    - a named opposition NPC is promoted to principal depth (12.11.1)
    - 'create_clock(clk.twist_champion_hunt: danger 8, hidden, 2 ticks)'
    tags:
    - threat
  lifecycle: provisional
  basis: *id002
- id: tbl.twist_s5
  name: Twist rows at S5
  tags: []
  die: d8
  recency: true
  context_filters:
  - scene_tags
  - band
  results:
  - range: '1'
    result: An ally turns against you.
    writes:
    - a Warm-or-better NPC's standing -2 steps; one of their wants now opposes the PC's (logged with its cause)
  - range: '2'
    result: A haven falls.
    writes:
    - a place the PC uses as a haven becomes unsafe (occupied, burned, closed); downtime there is unavailable until restored
  - range: '3'
    result: A thread fails.
    writes:
    - an active thread's opposing clock completes; its on_complete runs
  - range: '4'
    result: A patron withdraws support.
    writes:
    - an institutional offer or support is withdrawn (ch.11); ranks follow ch.11's rules
  - range: '5'
    result: A secret of yours comes out.
    writes:
    - a fact the PC kept hidden becomes public in a scope (ch.11 reputation entry)
  - range: '6'
    result: A rival triumphs.
    writes:
    - 'a rival''s progress clock completes: they reach the goal first'
    fallback: row 3
  - range: '7'
    result: A debt is called in, now.
    writes:
    - a commitment the PC owes falls due at once (ch.11), with its stated consequence for refusal
    fallback: row 2
  - range: '8'
    result: 'The land changes: a road closes, a bridge falls, war or plague reaches the region.'
    writes:
    - a new situation (ch.11) with a default timeline
  lifecycle: provisional
  basis: *id002
- id: tbl.event_focus
  name: Random-event focus
  tags: []
  die: d100
  recency: false
  context_filters:
  - phase
  results:
  - range: 1-8
    result: remote event
    means: something happens elsewhere; it reaches the PC as news or rumor
  - range: 9-24
    result: NPC action
    means: a cast-list NPC acts on a recorded want
    target_list: cast
  - range: 25-30
    result: new NPC
    means: a new person enters the PC's world (12.11.1)
  - range: 31-40
    result: faction move
    means: a faction acts visibly (ch.11 list; one tick on a clock that lists random_event)
    target_list: faction
  - range: 41-50
    result: thread advances
    means: a thread moves toward resolution or opens an opportunity
    target_list: thread
  - range: 51-56
    result: thread complicates
    means: a thread worsens or gains an obstacle
    tags:
    - threat
    phase_substitute:
      peak: omen
      relax: omen
    target_list: thread
  - range: 57-58
    result: thread resolves off-screen
    means: a thread ends without the PC (protected threads read as 'thread complicates', 12.6.5)
    target_list: thread
  - range: 59-66
    result: PC opportunity
    means: something useful comes within the PC's reach
  - range: 67-74
    result: PC complication
    means: a difficulty arises around the PC (never direct harm or a cost)
    tags:
    - threat
    phase_substitute:
      peak: omen
      relax: omen
  - range: 75-80
    result: rumor arrives
    means: a rumor reaches the PC (ch.11 rumor tables)
  - range: 81-86
    result: omen
    means: the most advanced hidden or sensed clock shows its current omen again, concretely (no tick)
  - range: 87-94
    result: current context
    means: something within the scene's current focus shifts
  - range: 95-100
    result: ambiguous
    means: something strange and unexplained occurs; its meaning is a fact sealed until investigated
  lifecycle: provisional
  basis:
  - '[R5 P-11 (Mythic event focus, reweighted for a faction sandbox)]'
  - '[R6 B-16]'
  - '[12.6.5]'
- id: tbl.scene_test
  name: Scene test
  tags: []
  die: d10
  recency: false
  context_filters:
  - tension
  results:
  - range: 1-10
    result: 'compare with tension T: roll <= T-3 deviates; odd = altered, even = interrupted; otherwise expected'
  lifecycle: provisional
  basis:
  - '[R5 P-05]'
  - '[12.4.4]'
  - '[DL-12-06]'
  rule:
    deviate_if_roll_lte: tension - 3
    odd: altered
    even: interrupted
- id: tbl.scene_adjustment
  name: Scene adjustment (altered scenes)
  tags: []
  die: d10
  recency: true
  context_filters: []
  results:
  - range: '1'
    result: add a person
    writes:
    - a cast-list NPC by weight, or a walk-on (12.11.1)
  - range: '2'
    result: remove a person
    writes:
    - an expected NPC is absent (Oracle with time scope for where)
  - range: '3'
    result: intensify the activity
    writes:
    - what was expected is happening harder, faster or louder
  - range: '4'
    result: reduce the activity
    writes:
    - what was expected is quieter, slower or nearly over
  - range: '5'
    result: add an object
    writes:
    - an addressable object is present (write-on-mention; descriptor pair from tbl.meaning)
  - range: '6'
    result: remove an object
    writes:
    - an expected object is missing (a fact; where it went is undetermined)
  - range: '7'
    result: shift the time
    writes:
    - 'the PC arrives later than meant: part of the expected moment has passed'
  - range: '8'
    result: change a feature of the place
    writes:
    - light, crowding or weather differ (a fact)
  - range: '9'
    result: two adjustments
    writes:
    - roll twice more on 1-8, ignoring repeats
  - range: '10'
    result: someone is already here for the same reason
    writes:
    - a rival, ally or stranger with the PC's purpose is present (12.11.1)
  lifecycle: provisional
  basis:
  - '[R5 P-05 (Mythic 2e scene adjustment)]'
  - '[12.4.4]'
