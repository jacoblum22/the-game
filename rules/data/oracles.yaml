    when: a purchase or sale (ch.08), or a Talk beat or speech whose topic is goods, services or a price
    action_rows: [2, 3, 4, 5, 7, 8, 9, 10]
    responses: {'2': refuses to deal, '3': stalls or haggles hard, '4': names a price or a condition, '5': serves someone else first, '7': asks what exactly the PC wants, '8': offers a lesser deal, '9': deals at the price, '10': adds something extra}
  - range: greeting
    result: a first word between the PC and an NPC this scene
    when: the PC addresses an NPC with no exchange between them yet this scene
    action_rows: [2, 3, 5, 6, 7, 8, 9, 10]
    responses: {'2': 'a curt nod, then back to their activity', '3': 'a wary, guarded reply', '5': returns the greeting without stopping, '6': 'answers, then turns to their own concern', '7': asks the PC's name or business, '8': greets and offers a pointer, '9': greets warmly and listens, '10': welcomes the PC and offers hospitality}
  - range: conversation
