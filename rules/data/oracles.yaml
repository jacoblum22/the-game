    action_rows: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    responses: {'2': ends the talk and turns away, '3': deflects or changes the subject, '4': wants something before going on, '5': 'answers briefly, attention on their activity', '6': steers the talk to their own want, '7': asks the PC a question back, '8': gives part of what was asked, '9': gives what was asked, '10': gives more than was asked}
  - range: crowd
