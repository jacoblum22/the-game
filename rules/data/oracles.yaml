    when: a loud or violent act, a lead or an incident in a public place this turn, and the PC addressed no one
    action_rows: [1, 2, 3, 5, 6, 7, 8]
    responses: {'1': someone sends for the watch or calls others, '2': people back away or scatter, '3': the crowd closes up or blocks the way, '5': 'people look, then go back to their business', '6': someone takes the chance for their own ends, '7': someone calls out a question, '8': someone steps up to help}
  - range: work
