# data/oracles.yaml
# Purpose: every table ch.12's DM procedures roll: meaning pairs (the 'and' of yes-and/no-and, random-event
#   content, descriptions), the twist rows by severity (target of cost.twist, 01.13.10), random-event focus,
#   the scene test and scene adjustments, lead-injection forms, vignettes, and NPC generation, reaction and
#   action tables. The DM never picks 'at random': it rolls these (00.3.2, SG-12).
# Owner: 12-dm-procedures (00.17.1 Q6; T-00-19). A region's seed tables (12.16.7, 12.16.11) replace the generic NPC and name
#   tables where they exist.
# Schema: data/SCHEMAS.md#oraclesyaml (Table: id, die, results [{range, result, effects?, sub_table?}],
#   recency, context_filters) plus the common envelope. Optional fields used here (documented in 12 Tables):
#   writes (the state writes a row makes), tags (row tags; 'threat' rows are filtered by the pacing phase),
#   phase_substitute, fallback, target_list, means, kind, rooted_in, pronouns, standing, standing_delta,
#   recency_window (default 5; meaning lists 20), context_rule, rule, modifier, constraints, never, base,
#   clamp, notes_rule, fallback_forms; by_role (tbl.npc_activity: role -> watch -> 3 activities, d6 pairs),
#   select_order and action_rows / responses (tbl.npc_practice) [revision: R2-B].
# Dice: table dice only (00.3.1): d6, d8, d10, d12, d20, d100, 2d6; rolled by roll_table with RC-RNG.
# All word lists are original to this ruleset (not copied from any published oracle).
# Basis: [R5 §2.1-2.3 P-01..P-11]; [R4 SG-12, W6, W10]; [R6 B-16]; [01.13.10]; DL-12-01..DL-12-20.

schema_version: 1
tables:
- id: tbl.meaning
  name: Meaning (dispatcher)
  tags: []
  die: d6
  recency: false
  context_filters:
  - meaning_kind
  results:
  - range: 1-3
    result: action pair
    sub_table:
    - tbl.meaning_verb
    - tbl.meaning_subject
  - range: 4-6
    result: description pair
    sub_table:
    - tbl.meaning_descriptor
    - tbl.meaning_focus
  lifecycle: provisional
  basis: &id001
  - '[R5 P-04 (Mythic meaning tables; UNE)]'
  - '[R4 W10, SG-12]'
  - '[12.6.7]'
  context_rule: 'when the caller passes meaning_kind: action or description, the die is not rolled and that row is used; yes-and
    / no-and and random events pass action; ''what is it like'' passes description'
