powers:
- id: pow.flight
  name: Flight
  kind: passive
  effects:
  - effect_id: eff.movement_mode
    params: {priority_rank: 10, mode: fly, duration: permanent}
  text: Moves by flying; may hold flag.aloft (06.3.6).
  tell: wings spread and lift
- id: pow.swimmer
  name: Swimmer
  kind: passive
  effects:
  - effect_id: eff.movement_mode
    params: {priority_rank: 10, mode: swim, duration: permanent}
  text: Moves by swimming at its pace; fights in water with no snag.
  tell: it slides into the water without a ripple
- id: pow.climber
  name: Wall-walker
  kind: passive
  effects:
  - effect_id: eff.movement_mode
    params: {priority_rank: 10, mode: climb, duration: permanent}
  text: Moves on walls and ceilings at its pace.
  tell: it is on the ceiling now
- id: pow.burrower
  name: Burrower
  kind: passive
  effects:
  - effect_id: eff.movement_mode
    params: {priority_rank: 10, mode: burrow, duration: permanent}
  text: Moves through earth at pace 1; surfaces at any band.
  tell: the ground heaves and cracks
- id: pow.night_eyes
  name: Night eyes
  kind: passive
  effects:
  - effect_id: eff.condition_immunity
    params:
      forbid:
        conditions: []
      flags: [flag.obscured]
      target: self
  text: Darkness and dim light do not obscure others to it.
  tell: eyes shine back the light
- id: pow.keen_scent
  name: Keen scent
  kind: passive
  effects:
  - effect_id: eff.check_edge
    params: {amount: 2, applies_when: verb = verb.observe and the beat tracks or finds by scent}
  text: +2 to Observe that tracks or finds by scent; hiding from it needs the scent masked.
  tell: it lifts its head and tastes the air
- id: pow.tremorsense
  name: Feels the ground
  kind: passive
  effects:
  - effect_id: eff.check_edge
    params: {amount: 2, applies_when: verb = verb.observe against a creature touching the ground within band.near}
  text: +2 to notice anything touching the ground within band.near, seen or not.
  tell: it goes still, as if listening through its feet
- id: pow.knockdown
  name: Bowl over
  kind: rider
  effects:
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.might, degree_table: tbl.09.knockdown}
  text: On a hit, the target Evades against its effect DC or is knocked prone.
  tell: it lowers its weight to bowl you over
- id: pow.grab
  name: Seize
  kind: rider
  effects:
  - effect_id: eff.apply_condition
    params: {condition: cond.grabbed, severity: S1, duration: until_cleansed, target: the target}
  text: On a hit, the target is grabbed (S1) until it breaks free (06.5.2).
  tell: jaws or hands reach to hold, not to tear
- id: pow.bleed
  name: Tearing wound
  kind: rider
  effects:
  - effect_id: eff.apply_condition
    params: {condition: cond.bleeding, severity: S1, duration: until_cleansed, target: the target}
  text: On a hit, the target bleeds (1 stack; 06.7).
  tell: its edge is serrated, or its teeth are
- id: pow.chill_touch
  name: Grave-cold touch
  kind: rider
  effects:
  - effect_id: eff.apply_condition
    params: {condition: cond.chilled, severity: S1, duration: 'rounds:2', target: the target}
  text: On a hit, the target is chilled (escalates to frozen at 2 stacks; 06.7).
  tell: frost forms where it reaches
- id: pow.burning_touch
  name: Burning touch
  kind: rider
  effects:
  - effect_id: eff.apply_condition
    params: {condition: cond.burning, severity: S1, duration: until_cleansed, target: the target}
  text: On a hit, the target is set burning (1 stack).
  tell: the air around it shimmers
- id: pow.ghoul_paralysis
  name: Ghoul's touch
  kind: rider
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.endurance, degree_table: aff.ghoul_ichor}
  text: On a hit, an exposure to ghoul ichor (07.9.2).
  tell: its claws are black with old grave-filth
- id: pow.venom_adder
  name: Venomous bite
  kind: rider
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.endurance, degree_table: aff.adder_venom}
  text: On a hit, an exposure to adder venom (07.9.2).
  tell: fangs bead with venom
- id: pow.venom_widow
  name: Widow's bite
  kind: rider
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.endurance, degree_table: aff.widow_venom}
  text: On a hit, an exposure to widow venom (07.9.2).
  tell: the red mark on its belly
- id: pow.venom_wyvern
  name: Wyvern sting
  kind: rider
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.endurance, degree_table: aff.wyvern_venom}
  text: On a hit with the sting, an exposure to wyvern venom (07.9.2).
  tell: the tail arches over its back
- id: pow.plague_bite
  name: Plague bite
  kind: rider
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.endurance, degree_table: aff.rat_plague}
  text: On a hit, an exposure to rat plague (07.9.2).
  tell: matted fur, running sores
- id: pow.wound_rot
  name: Filth-blade
  kind: rider
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.endurance, degree_table: aff.wound_rot}
  text: On a hit, an exposure to wound rot (07.9.2).
  tell: the blade is crusted brown
- id: pow.grave_chill
  name: Barrow-cold
  kind: rider
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.resolve, degree_table: aff.grave_chill}
  text: On a hit, an exposure to grave chill (07.9.2).
  tell: breath fogs near it on a warm night
- id: pow.life_drink
  name: Life-drinker
  kind: rider
  effects:
  - effect_id: eff.restore
    params: {quantity: vitality, units: 3, target: self}
  text: On a hit that deals harm, it regains 3 Vitality (never above its maximum).
  tell: it shudders with pleasure as it feeds
- id: pow.focus_leech
  name: Mind-leech
  kind: rider
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.resolve, degree_table: tbl.09.drain}
  text: On a hit, the target Endures with Resolve or loses Focus (05.6.13; at most 4 a scene). T4+ only.
  tell: a cold pressure behind the eyes when it touches you
  min_band: 4
- id: pow.corrode
  name: Corroding touch
  kind: rider
  effects:
  - effect_id: eff.write_fact
    params: {subject: the target's worn armor, predicate: condition, value: 'damaged (reduction -1 until mended, 08)'}
  text: 'On a hit, the target''s worn armor is damaged: its reduction is 1 lower until mended (08).'
  tell: metal it touches smokes and pits
- id: pow.ambush_strike
  name: Strike from hiding
  kind: passive
  effects:
  - effect_id: eff.harm_severity_step
    params: {ladder: severity, steps: 1, applies_when: the target is unaware of it (06.7.6 unaware)}
  text: Its Strikes against a target unaware of it are one severity rung heavier.
  tell: '(none until it strikes: its tell is the place, a hush or a smell)'
- id: pow.constrict
  name: Constrict
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: S2
      harm_tags: [harm.physical.crush]
      target: a creature it holds (cond.grabbed or worse)
  - effect_id: eff.apply_condition
    params: {condition: cond.restrained, severity: S3, duration: 'while:held', target: that creature}
  action_cost: 1
  text: 'One action: a creature it holds takes Moderate crushing harm and is restrained while held.'
  tell: coils tighten
- id: pow.drag_off
  name: Drag off
  kind: action
  effects:
  - effect_id: eff.reposition
    params:
      target: self and the creature it holds
      band_change: 1
      flags_add: []
      flags_remove: []
  action_cost: 2
  text: 'Two actions: moves one band away, taking a creature it holds with it.'
  tell: it starts backing away, dragging
- id: pow.engulf
  name: Engulf
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.might, degree_table: tbl.09.hold}
  - effect_id: eff.deal_harm
    params:
      severity: S2
      harm_tags: [harm.corrosion.acid]
      target: a creature restrained inside it, at its turn end
  action_cost: 2
  windup: true
  text: 'Two actions after a windup: an engaged creature Evades or is drawn inside (restrained), taking Moderate acid harm at each of
    its turn ends while inside.'
  tell: it heaves up and over, like a wave about to break
- id: pow.web
  name: Web
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.agility, degree_table: tbl.09.hold}
  action_cost: 1
  shape: linger
  windup: true
  cost: 1
  text: 'One action after a windup, 1 Focus: a web over one group (linger, 06.8); anyone entering or ending a turn there Evades or is
    restrained.'
  tell: it backs up and spins, legs working
- id: pow.breath_fire
  name: Fire breath
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: BAND+1
      harm_tags: [harm.fire.flame]
      target: each creature selected
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.endurance, degree_table: tbl.09.blast}
  action_cost: 1
  shape: cone
  windup: true
  limits: {per: round, uses: 1}
  recharge: rest of the round after; again after a windup
  text: 'After a windup, one action: a cone of fire (06.8, cap 4) at its band''s heavy severity; each target Evades for less.'
  tell: its throat swells and glows; heat rolls ahead of it
- id: pow.breath_frost
  name: Frost breath
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: BAND+1
      harm_tags: [harm.frost.ice]
      target: each creature selected
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.endurance, degree_table: tbl.09.blast}
  - effect_id: eff.apply_condition
    params: {condition: cond.chilled, severity: S1, duration: 'rounds:2', target: each creature that failed}
  action_cost: 1
  shape: cone
  windup: true
  text: 'After a windup, one action: a cone of rime at its band''s heavy severity; each target Evades for less; those who fail are chilled.'
  tell: frost spreads from its jaws; the air goes white
- id: pow.breath_acid
  name: Acid spew
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: BAND+1
      harm_tags: [harm.corrosion.acid]
      target: each creature selected
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.endurance, degree_table: tbl.09.blast}
  action_cost: 1
  shape: pierce
  windup: true
  text: 'After a windup, one action: a line of acid (pierce, 06.8) at its band''s heavy severity; each target Evades for less.'
  tell: it rears back, hissing, jaws dripping smoke
- id: pow.breath_storm
  name: Lightning breath
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: BAND+1
      harm_tags: [harm.storm.lightning]
      target: each creature selected
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.endurance, degree_table: tbl.09.blast}
  action_cost: 1
  shape: chain
  windup: true
  text: 'After a windup, one action: lightning that leaps between targets (chain, 06.8) at its band''s heavy severity; each target Evades
    for less.'
  tell: sparks crawl over its scales; hair stands on end
- id: pow.spore_burst
  name: Spore burst
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.endurance, degree_table: aff.grey_spore}
  action_cost: 1
  shape: burst
  windup: true
  cost: 1
  text: 'After a windup, one action and 1 Focus: a burst of spores; each target is exposed to grey spore (07.9.2).'
  tell: its caps swell and split; a grey haze trickles out
- id: pow.howl
  name: Terrible howl
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.presence, degree_table: tbl.09.fear}
  action_cost: 1
  shape: burst
  limits: {per: conflict_end, uses: 1}
  text: 'Once a conflict, one action: every enemy within band.near Endures with Resolve or is frightened.'
  tell: it fills its chest and throws back its head
- id: pow.dread_gaze
  name: Dread gaze
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.presence, degree_table: tbl.09.fear}
  action_cost: 1
  cost: 1
  text: 'One action, 1 Focus: one creature within band.near that can see it Endures with Resolve or is frightened.'
  tell: it turns its whole attention on one of you
- id: pow.charm_gaze
  name: Beguiling gaze
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.presence, degree_table: tbl.09.charm}
  action_cost: 1
  cost: 2
  min_band: 3
  text: 'One action, 2 Focus: one creature within band.close that meets its eyes Endures with Resolve or is charmed (06.7.4 diminishing
    applies).'
  tell: its eyes catch the light and hold yours
- id: pow.mind_blast
  name: Mind blast
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: BAND
      harm_tags: [harm.mind.psychic]
      target: each creature selected
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.intellect, degree_table: tbl.09.daze}
  action_cost: 1
  shape: cone
  windup: true
  cost: 2
  min_band: 3
  text: 'After a windup, one action and 2 Focus: a cone of psychic force at its band''s severity; each target Endures with Resolve or
    is dazed.'
  tell: a pressure in the ears, rising; its feelers spread
- id: pow.null_field
  name: Unmaking silence
  kind: action
  effects:
  - effect_id: eff.drain
    params: {quantity: focus, units: 4, target: each creature selected}
  action_cost: 2
  shape: burst
  windup: true
  limits: {per: conflict_end, uses: 1}
  min_band: 5
  text: 'Once a conflict, after a windup, two actions: every creature within band.near loses 4 Focus (the ''empty the pool'' power:
    T5 only, its tell named before use; 05.6.13).'
  tell: every light dims; the hum of any working you hold falters
- id: pow.curse
  name: Laying the eye
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.presence, degree_table: aff.evil_eye}
  action_cost: 1
  cost: 1
  text: 'One action, 1 Focus: one creature within band.near is exposed to the evil eye (07.9.2).'
  tell: it points, and mutters your name
- id: pow.sweep
  name: Sweeping blow
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: ATTACK
      harm_tags: [the attack's harm tags]
      target: each creature selected
  action_cost: 1
  shape: cone
  windup: true
  text: 'After a windup, one action: its main attack against every target in a cone (06.8, cap 4), one roll compared to each Guard.'
  tell: it draws the weapon wide, low, both hands
- id: pow.stomp
  name: Stomp
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: ATTACK
      harm_tags: [harm.physical.crush]
      target: each creature selected
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.might, degree_table: tbl.09.knockdown}
  action_cost: 1
  shape: burst
  windup: true
  text: 'After a windup, one action: a burst around it; its main attack''s harm to each, and each Evades or falls.'
  tell: it rears up, a foot high over the ground
- id: pow.boulder
  name: Hurl a boulder
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: BAND+1
      harm_tags: [harm.physical.crush]
      target: one creature at band.near or band.far
  action_cost: 1
  windup: true
  text: 'After a windup, one action: an aimed throw at band.near or band.far at its band''s heavy severity (against Guard).'
  tell: it heaves a rock the size of a cask over its head
- id: pow.wing_buffet
  name: Wing buffet
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.might, degree_table: tbl.09.push}
  action_cost: 1
  shape: burst
  text: 'One action: everything engaged with it Evades or is hurled one band back.'
  tell: its wings snap open
- id: pow.whirlwind
  name: Whirlwind
  kind: action
  effects:
  - effect_id: eff.deal_harm
    params:
      severity: BAND
      harm_tags: [harm.storm.thunder]
      target: each creature selected
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.agility, degree_table: tbl.09.push}
  action_cost: 1
  shape: burst
  windup: true
  text: 'After a windup, one action: a whirling burst at its band''s severity; each target Evades or is hurled back.'
  tell: dust and leaves begin to spiral around it
- id: pow.drown
  name: Drag under
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.might, degree_table: tbl.09.choke}
  action_cost: 1
  text: 'One action: a creature it holds in water Endures or begins choking (07.10.4).'
  tell: it pulls down, not away
- id: pow.tremor
  name: Tremor
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: evade, effect_dc_source: self.might, degree_table: tbl.09.knockdown}
  action_cost: 1
  shape: burst
  cost: 1
  text: 'One action, 1 Focus: the ground bucks; everything touching it within band.close Evades or falls.'
  tell: it sinks its fists into the ground
- id: pow.summon_dead
  name: Raise the dead
  kind: action
  effects:
  - effect_id: eff.summon
    params: {template: adv.skeleton_rabble (a mob of 3), location: band.far, duration: scene}
  action_cost: 2
  cost: 2
  limits: {per: conflict_end, uses: 1}
  text: 'Once a conflict, two actions and 2 Focus: a mob of three skeletons claws up at band.far (a behavior-row reinforcement, 06.2.5).'
  tell: it chants; the ground at the edge of the light begins to move
- id: pow.call_kin
  name: Call the pack
  kind: action
  effects:
  - effect_id: eff.tick_clock
    params: {clock: clk.09.reinforcements, ticks: 2}
  action_cost: 1
  limits: {per: conflict_end, uses: 1}
  text: 'Once a conflict, one action: ticks its side''s reinforcement clock by 2 (09.8.4; arrivals at band.far when it completes).'
  tell: it calls, long and rising; something answers
- id: pow.rally_cry
  name: Rally
  kind: action
  effects:
  - effect_id: eff.tick_clock
    params: {clock: clk.morale.<side>, ticks: -delivered_reach}
  action_cost: 1
  text: 'One action: a fortune check against Moderate; its side''s morale clock falls by the delivered reach (06.11.3).'
  tell: it bellows at its own and they straighten
- id: pow.mend_kin
  name: Mend
  kind: action
  effects:
  - effect_id: eff.restore
    params: {quantity: vitality, units: 3, target: one ally within band.close}
  action_cost: 1
  cost: 1
  text: 'One action, 1 Focus: one ally within band.close regains 3 Vitality.'
  tell: it lays hands or tools on its ally
- id: pow.blink
  name: Blink
  kind: action
  effects:
  - effect_id: eff.reposition
    params:
      target: self
      band_change: -2
      flags_add: []
      flags_remove: [flag.cornered]
  action_cost: 1
  cost: 1
  text: 'One action, 1 Focus: it vanishes and reappears up to two bands away; this movement provokes nothing.'
  tell: it flickers at the edges
- id: pow.possess
  name: Possess
  kind: action
  effects:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: self.presence, degree_table: tbl.09.charm}
  - effect_id: eff.write_fact
    params: {subject: self, predicate: housed_in, value: the target while charmed}
  action_cost: 2
  cost: 2
  min_band: 3
  windup: true
  text: 'After a windup, two actions, 2 Focus: it pours itself into one creature within band.close, which Endures with Resolve or is
    charmed and carries it (it acts through the host; harm to the host harms both).'
  tell: its shape thins toward you like smoke drawn to a flue
- id: pow.glamour
  name: Glamour
  kind: action
  effects:
  - effect_id: eff.grant_lever
    params:
      type: precision
      for_verbs: [verb.sneak, verb.talk]
      for_tags: []
      duration: scene
      to: self
  action_cost: 1
  cost: 1
  text: 'One action, 1 Focus: an illusion of its making; it holds a Precision lever on Sneak and Talk for the scene (disbelieved by
    a resolved Observe against its Intellect defense).'
  tell: the light bends wrong around it for a moment
- id: pow.split
  name: Divide
  kind: trigger
  effects:
  - effect_id: eff.summon
    params: {template: a member of the same template at half its current Vitality, location: band.engaged, duration: scene}
  hook: on_hit_taken
  limits: {per: conflict_end, uses: 2}
  text: 'When a cutting or piercing hit lands on it, it splits: a second of its kind with half its current Vitality appears engaged
    (twice a conflict).'
  tell: cut, it bulges and pinches in two
- id: pow.regenerate
  name: Regenerate
  kind: trigger
  effects:
  - effect_id: eff.restore
    params: {quantity: vitality, units: 3, target: self}
  hook: on_turn_start
  applies_when: it took no harm.fire or harm.corrosion since its last turn and it is not defeated
  text: At the start of its turn it regains 3 Vitality unless fire or acid harmed it since its last turn. At 0 Vitality it is defeated,
    and rises again at scene_end unless burned or dissolved.
  tell: the wound closes as you watch
- id: pow.heat_aura
  name: Heat haze
  kind: trigger
  effects:
  - effect_id: eff.aura
    params:
      priority_rank: 10
      band: band.engaged
      effects:
      - effect_id: eff.deal_harm
        params:
          severity: S1
          harm_tags: [harm.fire.heat]
          target: each creature engaged with it at its turn end
  hook: on_turn_end
  text: Each creature engaged with it at the end of its turn takes Light fire harm.
  tell: the air ripples; your skin tightens
- id: pow.cold_aura
  name: Killing cold
  kind: trigger
  effects:
  - effect_id: eff.aura
    params:
      priority_rank: 10
      band: band.engaged
      effects:
      - effect_id: eff.apply_condition
        params: {condition: cond.chilled, severity: S1, duration: 'rounds:1', target: each creature engaged with it at its turn end}
  hook: on_turn_end
  text: Each creature engaged with it at the end of its turn is chilled.
  tell: rime grows on your weapon
- id: pow.unholy_aura
  name: Profane presence
  kind: trigger
  effects:
  - effect_id: eff.aura
    params:
      priority_rank: 10
      band: band.close
      effects:
      - effect_id: eff.status_modifier
        params: {amount: -1, applies_when: checks with trait.nature.sacred}
  hook: on_turn_start
  text: Within band.close of it, checks bearing trait.nature.sacred take -1.
  tell: candle flames lean away from it
- id: pow.shrug
  name: Shrug it off
  kind: trigger
  effects:
  - effect_id: eff.cleanse
    params: {condition_or_category: control, target: self}
  hook: on_turn_start
  limits: {per: conflict_end, uses: 1}
  text: Once a conflict, at the start of its turn, it ends one control condition on itself (06.7.4). Solo variant only.
  tell: it shakes itself free with a roar
- id: pow.second_wind
  name: Second wind
  kind: trigger
  effects:
  - effect_id: eff.write_fact
    params: {subject: self, predicate: phase, value: 2}
  hook: on_vitality_threshold
  threshold: half
  limits: {per: conflict_end, uses: 1}
  text: 'The first time it is bloodied, it enters its second phase: its behavior list''s phase-2 rows apply from its next turn (its
    tell is shown at once). Solo variant only.'
  tell: 'it changes: the second phase''s tell'
- id: pow.frenzy
  name: Frenzy
  kind: passive
  effects:
  - effect_id: eff.harm_edge
    params: {amount: 1, applies_when: bloodied(self)}
  - effect_id: eff.defense_status
    params: {amount: -2, applies_when: bloodied(self)}
  text: 'While bloodied: +1 harm, Guard and every other defense -2.'
  tell: blood up, it stops guarding itself
- id: pow.shield_wall
  name: Shield wall
  kind: passive
  effects:
  - effect_id: eff.defense_edge
    params: {amount: 1, attribute: agility, applies_when: an ally is engaged with the same enemy}
  text: +1 Guard while an ally is engaged with the same enemy.
  tell: shields lock edge to edge
- id: pow.pack_tactics
  name: Pack tactics
  kind: passive
  effects:
  - effect_id: eff.check_edge
    params: {amount: 1, applies_when: trait.action.attack and an ally of it is engaged with the target}
  text: +1 to attacks against a target an ally of it is engaged with.
  tell: they circle, never all in front of you
- id: pow.incorporeal
  name: Incorporeal
  kind: passive
  effects:
  - effect_id: eff.harm_resistance
    params:
      factor: 0.5
      harm_tags: [harm.physical]
  - effect_id: eff.condition_immunity
    params:
      forbid:
        conditions: [cond.grabbed, cond.restrained, cond.pinned, cond.prone]
      target: self
  text: Halves physical harm unless the weapon is silvered or carries a magical property (08); cannot be grabbed, restrained, pinned
    or knocked down; passes through solid matter.
  tell: your blade passes through it like cold water
- id: pow.mindless
  name: Mindless
  kind: passive
  effects:
  - effect_id: eff.condition_immunity
    params:
      forbid:
        conditions: [cond.frightened, cond.charmed, cond.distracted]
      effects_with_trait: [trait.nature.mental]
      target: self
  text: Unaffected by effects bearing trait.nature.mental; cannot be frightened, charmed or distracted; never yields.
  tell: nothing behind the eyes
- id: pow.deathless
  name: Deathless
  kind: passive
  effects:
  - effect_id: eff.condition_immunity
    params:
      forbid:
        conditions: [cond.poisoned, cond.bleeding, cond.exhausted, cond.choking]
      target: self
  text: 'No breath, blood or fatigue: cannot be poisoned, bleed, tire or choke.'
  tell: no breath fogs from it
- id: pow.unliving
  name: Unliving body
  kind: passive
  effects:
  - effect_id: eff.condition_immunity
    params:
      forbid:
        conditions: [cond.poisoned, cond.bleeding, cond.exhausted, cond.choking, cond.frightened, cond.charmed]
      target: self
  text: 'A made thing: cannot be poisoned, bleed, tire, choke, be frightened or be charmed.'
  tell: the creak and grind of joints
- id: pow.amorphous
  name: Amorphous
  kind: passive
  effects:
  - effect_id: eff.condition_immunity
    params:
      forbid:
        conditions: [cond.prone, cond.off_balance, cond.blinded, cond.bleeding]
      target: self
  text: 'No front, no legs, no eyes: cannot be knocked down, unbalanced, blinded or bled; squeezes through any gap.'
  tell: it pours rather than walks
- id: pow.spell_turning
  name: Warded hide
  kind: passive
  effects:
  - effect_id: eff.defense_edge
    params: {amount: 2, attribute: resolve, applies_when: against workings (trait.nature.magical)}
  text: +2 to every defense against workings (trait.nature.magical).
  tell: sigils glint on its skin when magic nears it
degree_tables:
- id: tbl.09.knockdown
  name: Knocked down
  verb: verb.evade
  attribute: agility
  critical_success: []
  success: []
  failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.prone, severity: S2, duration: until_cleansed, target: the target}
  critical_failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.prone, severity: S2, duration: until_cleansed, target: the target}
  - effect_id: eff.apply_condition
    params: {condition: cond.off_balance, severity: S1, duration: 'rounds:1', target: the target}
  text: Evade or go down.
- id: tbl.09.fear
  name: Dread at the sight
  verb: verb.endure
  attribute: resolve
  critical_success:
  - effect_id: eff.write_fact
    params: {subject: the target, predicate: inured_to, value: this source for the scene}
  success: []
  failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.frightened, severity: S1, duration: scene, target: the target}
  critical_failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.frightened, severity: S2, duration: scene, target: the target}
  text: Endure with Resolve or be frightened of the source.
- id: tbl.09.blast
  name: Caught in the blast
  verb: verb.evade
  attribute: agility
  critical_success:
  - effect_id: eff.harm_severity_step
    params: {ladder: severity, steps: -2, applies_when: this blast}
  success:
  - effect_id: eff.harm_severity_step
    params: {ladder: severity, steps: -1, applies_when: this blast}
  failure: []
  critical_failure:
  - effect_id: eff.harm_severity_step
    params: {ladder: severity, steps: 1, applies_when: this blast}
  text: 'Evade: a success takes the blast one rung lighter, a critical success two; a critical failure one heavier.'
- id: tbl.09.charm
  name: Caught by the eyes
  verb: verb.endure
  attribute: resolve
  critical_success:
  - effect_id: eff.write_fact
    params: {subject: the target, predicate: inured_to, value: this source for the scene}
  success: []
  failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.charmed, severity: S2, duration: 'rounds:1', target: the target}
  critical_failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.charmed, severity: S2, duration: 'rounds:2', target: the target}
  text: 'Endure with Resolve or regard the source as a friend for a round (a control condition: 06.7.4).'
- id: tbl.09.hold
  name: Held fast
  verb: verb.evade
  attribute: agility
  critical_success: []
  success: []
  failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.restrained, severity: S3, duration: 'rounds:1', target: the target}
  critical_failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.restrained, severity: S3, duration: 'rounds:2', target: the target}
  text: 'Evade or be restrained (a control condition: 06.7.4).'
- id: tbl.09.daze
  name: Reeling
  verb: verb.endure
  attribute: resolve
  critical_success: []
  success: []
  failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.dazed, severity: S2, duration: 'rounds:1', target: the target}
  critical_failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.stunned, severity: S3, duration: 'rounds:1', target: the target}
  text: 'Endure with Resolve or be dazed; a critical failure stuns for a round (control conditions: 06.7.4).'
- id: tbl.09.drain
  name: Drained
  verb: verb.endure
  attribute: resolve
  critical_success: []
  success:
  - effect_id: eff.drain
    params: {quantity: focus, units: 1, target: the target}
  failure:
  - effect_id: eff.drain
    params: {quantity: focus, units: 2, target: the target}
  critical_failure:
  - effect_id: eff.drain
    params: {quantity: focus, units: 3, target: the target}
  text: 'Endure with Resolve: Focus drained 1 / 2 / 3 by degree, at most 4 a scene (05.6.13).'
- id: tbl.09.push
  name: Hurled back
  verb: verb.evade
  attribute: agility
  critical_success: []
  success: []
  failure:
  - effect_id: eff.reposition
    params:
      target: the target
      band_change: 1
      flags_add: []
      flags_remove: []
  critical_failure:
  - effect_id: eff.reposition
    params:
      target: the target
      band_change: 1
      flags_add: []
      flags_remove: []
  - effect_id: eff.apply_condition
    params: {condition: cond.prone, severity: S2, duration: until_cleansed, target: the target}
  text: Evade or be thrown one band back (and down on a critical failure).
- id: tbl.09.choke
  name: Dragged under
  verb: verb.endure
  attribute: endurance
  critical_success: []
  success: []
  failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.choking, severity: S2, duration: 'while:held', target: the target}
  critical_failure:
  - effect_id: eff.apply_condition
    params: {condition: cond.choking, severity: S3, duration: 'while:held', target: the target}
  text: Endure or start to choke while held (07.10.4 breath).
