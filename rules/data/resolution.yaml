# data/resolution.yaml
# Purpose: every table of the resolution pipeline: DC tiers, the degree rule, near miss, READ tables
#   (degree x reach -> delivered reach; stakes x degree -> cost severity), the closed cost menu with
#   forms per severity and state writes, deliver_count, the World-Fact Oracle, fate, repetition, group,
#   help, setup, sequential feeding, time costs by mode, trait rules, and auto-commit.
# Owner: 01-resolution (T-00-19). No owner-blocks.
# Schema: data/SCHEMAS.md#resolutionyaml (required keys) plus optional keys documented in
#   01-resolution.md "Tables" (sequential, repetition, group, help, setup, time_cost, traits,
#   stakes_flags, reach_flags, oracle.answer_shapes, oracle.qualifiers, limits).
# Basis: [C:VII] [C:P8] [C:P16] [C:P17] [R7 §4] [R4 §4] [00.3, 00.12.7, 00.13]; DL-01-01..25.
# Odds: exhaustive enumeration, scratchpad odds01.py / oracle01.py / fate01.py (results in 01 T-01-3, T-01-10).

schema_version: 1

dc_tiers:          # must satisfy CT-1..CT-6 (00.3.17); proof in 01.8 "Calibration proof"; DL-01-01
  - {id: trivial, name: Trivial, dc: null, roll: false, anchor: "anyone, in these conditions, every time", tags: [], basis: ["[00.3.17]", "[T-00-5]", "[DL-01-01]"], lifecycle: provisional}
  - {id: easy, name: Easy, dc: 10, anchor: "an untrained adult, taking care, usually succeeds", examples: ["climb a rough stone wall with good holds", "spot a carelessly hidden coin purse (boundary)"], tags: [], basis: ["[00.3.17]", "[T-00-5]", "[DL-01-01]"], lifecycle: provisional}
  - {id: moderate, name: Moderate, dc: 15, anchor: "needs competence; the untrained often fail", examples: ["follow a clear trail across hard ground", "talk a neutral stranger into bending a small rule (boundary)"], tags: [], basis: ["[00.3.17]", "[T-00-5]", "[DL-01-01]"], lifecycle: provisional}
  - {id: hard, name: Hard, dc: 20, anchor: "challenges a practiced professional", examples: ["pick a guild-made lock", "cut a hanging rope with an arrow at 60 ft (boundary)"], tags: [], basis: ["[00.3.17]", "[T-00-5]", "[DL-01-01]"], lifecycle: provisional}
  - {id: very_hard, name: Very hard, dc: 25, anchor: "experts often fail", examples: ["track a ranger over rock in rain", "swim a flooded river in spate clothed (boundary)"], tags: [], basis: ["[00.3.17]", "[T-00-5]", "[DL-01-01]"], lifecycle: provisional}
  - {id: legendary, name: Legendary, dc: 30, anchor: "the edge of mortal ability; needs levers or licenses", examples: ["hold a collapsing gate alone for a minute", "climb the smooth inside of a well shaft without gear (boundary)"], tags: [], basis: ["[00.3.17]", "[T-00-5]", "[DL-01-01]"], lifecycle: provisional}
  - {id: beyond, name: Beyond, dc: null, gate: G4, anchor: "no mortal without a license that changes the category", tags: [], basis: ["[00.3.17]", "[T-00-5]", "[DL-01-01]"], lifecycle: provisional}
dc_tier_rules:
  judge: "intrinsic properties only (would it be true tomorrow, for anyone?); circumstances are levers/snags"
  tie_break: class_base   # [revision: R2-C; DL-01-29] was 'higher': the obstacle class's base (basic_verbs.yaml anchor.obstacle_classes)
  nudge: {max_rungs: 1, needs: cited_intrinsic_fact, never_two: true}
  no_class_fits: "class other: the DM picks the rung by T-01-2; between two rungs, the lower for an everyday act (T-00-5's everyday rows), else the higher"
  stored_key: "dc.<obstacle_id>.<anchor_id>[+dc:<delta>]"
  feasible_range_per_ct: {easy: [8, 11], moderate: [14, 16], hard: [19, 21], very_hard: [24, 26], legendary: [29, 31]}

degree_rule:       # DL-01-02
  critical_band: 10
  natural_20: step_up        # one degree better; a critical success stays one
  natural_1: step_down       # one degree worse; a critical failure stays one
  ties: actor_wins           # total == DC is a success
  ids: [critical_success, success, failure, critical_failure]

near_miss:         # DL-01-03: degree failure AND margin >= -3 (includes nat-1 step-downs of successes)
  min: -3
  max: null                  # no upper bound: a nat-1 step-down with margin >= 0 is a near miss
  requires_degree: failure
  success_at_cost_available: true

read_delivery:     # T-01-4; delivered reach 0..4
  - {degree: critical_success, reach_delta: 1, max: 4}
  - {degree: success, reach_delta: 0}
  - {degree: failure, near_miss_taken: true, reach_delta: 0, note: "success at a cost; a cost.shortfall may lower it, never below 1"}
  - {degree: failure, near_miss_taken: false, reach: 0}
  - {degree: critical_failure, reach: 0}
overflow: {rule: "each unused rung (max 1) above what the anchor's reach unit can use becomes a follow-up Precision lever", fact: "momentum.<actor>.<target>", expires: "after the actor's next beat or scene_end"}   # DL-01-22

read_costs:        # T-01-5; exactly one cost per resolved beat; DL-01-04
  - {stakes: safe, degree: failure, severities: []}
  - {stakes: safe, degree: near_miss_success_at_cost, severities: [S1]}
  - {stakes: safe, degree: critical_failure, severities: [S1]}
  - {stakes: risky, degree: failure, severities: [S2]}
  - {stakes: risky, degree: near_miss_success_at_cost, severities: [S2]}
  - {stakes: risky, degree: critical_failure, severities: [S3]}
  - {stakes: dire, degree: failure, severities: [S3]}
  - {stakes: dire, degree: near_miss_success_at_cost, severities: [S3]}
  - {stakes: dire, degree: critical_failure, severities: [S4]}

stakes_flags:      # 01.6.9; DL-01-05
  source: {question: "Is there an established source that would impose a cost if this beat failed?", sources: [aware_opponent_or_observer, hazard, height_or_depth, listening_clock, damageable_item, goodwill_or_trust, consumed_resource], false_gives: safe, tie_break: true}
  heavy: {question: "Could that source deliver a Heavy (S3) setback?", true_for: ["fall of 20 ft or more", "hazard of severity S3+", "armed opponent with threat band >= PC power band acting against the PC", "loss of an item or ally not readily replaced", "lasting enmity of a powerful NPC or faction"], true_gives: dire, false_gives: risky, tie_break: true}
  lethal: {legal_when: [dire, lethal_context_recorded_before_declaration], true_when: "threatened cost is cost.harm (or cost.footing into a lethal hazard) from a source that can move the PC to Dying"}
  conflict_clause: "a beat whose failure is only the opponent's ordinary next action is Safe"
reach_flags:       # 01.6.10; [revision: R2-K] [DL-12-121]: whole's tie-break is true (Standard), Limited needs a cited factor
  whole: {question: "Would the method, done well, achieve the whole stated intent?", false_gives: limited, tie_break: true}
  one_factor: {question: "Does exactly one effect factor (potency, quality, scale) stand against the method, unoffset?", true_gives: limited, tie_break: true}
  great_only_from: [amplifying_lever, license_or_effect_step, offer_trade]
trades:            # 01.7.3; DL-01-14; once per beat, before commit
  - {id: go_big, stakes_steps: 1, reach_steps: 1, forbidden_from: {stakes: dire}}
  - {id: play_it_safe, stakes_steps: -1, reach_steps: -1, forbidden_from: {stakes: safe, reach: limited}}

cost_menu:         # 01.13; DL-01-15. U(S1..S5) = 1,1,2,3,4. forms: allowed fictional forms per severity.
  - id: cost.harm
    name: Harm
    fits_when: "the method exposes the actor's body to an established source of harm"
    standard_form: "S2: a cut, a burn, a hard fall, a sprain, a blow that lands"
    heavy_form: "S3: a telling blow, a bad burn, a fall that knocks the wind out"
    forms:
      S1: {write: "apply_harm(severity S1 = 1)", text: "a scrape, bruise, singe, wrenched finger"}
      S2: {write: "apply_harm(severity S2 = 3)", text: "a cut, a burn, a hard fall, a sprain"}
      S3: {write: "apply_harm(severity S3 = 5)", text: "a telling blow, a bad burn, a deep gash"}
      S4: {write: "apply_harm(severity S4 = 8)", text: "a broken bone, a grievous wound (07: wounds, marks)"}
      S5: {write: "apply_harm(severity S5 = 12)", text: "crushing, drowning, burning at a fire's heart (hazards and lethal frames only)"}
    effect_refs: [{effect_id: eff.deal_harm, params: {severity: "<S>", harm_tags: "<source harm tags; falls: harm.physical.crush>", target: "actor or sharing helper"}}]
    notes: "apply_harm receives lethal = frame.lethal; non-lethal harm never moves a PC into Dying (07, INV-6)"
    tags: []
    basis: ["[R7 §4.3]", "[R: https://bladesinthedark.com/consequences-harm]", "[00.3.11]", "[DL-01-15]"]
    lifecycle: provisional
  - id: cost.drain
    name: Drain
    fits_when: "the method spent effort or consumed something: Focus (abilities, concentration, a push), supply, ammunition, light, a consumable's uses, coin carried for the purpose"
    standard_form: "S2: 1 unit (1 Focus spent to no purpose; a ration spoiled)"
    heavy_form: "S3: 2 units"
    forms:
      S1: {write: "update_quantity(-1)", text: "an arrow lost, a torch guttering early"}
      S2: {write: "update_quantity(-1)", text: "1 Focus spent to no purpose; a flask spilled"}
      S3: {write: "update_quantity(-2)", text: "2 Focus; two supply"}
      S4: {write: "update_quantity(-3)", text: "3 Focus; a pack of supplies ruined"}
      S5: {write: "update_quantity(-4)", text: "the whole store lost"}
    effect_refs: [{effect_id: eff.drain, params: {quantity: "focus|supply", units: "U(S)", target: actor}}]
    must_land_in_full: true
    tags: []
    basis: ["[R7 §4.3]", "[R: https://bladesinthedark.com/consequences-harm]", "[00.3.11]", "[DL-01-15]"]
    lifecycle: provisional
  - id: cost.gear
    name: Gear
    fits_when: "the method uses or exposes a carried item not flagged cost_immune (08)"
    standard_form: "S2: left behind at a named place"
    heavy_form: "S3: damaged"
    forms:
      S1: {write: "item.location = ground at actor's position", text: "dropped, knocked from the hand"}
      S2: {write: "item.location = <named place>", text: "left on the far side, down the well, stuck in a beam"}
      S3: {write: "item.condition = damaged (edge, harm_edge, reduction suspended until repaired)", text: "notched, bent, cracked"}
      S4: {write: "item.condition = broken OR item.location = <opponent>", text: "snapped, or wrenched away and held"}
      S5: {write: "item.exists = destroyed OR location sealed unknown", text: "burned to ash, swept away"}
    effect_refs: [{effect_id: eff.write_fact, params: {subject: "<item>", predicate: "location|condition|exists", value: "<per severity>"}}]
    tags: []
    basis: ["[R7 §4.3]", "[R: https://bladesinthedark.com/consequences-harm]", "[00.3.11]", "[DL-01-15]"]
    lifecycle: provisional
  - id: cost.time
    name: Time
    fits_when: "the method takes time while something else moves (a clock lists cost.time, or the mode's time matters); not in conflict unless a listening clock exists"
    standard_form: "S2: a listening clock +1, or the time_cost row"
    heavy_form: "S3: a listening clock +2, or the time_cost row"
    forms:
      S1: {write: "tick listening clock +1 OR advance_time(time_cost.S1)"}
      S2: {write: "tick listening clock +1 OR advance_time(time_cost.S2)"}
      S3: {write: "tick listening clock +2 OR advance_time(time_cost.S3)"}
      S4: {write: "tick listening clock +3 OR advance_time(time_cost.S4)"}
      S5: {write: "tick listening clock +4 OR advance_time(time_cost.S5)"}
    effect_refs: [{effect_id: eff.tick_clock, params: {clock: "<nearest-to-complete listening clock>", ticks: "U(S)"}}]
    tags: []
    basis: ["[R7 §4.3]", "[R: https://bladesinthedark.com/consequences-harm]", "[00.3.11]", "[DL-01-15]"]
    lifecycle: provisional
  - id: cost.exposure
    name: Exposure
    fits_when: "stealth, deception, trespass or noise with an established observer, listener or listening clock"
    standard_form: "S2: noticed; alert clock +1"
    heavy_form: "S3: spotted; flag.hidden lost; alert clock +2"
    forms:
      S1: {write: "observer.alertness +1 step; listening clocks +1", text: "a head turns; a dog stirs"}
      S2: {write: "+ record_knowledge(observer, someone at <place>); alertness >= alert; clocks +1", text: "noticed"}
      S3: {write: "+ remove flag.hidden; observer knows location; alertness alarmed; clocks +2", text: "spotted"}
      S4: {write: "+ record_knowledge(observer, identity and deed); clocks +3", text: "identified"}
      S5: {write: "+ faction/public knows; reputation content entry (11); clocks +4", text: "exposed publicly"}
    alertness_ladder: [unaware, suspicious, alert, alarmed]   # interface: 15/12
    effect_refs: [{effect_id: eff.tick_clock, params: {clock: "kind: listening (cost.exposure source)", ticks: "U(S)"}}]
    tags: []
    basis: ["[R7 §4.3]", "[R: https://bladesinthedark.com/consequences-harm]", "[00.3.11]", "[DL-01-15]"]
    lifecycle: provisional
  - id: cost.footing
    name: Footing
    fits_when: "the actor's body position, balance, grip or place in a fight or on terrain is at stake"
    standard_form: "S2: prone, grabbed, one band against the intent, or a slide to a worse position"
    heavy_form: "S3: restrained, cornered, slowed, or separated two bands"
    forms:
      S1: {write: "apply_condition(cond.off_balance, S1, until end of next turn) OR remove one of flag.in_cover/flag.elevated/flag.hidden"}
      S2: {write: "apply_condition(cond.prone) OR apply_condition(cond.grabbed) OR band -1 step vs intent OR place-graph slide"}
      S3: {write: "apply_condition(cond.restrained) OR set flag.cornered OR apply_condition(cond.slowed, scene) OR band +2 from allies/goal"}
      S4: {write: "apply_condition(cond.pinned) OR move to next lower/worse place OR held in opponent's control"}
      S5: {write: "apply_condition(cond.restrained, until_cleansed) within a hazard's reach OR swept to a distant place"}
    effect_refs: [{effect_id: eff.apply_condition, params: {condition: "<per severity>", severity: "<S>", duration: "<per form>", target: actor}}, {effect_id: eff.reposition, params: {target: actor}}]
    notes: "moving into a hazard does not also deal harm as part of this cost; the hazard acts on its cadence"
    tags: []
    basis: ["[R7 §4.3]", "[R: https://bladesinthedark.com/consequences-harm]", "[00.3.11]", "[DL-01-15]"]
    lifecycle: provisional
  - id: cost.shortfall
    name: Shortfall
    fits_when: "success-at-cost only; the method could plausibly have worked partway"
    standard_form: "S2: delivered reach -1 (min 1)"
    heavy_form: "S3: delivered reach -2 (min 1)"
    forms:
      S1: {write: "delivered_reach -1, min 1"}
      S2: {write: "delivered_reach -1, min 1"}
      S3: {write: "delivered_reach -2, min 1"}
    alternate_only: true
    must_land_in_full: true   # illegal when delivered reach is already 1
    effect_refs: [{effect_id: eff.reach_step, params: {ladder: reach, steps: "-1|-2"}}]
    tags: []
    basis: ["[R7 §4.3]", "[R: https://bladesinthedark.com/consequences-harm]", "[00.3.11]", "[DL-01-15]"]
    lifecycle: provisional
  - id: cost.closed_door
    name: Closed door
    fits_when: "a one-shot attempt against something that can refuse or seize up: persuasion, bargain, bluff or request to an entity or institution; a mechanism that jams; spendable trust"
    standard_form: "S2: this approach closed until a new fact changes the situation"
    heavy_form: "S3: as S2, and the target's standing -1"
    forms:
      S1: {write: "closed.<obstacle>.<method_class> = until scene_end"}
      S2: {write: "closed.<obstacle>.<method_class> = until superseding fact (re-attempt cost cannot reopen)"}
      S3: {write: "S2 + set_relationship(target->actor standing -1)"}
      S4: {write: "S2 + standing -2 + refusal fact with its lifting condition (15)"}
      S5: {write: "S4 + faction status toward PC -1 (11)"}
    effect_refs: [{effect_id: eff.write_fact, params: {subject: "<obstacle>", predicate: closed_approach, value: "<method_class, until>"}}]
    tags: []
    basis: ["[R7 §4.3]", "[R: https://bladesinthedark.com/consequences-harm]", "[00.3.11]", "[DL-01-15]"]
    lifecycle: provisional
  - id: cost.twist
    name: Twist
    fits_when: "always; chosen only when no other entry is a candidate"
    standard_form: "S2: a new obstacle"
    heavy_form: "S3: a new threat (band <= scene)"
    forms:
      S1: {write: "roll_table(tbl.twist, severity S1)", text: "a complication; no threat"}
      S2: {write: "roll_table(tbl.twist, severity S2)", text: "a new obstacle needing its own beat"}
      S3: {write: "roll_table(tbl.twist, severity S3)", text: "a new threat (band <= scene) or a new danger clock with 1 tick"}
      S4: {write: "roll_table(tbl.twist, severity S4)", text: "escalation: threat up to scene band + 1, a danger clock +3, allies arrive"}
      S5: {write: "roll_table(tbl.twist, severity S5)", text: "a reversal (world events only)"}
    never: [direct harm, death]
    effect_refs: []
    tags: []
    basis: ["[R7 §4.3]", "[R: https://bladesinthedark.com/consequences-harm]", "[00.3.11]", "[DL-01-15]"]
    lifecycle: provisional
cost_selection:    # 01.13.1
  candidates: "entries whose fits_when is true, each citing a fact id of its source"
  order: [already_threatened_in_scene, most_directly_engaged_source, not_last_entry_paid_on_this_obstacle, twist_last]
  tie_order: [cost.harm, cost.footing, cost.exposure, cost.time, cost.gear, cost.drain, cost.closed_door]
  # [revision: spec 032 P8b] [DL-01-54]: what a verb's failure most plainly costs, in order. The code framer (no Framer model) takes the DM's
  # choice when legal, else the first entry here that check_cost_decl accepts; none legal on a risky roll = a Safe roll. Reading is never harm.
  verb_costs:
    verb.observe: [cost.time, cost.exposure, cost.drain]
    verb.recall: [cost.time, cost.drain]
    verb.talk: [cost.closed_door, cost.exposure, cost.time]
    verb.strike: [cost.harm, cost.footing, cost.exposure]
    verb.grapple: [cost.harm, cost.footing, cost.exposure]
    verb.force: [cost.harm, cost.footing, cost.gear, cost.exposure]
    verb.exert: [cost.harm, cost.footing, cost.drain]
    verb.sneak: [cost.exposure, cost.time]
  per_beat: 1
  declared_at: FRAME        # threatened (all rolled frames) + alternate (Risky and Dire)

time_cost:         # T-01-9
  site: {S1: {intervals: 1}, S2: {intervals: 1}, S3: {intervals: 2}, S4: {intervals: 3}, S5: {intervals: 4}}
  free: {S1: {intervals: 1}, S2: {hours: 1}, S3: {hours: 2}, S4: {watches: 1}, S5: {days: 1}}
  travel: {S1: {hours: 1}, S2: {hours: 3}, S3: {watches: 1}, S4: {watches: 2}, S5: {days: 1}}
  downtime: {S1: {days: 1}, S2: {days: 1}, S3: {days: 2}, S4: {days: 3}, S5: {weeks: 1}}
  conflict: "listening clock only"

delivery_counts:   # T-01-6; deliver_count(N, delivered_reach); N after dedupe, 1..5; DL-01-12
  - {reach: 4, formula: "N + 1 bonus (unasked relevant item from the permitted slice, else a follow-up Precision lever)"}
  - {reach: 3, formula: "N"}
  - {reach: 2, formula: "ceil(N/2)"}
  - {reach: 1, formula: "max(1, floor(N/3))"}
  - {reach: 0, degree: failure, formula: "0 reliable; 1 vague impression of the top-ranked item (certainty believed, sealed truth true)"}
  - {reach: 0, degree: critical_failure, formula: "0; if misleadable, 1 plausible falsehood on the top-ranked item (certainty believed, sealed truth false; small, correctable, never about a threat's existence or lethality)"}
delivery_rules: {max_items: 5, ranking: player_then_declaration_order, ineligible: "items sealed behind a gate the beat cannot open are not counted", reask: "rides; needs new method, new lever, passed interval, or re-attempt cost"}

oracle:            # 01.15; T-01-10; DL-01-11. d100 1..100.
  rungs:
    - {id: certain, roll: false, answer: yes, anchor: "the scene type implies it"}
    - {id: likely, yes_on: 26, roll: true, anchor: "commonly true of such places or people"}
    - {id: even, yes_on: 51, roll: true, anchor: "could go either way"}
    - {id: unlikely, yes_on: 76, roll: true, anchor: "uncommon but unremarkable"}
    - {id: remote, yes_on: 91, roll: true, anchor: "rare; would be noteworthy"}
    - {id: impossible, roll: false, answer: no, anchor: "contradicts canon or an established fact"}
  doubles: {faces: [11, 22, 33, 44, 55, 66, 77, 88, 99, 100], effect: "extreme answer: yes-and / no-and; the 'and' is rolled on tbl.meaning (12)"}
  but_band: {yes_but: "threshold .. threshold+4", no_but: "threshold-5 .. threshold-1", precedence: "doubles first"}
  answer_shapes: [yes_and, yes, yes_but, no_but, no, no_and]
  qualifiers:
    yes_but: {options: [lesser, costly, elsewhere, noticed], default: lesser}
    no_but: {options: [substitute, trace, adjacent], default: trace}
  odds_faces:      # per 100 faces: yes_and / yes / yes_but / no_but / no / no_and
    likely: [8, 62, 5, 4, 19, 2]
    even: [6, 40, 4, 5, 41, 4]
    unlikely: [4, 17, 4, 5, 64, 6]
    remote: [2, 3, 5, 4, 78, 8]
  tie_break: "the rung less favorable to what the asking player evidently hopes; if none evident, the rung nearer Even"
  tension_shift_max_rungs: 1     # owner 12
  never_reask: "one answer per fact_key; rephrasings are the same key; time-scoped facts may be re-asked after their scope passes"
  sealed_mode: "discovery questions write a sealed fact gated on discovery (secret frames)"

fate:              # 01.16; T-01-14; DL-01-06
  max: 3
  start: 1
  earn:
    - "hard_luck: a committed Risky/Dire frame with the PC as actor ends in critical_failure: +1, once per scene, never raising fate above 2"
    - "thread_completed: a thread the PC pursued reaches status completed (11): +1"
    - "vow_kept: a vow or oath commitment is fulfilled (04/11): +1"
  spend:
    - {use: reroll, cost: 1, when: "on_roll of a seen d20 in a check by or against the PC", limit: "1 per roll", not_on: [secret_frame, oracle, roll_table, generate, fortune_check_without_pc]}
    - {use: last_chance, cost: "fate_cost of the ch.07 option (1..3)", via: "spend_fate(n)"}
  never: [buy_facts, buy_licenses, buy_degrees, cancel_costs, drained_by_costs]

repetition:        # 01.14.3; DL-01-08; the shape ch.06 uses for attacks
  engine_snags_by_instance: [0, -2, -4]
  cap: -4
  counts_toward_cited_snag_limit: false
  counts_toward_circumstance_cap: true
  window: {conflict: "the actor's turn", outside_conflict: "one repeated beat"}
  same_act: {conflict: "any beat with trait.action.attack, any target", outside_conflict: "same verb against the same obstacle"}
  throttle: "min(stated quantity, actions available (06), instances the time allows)"
  owner_may_tune: "06 may set any non-increasing sequence within the -4 cap"

sequential:        # T-01-8
  critical_success: "the later beat gains what the earlier was for + one extra Precision or Amplifying lever (player's choice)"
  success: "the later beat gains what the earlier was for"
  failure: "the later beat proceeds without it at stakes +1, or is abandoned with nothing spent"
  critical_failure: "the later beat cannot proceed as planned; the earlier cost applies"

group:             # 01.14.7; DL-01-10
  all_must: {modifier: lowest_base, cost_lands_on: "the member whose modifier was used, unless another's method engaged the source"}
  any_may: {modifier: highest_base}
  help_levers_max: 1
  tie_break: all_must
help:              # 01.14.8
  lever: {type: precision, value: 2}
  max_per_beat: 1
  eligibility: "the helper could attempt the helped beat alone now (gate G1/G2, in position, not forbidden)"
  shares_cost: "when the helper's method engaged the cost's source"
setup:             # 01.14.9
  uses: {success: 1, critical_success: 2}
  critical_failure: "target forewarned: a snag fact on the intended follow-up"
  duration: {conflict: "until used or end of the setter's next turn", outside: "until used or scene_end"}
  condition_knob: [cond.distracted, cond.off_balance, cond.exposed, cond.blinded]
take_the_time:     # 01.4.4; DL-01-09; [revision: R2-K] [DL-01-44]: computed by code on the typed frame, every verb
  not_costly_when: [stakes_source_none, no_sourced_threatened_cost, no_clock_listening, not_conflict, retry_at_leisure]
  stakes_check: "a frame naming a sourced cost or a listening clock is costly whatever stakes.source says (logged)"
  time_charged: advance_time            # the RESULT says how long; never 'hidden check made'
  fallback: same_test_on_own_scope      # owner-confirmed 2026-10-10 [revision: R2-K] (DL-01-46); tier read after the fallback's shift
  time_multiplier: 2
  free_unit: minutes                    # [revision: R2-L] [DL-01-50]: never site intervals in free play
  free_unlisted_minutes: 5             # an unlisted beat taken with time costs 2 x 5 minutes (provisional: owner decision R2-L-3)
  cost_source: mechanical_only        # [revision: R2-L] [DL-01-51] 01.4.1: a narrated T1a detail never makes a frame costly
  forbidden_tiers: [very_hard, legendary]
  requires: "uncertain and not costly"
limits:
  beats_per_declaration: 3
  clarifying_questions: 1
  anchor_knob_changes: 2
  levers_cited: 2
  snags_cited: 2

auto_commit:       # 01.7.4 [revision: R2-C; DL-01-32, D7 assumed, owner to confirm]
  default: true     # a creation-time preference (T-14-1); the player may turn it off
  allowed_when: [stakes_safe, not_lethal, not_secret, no_mode_price, not_long_shot, success_or_better_at_least_50]
  never: [risky, dire, lethal]
  only_when_costly: true           # [revision: R2-K] [DL-01-47]: a Safe frame that is not costly takes the time and never reaches an OFFER

frame_guards:      # [revision: R2-C; DL-01-29] 00.3.9(b), 01.6.8, 01.6.13
  cited_precision_snags_max: 1     # a further fitting hindering fact applies as a Protective snag (stakes +1)
  critical_failure_guard:
    applies_when: [not_dire, not_opposed, not_secret]
    require: "critical_failure <= max(5, success_or_better)"
    then: [convert_precision_snag_to_protective, show_long_shot_with_best_alternative]
    guard_rung_sets_lethal: false

stakes_cost_menus: # [revision: R2-C; DL-01-31] 01.6.9 / 01.6.11: the cost menus each stakes source may draw on.
  # cost.shortfall (alternate only) and cost.twist (last resort, 01.13.1) are open to every source.
  aware_opponent_or_observer: [cost.exposure, cost.closed_door, cost.footing, cost.time, cost.harm]
  hazard: [cost.harm, cost.footing, cost.gear, cost.time, cost.drain]
  height_or_depth: [cost.harm, cost.footing, cost.gear]
  listening_clock: [cost.time, cost.exposure]
  damageable_item: [cost.gear]
  goodwill_or_trust: [cost.closed_door, cost.exposure, cost.time]
  consumed_resource: [cost.drain, cost.gear]
  harm_only_when: {aware_opponent_or_observer: "the party is armed and hostile to the actor (a cited fact)"}

traits:            # T-01-13 (what each trait tag pulls in); tag definitions: tags.yaml (03)
  trait.action.attack: [target_defense, on_check_against_reactions, repetition_window, starts_conflict, hostile_act_witnessed]
  trait.action.manipulate: [needs_free_hand, forbidden_by: [cond.grabbed (an arm held), cond.pinned, cond.restrained], may_provoke_reactions_06]
  trait.action.move: [forbidden_by: [cond.restrained, cond.pinned, cond.frozen], slowed_limits_bands, may_provoke_reactions_06, set_position_on_move]
  trait.action.concentrate: [no_shared_action, ends_on: [cond.stunned, cond.unconscious], on_harm_endure_resolve: {S1: easy, S2: easy, S3: moderate, S4: hard, S5: very_hard}]
  trait.action.speech: [forbidden_by: [cond.choking, silenced], implies: trait.sense.audible]
  trait.sense.visible: [perceived_with_line_of_sight, removes_flag.hidden_unless_sneak]
  trait.sense.audible: [heard_within: band.near, ticks_listening_clocks, not_through_walls]
  trait.sense.loud: [heard_within: band.distant, method_consequence_any_degree, ticks_listening_clocks, removes_flag.hidden]
  trait.sense.scent: [writes_trail_fact, trackers_gain_precision_lever_10]
  trait.delivery.touch: [needs: band.engaged, aimed_vs_agility_unless_willing_or_helpless]
  trait.delivery.melee: [owner: "06"]
  trait.delivery.ranged: [owner: "06"]
  trait.delivery.area: [owner: "06"]
  trait.delivery.aura: [owner: "06"]
  trait.delivery.line: [owner: "06"]
  trait.nature.magical: [sensed_by_magic_sense_licenses, warded_and_dispelled_05, inert_where_canon_forbids_13]
  trait.nature.sacred: [keys_resistances_by_creature_tags_09]
  trait.nature.profane: [keys_resistances_by_creature_tags_09]
  trait.nature.mental: [resisted_with: resolve, mindless_unaffected: [creature.undead.mindless, creature.construct]]
  trait.nature.illusion: [disbelieve: "Observe (Wits) vs effect DC after physical interaction or cause; success ends it for that target"]
  trait.duration.instant: [resolves_and_ends]
  trait.duration.sustained: [implies: trait.action.concentrate]
  trait.duration.lasting: [carries_duration_form]
  trait.duration.permanent: [until_removed_by_named_means]

intended_change:   # 01.2.7 [revision: R2-H] [DL-01-34]: each beat's typed intended change; applied on success, scaled by reach, cited (must-name)
  kinds:
    take: {slots: [item, from], applies: "the item's holder becomes the actor"}
    give: {slots: [item, to], applies: "the item's holder becomes the recipient"}
    move_to: {slots: [place_or_band, who], applies: "position: the place, or beside the person or thing (an approach: one beat, 01.4.1); in a conflict, bands toward or away (PR-06-4)"}   # [revision: R2-I] [DL-12-98]
    open: {slots: [thing], applies: "the thing's state: open"}
    close: {slots: [thing], applies: "the thing's state: closed"}
    learn: {slots: [topic_or_entity], applies: "delivered items (01.10; PR-12-10; 15.9)"}
    persuade_to: {slots: [person, act], applies: "npc.<id>.agreed: <act> (15.3)"}
    restrain: {slots: [person], applies: "held, restrained or pinned (T-12-18 Grapple rows)"}
    free: {slots: [person], applies: "the hold ends"}
    harm: {slots: [target], applies: "harm and conditions (ch.06, ch.07)"}
    hide: {slots: [who_or_item, from_whom], applies: "hidden (Sneak, 01.18.13)"}
    make: {slots: [item_kind, from], applies: "a made or mended thing (Handle; ch.08)"}
    none: {slots: [], applies: "nothing beyond the beat's own rule"}
  descriptions: "a whom/what slot may hold an unnamed description of people or things present ('the refugees', 'the queue'): the change is a scene fact about it, the narrator voices whoever speaks; no group entity, no spokesperson; consequential -> the case or casting picks an individual (01.2.7)"   # [revision: R2-I] [DL-12-97]
  before_framing:                    # 01.2.7 step 1 [revision: R2-I] [DL-01-36]
    already_true: certain            # the change already holds in the store: no roll, no OFFER (01.4.1: trivial)
    already_true_judged_on: typed_goal   # [revision: R2-K] [DL-01-45]: agreed {person, act, size}; same or smaller contained act -> already true; a roll never shrinks an agreement; word overlap retired
    rolled_beat_needs_goal: true     # [revision: R2-K] [DL-01-42]: `none` only on beats that do not roll
    no_valid_target: [description, ask_who]
    rule: "never offer a roll whose success has nothing to deliver"
  slot_ids: in_scope                 # ids from the Reader's view (scene and spotlight entities) or a place the PC knows
  reach:                             # delivered reach -> how much of the change lands
    0: nothing
    1: "partial: take = a hand on it, still contested; move_to = part of the way (one band in a conflict); persuade_to = a smaller act; restrain = a grip; learn = 01.10's count"
    2: whole
    3: "whole, plus the kind's extra where it has one (restrain: restrained)"
    4: "as 3 (restrain: pinned)"
  failure: nothing
  success_at_cost: "the change and its cost; the cost never undoes the change (01.9.3)"
  unapplicable: "not applied; the RESULT says why (the item is not where the slot says), so 12.3.6 can explain it"
  split: "one beat per goal: two goals in one message are two beats; a method, or force or movement in service of a goal, is that goal's beat and is rolled as the goal, never a change of its own (01.2.2, 01.2.7)"   # [revision: R2-J] [DL-01-37]
  log: [restatement, verb, ids_in_scope, kind, slots]   # Laya-ready: a short-input decision with at most 20 options, logged with its inputs

reverses_goal:     # 01.9.3 [revision: R2-M] [DL-01-61]: per typed change kind, the cost ids that undo the goal when
                   # paid on the goal's own target; a success at a cost never pays one. Ids only: no price's words
                   # are read (constitution VIII.9). Kinds not listed have none.
  persuade_to: [cost.closed_door]
  learn: [cost.closed_door]

attribute_rubric:  # 01.6.1 [revision: R2-H] [DL-01-35]
  lift_or_carry:
    when: "a beat whose typed change is take, or whose method lifts, carries or palms a thing (Exert, Force, Handle or Sneak)"
    allowed: [might, agility, endurance]
    words:                           # the method's words decide when they pick one
      might: [heave, haul, hoist, wrench, drag, shoulder]
      agility: [palm, slip, snatch, pluck, quick and quiet, deft]
      endurance: [carry far, all day, for hours]
    default: best_computed           # no word picks: the allowed attribute with the best odds (the one exception to 01.6.1's lower-on-a-tie)
    offer: list_alternatives         # the OFFER lists the others with their odds; the player picks at no cost (00.4.5)
