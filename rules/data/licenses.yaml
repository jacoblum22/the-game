# data/licenses.yaml
# Purpose: every license that is not an ability, a rite, a basic verb or a language: the 81 TRAINING licenses
#   (one per level-2 deed tag: the domain license of that trade or art, with grades trained < expert < master)
#   and the two Focus licenses. A training license licenses the methods of its tag that the basic verbs exclude,
#   and is what makes emulation (05.5.4), stretch grades (05.5.2), learning (05.8.5) and flares available for
#   abilities under its tag. Callings set the grade by tier (04.5.1); every other path grants `trained`.
# Owner: 05-abilities-focus-magic (T-00-19). Owner-blocks: 02 (origin licenses), 08 (item licenses), 13 (languages,
#   setting licenses), and 04 (the six lic.call.* capability licenses, data/licenses.yaml owner-block 04, approved).
# Schema: data/SCHEMAS.md#licensesyaml (License, 00.12.1). EVERY entry carries explicit principle, scope, excludes,
#   crude_fallback, stretch, emulate and acquisition_paths (01 Interface request; a missing field would be read
#   as null and logged as a rule_conflict). Generated by rules/_process/simulation/05-gen_data05/gen_data05.py.
# Basis: [C:VII] [00.12.1] [00.12.4] [01.3.5] [04.5.1, 04.5.3] [R7 4.4] [DL-05-06] [DL-05-08]

schema_version: 1
lifecycle: provisional
grades:
- grade: trained
  obstacle_tier_cap: hard
  technique_cap_min_tier: 2
  stretch: {dc_shift: 5, cost_add: 1, reach_cap: limited}
  flares: 1
  reached_by: origin, mentor, text, or a calling's Mark at tier 1-2
- grade: expert
  obstacle_tier_cap: very_hard
  technique_cap_min_tier: 4
  stretch: {dc_shift: 5, cost_add: 1, reach_cap: standard}
  flares: 1
  reached_by: a calling's tier only (04.5.1)
- grade: master
  obstacle_tier_cap: legendary
  technique_cap_min_tier: 5
  stretch: {dc_shift: 0, cost_add: 1, reach_cap: standard}
  flares: 2
  reached_by: a calling's tier only (04.5.1)
training_clock:
  name: training in <trade>
  kind: project
  segments: 8
  visibility: public
  direction: fill
  tick_sources:
  - {'on': a downtime training week with a mentor (ch.15), ticks: 2}
  - {'on': a downtime week of study from a manual, ticks: 1}
  on_complete:
    effects:
    - {effect_id: eff.grant_license, params: {license: the training license, grade: trained, duration: permanent}}
    interrupting: false
    then: close
training_competence_cap: {counts: 'competence entries with source taught (mentor or text path, 05.9.4)', cap: 'learning picks (02.5.6) + the highest confirmed tier among held callings, minimum 1', past_cap: 'the license is acquired and held as access (no competence entry, 02.5.2), unless the player sets aside one taught entry at a long rest (its license stays, as access)', deepening: 'training a license already held as access writes its +2 entry, within the cap', not_counted: origin and calling entries}
emulate_defaults: {dc_shift: 5, cost_mult: 2, reach_cap: limited}

licenses:
- id: lic.training.martial_blade
  name: Bladework
  kind: training
  tags: [deed.martial.blade]
  principle: Practise the trade or art of bladework as one trained in it.
  scope: 'Fight with swords, daggers and knives using their techniques (the basic Strike already covers hitting with one). Also: hold, learn (05.8.5) and emulate (05.5.4) abilities whose first tag is at or under deed.martial.blade, and stretch them at your grade''s price (T-05-6). The grade caps the obstacle tier at which these methods can succeed: trained Hard, expert Very hard, master Legendary.'
  excludes:
  - {what: methods and abilities of any other level-2 deed tag, needs: that tag's own lic.training.* license}
  - {what: an ability of this tag that you neither hold nor have witnessed, needs: 'a pick (04.8.4), a teacher or text (05.8.5), or lic.call.open_art'}
  grades:
  - {grade: trained, scope: 'licensed methods up to Hard obstacles; techniques of min_tier 1-2; stretch DC +5, +1 Focus, Limited reach; one flare'}
  - {grade: expert, scope: 'licensed methods up to Very hard obstacles; techniques of min_tier 1-4; stretch DC +5, +1 Focus, Standard reach; one flare'}
  - {grade: master, scope: 'licensed methods up to Legendary obstacles; techniques of min_tier 1-5; stretch DC +0, +1 Focus, Standard reach; two flares'}
  attribute: by_method
  grants_competence:
  - {tag: deed.martial.blade, value: 2, when: 'acquired by the mentor or text path (an origin sets its own value, at most +2; a calling sets its own, 04.5.2)'}
  crude_fallback: {verb: verb.strike, method: cut or thrust with the blade untrained, dc_shift: 0, reach_cap: standard, consequence: null}
  stretch:
    dc_shift: 5
    cost_add: 1
    reach_cap: limited
    within: principle
    by_grade:
      expert: {dc_shift: 5, cost_add: 1, reach_cap: standard}
      master: {dc_shift: 0, cost_add: 1, reach_cap: standard}
  emulate:
    allowed_for: active abilities whose first tag is at or under deed.martial.blade, that you have witnessed (a pc.witnessed fact), with min_tier within your grade's technique cap (trained 2, expert 4, master 5); not oath-gated, not adversary_only
    dc_shift: 5
    cost_mult: 2
    reach_cap: limited
    crit_fail: {effect_id: eff.apply_condition, params: {condition: cond.off_balance, severity: S1, duration: 'rounds:1', target: self}}
    learn_clock:
      name: learning <ability>
      kind: project
      segments: 6 (min_tier 1-2) | 8 (3-4) | 12 (5)
      visibility: public
      direction: fill
      tick_sources:
      - {'on': a successful emulation of the ability, ticks: delivered_reach}
      - {'on': a training week with a mentor who holds it, ticks: 3}
      - {'on': a week of study from a text that teaches it, ticks: 2}
      - {'on': a week of practice alone after witnessing it, ticks: 1}
      on_complete:
        effects:
        - {effect_id: eff.grant_license, params: {license: the learned ability, grade: rank 1, duration: permanent}}
        interrupting: false
        then: close
  acquisition_paths:
  - {type: origin, detail: granted by an origin at creation (ch.02), clock: null, requires: null}
  - {type: mentor, detail: a training week with a mentor ticks 2 (ch.15; writes cnt.training), clock: 'clk.train (8 segments, project, public)', requires: a mentor who holds lic.call.proof for this tag or this license at expert}
  - {type: project, detail: a week of study from a manual ticks 1, clock: 'clk.train (8 segments, project, public)', requires: a text that teaches the trade}
  - {type: recognition, detail: 'a calling whose key is at or above this tag: its Mark (lic.call.mark) gives use of this license at the tier''s grade (04.5.1)', clock: null, requires: null}
  source: data
  lifecycle: provisional
  basis: ['05.9', 00.12.1, 04 Interface request 5, DL-05-06]
