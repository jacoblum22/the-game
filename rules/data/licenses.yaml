  # ---- merged from licenses.04.yaml ----
  # data/contrib/licenses.04.yaml
  # Purpose: the calling-capability licenses ch.04 grants, for merge into data/licenses.yaml (owner 05). T-00-19
  #   lists owner-blocks 02, 08 and 13 for that file; ch.04 REQUESTS an owner-block "04" (04 Interface requests).
  #   Five universal capabilities, one per tier of the ladder, plus the Devourer's special capability. They are
  #   universal on purpose: a calling is a derived label and hands out no list of its own (constitution P5). Each
  #   license is held ONCE (INV-13); its scope reads the holder's callings, so a second calling widens the scope
  #   without a second instance.
  # Owner: 04-recognition-and-growth. Schema: data/SCHEMAS.md#licensesyaml (License, 00.12.1).
  # "Your key" below means: the key tag(s) of any calling you hold, unsuspended, at the stated tier or higher.
  #   For a hybrid the keys are its two roads; for a vow or dark calling, its conduct axis (only where stated).
  # Basis: [C:VII] [C:P5] [C:P2] [R3 04.6 tier rewards are capabilities] [R1 04 qualitative growth]
  #   [R2 #4 mastery widens the reliable envelope] [DL-04-01] [DL-04-23]
  - owner: "04"
    entries:
      - id: lic.call.mark
        name: The Mark of the Calling
        kind: calling_capability
        tags: [deed]
        principle: "The world has grounds to treat you as a practitioner of what you do."
        scope: "Use every training license whose first tag is at or under your key at the grade your calling's tier sets (callings.yaml#tier_ladder.training_grade). Present yourself as a recognized practitioner of your key wherever a rule, license or institution requires one (guild work, an order's rites, a trial's entry)."
        excludes:
          - "a rank or seat in any institution (ch.11 grants ranks; a rank is never capability)"
          - "techniques of a training license whose first tag lies outside your key (acquire that license by its own paths)"
        attribute: by_method
        crude_fallback: none
        stretch: null
        emulate: null
        acquisition_paths:
          - {type: recognition, detail: "tier 1 (Called) of any calling", clock: null, requires: "04.5.3"}
        source: "calling tier 1"
        lifecycle: provisional
        basis: ["04.5.3", "C:VII"]
      - id: lic.call.proof
        name: Proven
        kind: calling_capability
        tags: [deed.influence.teaching]
        principle: "What you have proven you can pass on."
        scope: "Act as the mentor in the mentor acquisition path of any training license whose first tag is at or under your key, up to the grade one below your own, for a companion or an NPC (ch.15's training activity; ch.16 for companions). Your teaching ticks the learner's clock at the rate ch.15 sets for a mentor."
        excludes:
          - "teaching an ability (abilities are picked or acquired, never taught by this license)"
          - "granting a calling to anyone (a calling comes only from the learner's own deeds)"
        attribute: presence
        crude_fallback: {verb: verb.help, method: "work beside the learner on one task", dc_shift: 0, reach_cap: standard, consequence: null}
        stretch: null
        emulate: null
        acquisition_paths:
