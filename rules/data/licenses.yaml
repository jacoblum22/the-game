      name: Orrowan, the bell-tongue
      kind: language
      tags:
      - deed.lore.languages
      principle: Speak and understand Orrowan, the tongue of the old kingdom of Orrow.
      scope: Talk, listen and (with lic.lang.letters) read and write Orrowan, to the extent of the grade held. Spoken natively by the Woken and by the oldest folk of the border
        villages; sung in the Bellwardens' offices; carved and painted on every ruin of the vale.
      excludes:
      - what: reading or writing it without lic.lang.letters
        needs: lic.lang.letters
      - what: any other tongue
        needs: that tongue's own lic.lang.* license
      - what: the Deep Tongue of Sael's lowest vaults
        needs: lic.lang.old_tongue
      grades:
      - grade: broken
        scope: needs, directions, prices, warnings and other simple concrete matters; every Talk in it holds a Precision snag and its reach is capped at Limited
      - grade: accented
        scope: everyday speech with no snag; you are plainly not of Orrow; subtle, technical or courtly matters hold a Precision snag
      - grade: native
        scope: everything a native speaker can say or catch, including the bell-offices, old law and courtly forms
      attribute: by_method
