- id: lic.focus.push
  name: Push
  kind: fact
  tags: [deed]
  principle: Spend your reserves to make an ordinary effort count for more.
  scope: 'Spend 1 Focus on your own declared, rolled beat whose primary deed tag (or an ancestor) carries competence above the PC floor: choose reach +1 rung or stakes -1 rung. Once per beat, declared at the OFFER (05.6.7).'
  excludes:
  - {what: a bonus to the roll or a change to the DC, needs: a lever citing an established fact (00.3.9)}
  - {what: a resisted check or an Oracle question, needs: 'nothing: a push applies to declared beats only'}
  - {what: a beat at a tag where you have only the floor, needs: training in that tag (05.9.4)}
  attribute: by_method
  crude_fallback: none
  stretch: null
  emulate: null
  effects:
  - {effect_id: eff.reach_step, params: {ladder: reach, steps: 1, applies_when: 'the pushed beat, when the player chose reach'}}
  - {effect_id: eff.stakes_step, params: {ladder: stakes, steps: -1, applies_when: 'the pushed beat, when the player chose stakes'}}
  cost: {focus: 1}
  limits: {per: beat_end, uses: 1}
  acquisition_paths:
  - {type: origin, detail: held by every character from creation, clock: null, requires: null}
  source: every character
  lifecycle: provisional
  basis: [05.6.7, 'C:P2', 'R3 #9', DL-05-12]
  universal: true
- id: lic.focus.reserve
  name: The Reserve
  kind: training
  tags: [deed.lore.arcana.theory]
  principle: Set aside your own reserves in a vessel and take back exactly what you set aside.
  scope: 'Bank Focus into a vessel (an item tagged item.tool.implement that you made or have kept for a season) and draw it later at a ratio of 1 to 1: capacity 2, or 3 when your highest tier is 3 or more, or 4 at tier 5 (05.6.12).'
