        consequence: null
        reading: an Orrowan inscription without the license yields numerals, seals, the bell-sign and the keepers' names only
      stretch: null
      emulate: null
      effects:
      - effect_id: eff.06.grant_snag
        params:
          type: precision
          sign: snag
          to: the bearer
          fact: speaks Orrowan brokenly
          applies_when: a Talk beat is spoken in this tongue and the grade held is broken
          duration: permanent
      - effect_id: eff.reach_step
        params:
          ladder: reach
          steps: -1
          applies_when: a Talk beat is spoken in this tongue, the grade held is broken, and the framed reach is above Limited
      - effect_id: eff.06.grant_snag
        params:
          type: precision
          sign: snag
          to: the bearer
          fact: speaks Orrowan as a foreigner
          applies_when: a Talk beat is spoken in this tongue, the grade held is accented, and the matter is subtle, technical or courtly (a fact on the scene or the NPC)
          duration: permanent
      acquisition_paths:
      - type: origin
        detail: granted by the Woken upbringing (orig.up.woken) at accented, or bought with a learning pick (02.5.6)
        clock: null
        requires: null
      - type: mentor
        detail: 'clk.learn_tongue (8 segments, project, public): a week living among Woken in Tolling''s Waking House or in Harrowby ticks 2; a week with a teacher (a Bellwarden,
          a Woken) or a text (needs lic.lang.letters) ticks 1'
        clock: clk.learn_tongue
        requires: speakers to live among, or a teacher who holds it at accented or better
      - type: project
        detail: a week of study from the Bellwardens' psalter or an Orrowan primer from the Lamplit Library ticks 1
        clock: clk.learn_tongue
        requires: lic.lang.letters and such a text
      source: data
      lifecycle: provisional
      basis:
