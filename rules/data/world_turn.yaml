# data/world_turn.yaml
# Purpose: the living world's engine data: the World Turn's steps and the Season Turn's; what the change log
#   records; status steps; world reactions and deed families; situation templates; traces and spread; rumor
#   truth and distortion; epithet forms; hook, fallback, land-change, seasonal-event and local-event tables;
#   world phenomena; thread ranks and sources; great-project world changes; holding improvements; caps;
#   reputation thresholds (11.2, 11.4-11.7, 11.9, 11.11).
# Owner: 11-living-world (T-00-19). No owner-blocks; a region's seed (12.16) supplies regional tables by naming them
#   `tbl.11.season_events.<region>`, `tbl.11.hook.<region>`, `tbl.<region>.events` in its region file.
# Schema: data/SCHEMAS.md#world_turn.yaml (steps, event_tables, attention) plus T-11-1's optional keys.
# Every entry lifecycle: provisional (00.16.3).
# Basis: [R6 B-R1, B-12, B-13, B-17, B-19, B-20] [R5 P-07, P-08, P-14, P-24, P-44] [R1 #10] [DL-11-01..24]

schema_version: 1
steps:
- n: 1
  name: Elapse
  handler: h.11.world_turn
  rule_id: 11.2.2; PR-11-1 step 1
  does: close the change log; stamp the turn; read the PC's place and whether play is suspended
- n: 2
  name: Maintain
  handler: h.11.world_turn
  rule_id: 11.9.3; 11.3.10; 11.3.17; PR-11-1 step 2
  does: "holdings' yields and threats; obligations due; off-screen linchpin fates; spent levers; open officer seats filled (11.3.17) [revision: I-081]"
- n: 3
  name: Timelines
  handler: h.11.world_turn
  rule_id: 11.4.2
  does: week-cadence situation steps; completions of clocks ticked in phase 5
- n: 4
  name: Faction actions
  handler: h.11.world_turn
  rule_id: 11.3.5-11.3.7; 11.3.16; PR-11-2
  does: one action per full faction (tier order); a d6 per petty faction
- n: 5
  name: Consequences
  handler: h.11.world_turn
  rule_id: 11.4.6-11.4.8
  does: match the closed change log to world reactions; most specific eligible wins; <= 1 per change, <= 6 per region
- n: 6
  name: Attention
  handler: h.11.world_turn
  rule_id: 11.3.12
  does: attention completions become entanglements; pursuit
- n: 7
  name: News and rumors
  handler: h.11.world_turn
  rule_id: 11.6.2-11.6.6; PR-11-7
  does: traces of every consequential change; spread one step; fade; what reached the PC
- n: 8
  name: Queue
  handler: h.11.world_turn
  rule_id: 11.4.4-11.4.5; 11.5.8-11.5.10; 11.11.2
  does: bang queue; kicker; register upkeep; hook supply; season herald at week 12
- n: 9
  name: Record
  handler: h.11.world_record
  rule_id: 11.12.2
  does: at most five chronicle lines (phase 9)
season_steps:
- n: 1
  name: Calendar
  rule_id: 11.11.3; 11.10.4
- n: 2
  name: Factions
  rule_id: 11.3.9; 11.3.12; 11.3.14; 11.8.3-11.8.6; 11.9.9
- n: 3
  name: Situations
  rule_id: 11.4.3
- n: 4
  name: Seasonal events and phenomena
  rule_id: 11.11.4
- n: 5
  name: Threads
  rule_id: 11.5.5; 11.5.9
- n: 6
  name: Reputation
  rule_id: 11.7.4; 11.7.9
- n: 7
  name: Holdings
  rule_id: 11.9.3
- n: 8
  name: Seams
  rule_id: 11.13.1
- n: 9
  name: Record
  rule_id: 11.12.5
year_steps:
- n: 1
  name: Aging
  rule_id: 11.10.5
- n: 2
  name: Annual festival
  rule_id: 11.10.4
- n: 3
  name: Year digest
  rule_id: 11.12.5
- n: 4
  name: Legend review
  rule_id: 11.11.5 (score-5 epithets permanent)
- n: 5
  name: Retired characters age
  rule_id: 11.13.7
event_tables:
- tbl.11.rumor_truth
- tbl.11.distortion
- tbl.11.epithet_forms
- tbl.11.hook
- tbl.11.fallback_form
- tbl.11.land_changes
- tbl.11.season_events.spring
- tbl.11.season_events.summer
- tbl.11.season_events.autumn
- tbl.11.season_events.winter
- tbl.11.local_events
- tbl.11.rumors
attention:
  defined_in: data/factions.yaml#attention
  rule_id: 11.3.12
caps:
  full_factions_per_region: 6
  full_factions_realm: 12
  active_situations_per_region: 8
  bang_queue: 6
  active_threads: 12
  seeded_hooks_known: 8
  personal_threads_per_ally: 1
  reactions_per_change: 1
  reactions_per_region_per_turn: 6
  chronicle_lines_per_world_turn: 5
  reputation_entries_per_scope_per_actor: 3
  epithets_in_use: 3
  bequeathed_threads: 3
  news_items_on_arrival: 3
logged_patterns:
- public_deed
- recognition_event
- victory_over_pc
- setback.*
- fac.*.status_to_pc
- fac.*.hold | fac.*.tier | fac.*.lifecycle_stage | fac.*.relations.*
- npc.*.exists
- npc.*.member_of
- npc.*.held_by
- loc.*.owner | loc.*.safe | loc.*.cleared | loc.*.danger | loc.*.occupants
- sit.*.step.* | sit.*.status
- thr.*.status
- clk.*.completed
- pc.reputation.*
- commitment.*.violated | commitment.*.satisfied
- cost.exposure.S5
- rumor_reached_seat.*
status_steps:
- id: st.patron_thread
  deed: completed a thread the faction is patron of
  step: +1; +2 at formidable or higher
  class: small; weight at formidable+
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.accepted_offer
  deed: accepted its institutional offer (V3, V9) or a rank
  step: '+1'
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.obligation_kept
  deed: kept a rank obligation due this season
  step: +1 once per season
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.admired
  deed: a week of service; a gift of >= 1 Unit of its lifestyle; a noteworthy deed on a pole its values admire, in its scope
  step: +1 once per season per source kind
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.spared
  deed: spared, freed or ransomed its members; returned what was taken
  step: '+1'
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.helped_rival
  deed: completed a thread for a faction at -2 or worse toward it
  step: '-1'
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.despised
  deed: a noteworthy deed on a pole its values despise, in its scope
  step: '-1'
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.robbed
  deed: robbed, defrauded or lied to it (an exposed lie)
  step: '-1'
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.broke_obligation
  deed: broke a rank obligation; sold its gift
  step: '-1'
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.declined
  deed: declined its offer with a decline_cost
  step: the cost's amount
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.killed_rank_and_file
  deed: killed or maimed its rank and file
  step: -1 once per scene
  class: small
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.struck_officer_or_hold
  deed: killed, took or turned an officer; struck one of its holds
  step: '-2'
  class: weight
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.foiled_goal
  deed: foiled its goal (goal clock voided by a racing clock the PC filled, or a thread completed against it)
  step: '-2'
  class: weight
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
- id: st.linchpin
  deed: a linchpin's fate fired by the PC's hand
  step: -3 dies or captured; -2 turned or exposed
  class: weight (per-turn cap does not apply)
  lifecycle: provisional
  basis:
  - 11 (world_turn.status_steps)
status_caps:
  small_per_faction_per_turn: 1
  weight_max_step: 2
  total_per_faction_per_turn: 2
  applies_only_when_known: true
reputation:
  score_thresholds:
    1: 1
    2: 3
    3: 6
    4: 10
    5: 15
  points:
    noteworthy_packet: 1
    three_ordinary_carried_packets: 1
    recognition_event_witnessed: 1
    exposure_s5: 2
    great_project: 2
  key_rule: conduct axis and pole of the strongest conduct entry when its magnitude >= 2; else the deed branch; defeat; scandal
  epithet_when: score >= 2 and >= 2 noteworthy packets on the key in the scope
  spread:
    settlement_to_region: score >= 3 -> score - 2
    region_to_realm: score >= 4 -> score - 2
    faction_scopes_spread: false
  fade: no point for 4 seasons -> score -1 (not at score 4 or 5)
  tone_bands:
    1: a few have heard
    2: known here
    3: talked of
    4: famous here
    5: a legend here
  valence_words:
    admired: admired
    despised: despised
    neutral: spoken of
    feared: feared (despised with score >= 3)
deed_families:
- id: fam.violence_folk
  true_only_when: the deed's literal act killed, maimed or terrorized people of creature.folk
  lifecycle: provisional
  basis:
  - 11 (world_turn.deed_families)
- id: fam.mercy
  true_only_when: the deed spared, freed, healed or forgave someone at the doer's cost or risk
  lifecycle: provisional
  basis:
  - 11 (world_turn.deed_families)
- id: fam.theft_fraud
  true_only_when: the deed took property or advantage by stealth or deceit
  lifecycle: provisional
  basis:
  - 11 (world_turn.deed_families)
- id: fam.sacrilege_piety
  true_only_when: the deed honored or defiled a holy place, rite or relic
  lifecycle: provisional
  basis:
  - 11 (world_turn.deed_families)
- id: fam.great_beast
  true_only_when: the deed slew or drove off a beast, monster or dragon of threat band >= the PC's band or of principal depth
  lifecycle: provisional
  basis:
  - 11 (world_turn.deed_families)
- id: fam.place_opened
  true_only_when: the deed opened, cleared or claimed a site, ruin or route
  lifecycle: provisional
  basis:
  - 11 (world_turn.deed_families)
- id: fam.rescue
  true_only_when: the deed brought a captive, lost or endangered person to safety
  lifecycle: provisional
  basis:
  - 11 (world_turn.deed_families)
- id: fam.betrayal
  true_only_when: the deed broke a recorded agreement, bond or oath
  lifecycle: provisional
  basis:
  - 11 (world_turn.deed_families)
reactions:  # key `on` quoted: unquoted it parses as the boolean true under YAML 1.1 [verification: V2c-008]
- id: wr.great_beast_slain
  'on': npc.*.exists=dead (creature.beast|creature.dragon|creature.horror; band >= PC band or principal)
  family: fam.great_beast
  candidates:
  - id: kin_vengeance
    specificity: pc_deed
    weight: 2
    requires: a carrier; the beast had kin or a cult
    writes:
    - create hunt clock (danger 6, hidden, +1 a week) for the kin
    bang:
      tag: threat
      intensity_delta: 3
      content: the beast's kin comes for its killer
  - id: clutch_rumor
    specificity: pc_deed
    weight: 2
    requires: a carrier
    writes:
    - 'a hook: what the beast left behind (an egg, a hoard, a mate); a rumor (eyewitness) about it'
  - id: hunters_flood
    specificity: region
    weight: 3
    writes:
    - the area's danger rating -1 rung for a season (fewer beasts); a rumor that the wood is safe
  nothing_weight: 2
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.rescue
  'on': public_deed
  family: fam.rescue
  candidates:
  - id: kin_owe
    specificity: npc
    weight: 3
    writes:
    - 'the rescued one''s kin: standing +1 toward the PC; a favor owed (commitment)'
  - id: captor_marks
    specificity: pc_deed
    weight: 2
    requires: the captor is a faction
    writes:
    - tick the captor faction's attention +1
  nothing_weight: 2
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.mercy_shown
  'on': public_deed
  family: fam.mercy
  candidates:
  - id: spared_returns
    specificity: pc_deed
    weight: 2
    requires: the spared one lives
    writes:
    - 'the spared NPC''s next appearance is as an ally of opportunity (a bang: opportunity)'
  - id: faith_notices
    specificity: faction
    weight: 2
    requires: a faction whose values admire conduct.mercy holds a seat in the scope
    writes:
    - 'that faction: st.admired'
  nothing_weight: 3
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.violence_folk
  'on': public_deed
  family: fam.violence_folk
  candidates:
  - id: kin_feud
    specificity: pc_deed
    weight: 2
    requires: a named victim with kin
    writes:
    - a situation of template sit_t.feud with the victim's kin as actor
  - id: law_moves
    specificity: faction
    weight: 3
    requires: a crown.civic or crown.military faction seats the scope
    writes:
    - that faction's attention +2
  nothing_weight: 1
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.theft_known
  'on': public_deed
  family: fam.theft_fraud
  candidates:
  - id: victim_hires
    specificity: npc
    weight: 2
    writes:
    - 'the victim hires someone to recover it (a thorn: an NPC hunter, recurring)'
  - id: fence_word
    specificity: faction
    weight: 2
    requires: an org.outlaw faction in the scope
    writes:
    - 'that faction: relation-of-interest fact; an opportunity bang (they want a cut)'
  nothing_weight: 2
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.sacrilege
  'on': public_deed
  family: fam.sacrilege_piety
  candidates:
  - id: faith_wrath
    specificity: faction
    weight: 3
    requires: the place's faith is a faction
    writes:
    - 'that faction: st.despised (or st.admired for piety)'
  - id: place_stirs
    specificity: region
    weight: 1
    requires: the place has a keeper or spirit
    writes:
    - a situation of template sit_t.cursed_ground at the place (sacrilege only)
  nothing_weight: 2
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.place_opened
  'on': loc.*.cleared
  family: fam.place_opened
  candidates:
  - id: settlers_come
    specificity: region
    weight: 2
    requires: ring <= 2 from a haven
    writes:
    - 'a hook: settlers want the site made safe for good (pacify, T-11-17)'
  - id: something_else_moves_in
    specificity: region
    weight: 2
    writes:
    - at the next Season Turn the site gains new occupants from the region's encounter table (10)
  - id: claimant_appears
    specificity: faction
    weight: 1
    writes:
    - a faction claims the site (a hold place) unless the PC claims it first (racing clock 4)
  nothing_weight: 2
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.betrayal
  'on': commitment.*.violated
  family: fam.betrayal
  candidates:
  - id: wronged_tells
    specificity: npc
    weight: 3
    writes:
    - the wronged party's standing -2; a rumor (eyewitness) in its home scope; reputation conduct.loyalty:- or honesty:- in
      that scope
  nothing_weight: 1
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.victory_over_pc
  'on': victory_over_pc
  candidates:
  - id: victor_boasts
    specificity: pc_deed
    weight: 3
    writes:
    - a rumor (boast) in the victor's scope
  - id: victor_hunts
    specificity: pc_deed
    weight: 1
    requires: the victor's Nemesis result is nem.grudge or nem.hunts
    writes:
    - the hunt clock (09.9.3)
  nothing_weight: 2
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.faction_lost_hold
  'on': fac.*.hold
  candidates:
  - id: rival_presses
    specificity: faction
    weight: 3
    requires: a rival at <= -2
    writes:
    - the rival's next action is strike against it (if eligible)
  - id: members_waver
    specificity: faction
    weight: 1
    writes:
    - 'one officer''s member_of is in doubt: courtable by any faction for a season'
  nothing_weight: 2
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.linchpin_dead
  'on': npc.*.exists=dead (a linchpin)
  candidates:
  - id: succession_bang
    specificity: npc
    weight: 2
    requires: the PC met the linchpin
    writes:
    - 'a social bang: the successor sends for the PC (an offer or a warning)'
  nothing_weight: 1
  immediate: true
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.reputation_score3
  'on': pc.reputation.*.score>=3
  candidates:
  - id: petitioner
    specificity: pc_deed
    weight: 3
    writes:
    - 'an opportunity bang: someone in the scope asks the PC''s help because of what they are known for (a hook keyed to the
      entry''s key)'
  - id: challenger
    specificity: pc_deed
    weight: 1
    requires: the entry's key is deed.martial
    writes:
    - 'a social bang: a challenger seeks the PC out'
  nothing_weight: 1
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.rumor_believed
  'on': rumor_reached_seat.* (a rumor about a faction's rival reaches its seat)
  candidates:
  - id: acts_on_it
    specificity: faction
    weight: 2
    writes:
    - the faction's relation toward the rival -1, as if the rumor were known, never below -2 by rumor (11.3.14); its next strike or scheme targets that rival
    cooldown: 'once a season per faction toward one rival (rumor_acted.<rival> on the faction) [revision: I-080]'
  nothing_weight: 3
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.holding_acquired
  'on': loc.*.owner=pc
  candidates:
  - id: neighbors_call
    specificity: npc
    weight: 2
    writes:
    - 'a social bang: the neighbors call (one asks a favor)'
  - id: seat_faction_taxes
    specificity: faction
    weight: 2
    writes:
    - the seat faction asks a fee or a service (a commitment offered)
  nothing_weight: 2
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.situation_concluded
  'on': sit.*.status=concluded
  candidates:
  - id: aftermath_hook
    specificity: region
    weight: 3
    writes:
    - a hook from the end state's loose end (who profits, who grieves)
  nothing_weight: 1
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
- id: wr.cache_sighting
  'on': clk.cache.*.ticked
  candidates:
  - id: cache_rumor
    specificity: pc_deed
    weight: 1
    writes:
    - a rumor (trace, true) pointing to the cache's place
  nothing_weight: 0
  immediate: true
  lifecycle: provisional
  basis:
  - 11 (world_turn.reactions)
situation_templates:
- id: sit_t.feud
  name: The feud
  roles:
  - house_a
  - house_b
  cadence: week
  steps:
  - n: 1
    at: 1 week
    key_delta: an insult or a theft between the houses (a fact)
    trace: hard words at the market
    prevented_by: []
  - n: 2
    at: 3 weeks
    key_delta: a beating or a burned barn; relation -1
    trace: a barn burns
    prevented_by:
    - the houses meet under a truce (a fact)
  - n: 3
    at: 6 weeks
    key_delta: a death; relation -3
    trace: a funeral and a vow
    prevented_by:
    - the first wrong is repaired
  - n: 4
    at: 10 weeks
    key_delta: one house loses hold or leaves the region
    trace: a farm stands empty
    prevented_by:
    - reconcile (T-11-17)
  end_state: one house gone; the other strong
  if_prevented: relations set to -1; a wedding or a pact
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.sickness
  name: The sickness
  roles:
  - settlement
  - source
  cadence: day
  steps:
  - n: 1
    at: 3 days
    key_delta: the first sick (a fact)
    trace: a door marked with chalk
    prevented_by: []
  - n: 2
    at: 10 days
    key_delta: 'a quarantine: the settlement''s route links closed to spread (11.6.5)'
    trace: the gate shut to strangers
    prevented_by:
    - the source found and cleansed
  - n: 3
    at: 21 days
    key_delta: deaths; the settlement's lifestyle costs one rung higher
    trace: the death-cart
    prevented_by:
    - a cure brought (a thread)
  - n: 4
    at: 42 days
    key_delta: the settlement half empty; its seat faction loses hold
    trace: empty streets
    prevented_by:
    - cleanse (T-11-17)
  end_state: 'a phenomenon: the sickness endemic in the region (confirmed)'
  if_prevented: the sickness lifts; whoever helped is admired
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.road_of_knives
  name: The road of knives
  roles:
  - outlaws
  - road
  cadence: week
  steps:
  - n: 1
    at: 1 week
    key_delta: a wagon robbed on the road; route danger +1 rung
    trace: a looted wagon in the ditch
    prevented_by: []
  - n: 2
    at: 3 weeks
    key_delta: the caravans stop; prices in the road's towns one notch up
    trace: no wagons at the market
    prevented_by:
    - the outlaws' camp broken
  - n: 3
    at: 6 weeks
    key_delta: the outlaws hold a toll-point (a hold place)
    trace: a toll-chain across the road
    prevented_by:
    - the toll-point retaken
  end_state: the outlaws a tier-1 faction holding the road
  if_prevented: the road safe; trade back; route danger restored
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.succession
  name: The succession
  roles:
  - faction
  - claimants
  cadence: week
  steps:
  - n: 1
    at: 1 week
    key_delta: two claimants named (officers)
    trace: two banners in the hall
    prevented_by: []
  - n: 2
    at: 4 weeks
    key_delta: 'the faction''s actions split: its goal clock paused'
    trace: the hall divided at meat
    prevented_by:
    - one claimant withdraws or dies
  - n: 3
    at: 8 weeks
    key_delta: a strike between the claimants' followers; hold lost
    trace: blood in the courtyard
    prevented_by:
    - a council decides (a social scene)
  end_state: one claimant heads it; the other leaves with followers (a new petty faction)
  if_prevented: a claimant heads it; the faction recovers hold
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.hunger
  name: The hunger
  roles:
  - settlement
  cadence: week
  steps:
  - n: 1
    at: 1 week
    key_delta: grain prices two notches up
    trace: long queues at the bakery
    prevented_by: []
  - n: 2
    at: 4 weeks
    key_delta: a riot; the seat faction loses hold
    trace: broken shutters
    prevented_by:
    - grain brought (a thread)
  - n: 3
    at: 8 weeks
    key_delta: families leave; the settlement's lifestyle one rung costlier
    trace: carts heading out
    prevented_by:
    - the harvest saved
  end_state: the settlement diminished for a year
  if_prevented: prices fall; the helpers admired
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.hunting_ground
  name: The hunting ground
  roles:
  - beast
  - area
  cadence: week
  steps:
  - n: 1
    at: 1 week
    key_delta: livestock taken; area danger +1 rung
    trace: a savaged ewe
    prevented_by: []
  - n: 2
    at: 3 weeks
    key_delta: a herder killed
    trace: a funeral; nobody grazes the high fields
    prevented_by:
    - the beast slain or driven off
  - n: 3
    at: 6 weeks
    key_delta: 'the area''s farms abandoned; a hook: a bounty'
    trace: empty steadings
    prevented_by:
    - the beast slain or driven off
  end_state: the area deadly until the beast is slain
  if_prevented: the area restored
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.the_rite
  name: The rite
  roles:
  - cult
  - place
  - moon
  cadence: day
  steps:
  - n: 1
    at: 7 days
    key_delta: the cult gathers components (a theft)
    trace: a stolen bell, a missing sheep
    prevented_by: []
  - n: 2
    at: 14 days
    key_delta: a captive taken for the rite
    trace: a girl missing from the mill
    prevented_by:
    - the components recovered
  - n: 3
    trigger: moon.phase=new after step 2
    key_delta: 'the rite done: the thing is woken (a new situation or adversary)'
    trace: the hill burns cold at night
    prevented_by:
    - the captive freed and the rite site broken
  end_state: what was woken walks
  if_prevented: the cult's hold lost twice; its leader exposed
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.war_comes
  name: War comes
  roles:
  - attacker
  - defender
  cadence: week
  steps:
  - n: 1
    at: 1 week
    key_delta: relations -3 (war); a muster
    trace: the levy called
    prevented_by: []
  - n: 2
    at: 4 weeks
    key_delta: a battle (11.3.15) between their forces in the region
    trace: smoke on the horizon
    prevented_by:
    - a truce brokered
  - n: 3
    at: 10 weeks
    key_delta: the loser loses a hold place; refugees
    trace: refugees on the road
    prevented_by:
    - a truce brokered
  end_state: a new border; a holding or village changes hands
  if_prevented: relations -1; a truce feast
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.flood_and_fire
  name: Flood or fire
  roles:
  - place
  cadence: day
  steps:
  - n: 1
    at: 2 days
    key_delta: the river rises or the dry woods smoke; a route closed
    trace: the ford impassable
    prevented_by: []
  - n: 2
    at: 5 days
    key_delta: a holding or a farm damaged (damage clock +4)
    trace: a roof floating downstream
    prevented_by:
    - levees raised or firebreaks cut (a group beat)
  - n: 3
    at: 10 days
    key_delta: the route remade (shorter, longer, or a new crossing needed)
    trace: a new channel
    prevented_by: []
  end_state: 'the map changed: a route link altered'
  if_prevented: the damage limited; the workers admired
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.the_debt
  name: The debt
  roles:
  - creditor
  - debtor
  cadence: week
  steps:
  - n: 1
    at: 2 weeks
    key_delta: the creditor demands payment
    trace: a bailiff at the door
    prevented_by:
    - paid
  - n: 2
    at: 5 weeks
    key_delta: the debtor's property seized (a holding or goods)
    trace: goods carted away
    prevented_by:
    - paid or forgiven
  end_state: the debtor ruined; the creditor stronger
  if_prevented: a grateful debtor
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.the_missing
  name: The missing
  roles:
  - missing_person
  - taker
  cadence: day
  steps:
  - n: 1
    at: 1 day
    key_delta: someone is missing (a fact)
    trace: a mother asking at every door
    prevented_by: []
  - n: 2
    at: 7 days
    key_delta: a ransom demand or a body
    trace: a note pinned to the well
    prevented_by:
    - found
  end_state: the missing one lost or dead
  if_prevented: found; the finder owed
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.festival_trouble
  name: Trouble at the festival
  roles:
  - festival
  - troublemaker
  cadence: day
  steps:
  - n: 1
    at: the festival's eve
    key_delta: a plot laid (sealed)
    trace: strangers buying lamp oil
    prevented_by: []
  - n: 2
    at: the festival
    key_delta: 'the plot springs: a theft, a fire, a killing'
    trace: a scream in the square
    prevented_by:
    - the plot uncovered
  end_state: the festival ruined; its faction loses hold
  if_prevented: the festival saved; the PC its hero for a year
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.cursed_ground
  name: The cursed ground
  roles:
  - place
  - curse
  cadence: week
  steps:
  - n: 1
    at: 1 week
    key_delta: the place's resonance turned; animals avoid it
    trace: birds silent over the field
    prevented_by: []
  - n: 2
    at: 4 weeks
    key_delta: the place a site (10) with spectral or blighted occupants
    trace: lights at night
    prevented_by:
    - cleanse (T-11-17)
  end_state: a haunted site for good
  if_prevented: the ground cleansed
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.the_prisoner
  name: The prisoner
  roles:
  - captor
  - captive
  cadence: week
  steps:
  - n: 1
    at: 1 week
    key_delta: the captive moved to the captor's hold
    trace: a closed cart on the road at night
    prevented_by: []
  - n: 2
    at: 4 weeks
    key_delta: a trial, a sale or a sacrifice set for a date (a commitment)
    trace: a proclamation
    prevented_by:
    - freed
  - n: 3
    at: 6 weeks
    key_delta: the captive's fate done
    trace: the gallows used
    prevented_by:
    - freed
  end_state: the captive lost
  if_prevented: freed; the captor shamed
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.scandal
  name: The scandal
  roles:
  - faction
  - exposed
  cadence: week
  steps:
  - n: 1
    at: 1 week
    key_delta: the secret is news in the seat
    trace: whispers in the hall
    prevented_by: []
  - n: 2
    at: 3 weeks
    key_delta: 'the exposed one expelled or defended: the faction loses hold either way'
    trace: a door slammed on a name
    prevented_by:
    - the accusation disproved
  end_state: the faction weakened; a rival gains
  if_prevented: the faction steadied
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
- id: sit_t.the_enemy
  name: The enemy
  roles:
  - enemy
  - pc
  cadence: week
  steps:
  - n: 1
    at: 2 weeks
    key_delta: the enemy learns where the PC is
    trace: a familiar face in the crowd, gone
    prevented_by: []
  - n: 2
    at: 5 weeks
    key_delta: 'the enemy acts: a threat bang (pc_deed)'
    trace: a message in the old cipher
    prevented_by:
    - the enemy dealt with
  end_state: the enmity in the open
  if_prevented: the enmity settled
  lifecycle: provisional
  basis:
  - 11 (world_turn.situation_templates)
traces:
- change: hidden or sensed goal clock ticks
  trace: one omen of its stage
- change: faction goal completes
  trace: news in its seat; a rumor (official) where it acts; a visible change
- change: strike succeeds
  trace: a rumor (eyewitness) in both seats; a visible change at the struck place
- change: hold or place changes hands; collapse; war begun or ended
  trace: news in the region; a visible change
- change: situation step fires
  trace: its trace as news in its place; a rumor (hearsay) one step beyond
- change: linchpin fate
  trace: news in the faction's seat; a rumor (hearsay) in the region
- change: noteworthy public_deed of the PC
  trace: a rumor (eyewitness) in each carrier scope
- change: recognition staged before witnesses
  trace: a rumor (eyewitness) in each witness scope
- change: victory_over_pc
  trace: a rumor (boast if nem.boast, else eyewitness) in the victor's scope
- change: belief pc.dead
  trace: a rumor (official, false) in the victor's faction scope and seat
- change: cache clock ticks or disperses
  trace: a rumor (trace, true) pointing to the place or holder
- change: seasonal phenomenon begins
  trace: news in the region
- change: world change of a great project
  trace: news in its scope; a visible change
spread:
- from: origin settlement
  to: each neighbor settlement
  takes: 1 World Turn
  condition: an open route link of <= 8 travel watches
- from: settlements
  to: region
  takes: 2 World Turns after it is in two settlements of the region; 1 if in the region's largest settlement
- from: region
  to: realm
  takes: 4 World Turns after it reached the region
  condition: news; tier-3+ faction rumors; war; collapse; linchpin; PC deeds once the PC's reputation in the region is >=
    4
- beyond: 2 steps from origin
  rule: arrives as a new rumor, source hearsay, truth re-rolled and never truer than the original
- stops: 8 weeks after birth or 4 steps from origin
  fades: 8 weeks after it stops
tbl.11.rumor_truth:
  die: d10
  rows:
    eyewitness:
      'true': 1-6
      partial: 7-9
      'false': '10'
    official:
      'true': 1-5
      partial: 6-9
      'false': '10'
    hearsay:
      'true': 1-4
      partial: 5-7
      'false': 8-10
    boast:
      'true': 1-2
      partial: 3-7
      'false': 8-10
    legend:
      'true': 1-3
      partial: 4-7
      'false': 8-10
    planted:
      partial: 9-10
      'false': 1-8
      note: a planted rumor that is in fact so is true
    trace:
      'true': 1-10
  outdated: true or partial becomes outdated when its fact is superseded; nothing else changes truth
tbl.11.distortion:
  die: d6
  results:
  - range: '1'
    field: who
    form: credited to someone else, or the victim is wrong
  - range: '2'
    field: where
    form: another place
  - range: '3'
    field: when
    form: a month ago, or 'tonight'
  - range: '4'
    field: how_many
    form: doubled or halved
  - range: '5'
    field: why
    form: a motive invented
  - range: '6'
    field: what
    form: the deed inverted (rescued -> kidnapped)
  false_rule: a false rumor carries form 1 or 6 (re-roll others), or is a plain falsehood if planted
tbl.11.epithet_forms:
  die: d8
  rules:
  - names what was done, never a calling name or a rules term
  - only nouns the deed line or the place supplies
  - one per entry; at most three in use
  results:
  - range: '1'
    form: the <noun of the deed>
    example: the Ford-Warden
  - range: '2'
    form: <place>'s <noun>
    example: Ashford's Arrow
  - range: '3'
    form: <adjective>-<noun> (a kenning)
    example: Quiet-Match
  - range: '4'
    form: the one who <did it>
    example: the one who held the ford
  - range: '5'
    form: <name> <byname>
    example: Wren Two-Fires
  - range: '6'
    form: a mocking form (despised valence) or a fond diminutive (admired)
    example: Wren Run-Away / little Wren of the ford
  - range: '7'
    form: <name> of <place>
    example: Wren of the Tangle
  - range: '8'
    form: the community's own word for what it fears or loves
    example: the Coal-Witch
tbl.11.hook:
  die: d20
  context: the region's terrain and the PC's current settlement tier; a region's seed replaces per region
  results:
  - range: '1'
    seed: a child missing since the last market day
    template: sit_t.the_missing
  - range: '2'
    seed: a bell rings under the millpond on still nights
    kind: question
  - range: '3'
    seed: a merchant pays well for an escort through the hills
    kind: quest
  - range: '4'
    seed: the old tower has smoke from its chimney again
    kind: question
  - range: '5'
    seed: two families quarrel over a boundary stone
    template: sit_t.feud
  - range: '6'
    seed: a stranger asks after the PC by name
    template: sit_t.the_enemy
  - range: '7'
    seed: sheep found savaged on the high fields
    template: sit_t.hunting_ground
  - range: '8'
    seed: a shrine's lamp has gone out and the keeper is gone
    kind: question
  - range: '9'
    seed: a debtor begs help against a creditor
    template: sit_t.the_debt
  - range: '10'
    seed: a map sold cheap at the market, half burned
    kind: place
  - range: '11'
    seed: the river is rising and the levee is old
    template: sit_t.flood_and_fire
  - range: '12'
    seed: a prisoner in the reeve's cell swears he is innocent
    template: sit_t.the_prisoner
  - range: '13'
    seed: a festival is coming and someone is buying lamp oil by the barrel
    template: sit_t.festival_trouble
  - range: '14'
    seed: a cough spreading in the poor quarter
    template: sit_t.sickness
  - range: '15'
    seed: a hunter came back from the deep wood and will not speak
    kind: question
  - range: '16'
    seed: a road-warden's horse came home without him
    template: sit_t.road_of_knives
  - range: '17'
    seed: an heir has come home to claim a ruined hall
    kind: quest
  - range: '18'
    seed: a cult symbol chalked on the chapel door
    template: sit_t.the_rite
  - range: '19'
    seed: a guild offers a reward for a rival's ledger
    kind: quest
  - range: '20'
    seed: a famous name in the chronicle has a grave nobody tends
    kind: place
tbl.11.fallback_form:
  die: d8
  results:
  - range: '1'
    form: a witness seeks the PC out
  - range: '2'
    form: the opposition acts and leaves evidence
  - range: '3'
    form: a new victim
  - range: '4'
    form: a messenger with a demand
  - range: '5'
    form: the patron's impatience (an officer comes asking)
  - range: '6'
    form: an object turns up
  - range: '7'
    form: a rival claims the prize
  - range: '8'
    form: a rumor sharpens (a new rumor, true, pointing to the core placement)
tbl.11.land_changes:
  die: d6
  rule: 'tbl.twist_s5 row 8 (12): new_situation(template, region)'
  results:
  - range: '1'
    template: sit_t.road_of_knives
    note: a road closes
  - range: '2'
    template: sit_t.flood_and_fire
    note: a bridge falls
  - range: '3'
    template: sit_t.war_comes
    note: war reaches the region
  - range: '4'
    template: sit_t.sickness
    note: a plague
  - range: '5'
    template: sit_t.flood_and_fire
    note: a flood
  - range: '6'
    template: sit_t.hunger
    note: a famine
phenomena:
- id: ph.hard_winter
  effects:
  - 'route links: winter danger +1 rung'
  - supply costs one notch up
  confirm_when: never
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
- id: ph.bandit_summer
  effects:
  - route links danger +1 rung
  - a situation sit_t.road_of_knives
  confirm_when: its situation concluded with no PC intervention
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
- id: ph.good_harvest
  effects:
  - food one notch cheaper
  - petty factions' d6 +1 for the season
  confirm_when: never
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
- id: ph.late_frost
  effects:
  - farmsteads yield no supply this season
  confirm_when: never
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
- id: ph.cattle_sickness
  effects:
  - a situation sit_t.sickness among herds
  - meat one notch dearer
  confirm_when: its situation concluded with no PC intervention (endemic)
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
- id: ph.comet_year
  effects:
  - arcane and divine factions' goal checks +1
  - a festival of omens
  - rumor surge each month
  confirm_when: never
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
- id: ph.pilgrimage
  effects:
  - faith factions' sway checks +1
  - 'the roads busy: route danger -1 rung near shrines'
  confirm_when: never
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
- id: ph.war_levy
  effects:
  - crown factions' force +1 for the season
  - hireling wages one notch up
  confirm_when: a war situation in the region concluded
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
- id: ph.fever_season
  effects:
  - a situation sit_t.sickness in the largest settlement
  confirm_when: its situation concluded with no PC intervention
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
- id: ph.drought
  effects:
  - wetland and river routes easier
  - 'hunger: sit_t.hunger in one village'
  confirm_when: never
  lifecycle: provisional
  basis:
  - 11 (world_turn.phenomena)
tbl.11.season_events.spring:
  die: d12
  results:
  - range: 1-2
    phenomenon: ph.late_frost
  - range: '3'
    phenomenon: ph.pilgrimage
  - range: '4'
    phenomenon: ph.fever_season
  - range: 5-6
    situation: sit_t.flood_and_fire
  - range: '7'
    situation: sit_t.feud
  - range: 8-12
    result: nothing remarkable
tbl.11.season_events.summer:
  die: d12
  results:
  - range: 1-2
    phenomenon: ph.bandit_summer
  - range: '3'
    phenomenon: ph.drought
  - range: '4'
    phenomenon: ph.comet_year
  - range: '5'
    situation: sit_t.war_comes
  - range: '6'
    situation: sit_t.hunting_ground
  - range: '7'
    situation: sit_t.festival_trouble
  - range: 8-12
    result: nothing remarkable
tbl.11.season_events.autumn:
  die: d12
  results:
  - range: 1-2
    phenomenon: ph.good_harvest
  - range: '3'
    phenomenon: ph.cattle_sickness
  - range: '4'
    phenomenon: ph.war_levy
  - range: '5'
    situation: sit_t.the_debt
  - range: '6'
    situation: sit_t.the_rite
  - range: '7'
    situation: sit_t.succession
  - range: 8-12
    result: nothing remarkable
tbl.11.season_events.winter:
  die: d12
  results:
  - range: 1-3
    phenomenon: ph.hard_winter
  - range: '4'
    phenomenon: ph.fever_season
  - range: '5'
    situation: sit_t.hunger
  - range: '6'
    situation: sit_t.the_missing
  - range: '7'
    situation: sit_t.hunting_ground
  - range: 8-12
    result: nothing remarkable
tbl.11.local_events:
  die: d12
  rule: chapter 10's V face (local event) uses tbl.<region>.events if 13 provides one, else this table, else 12's tbl.event_focus
  results:
  - range: '1'
    result: a traveler with news (the newest news item of the region)
  - range: '2'
    result: a faction's people pass on its business (a full faction in the region, by list weight)
  - range: '3'
    result: a sign of a situation's next step (its trace)
  - range: '4'
    result: a rumor told around a fire (tbl.11.rumors for the region)
  - range: '5'
    result: an omen of a hidden clock (no tick; a repeat of its last omen)
  - range: '6'
    result: a peddler or a pilgrim (trade; one rumor)
  - range: '7'
    result: 'someone in trouble (a hook: tbl.11.hook)'
  - range: '8'
    result: the weather turns (10's shift table)
  - range: '9'
    result: a grave, cairn or statue of the chronicle (a place of a legend if one is near)
  - range: '10'
    result: a faction's courier (an opportunity if any faction is at +2)
  - range: '11'
    result: tracks of something passing (the region's encounter table, omen only)
  - range: '12'
    result: 12's tbl.event_focus
tbl.11.rumors:
  rule: 'draws among the rumors circulating in the scope: weight 3 if born in the last two weeks, 2 in the last month, 1 otherwise;
    recency'
thread_ranks:
- rank: troublesome
  clock: 4
  deeds_points: 1
- rank: dangerous
  clock: 6
  deeds_points: 2
- rank: formidable
  clock: 8
  deeds_points: 3
- rank: extreme
  clock: 12
  deeds_points: 4
- rank: epic
  clock: 12
  linked_second: 12
  deeds_points: 5
thread_progress:
  tick_sources:  # `on` quoted, as in reactions [verification: V2c-008]
  - 'on': serving_beat
    ticks: delivered_reach
  - 'on': core_clue_found
    ticks: 1
  - 'on': milestone
    ticks: 2
  - 'on': random_event
    ticks: 1
    condition: never the last segment
  flashpoints:
  - first reaches half
  - first reaches imminent (remaining <= max(1, size / 4))
thread_lifecycle:
  seeded_expires: 8 weeks
  active_unprogressed_expires: 13 weeks, unless protected (progressed in the last 12 scenes) or a vow
  vows_expire: false
  fallback_trigger_scenes: 3
thread_sources:
- source: creation's long vow (02.9.1)
  kind: vow
  rank: formidable
  opposing: none
  fallback: a person from the PC's past
- source: restitution (04.9.4)
  kind: quest
  rank: dangerous
  opposing: none
  fallback: the wronged party's kin seek the PC out
- source: the Bargain's debt (07.5.5)
  kind: vow
  rank: as the ask
  opposing: clk.deaths_debt (countdown 8, +1/week)
  fallback: the curse's next stage shows itself
- source: a dread obsession (07.11)
  kind: quest
  rank: dangerous
  opposing: none
  fallback: the haunt's object appears
- source: an ally's personal thread (16.12)
  kind: quest
  rank: dangerous
  opposing: per its want
  fallback: a person from the ally's past
- source: a vow at an ally's death (16.9.5)
  kind: vow
  rank: dangerous
  opposing: none
  fallback: the dead ally's kin or killer
- source: a rite's condition or a spirit's bargain (05)
  kind: quest
  rank: troublesome or dangerous
  opposing: the rite's window
  fallback: the spirit's reminder
- source: a case (15.9)
  kind: quest
  rank: by the case
  opposing: the case's opposition clock
  fallback: the case's fallbacks
- source: a faction's commission (paid at 08.8.8's job fee for its band, economy.yaml#job_fees) [revision: I-091]
  kind: quest
  rank: by the job
  opposing: the rival's goal clock when it races
  fallback: the patron's impatience
- source: a cache to recover (07.6.4)
  kind: quest
  rank: troublesome
  opposing: clk.cache (6, +1/week)
  fallback: a cache rumor sharpens
- source: a bequest (11.13.6)
  kind: as the original
  rank: as the original
  opposing: as the original, stopped one short of completion in the timeskip
  fallback: as the original
world_changes:
- id: wc.found
  changes: a new settlement, waystation or holding
  writes:
  - 'a new place (10.1); safe: true if garrisoned'
  - a petty faction of its people at tier 0, Warm toward the PC
  reputation: +2 points, key of the project
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
- id: wc.connect
  changes: a road, bridge, ferry or pass
  writes:
  - a new route link, or an existing one shortened by a third (round down), or passable in winter
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
- id: wc.pacify
  changes: an area made safe for good
  writes:
  - danger rating -1 rung permanently (never below settled)
  - home band -1 where a hold stands
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
- id: wc.reconcile
  changes: a feud ended
  writes:
  - the parties' relations set to -1 (or as agreed)
  - the feud situation defused
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
- id: wc.raise
  changes: a faction lifted
  writes:
  - it gains hold
  - stage rising if it was declining
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
- id: wc.topple
  changes: a faction brought down
  writes:
  - it loses hold twice
  - stage declining
  - a linchpin's exposed fate if the project exposed one
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
- id: wc.reform
  changes: a law or custom changed
  writes:
  - a regional fact
  - each faction's status toward the PC +1 if its values admire the reform, -1 if they despise it
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
- id: wc.establish
  changes: an institution founded
  writes:
  - a faction from the template of its org_tags at tier 0, rising, the PC its head (11.9.8)
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
- id: wc.cleanse
  changes: a cursed, haunted or fouled place set right
  writes:
  - its situation defused
  - its cursed fact or turned resonance removed
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
- id: wc.restore
  changes: a ruin made whole
  writes:
  - safe restored
  - its owner named
  - a cleared site made a settlement or a hold
  lifecycle: provisional
  basis:
  - 11 (world_turn.world_changes)
