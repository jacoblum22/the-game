improvement_caps:
  below_manor: 3
  manor_or_keep: 6
holdings_yield:
  check: d20 + steward modifier (+2 lever if managed_this_week) vs Moderate 15 (Hard 20 while a situation or Hostile attention
    is active in its settlement)
  steward_modifier:
    hired_skilled_hand: 3
    hired_specialist: 5
    ally: its own Presence + competence on deed.influence.trade
    pc: the PC's base modifier on deed.influence.trade, if managed this week
  by_degree:
    critical_success: the higher of two rolls of 08's yield dice
    success: one roll
    failure: the lower of two rolls
    critical_failure: nothing; a trouble bang (social, 1, npc)
  absentee_snag: -2 after a season with no managed_this_week
  strike_defense: 10 + 2 x garrison + 2 x PC domain tier (+2 walls)
  damage_clock:
    segments: 6
    visibility: public
    strike_success: 2
    strike_critical: 4
    repair_week: -2
    unpaid_upkeep_week: 1
bangs:
  default_intensity_delta:
    threat: 3
    social: 1
    opportunity: 0
  specificity_order:
  - pc_deed
  - npc
  - faction
  - region
  - generic
  default_expiry: 4 weeks
  queue_cap: 6
  fallback_fires: next scene_start (12.8.4)
