# data/gen_absorb.yaml
# Purpose: the generator domain `gen.absorb` (00.11): the calling-gated monster-power absorption trait
#   ("Blue Mage"). Only a holder of lic.call.taking (granted by call.devourer, 04.10) may run it. The source
#   creature's tags gate a small pool of natural powers; the manner of the defeat picks the fill; the Taking
#   check's degree sets Greater or nothing. The output is ONE absorbed power, written to the Devourer's LIBRARY;
#   powers are used only while slotted in the `acquired` partition (ch.05).
# Owner: 04-recognition-and-growth (T-00-19). Rules: 04.10 (trigger, cap, cost, failure), PR-04-9.
# Schema: data/SCHEMAS.md#gen_absorbyaml (the gen_*.yaml schema). Optional keys added by ch.04 (T-04-9):
#   requires, trigger, taking_check, caps, costs, failure, banes, evidence; per PoolEntry: name, activation,
#   cost, limits, bias, text (literal, positive-scoped: SG-15).
# Every effect below is a core effect of data/effects.yaml with parameters; none is new.
# Ids: pool entries are abilities (prefix ab.) with slot_class acquired; ch.05 mirrors them into abilities.yaml
#   by reference and may not change their effects (04 Interface requests).
# Archetypes (ch.09) attach: `absorbable.pool_gate_tags` (default: the archetype's creature_tags),
#   `absorbable.cannot_absorb [id]`, and `signature_of` on at most one entry here per archetype.
# Basis: [C:P5 "Blue Mage ... a class-gated special capability"] [00.11] [R2 4e, #42, #43, #47, gap 1]
#   [R3 04.18 library + cannot-copy] [R6 A-28, V13] [R: src/ability_pool.py (shape kept, content replaced)]
#   [R: https://finalfantasy.fandom.com/wiki/Learning (witness the action; survive; win the fight)]
#   [DL-04-19, DL-04-20, DL-04-21]

schema_version: 1
lifecycle: provisional
domain: gen.absorb
output_kind: ability

requires: {license: lic.call.taking, calling: call.devourer, not_suspended: true}

trigger:                            # all must hold; engine-checked except the circumstance enum
  event: on_defeat
  conditions:
    - "the defeat is RESOLVED: it carries the frame id of the PC's own declared beat or ability (03.3.2 D3); a narrated kill generates nothing"
    - "the creature's archetype has an absorbable pool with at least one entry left after the pool gate"
    - "the PC perceived the creature act in this scene (a witnessed attack, ability or movement mode: a fact or frame in the scene log)"
    - "the Taking is declared before scene_end, or within 1 interval of the defeat, while the body (or the yielded creature) is within band.engaged"
    - "no Taking has been attempted on this creature (one attempt per creature)"
    - "no Taking has succeeded since the PC's last rest_long (limits: {per: rest_long, uses: 1})"

circumstances:                      # the fill-quality circumstance: HOW the character engaged it [J:enum]
  - {id: decisive, true_only_when: "the PC's own resolved success defeated the creature in a fight in which the PC was never Staggered or Dying", false_for: "a foe finished by an ally, a hazard or a companion; any fight in which the PC was Staggered"}
  - {id: narrow_survival, true_only_when: "the PC's own resolved success defeated it AND during the conflict the PC was Staggered or Dying, or the defeating frame was lethal", false_for: "a hard fight the PC came through above 0 Vitality with no lethal frame"}
  - {id: merciful, true_only_when: "the creature yielded or was subdued alive by the PC's own resolved beat and is spared (a mercy fact is written); the power is taken as a gift", false_for: "a creature that is bound and then killed; a creature too mindless to yield (creature.undead.mindless, creature.construct, creature.horror.ooze)"}
  - {id: scavenged, default: true, true_only_when: "none of the above: found dead, killed by another, or the manner is uncertain", false_for: "any defeat by the PC's own resolved beat"}

fill_map:
  - {circumstance: decisive, fill_method: signature}
  - {circumstance: narrow_survival, fill_method: biased, bias_tag: ward}
  - {circumstance: merciful, fill_method: chosen}
  # scavenged has no fill: the trigger refuses the Taking before any check (04.10.2), so generate() is never called with it

quality_rungs:
  - {id: taken, signature_slots: 1, magnitude_slots: 0}     # one power: the source's signature
  - {id: echo, signature_slots: 0, magnitude_slots: 1}      # one power: drawn or chosen from the gated pool

quality_map:                        # degree = the Taking check's degree; failures generate nothing (failure block)
  - {circumstance: decisive, degree: critical_success, quality_rung: taken}
  - {circumstance: decisive, degree: success, quality_rung: taken}
  - {circumstance: narrow_survival, degree: critical_success, quality_rung: echo}
  - {circumstance: narrow_survival, degree: success, quality_rung: echo}
  - {circumstance: merciful, degree: critical_success, quality_rung: echo}
  - {circumstance: merciful, degree: success, quality_rung: echo}

degree_effects: {critical_success: greater, critical_failure: none}
tier_rule:
  signature: "min(tier_cap of the source's threat band, calling tier + 1)"
  magnitude: "min(tier_cap - 1, calling tier + 1), minimum 1"
  greater: "+1 tier, at most tier_cap + 1 and at most calling tier + 2"
  held_power: "an absorbed power keeps the tier it was taken at; taking the same power again at a higher tier REPLACES it (restated, never stacked: INV-13)"
recency_window: 5
slot_cap: 1                         # one power per Taking

taking_check:                       # a frame like any other (01); the player sees the OFFER and may withdraw
  verb: verb.endure
  attribute: resolve
  deed_tag: deed.lore.bestiary.monsters      # knowing what it is is how it is taken; competence from the calling applies
  dc_source: "effect DC by the creature's threat band tier: T1 Easy, T2 Moderate, T3 Hard, T4 Very hard, T5 Legendary (00.3.8)"
  stakes: "Risky when the creature's threat band <= power_band + 1; Dire when higher; never lethal"
  reach: standard
  action_cost: "1 action in a conflict; otherwise 1 interval"
  on_degree:
    critical_success: "generate with Greater"
    success: "generate"
    failure: "nothing is taken; the declared cost applies (failure block); no second attempt on this creature"
    critical_failure: "as failure, cost one severity rung higher, and the creature family's bane attaches until the next rest_long"

costs:
  focus: 2                          # spent on declaring the Taking, whatever the degree (activation cost, 00.3.13)
  slot: "a slotted power occupies one slot of the acquired partition (ch.05; reference 4)"
  bane: "while ANY power of a creature branch is slotted, that branch's bane applies (banes below); one instance per branch (INV-13)"

caps:
  library: {by_calling_tier: [4, 6, 8, 10, 12]}       # powers known; at the cap a new power must replace one
  slotted: "the free slots of the acquired partition (ch.05)"
  reslot: {at: rest_long, cost: none}                  # the active set changes only at a long rest
  per_day: 1                                           # successful Takings per rest_long
  per_creature: 1                                      # attempts

failure:
  cost_forms_allowed: [cost.harm, cost.drain]          # 01's cost menu; severity from stakes and degree (01 READ table)
  cost_harm_tags: "the creature's own first harm tag, else harm.blight.necrotic"
  never: ["a power the output does not hold", "a permanent loss", "death (the frame is never lethal)"]

evidence: {primary_tag: deed.lore.bestiary.monsters, note: "the Taking is the PC's declared beat and records as any deed (03); cnt.focus credits the same tag"}

banes:                              # the qualitative tax (R2 #47): applied while a power of the branch is slotted
  - {branch: creature.beast, effect: {effect_id: eff.status_modifier, params: {amount: -2, applies_when: "verb in [verb.talk, verb.handle] and target_tags under creature.beast"}}, text: "Beasts scent a rival in you: -2 on Talk and Handle with beasts."}
  - {branch: creature.undead, effect: {effect_id: eff.harm_vulnerability, params: {factor: 2, harm_tags: [harm.radiance]}}, text: "Double radiant harm you take."}
  - {branch: creature.spirit, effect: {effect_id: eff.harm_vulnerability, params: {factor: 2, harm_tags: [harm.arcane.raw]}}, text: "Double raw arcane harm you take."}
  - {branch: creature.fiend, effect: {effect_id: eff.harm_vulnerability, params: {factor: 2, harm_tags: [harm.radiance.holy]}}, text: "Double holy harm you take; sacred wards and exorcisms treat you as a fiend."}
  - {branch: creature.construct, effect: {effect_id: eff.harm_vulnerability, params: {factor: 2, harm_tags: [harm.storm.lightning]}}, text: "Double lightning harm you take."}
  - {branch: creature.elemental, effect: {effect_id: eff.harm_vulnerability, params: {factor: 2, harm_tags: ["the entry's opposed harm tag"]}}, text: "Double harm of the element opposed to the power you carry (named on the entry)."}
  - {branch: creature.dragon, effect: {effect_id: eff.status_modifier, params: {amount: -2, applies_when: "verb = verb.sneak"}}, text: "The heat and the smell of it are hard to hide: -2 on Sneak."}
  - {branch: creature.horror, effect: {effect_id: eff.harm_vulnerability, params: {factor: 2, harm_tags: [harm.fire]}}, text: "Double fire harm you take."}
no_pool: [creature.folk.human, creature.folk.elf, creature.folk.dwarf, creature.folk.halfling, creature.folk.orc, creature.folk.goblin]   # the human-like folk: their powers are learned, not natural, so nothing to take (their arts are learned by 05's emulate). Giant-kin and beastfolk carry natural powers and are gated like any creature (revision I-020; 09 Interface request)

