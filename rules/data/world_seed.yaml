  - {id: ws.req.11_calendar, from: "11", need: "month, weekday, quarter-day, festival and era names (or the counted defaults)", rules: ["11.10.1", "11.10.4"], key: "calendar", check: calendar}
  - {id: ws.req.11_tables, from: "11", need: "tbl.11.season_events.<region>, tbl.11.hook.<region>, tbl.<region>.events (or the generic ones)", rules: ["11.5.10", "11.11.3"], key: "tables (hooks, season events)", check: generic_or_table, generic: "world_turn.yaml#tbl.11.hook, tbl.11.season_events.*, tbl.11.local_events"}
  - {id: ws.req.11_values, from: "11", need: "regional values for region scopes", rules: ["11.7.6"], key: "values", check: values}
  - {id: ws.req.11_lifespans, from: "11", need: "lifespans for its peoples", rules: ["11.10.5"], key: "calendar/lifespans", check: generic_or_table, generic: "calendar.yaml#lifespans"}
