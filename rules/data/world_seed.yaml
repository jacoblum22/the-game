  - id: tbl.12.seed.inciting
    name: "How the story begins (12.16.16)"
    die: d8
    note: "every incident starts in the haven at a moment of decision (12.5.2 step 5) and names the situation or faction its first lead points to"
    results:
      - {range: "1", option: alarm, text: "the haven's alarm sounds: something from the wound is at the gate", lead_to: situation, scene: "the gate, at the moment the bar comes down"}
      - {range: "2", option: dying_messenger, text: "a rider dies in the market with a message for someone who is not there", lead_to: faction_threat, scene: "the market, the rider falling from the saddle"}
      - {range: "3", option: missing, text: "a child (or an elder, or a priest) is missing since last night, and the trail leads out of the haven", lead_to: site_ring1, scene: "the square, the search being organised"}
      - {range: "4", option: offer, text: "a powerful person offers the character work, coin and a warning", lead_to: faction_goal, scene: "the hall of the rulers, the offer on the table"}
      - {range: "5", option: theft, text: "something sacred is stolen from the temple in the night", lead_to: faction_threat, scene: "the temple at dawn, the empty niche"}
      - {range: "6", option: omen, text: "an omen of the wound in the sky or the earth, and the whole haven sees it", lead_to: situation, scene: "the walls, everyone looking the same way"}
      - {range: "7", option: refugees, text: "refugees arrive with a story nobody believes", lead_to: site_ring2, scene: "the gate, the refugees and the guards"}
      - {range: "8", option: duel, text: "a quarrel in the inn turns to a challenge, and the challenger is more than they seem", lead_to: faction_goal, scene: "the inn's common room, the blade drawn"}

