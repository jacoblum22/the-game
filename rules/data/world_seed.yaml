# data/world_seed.yaml
# Purpose: the world seed (12.16): the procedure that builds a starting world from nothing, so the game runs with
#   no pre-made setting. It holds the seed's steps, the session-zero questions (each with closed options and an
#   oracle roll, so a step is answered by the player, by the engine, or both), the oracle tables the steps roll
#   on (premises, keepers, peoples' presence, names, places, havens, inciting incidents), the canon defaults of
#   05.7.10, 07 and 15, and the requirements list: everything the other chapters read from a region, with the
#   seed key that supplies it and the check `12-world-seed.py` runs on a seed. A seed is written as a region
#   record of the shape of `region_*.yaml` (SCHEMAS.md#region_yaml); chapter 13's `region_thallen.yaml` is one
#   optional pre-made seed of that shape.
# Owner: 12-dm-procedures (12.16). Schema: data/SCHEMAS.md#world_seedyaml.
# Reference implementation: _process/simulation/12-world-seed.py (runs every step from this file and the
#   files it names; validates the seed against `requirements`; one generated example committed beside it).
# Every entry lifecycle: provisional (00.16.3). Basis: [12.16] [05.7.10] [02.2.2-02.4.8] [10.2.4, T-10-2]
#   [11.3.18, PR-11-8] [PR-10-6, PR-10-10] [R5 P-22..P-36 (solo sandbox generation)] [DL-12-21..DL-12-24]
# [revision: I-028]

schema_version: 1
lifecycle: provisional

modes:
  - {id: guided, text: "the player answers every question from its options (or states a custom answer the DM classifies to the nearest option, 12.16.2)"}
  - {id: oracle, text: "the engine rolls every question's oracle; the player sees the result and may veto one answer per step (re-rolled once)"}
  - {id: mixed, text: "per question: the player answers the ones they care about; the engine rolls the rest (the default)"}

# ------------------------------------------------------------------------------------------- steps
# Run in this order (12.16.3). `writes` are region keys (SCHEMAS.md#region_yaml); `rolls` are the tables and
# procedures each step uses.
steps:
  - {id: ws.step.premise, n: 1, name: "Premise: what went wrong here", rule: "12.16.4", questions: [ws.q.wound, ws.q.climate], writes: ["region/pitch", "region/truths", "region/climate", "region/wound"]}
  - {id: ws.step.canon, n: 2, name: "Canon: what is impossible, and how magic works", rule: "12.16.5", questions: [ws.q.magic_level, ws.q.magic_law, ws.q.spirits, ws.q.arcane_source, ws.q.extra_impossible, ws.q.regrowth, ws.q.closed_school, ws.q.relics_magic, ws.q.hybrid_none], writes: ["canon_impossible", "canon"]}
  - {id: ws.step.faith, n: 3, name: "Faith: the keepers and who answers at death's door", rule: "12.16.6", questions: [ws.q.keeper_count, ws.q.keepers, ws.q.bargainer], writes: ["keepers", "canon/facts"]}
  - {id: ws.step.peoples, n: 4, name: "Peoples and tongues", rule: "12.16.7", questions: [ws.q.presence, ws.q.second_tongue], writes: ["peoples", "absent_origins", "names", "tongues"]}
  - {id: ws.step.land, n: 5, name: "The land: rings, areas and routes", rule: "12.16.8", questions: [ws.q.terrain], writes: ["region/rings", "terrain_by_ring", "places (the region and its areas)", "places[]/links"]}
  - {id: ws.step.haven, n: 6, name: "The haven", rule: "12.16.9", questions: [ws.q.haven_tier, ws.q.haven_site], writes: ["region/haven", "places (settlements and buildings)", "places_of_acceptance", "fight_locations", "stock"]}
  - {id: ws.step.factions, n: 7, name: "Factions with running clocks", rule: "12.16.10", questions: [ws.q.rulers, ws.q.fourth_faction], writes: ["factions", "clocks", "values"]}
  - {id: ws.step.cast, n: 8, name: "The cast", rule: "12.16.11", questions: [], writes: ["npcs", "bond_placement"]}
  - {id: ws.step.sites, n: 9, name: "Sites, lairs and threats", rule: "12.16.12", questions: [], writes: ["places (sites)", "situations", "clocks", "bestiary"]}
  - {id: ws.step.tables, n: 10, name: "Encounter tables", rule: "12.16.13", questions: [], writes: ["encounter_tables", "encounter_table_audit"]}
  - {id: ws.step.rumors, n: 11, name: "Rumors", rule: "12.16.14", questions: [], writes: ["rumor_tables"]}
  - {id: ws.step.calendar, n: 12, name: "The calendar", rule: "12.16.15", questions: [ws.q.month_names], writes: ["calendar"]}
  - {id: ws.step.opening, n: 13, name: "The opening and the pregens", rule: "12.16.16", questions: [ws.q.inciting], writes: ["opening", "pregens"]}
  - {id: ws.step.check, n: 14, name: "The seed check", rule: "12.16.17", questions: [], writes: ["seed/check"]}

# ---------------------------------------------------------------------------------------- questions
# Every question: `ask` (what the DM asks, out of fiction, 12.15), `options` (closed list; `text` is shown),
# `oracle` (the engine's roll when the player does not answer). Option effects are read by the step's rule.
questions:
  - id: ws.q.wound
    step: ws.step.premise
    ask: "Every frontier has a trouble. What went wrong in this land, a generation or two ago?"
    oracle: {die: d12, table: tbl.12.seed.wound}
    options_from: tbl.12.seed.wound
  - id: ws.q.climate
    step: ws.step.premise
    ask: "What is the land like to live in?"
    options:
      - {id: temperate, text: "temperate: green summers, wet autumns, snow some winters"}
      - {id: northern, text: "northern: short summers, long hard winters"}
      - {id: highland, text: "highland: high valleys, cold nights, storms off the peaks"}
      - {id: arid, text: "arid: dry hills and scrub, hot days, cold nights"}
      - {id: coastal, text: "coastal: mild and wet, fog and sea-storms"}
    oracle: {die: d6, results: [{range: "1-3", option: temperate}, {range: "4", option: northern}, {range: "5", option: highland}, {range: "6", option: coastal}]}
    note: "arid is chosen only by the player or by a wound that names it (the oracle keeps the starting land green enough to forage)"
  - id: ws.q.magic_level
    step: ws.step.canon
    ask: "How common is magic?"
    options:
      - {id: rare, text: "rare: a village may never have seen a working; casters are spoken of", spirits: rare, arcane_teacher_at: city}
      - {id: uncommon, text: "uncommon: every town knows a hedge-witch and a priest who can heal", spirits: rare, arcane_teacher_at: town}
      - {id: common, text: "common: wards on the gates, a mage in the council", spirits: uncommon, arcane_teacher_at: village}
    oracle: {die: d6, results: [{range: "1-2", option: rare}, {range: "3-5", option: uncommon}, {range: "6", option: common}]}
  - id: ws.q.magic_law
    step: ws.step.canon
    ask: "Where the game begins, is working magic in the open lawful, licensed, or feared? (05.7.10 item 6)"
    options:
      - {id: lawful, text: "lawful: no one minds a working in the market"}
      - {id: licensed, text: "licensed: lawful for those who hold the rulers' licence; a visible working without it is a method consequence (01.11.2)"}
      - {id: feared, text: "feared: lawful on paper; any visible working draws a crowd, a priest or a mob (a method consequence, 01.11.2)"}
    oracle: {die: d6, by: ws.q.magic_level, results: {rare: [{range: "1-2", option: lawful}, {range: "3-4", option: feared}, {range: "5-6", option: licensed}], uncommon: [{range: "1-3", option: lawful}, {range: "4-5", option: licensed}, {range: "6", option: feared}], common: [{range: "1-4", option: lawful}, {range: "5-6", option: licensed}]}}
  - id: ws.q.spirits
    step: ws.step.canon
    ask: "How common are spirits of place? (the Oracle's odds, 05.7.10 item 5)"
    options:
      - {id: rare, text: "rare: Unlikely in any given place; Likely at a place with resonance"}
      - {id: uncommon, text: "uncommon: Even odds in wild places; Likely at a place with resonance"}
      - {id: common, text: "common: Likely anywhere wild; Certain at a place with resonance"}
    oracle: {from: ws.q.magic_level, map: {rare: rare, uncommon: rare, common: uncommon}}
  - id: ws.q.arcane_source
    step: ws.step.canon
    ask: "Who can learn arcane magic? (05.7.10 item 2)"
    options:
      - {id: anyone_literate, text: "anyone literate with a teacher or a text (the default)"}
      - {id: order_only, text: "only those an arcane order admits: a teacher outside the order is a crime; a text is contraband", requires: "the arcane training licenses' requires gain: admitted by the region's arcane order (a faction rank)"}
      - {id: gifted_only, text: "only those born with the gift: the Touched livelihood's birth gift, or a birth result naming arcane", requires: "the arcane training licenses' requires gain: a birth gift or Touched spark naming arcane"}
    oracle: {die: d6, results: [{range: "1-4", option: anyone_literate}, {range: "5", option: order_only}, {range: "6", option: gifted_only}]}
  - id: ws.q.extra_impossible
    step: ws.step.canon
    ask: "Beyond the five things no magic does anywhere (12.16.5), is anything else impossible here? Pick none, one or two."
    options_from: tbl.12.seed.extra_impossible
    oracle: {die: d6, results: [{range: "1-3", option: none}, {range: "4-5", count: 1, table: tbl.12.seed.extra_impossible}, {range: "6", count: 2, table: tbl.12.seed.extra_impossible}]}
  - id: ws.q.regrowth
    step: ws.step.canon
    ask: "Can any rite regrow a lost limb or eye? (07.7.6)"
    options:
      - {id: "no", text: "no (the default): prosthetics, healers' craft and the maim's other offsets only"}
      - {id: great_rite, text: "yes, but only by a great rite at a place of power (a rite of band 4, its components scarce)"}
    oracle: {die: d6, results: [{range: "1-5", option: "no"}, {range: "6", option: great_rite}]}
  - id: ws.q.closed_school
    step: ws.step.canon
    ask: "Is any school of magic closed in this world, or unknown here? (05.7.10 item 8)"
    options:
      - {id: none, text: "none (the default)"}
      - {id: necromancy, school: deed.arcane.necromancy, text: "necromancy is lost: no teacher, no text; workings found in ruins only"}
      - {id: summoning, school: deed.arcane.summoning, text: "summoning is lost"}
      - {id: pact, school: deed.divine.pact, text: "no power here makes pacts"}
      - {id: shapeshifting, school: deed.primal.shapeshifting, text: "shapeshifting is lost"}
    oracle: {die: d12, results: [{range: "1-8", option: none}, {range: "9", option: necromancy}, {range: "10", option: summoning}, {range: "11", option: pact}, {range: "12", option: shapeshifting}]}
  - id: ws.q.relics_magic
    step: ws.step.canon
    ask: "Does someone who refuses magic (15's `magic` refusal) also refuse relics and enchanted things?"
    options:
      - {id: "yes", text: "yes: a relic is magic to those who fear magic (the default)"}
      - {id: holy_exempt, text: "holy relics of a keeper are exempt; other enchanted things are not"}
    oracle: {die: d6, results: [{range: "1-4", option: "yes"}, {range: "5-6", option: holy_exempt}]}
  - id: ws.q.hybrid_none
    step: ws.step.canon
    ask: "Do the four hybrid pairs chapter 04 leaves empty stay empty here (T-04-x: e.g. divine × primal)?"
    options:
      - {id: hold, text: "they hold: a named power and the nameless world share no servant (the default)"}
    oracle: {die: d6, results: [{range: "1-6", option: hold}]}
    note: "a seed that wants a hybrid for a none pair authors it as setting content under 04.4's audit; the seed procedure itself never does"
  - id: ws.q.keeper_count
    step: ws.step.faith
    ask: "How many powers answer prayers here?"
    options: [{id: "2", text: "two"}, {id: "3", text: "three"}, {id: "4", text: "four"}]
    oracle: {die: d6, results: [{range: "1-2", option: "2"}, {range: "3-5", option: "3"}, {range: "6", option: "4"}]}
  - id: ws.q.keepers
    step: ws.step.faith
    ask: "What are they? (pick a form for each; the engine names them)"
    options_from: tbl.12.seed.keeper_form
    oracle: {die: d12, table: tbl.12.seed.keeper_form, distinct: true, weights_by: ws.q.wound}
  - id: ws.q.bargainer
    step: ws.step.faith
    ask: "Who, if anyone, answers at the door of death to bargain? (07.5.5)"
    options:
      - {id: death_keeper, text: "the keeper of death and crossing, if there is one; else none"}
      - {id: none, text: "no one: the dying bargain with no one"}
      - {id: fey, text: "a fey lord of the borderlands (arch.fey_noble), for a price paid later"}
      - {id: fiend, text: "a tempter (arch.tempter) who collects"}
    oracle: {die: d6, results: [{range: "1-3", option: death_keeper}, {range: "4", option: none}, {range: "5", option: fey}, {range: "6", option: fiend}]}
  - id: ws.q.presence
    step: ws.step.peoples
    ask: "Which peoples live here, and how many? (common / uncommon / rare / absent for each of the eight)"
    oracle: {die: d6, table: tbl.12.seed.presence, by: people}
    rule: "humans are at least uncommon; at least one non-human people is present; a people absent here may still be met far away (a traveller), never as a local"
  - id: ws.q.second_tongue
    step: ws.step.peoples
    ask: "Besides the Common tongue, what is the land's second tongue? (02.2.2's creation default reads it)"
    options:
      - {id: old_tongue, text: "the Old Tongue, as the speech of whatever fell (renamed by the region)"}
      - {id: people, text: "the native tongue of the land's most common non-human people"}
    oracle: {die: d6, results: [{range: "1-3", option: people}, {range: "4-6", option: old_tongue}]}
  - id: ws.q.terrain
    step: ws.step.land
    ask: "What lies around the haven, ring by ring? (pick a terrain for each ring, or let the land roll)"
    oracle: {die: d12, table: tbl.12.seed.terrain_by_climate, by: ws.q.climate}
  - id: ws.q.haven_tier
    step: ws.step.haven
    ask: "Is the haven a village or a town?"
    options: [{id: village, text: "a village: a few hundred souls, a shrine, an inn"}, {id: town, text: "a walled town: a market, a temple, guilds"}]
    oracle: {die: d6, results: [{range: "1-2", option: village}, {range: "3-6", option: town}]}
  - id: ws.q.haven_site
    step: ws.step.haven
    ask: "Where does the haven stand?"
    options_from: tbl.12.seed.haven_site
    oracle: {die: d8, table: tbl.12.seed.haven_site}
  - id: ws.q.rulers
    step: ws.step.factions
    ask: "Who rules the haven?"
    options_from: tbl.12.seed.rulers
    oracle: {die: d6, table: tbl.12.seed.rulers, by: ws.q.haven_tier}
  - id: ws.q.fourth_faction
    step: ws.step.factions
    ask: "Who else has power here? (one more faction; the engine adds the rest)"
    oracle: {die: d12, table: "factions.yaml#tbl.11.faction_seed"}
  - id: ws.q.month_names
    step: ws.step.calendar
    ask: "Do the months have names here, or are they just counted?"
    options: [{id: named, text: "named: the engine names them from the land's own words"}, {id: counted, text: "counted: 'the second month of spring' (calendar.yaml's default)"}]
    oracle: {die: d6, results: [{range: "1-4", option: named}, {range: "5-6", option: counted}]}
  - id: ws.q.inciting
    step: ws.step.opening
    ask: "How does the story begin? (the inciting incident pairs with the character's long vow, 02.9.1)"
    options_from: tbl.12.seed.inciting
    oracle: {die: d8, table: tbl.12.seed.inciting}

# ------------------------------------------------------------------------------------------- tables
# Oracle tables the steps roll on (RC-RNG, 00.12.7 order). A wound's fields are read by later steps:
# `gates` (creature tags weighted x3 in encounter pools, 12.16.13), `situation` (the big threat's template,
# 12.16.12), `threat_org` (the threat faction's org kind), `themes` (site themes weighted x3), `keeper_bias`
# (keeper forms weighted x3), `era` (the calendar's era name), `truths` (three lines; {haven} and {region}
# are filled at the end).
tables:
  - id: tbl.12.seed.wound
    name: "What went wrong here (12.16.4)"
    note: "[revision: I-069] era_years is the wound's age: step 1 rolls the opening year of the era in that range (uniform), and {years} / {Years} in the pitch is that number in words, so the pitch and the opening date agree"
    die: d12
    results:
      - range: "1"
        option: fallen_realm
        threat_goal: {text: "take the old crown and the realm with it", kind: dominate, rating: sway}
        threat_temperament: cautious
        text: "a fallen realm: a kingdom broke two generations ago; its roads, keeps and heirs remain"
        pitch: "{region} was the heartland of a realm that fell in a single bad winter. Its roads still run; its keeps are ruins, and too many people remember they once had a claim."
        truths: ["The old realm's roads still run, and its ruins are full of what it left behind.", "Three families claim the old crown, and each has a seal to prove it.", "Something ended the realm in one winter, and no one agrees what."]
        gates: [creature.undead.mindless, creature.folk.human, creature.construct]
        situation: sit_t.succession
        threat_org: org.crown.noble
        themes: [site.theme.ancient, site.theme.ravaged, site.theme.fortified]
        keeper_bias: [kf.saint, kf.ancestors]
        era: "years since the Fall"
        era_years: [40, 60]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "2"
        option: plague
        threat_goal: {text: "spread the sickness to the haven before the summer ends", kind: change, rating: cunning}
        threat_temperament: secretive
        text: "a plague: a sickness of land or folk that comes back each hot season"
        pitch: "A wasting sickness took one in three in {region} {years} years ago, and every summer someone coughs and the whole valley holds its breath."
        truths: ["The sickness comes back in the hot months, and no healer knows why.", "The dead of the plague years lie in pits outside every village, unblessed.", "A cure was found once and lost again."]
        gates: [creature.undead, creature.beast.vermin, creature.horror.fungal]
        situation: sit_t.sickness
        threat_org: org.cult.undeath
        themes: [site.theme.haunted, site.theme.infested, site.theme.hallowed]
        keeper_bias: [kf.healer, kf.death]
        era: "years since the Wasting"
        era_years: [20, 30]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "3"
        option: invasion
        threat_goal: {text: "break the watch on the passes and burn the lowlands again", kind: dominate, rating: force}
        threat_temperament: aggressive
        text: "an invasion: a horde came over the mountains, was driven back, and is coming again"
        pitch: "The horde came down from the passes {years} winters ago and burned {region} to the river. It was driven back. The watchfires on the passes were lit again this spring."
        truths: ["The horde is gathering again beyond the passes.", "Some who fought it are still alive, and some of them took its gold.", "The old forts on the passes are held by too few, or by no one."]
        gates: [creature.folk.orc, creature.folk.goblin, creature.folk.giant]
        situation: sit_t.war_comes
        threat_org: org.clan.tribe
        themes: [site.theme.fortified, site.theme.ravaged]
        keeper_bias: [kf.war, kf.hearth]
        era: "years since the Burning"
        era_years: [20, 30]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "4"
        option: curse
        threat_goal: {text: "keep the curse from being lifted, and profit by it", kind: grow, rating: cunning}
        threat_temperament: secretive
        text: "a curse: a wrong was done, and the land answers it"
        pitch: "Someone in {region} did a terrible thing, and the land has not forgiven it: crops fail on certain fields, wells sour, and children are born with old eyes."
        truths: ["The curse has a source, a place and a name, and both are forgotten.", "The curse is spreading one field a year.", "Someone profits from the curse and does not want it lifted."]
        gates: [creature.spirit.fey.hag, creature.undead.spectral, creature.horror]
        situation: sit_t.cursed_ground
        threat_org: org.cult.forbidden
        themes: [site.theme.corrupted, site.theme.haunted, site.theme.wild]
        keeper_bias: [kf.land, kf.healer]
        era: "years since the Wrong"
        era_years: [11, 30]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "5"
        option: sundering
        threat_goal: {text: "recover the scattered pieces of the working and finish it", kind: change, rating: cunning}
        threat_temperament: secretive
        text: "a sundering: a great working went wrong and broke something"
        pitch: "The mages of {region} tried to bind something greater than themselves. The tower that held them is a crater now, and the sky over it is the wrong colour."
        truths: ["What the mages tried to bind is not dead.", "Pieces of the working are scattered across the land, and they are valuable.", "The surviving mages blame each other, and one of them is lying."]
        gates: [creature.construct, creature.elemental, creature.horror.aberration]
        situation: sit_t.the_enemy
        threat_org: org.order.arcane
        themes: [site.theme.ancient, site.theme.corrupted, site.theme.ravaged]
        keeper_bias: [kf.sky, kf.knowledge]
        era: "years since the Sundering"
        era_years: [11, 30]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "6"
        option: silent_god
        threat_goal: {text: "complete the rite that will put a new power in the silent one's place", kind: change, rating: sway}
        threat_temperament: zealous
        text: "a silent power: the land's great keeper stopped answering"
        pitch: "For a thousand years the keeper of {region} answered every true prayer. {Years} years ago it stopped. Its temple still stands, and its priests still pray, and nothing answers."
        truths: ["The silent keeper is not dead; something keeps it from answering.", "Other powers, and worse things, are moving into the silence.", "A relic of the silent keeper could wake it, and someone else wants it first."]
        gates: [creature.fiend, creature.spirit, creature.undead.spectral]
        situation: sit_t.the_rite
        threat_org: org.cult.fiendish
        themes: [site.theme.hallowed, site.theme.corrupted]
        keeper_bias: [kf.sky, kf.saint]
        era: "years since the Silence"
        era_years: [8, 15]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "7"
        option: long_winter
        threat_goal: {text: "buy up every granary before the next winter", kind: grow, rating: wealth}
        threat_temperament: mercantile
        text: "a long winter: the seasons broke and have not mended"
        pitch: "Winter came early to {region} {years} years ago and stayed a month too long, and every year since, it has stayed a little longer."
        truths: ["Each winter is longer than the last, and the old folk can name the day it began.", "The cold has a heart somewhere in the high country.", "Granaries are emptying, and someone is hoarding grain."]
        gates: [creature.elemental.frost, creature.beast.predator, creature.folk.giant]
        situation: sit_t.hunger
        threat_org: org.company.trading
        themes: [site.theme.wild, site.theme.ancient]
        keeper_bias: [kf.hearth, kf.land]
        era: "years since the Long Winter"
        era_years: [8, 15]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "8"
        option: restless_dead
        threat_goal: {text: "raise an army from the unburied battlefield", kind: grow, rating: force}
        threat_temperament: zealous
        text: "the restless dead: the dead do not stay in their graves"
        pitch: "In {region} the dead do not always stay buried. Every village keeps a watch on its graveyard, and every family burns its dead or pays the price."
        truths: ["The dead began to rise after a great battle, and the battlefield is still unburied.", "Someone learned to command the risen dead.", "A rite that once laid them is half-remembered."]
        gates: [creature.undead]
        situation: sit_t.the_missing
        threat_org: org.cult.undeath
        themes: [site.theme.haunted, site.theme.corrupted]
        keeper_bias: [kf.death, kf.saint]
        era: "years since the Rising"
        era_years: [11, 30]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "9"
        option: frontier
        threat_goal: {text: "drive the settlers back across the river", kind: dominate, rating: force}
        threat_temperament: zealous
        text: "a frontier: settlers pushing into a wild land that was never theirs"
        pitch: "{region} was wild country until a charter opened it to settlers {years} years ago. The farms are new, the roads are mud, and the wild has not agreed to any of it."
        truths: ["The charter's borders cross land older peoples call theirs.", "The settlers' sponsors in the capital want results, and soon.", "Something in the deep wild has started to notice the axes."]
        gates: [creature.beast, creature.spirit.fey, creature.spirit.place]
        situation: sit_t.hunting_ground
        threat_org: org.order.druidic
        themes: [site.theme.wild, site.theme.ancient, site.theme.infested]
        keeper_bias: [kf.land, kf.hearth]
        era: "years of the Charter"
        era_years: [5, 12]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "10"
        option: schism
        threat_goal: {text: "take the great temple and declare the other order heretic", kind: dominate, rating: sway}
        threat_temperament: zealous
        text: "a schism: one faith split in two, and both halves claim the temples"
        pitch: "The faithful of {region} split over a prophecy {years} years ago. Two orders now claim the same temples, the same relics and the same dead."
        truths: ["The prophecy at the heart of the schism was forged, and the forger is alive.", "Both orders are recruiting swords.", "The keeper itself has given a sign, and only a few have seen it."]
        gates: [creature.folk.human, creature.spirit.celestial, creature.undead.spectral]
        situation: sit_t.feud
        threat_org: org.order.knightly
        themes: [site.theme.hallowed, site.theme.fortified, site.theme.ravaged]
        keeper_bias: [kf.saint, kf.sky]
        era: "years since the Sundered Creed"
        era_years: [15, 25]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "11"
        option: tyrant
        threat_goal: {text: "bring the free haven under the Iron Peace", kind: dominate, rating: force}
        threat_temperament: aggressive
        text: "a tyrant: a cruel power rules the land beyond the haven"
        pitch: "Beyond the free haven, {region} answers to a lord who taxes in blood. The haven pays its tithe and keeps its gates shut, and refugees climb its walls at night."
        truths: ["The tyrant's power rests on one thing that could be taken.", "The haven pays the tyrant secretly, and some of its leaders profit.", "Resistance exists, and it is not as noble as it looks."]
        gates: [creature.folk.human, creature.fiend.devil, creature.beast.predator.canine]
        situation: sit_t.road_of_knives
        threat_org: org.crown.military
        themes: [site.theme.fortified, site.theme.ravaged, site.theme.corrupted]
        keeper_bias: [kf.war, kf.saint]
        era: "years of the Iron Peace"
        era_years: [11, 30]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)
      - range: "12"
        option: waking
        threat_goal: {text: "wake what sleeps under the hills", kind: change, rating: cunning}
        threat_temperament: secretive
        text: "an awakening: something very old is waking under the land"
        pitch: "The ground under {region} shakes in the night now, and wells run warm. The old songs say something sleeps under the hills. The old songs never said what wakes it."
        truths: ["Something under the land is waking, and its dreams leak into the waking world.", "A people who lived here before knew how to keep it asleep.", "Some want it to wake, and are helping."]
        gates: [creature.horror, creature.dragon, creature.elemental.earth]
        situation: sit_t.the_enemy
        threat_org: org.cult.doomsday
        themes: [site.theme.ancient, site.theme.corrupted, site.theme.wild]
        keeper_bias: [kf.land, kf.knowledge]
        era: "years since the First Tremor"
        era_years: [2, 5]   # [revision: I-069] the wound's age: the opening year is rolled in it (12.16.4)

  - id: tbl.12.seed.extra_impossible
    name: "One more thing no magic does here (12.16.5)"
    die: d8
    results:
      - {range: "1", option: no_teleport, text: "No one crosses space in an instant: no working moves a creature from one place to another without passing between.", scope: magic}
      - {range: "2", option: no_flight, text: "No working lets a person fly; levitation lifts no higher than a tall man's reach.", scope: magic}
      - {range: "3", option: no_conjured_food, text: "No working makes food or drink from nothing; magic can keep or purify, never create, sustenance.", scope: magic}
      - {range: "4", option: no_true_names, text: "No one can be commanded by their name; names have no power here.", scope: magic}
      - {range: "5", option: no_far_speech, text: "No working carries words beyond a day's walk.", scope: magic}
      - {range: "6", option: no_undying, text: "Nothing living stops ageing; no working lengthens a life beyond its people's span.", scope: magic}
      - {range: "7", option: no_gold_making, text: "No working makes gold, silver or gems (08's transmutation canon).", scope: magic}
      - {range: "8", option: no_weather_command, text: "No working commands the weather of a whole region; a rite may call rain on one field, never a season.", scope: magic}

