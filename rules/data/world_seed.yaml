  - {id: ws.req.15_tiers, from: "15/16", need: "settlement tiers (carousing, asking around, recruiting)", rules: ["15.13.8", "15.13.9", "16.3.2"], key: "places[]/settlement/tier", check: settlement_tiers}
  - {id: ws.req.15_teachers, from: "15", need: "teacher availability per settlement", rules: ["PR-15-8", "15.13.9"], key: "places[]/settlement/teachers", check: teachers}
  - {id: ws.req.15_sentries, from: "15", need: "sentries' post floors", rules: ["15.8 (alertness)"], key: "places[]/settlement/sentry_floors", check: sentries}
  - {id: ws.req.15_cases, from: "15", need: "case templates (or PR-15-6 on demand)", rules: ["15.9.1", "PR-15-6"], key: "cases", check: generic_or_table, generic: "PR-15-6"}
  - {id: ws.req.15_lifestyles, from: "15", need: "NPC lifestyles where they differ from the role default", rules: ["15.2 (lifestyle)"], key: "places[]/settlement/lifestyle_overrides", check: present}
  - {id: ws.req.15_relics, from: "15", need: "whether relics count as magic for the magic refusal", rules: ["15.3 (refusals)"], key: "canon/relics_and_refusal", check: nonempty}
  - {id: ws.req.16_hire, from: "16", need: "regional hire roles (and quirks, or the generic table), beasts and mounts available, the band limit by tier", rules: ["16.3.2", "16.3.3"], key: "places[]/settlement/hire", check: hire}
  - {id: ws.req.16_recruits, from: "16", need: "named NPCs who might be recruited", rules: ["16.3.4"], key: "npcs[]/recruit", check: recruits}

# ------------------------------------------------------------------------------------------ pack_requirements
# [revision: R2-D] [DL-12-61] The seed-pack checks (12.16.17; T-12-16's second part; I-130). Run by
# 12-world-seed.py#check_packs after the seed-pack pass; a failed check re-runs the pass for the entity named.
pack_requirements:
  - {id: ws.pack.place_look, from: "12", need: "every place (the region record aside) has a one-line look", rules: ["12.16.9", "12.4.3"], key: "places[]/look", check: looks}
  - {id: ws.pack.place_furniture, from: "12", need: "every place (the region record aside) has 2-4 furniture items", rules: ["12.16.9"], key: "places[]/furniture", check: furniture}
  - {id: ws.pack.place_exits, from: "12/10", need: "every place lists its exits from the route graph (a building: its settlement and its neighbours)", rules: ["12.16.9", "12.4.3"], key: "places[]/exits", check: exits}
  - {id: ws.pack.npc_knowledge, from: "12", need: "every cast NPC has 2-4 knowledge facts: one of their trade, one local or public, one tie to another cast member", rules: ["12.16.11", "12.10.6"], key: "npcs[]/knowledge", check: knowledge}
  - {id: ws.pack.npc_stance, from: "12", need: "every cast NPC has a stance toward the opening incident", rules: ["12.16.11"], key: "npcs[]/stance", check: stance}
  - {id: ws.pack.documents, from: "12/15", need: "every seeded document has text from tbl.12.seed.document, and a document a lead points to names the lead's target", rules: ["12.16.16"], key: "documents", check: documents}
  - {id: ws.pack.incident_case, from: "15", need: "the inciting incident's reduced case validates (15.9.4, reduced profile) with a core placement held at the opening place", rules: ["12.16.16", "PR-15-6", "15.9.4"], key: "cases", check: reduced_case}
