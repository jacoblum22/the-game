      - {range: "6", option: kf.saint, kind: saint, what: "a hero of the land's history, raised to power for one great deed and keeper of its memory", schools: [deed.divine.warding, deed.divine.oaths, deed.divine.exorcism], axes: [conduct.courage, conduct.protection], despises: [conduct.courage, conduct.piety], sign: "a pewter badge of the saint's emblem (item.tool.implement.holy_symbol)", faith_org: org.faith.shrine, title: ["the Defender", "the First Warden", "Saint of the Wall"], nature: sacred}
