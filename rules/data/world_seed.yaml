  # [revision: R2-D] [DL-12-61] seed packs (I-130): looks, furniture, documents, knowledge packs. Rolled by the
  # seed-pack pass (12.16.9, 12.16.11, 12.16.16) on a stream keyed by the seed and the entity id, so a pack never
  # changes the rest of the seed and a pre-made seed can be packed after the fact.
  - id: tbl.12.seed.place_look
    name: "A place's one-line look, by place type (12.16.9, 12.4.3)"
    die: d4
    note: "the place type is a haven building's kind (the last part of its id), else settlement, else the terrain group of an area or site (the second part of its first terrain tag), else default. {name} is the place's name. The look is atmosphere and incidental detail only (T0/T1a, 12.14.13): it never names a person, clue, hazard or valuable item. Written as the place's `look`; scene framing reads it (12.4.3)."
    by_kind:
      settlement: ["{name}: smoke from a score of chimneys, a muddy main street, dogs underfoot", "{name}: timber houses leaning together inside an old earth bank", "{name}: a cluster of roofs around a well, washing strung between the eaves", "{name}: stone footings, thatch above, and a bell tower that leans a little"]
      inn: ["a low common room, smoke-dark beams, the smell of ale and wet wool", "a long hall with a fire at one end and benches worn smooth", "a crowded taproom loud with talk, a stair climbing to the rooms", "a quiet front room, rushes on the floor, a cat on the hearth"]
      smithy: ["an open-fronted forge, the heat felt from the street, iron ringing", "a soot-black shed with a glowing hearth and a water trough", "a cramped workshop hung with tongs and half-made blades", "a yard of scrap iron before a forge that never quite goes cold"]
      temple: ["a whitewashed shrine, candles guttering before the keeper's sign", "a squat stone temple, cool and dim, smelling of old incense", "a timber hall of worship, its posts carved with the keeper's sign", "a small chapel with a worn step and a bell rope by the door"]
      hall: ["the rulers' hall: a high roof, a long table, banners gone grey with smoke", "a stone hall with a dais, a fire pit and guards at the door", "a timber longhall, its doors open to the yard, clerks at a side table", "a fortified house, its windows narrow, its door studded with iron"]
      gate: ["the gate: heavy doors, a bar as thick as a man, a watch platform above", "a gatehouse of old stone, the road rutted where it passes under", "a palisade gate with a guard hut and a brazier", "the way in, a toll board and a bored watch beside it"]
      market: ["an open square of stalls and awnings, sellers calling prices", "a market under a timber roof, sacks and baskets stacked high", "a muddy square ringed by stalls, a weighing beam at its centre", "a narrow market street, every doorway a shop"]
      healer: ["a low house smelling of herbs and boiled linen, cots along one wall", "a cottage hung with drying bundles, jars crowded on every shelf", "a whitewashed sickroom, quiet except for a kettle", "a herb garden before a small house, its door always open"]
      graveyard: ["a walled graveyard, the keeper's markers leaning in long grass", "rows of low stones under old yews, a path kept clear", "a hillside of graves above the roofs, a bench by the gate", "a tended burial ground, fresh flowers on a few mounds"]
      landmark: ["{name}: a place the old stories gather around, quiet and watched", "{name}: older than the haven, worn smooth by weather and hands", "{name}: offerings left here by people who will not say why", "{name}: a stillness here that travellers remark on"]
      highland: ["{name}: bare slopes, scree and heather, wind that never stops", "{name}: high ground under a wide sky, sheep tracks and grey rock", "{name}: crags above steep valleys, mist in the low places", "{name}: a rolling upland of rough grass and old cairns"]
      plains: ["{name}: open fields and hedgerows to the horizon", "{name}: flat grassland where the wind moves like water", "{name}: farmland, a few steadings, a long straight road", "{name}: moor and bog-cotton, a road marked by stones"]
      forest: ["{name}: tall trees, deep shade, the smell of leaf-mould", "{name}: tangled woodland, paths that come and go", "{name}: an old wood of oak and holly, quiet as a church", "{name}: thin birch woods, bright and full of birdsong"]
      water: ["{name}: shingle, salt wind and the cry of gulls", "{name}: a broad river, slow and brown, reeds along the banks", "{name}: a grey shore where boats are drawn up on the stones", "{name}: a lake edge, still water and a far bank in mist"]
      wetland: ["{name}: reed beds and black pools, the ground soft underfoot", "{name}: a marsh of hummocks and channels, midges thick in the air", "{name}: fen and willow, a causeway half under water", "{name}: a bog, its surface green and wrong-looking"]
      ruin: ["{name}: broken walls furred with moss, a doorway into dark", "{name}: fallen stones in a ring, a stair that goes nowhere", "{name}: a shell of a building, its roof long gone", "{name}: tumbled masonry and a cold that the sun does not reach"]
      underground: ["{name}: a mouth in the rock, cold air breathing out", "{name}: a shaft and a spoil heap, old timbers at the entrance", "{name}: a cave under an overhang, soot on the ceiling", "{name}: a low passage going down, water dripping somewhere"]
      default: ["{name}: quiet, the weather the loudest thing here", "{name}: a place that has seen better days", "{name}: unremarkable at first glance", "{name}: a place people pass through rather than stay"]

