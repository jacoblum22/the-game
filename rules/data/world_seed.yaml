  - {id: ws.req.11_rumors, from: "11/15", need: "rumor tables, each rumor's truth sealed and pointing somewhere real", rules: ["11.6.1", "11.6.4"], key: "rumor_tables", check: rumors}
  - {id: ws.req.12_npc_tables, from: "12", need: "region roster, role, name and furnishing tables (or the generic ones)", rules: ["12.11.1"], key: "names; tables (npc)", check: generic_or_table, generic: "oracles.yaml#tbl.npc_*"}
