blocks:   # owner-blocks merged at integration from _process/merged-contrib/conditions.NN.yaml (integration-merge.py)
  # ---- merged from conditions.07.yaml ----
  # data/contrib/conditions.07.yaml
  # Purpose: ch.07's owner-block for data/conditions.yaml (T-00-19: "conditions: 07 (affliction carriers)"). Six
  #   carriers: four wound carriers by site (the mechanical face of data/injuries.yaml wounds, T-07-4) and two
  #   affliction carriers beside ch.06's cond.poisoned. Harm states (staggered, dying, dead) are NOT conditions (00.9.4).
  # Confirmed, not redefined: cond.exhausted (ch.06: intensify, 3 stacks, -1 per stack, slowed at 3; 07.8.10) and
  #   cond.poisoned (ch.06: -1 / -2 / -3 by severity; the carrier of every affliction of kind poison).
  # Owner: 07-harm-recovery-death. Schema: data/SCHEMAS.md#conditionsyaml (Condition, 00.9.1); optional field `intent`
  #   as ch.06 uses it. Generated and validated by rules/_process/simulation/07-gen_data07.py.
  # Basis: [00.9] [06.7.1] [07.2.5] [07.9.1] [DL-07-10]
  - owner: '07'
    entries:

    - id: cond.wound_arm
      name: Wounded arm
      tags: [harm.physical]
      category: physical
      severity: S2
      severity_variable: true
      stacking: replace_stronger
      max_stacks: 1
      escalates_to: null
      duration: until_cleansed
      decay: []
      cleanse:
      - {means: 'the wound''s recovery (07.8.5-07.8.7): the carrier ends when the wound record heals', requires: null, check: null}
      exclusion_group: null
      priority_rank: 0
      neutralizes: []
      diminishing: null
      modifies:
      - effect_id: eff.status_modifier
        params: {amount: -1, applies_when: 'severity is S2; attack-trait and manipulate-trait beats with that arm, Grapple,
            Might-based Force and Exert'}
      - effect_id: eff.status_modifier
        params: {amount: -2, applies_when: 'severity in [S3, S4]; attack-trait and manipulate-trait beats with that arm, Grapple,
            Might-based Force and Exert'}
      - effect_id: eff.status_modifier
        params: {amount: -3, applies_when: 'severity is S5; attack-trait and manipulate-trait beats with that arm, Grapple,
            Might-based Force and Exert'}
      - effect_id: eff.restrict
        params:
          forbid:
            methods: [a weapon of weight heavy, a bow]
          target: the bearer
          duration: while the condition lasts
          applies_when: severity in [S3, S4, S5]
      - effect_id: eff.restrict
        params:
          forbid:
            methods: ['anything held in that hand: a shield, a second weapon, a two-handed method']
          target: the bearer
          duration: while the condition lasts
          applies_when: severity in [S4, S5]
      - effect_id: eff.restrict
        params:
          forbid:
            methods: [Exert to climb or swim without help]
          target: the bearer
          duration: while the condition lasts
          applies_when: severity is S5
      periodic: []
      on_apply: []
      on_remove: []
      visible: true
      narration_may_not_imply: [a wound of another site or severity than the record, healing that the recovery clock has not
          delivered]
      intent: a wound of the arm or hand; penalty and restrictions by severity (T-07-4)
      lifecycle: provisional
      basis: ['00.9', 07.2.5, T-07-4, DL-07-10]
    - id: cond.wound_leg
      name: Wounded leg
      tags: [harm.physical]
      category: physical
