        params: {amount: -1, applies_when: 'severity is S2; Move, Evade, and Exert or Sneak carried by the legs'}
      - effect_id: eff.status_modifier
        params: {amount: -2, applies_when: 'severity in [S3, S4]; Move, Evade, and Exert or Sneak carried by the legs'}
      - effect_id: eff.status_modifier
        params: {amount: -3, applies_when: 'severity is S5; Move, Evade, and Exert or Sneak carried by the legs'}
      - effect_id: eff.06.pace
        params: {amount: -1, applies_when: 'severity in [S3, S4, S5]'}
      - effect_id: eff.restrict
        params:
          forbid:
            methods: [Exert to jump or run]
          target: the bearer
          duration: while the condition lasts
          applies_when: severity in [S4, S5]
      - effect_id: eff.restrict
        params:
          forbid:
            methods: ['standing unsupported: the bearer is cond.prone unless it leans on a staff, a wall or a companion; Move
                is one band a turn at most']
