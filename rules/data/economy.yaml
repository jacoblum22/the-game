# data/economy.yaml
# Purpose: money, prices, selling, haggling, lifestyles, wealth tiers, services, wages, holdings' prices,
#   carrying capacity, supply, light, ammunition and the anti-inflation rules (08.8-08.9).
# Owner: 08-items-loot-crafting (T-00-19). Schema: data/SCHEMAS.md#economyyaml plus the optional fields
#   documented in chapter 08's Tables section (T-08-1).
# GENERATED by rules/_process/simulation/08-gen_data08.py (validated against tags.yaml, effects.yaml + contrib,
#   conditions.yaml, licenses.yaml + contrib, abilities.yaml and gen_absorb.yaml). Edit the script, not this file.
# Every entry lifecycle: provisional (00.16.3).

schema_version: 1
lifecycle: provisional
currency:
  units:
  - {id: coin, definition: 'one day''s plain food and a bed in a common room (02''s assumed unit, confirmed)', integer: true}
  lots: anything cheaper than 1 coin is sold by the LOT at 1 coin (5 torches, 2 days' trail rations, 10 candles, 20 sling bullets); no sub-coin exists (SG-23)
  weight: 100 coins = 1 load unit; fewer weigh nothing
  quantity: coin is a quantity on the character (update_quantity; every change is a tool write, R1 08)
price_bands:
- {band: 0, name: trifle, min: 1, max: 1, notch: 1}
- {band: 1, name: cheap, min: 2, max: 5, notch: 1}
- {band: 2, name: modest, min: 6, max: 25, notch: 2}
- {band: 3, name: costly, min: 26, max: 125, notch: 10}
- {band: 4, name: precious, min: 126, max: 625, notch: 50}
- {band: 5, name: treasure, min: 626, max: 3125, notch: 250}
- {band: 6, name: fortune, min: 3126, max: null, notch: 1000}
valuable_band: 3
quality_rungs:
- id: worn
  index: 1
  signature_slots: 0
  magnitude_slots: 0
  price: x1/2 of the base price (00.3.4's one halving, rounded down; minimum 1)
  intrinsic:
  - effect_id: eff.08.cost_step
    params: {ladder: severity, steps: 1, applies_when: cost.gear targets this item}
  meaning: 'below standard: patched, dull, loose; a cost.gear against it is taken one rung heavier (fragile)'
- id: common
  index: 2
  signature_slots: 0
  magnitude_slots: 0
  price: x1
  intrinsic: []
  meaning: standard, serviceable work
- id: fine
  index: 3
  signature_slots: 0
  magnitude_slots: 1
  price: x3
  intrinsic: []
  meaning: better make; one magnitude slot, which is OPEN (empty) unless a generator or a crafter fills it; a fine garment or jewel is a citable status fact
- id: masterwork
  index: 4
  signature_slots: 1
  magnitude_slots: 1
  price: x10
  intrinsic: []
  meaning: 'a master''s work or a true trophy: the identity layer opens'
- id: wondrous
  index: 5
  signature_slots: 1
  magnitude_slots: 2
  price: x30
  intrinsic: []
  meaning: the best that hands, hoards and powers produce
- id: storied
  index: 6
  signature_slots: 1
  magnitude_slots: 2
  price: authored
  intrinsic: []
  meaning: 'hand-authored named items (uniques): a fixed property set chosen by the author, exempt from mod groups but never from the item share (08.2) or the slot cap; never generated'
property_value_by_tier: {1: 20, 2: 50, 3: 125, 4: 300, 5: 750}
item_ability_value: x2 the tier value
relic_license_value: the tier value
list_price: 'base price x quality multiplier (worn: x1/2) + the sum of property values (00.10.6 adjust family for price; integers only)'
buying:
  asking: list + 1 notch of the list's band
  availability:
  - settlement: camp or waystation
    max_band: 1
    rungs: [worn, common]
    special_stock: false
  - settlement: village
    max_band: 2
    rungs: [worn, common, fine (weekly 1-in-6)]
    special_stock: false
  - settlement: town
    max_band: 3
    rungs: [worn, common, fine]
    special_stock: rarity_band <= 2
    masterwork: by commission only
  - settlement: city
    max_band: 5
    rungs: [worn, common, fine, masterwork (commission or a curio dealer)]
    special_stock: rarity_band <= 3
    property_items: 'a curio dealer''s stock: d4 property items each week, generated as scavenged at the region''s band, sold at list + 2 notches'
  oracle: an item not listed for a settlement is not there; asking whether a specific trader has it is an Oracle question at Unlikely (one band above the settlement's max) or Remote (two)
selling:
  mundane: half of list (x1/2), rounded down, minimum 1
  trade_goods: list where the goods are scarce; list minus one notch where common
  treasure: list minus one notch to a jeweler, broker or temple in a town or city; half of list elsewhere
  property_items: 'half of list, and ONLY through clk.find_buyer (6 segments, project, public; ticks per week: town 1, city 2, plus delivered reach of one Talk (trade) beat per week); a village or camp
    never buys them'
  own_make: an item the seller made sells for at most its materials' price + the maker's craft wage for the days worked (the labor cap, 08.8.9)
  materials_depth_per_week: {camp: 10, village: 30, town: 150, city: 750, rule: '[revision: I-079] trade goods and materials have their own depth of the same size: the most coin a settlement pays the PC
      per week for them, except a sale to a crafter who works the material in a named commission or project, up to what that work needs; glut still applies'}
  market_depth_per_week: {camp: 10, village: 30, town: 150, city: 750, rule: 'the most coin a settlement pays the PC per week for non-trade goods; past it, buyers are gone until next week'}
  glut: each sale of the same base item or trade good in one settlement in one week lowers that good's sale price there by one notch, recovering one notch per week (h.08.markets)
haggling:
  anchor: verb.talk with primary tag deed.influence.trade.haggling against the trader's Wits or Presence defense (15 composes it with standing)
  buying: {delivered_reach_0: the asking price stands, '1': list, '2': list - 1 notch, '3': list - 2 notches, '4': list - 3 notches}
  selling: {delivered_reach_0: the offer stands (half of list), '1': half + 1 notch, '2': half + 2 notches, '3': half + 3 notches, '4': list - 1 notch}
  floor: 'a price never falls below the materials floor: half of list for a seller''s own stock'
  repeat: one haggle per item per trader per day (01's repetition rule)
  critical_failure: 'cost.closed_door: the trader will not deal with the PC this week (15)'
lifestyles:
- id: destitute
  weekly_cost: 0
  unit: 1
  rest_site: rough
  social: a Precision snag on Talk where appearance matters (shabby)
  effects:
  - effect_id: eff.07.rest_cap
    params: {cap: partial, applies_when: rest_long in town on this lifestyle}
- {id: poor, weekly_cost: 4, unit: 4, rest_site: camp, social: none among common folk; a snag at court}
- {id: modest, weekly_cost: 7, unit: 7, rest_site: haven, social: none}
- {id: comfortable, weekly_cost: 14, unit: 14, rest_site: haven, social: a citable fact of means (a lever where credit matters)}
- {id: wealthy, weekly_cost: 35, unit: 35, rest_site: haven, social: a Precision lever on Talk with merchants and officials where means matter, includes: one servant}
- {id: noble, weekly_cost: 100, unit: 100, rest_site: haven, social: a Precision lever on Talk at court; expected of rank 2+ in a crown faction (11), includes: a household of four}
lifestyle_rules: {paid_by: h.08.upkeep at each week boundary (phase 4) for every week the PC spent any day in a settlement; a venture week costs supply instead (10), shortfall: 'unable to pay: the lifestyle
    drops one rung for that week and the PC takes the lower rung''s effects; debt is 11''s', unit_rule: a Unit of wealth for this character = the weekly cost of the current lifestyle (minimum 1); U(severity)
    Units is a cost of that severity in coin (S1 1 Unit ... S5 4 Units). 03's generosity ground floor = 1 Unit}
wealth_tiers:
- {tier: W1, name: scraping, coin_and_liquid: 0-50, typical_band: P1}
- {tier: W2, name: solvent, coin_and_liquid: 51-300, typical_band: P1-P2}
- {tier: W3, name: prosperous, coin_and_liquid: 301-1500, typical_band: P2-P3}
- {tier: W4, name: rich, coin_and_liquid: 1501-8000, typical_band: P3-P4}
- {tier: W5, name: magnate, coin_and_liquid: 8001+, typical_band: P4-P5}
purses:
- {band: 1, die: d4, coin: 1d4 - 1}
- {band: 2, die: 2d6, coin: 2d6}
- {band: 3, die: 4d6, coin: 4d6 + 5}
- {band: 4, die: 6d10, coin: 6d10 + 20}
- {band: 5, die: 10d10, coin: 10d10 + 80}
purse_rule: 'folk and other carriers of coin only (09 marks purse: none for beasts); one purse per defeated or robbed creature, rolled by roll_table'
hoard_coin:
- {band: 1, coin: 3d6 x 3}
- {band: 2, coin: 4d10 x 5}
- {band: 3, coin: 6d10 x 15}
- {band: 4, coin: 8d10 x 50}
- {band: 5, coin: 10d10 x 150}
hoard_goods:
- {band: 1, goods: d4 trade goods or a semiprecious gem}
- {band: 2, goods: d4 semiprecious gems and an art object}
- {band: 3, goods: d4 precious gems and d2 art objects}
- {band: 4, goods: 'd6 precious gems, d4 art objects, a treasure of art'}
- {band: 5, goods: 'a great gem, d6 precious gems, d4 treasures of art'}
services:
- {id: svc.lodging_common, price: 1, per: day, what: a bed in a common room and a plain meal (the coin's definition)}
- {id: svc.lodging_private, price: 3, per: day, what: a private room and good meals}
- {id: svc.stabling, price: 1, per: day per mount, what: 'stall, fodder, grooming'}
- {id: svc.bath_laundry, price: 1, per: visit, what: clears a 'filthy' or 'shabby' fact}
- {id: svc.messenger, price: 1, per: travel day of the route, what: a letter carried by a runner or rider}
- {id: svc.scribe, price: 1, per: letter; 2 per page copied, what: writing and fair copies}
- {id: svc.sage, price: 10, per: question, what: 'a Recall by a sage (lore, band 2) on one question; the answer is the sage''s frame (12)'}
- {id: svc.identify, price: 10, per: item, what: a sage or enchanter unseals every property of one item (08.5.3); town or city}
- {id: svc.healer, price: 2, per: day of care, what: 'Treat by a trained healer (07.8.8), with kit'}
- {id: svc.surgeon, price: 10, per: operation, what: surgery (deed.lore.medicine.surgery) for a wound (07)}
- {id: svc.cure, price: 'band 3 (by severity: S1 26, S2 40, S3 60, S4 90, S5 125)', per: affliction, what: 'a temple''s or cunning-folk''s cleansing of a poison, disease or curse (05 rites; 07.9.6)'}
- {id: svc.rite_for_hire, price: 'personal 10, local 50, site 250, regional 1250 + components', per: rite, what: a rite performed by a ritualist who knows it (05.8; scale 05.8.3)}
- {id: svc.repair, price: 'damaged: 1 notch of the item''s list band; broken: 2 notches', per: item, what: 'repair by a licensed crafter (08.6.7); masterwork needs trained, wondrous expert'}
- {id: svc.commission, price: materials + the crafter's weekly wage x weeks (round up) + 1 notch, per: item, what: 08.6.5}
- {id: svc.training, price: 'trained mentor 7, expert 25, master 100', per: week, what: 'a training week (15; 05.8.5, 05.9)'}
- {id: svc.passage_road, price: 2, per: day, what: a seat on a coach or carter's wagon with food}
- {id: svc.passage_river, price: 1, per: day, what: deck passage on a barge}
- {id: svc.passage_sea, price: 3, per: day, what: passage on a cog with food; a cabin x2}
- {id: svc.ferry, price: 1, per: crossing, what: river ferry}
- {id: svc.toll, price: 1, per: bridge or gate, what: a common toll (11's factions may double it)}
wages:
- {id: wage.porter, band: 1, weekly: 7, daily: 1, role: 'porter, torchbearer, linkboy, camp hand (carries 10 load)'}
- {id: wage.skilled, band: 1, weekly: 10, daily: 2, role: 'guide, cook, groom, scribe, carter'}
- {id: wage.soldier, band: 2, weekly: 14, daily: 2, role: 'guard, archer, scout, sailor'}
- {id: wage.specialist, band: 2, weekly: 21, daily: 3, role: 'trained healer, locksmith, sapper, hedge-witch'}
- {id: wage.veteran, band: 3, weekly: 50, daily: 8, role: 'sergeant, veteran mercenary, journeyman mage', share: plus a half share of coin found}
- {id: wage.champion, band: 4, weekly: 150, daily: 25, role: a renowned fighter or master of an art, share: plus a full share; hires only for a thread they believe in (16)}
- {id: wage.legend, band: 5, weekly: null, daily: null, role: 'never for coin: only for a cause, a debt or a bond (16)'}
craft_wages: {trained: 10, expert: 25, master: 60, unit: coins per week of work; the labor cap of 08.8.9 and the commission price of 08.6.5}
job_fees:
- {band: 1, fee: 40}
- {band: 2, fee: 85}
- {band: 3, fee: 200}
- {band: 4, fee: 600}
- {band: 5, fee: 2000}
job_fee_rules: 'paid by the patron when a job taken from it completes (11''s quest thread, ''a faction''s commission'' or an NPC''s paid request, 15.7.1 item 4 [revision: I-091]); keyed by the job''s challenge
  band (03.4.3: the opposition''s threat band, the faction''s tier, or the work''s type-tier); half up front if the patron''s standing is below Warm; 15''s bargaining may move it one notch (08.8.2); a failed
  or abandoned job pays only what was paid up front (08.8.8) [revision: I-086]'
holdings:
- {id: hold.cottage, buy: 150, build_weeks: 6, upkeep_week: 1, staff: 0, yield_week: 0, what: 'a home: a haven rest site; modest lifestyle at 4 coins/week while living there'}
- {id: hold.townhouse, buy: 600, build_weeks: 12, upkeep_week: 3, staff: 1, yield_week: 0, what: a town home; comfortable lifestyle at 9/week while living there}
- {id: hold.workshop, buy: 400, build_weeks: 8, upkeep_week: 2, staff: 1, yield_week: the worker's craft wage minus wages (labor value only), what: 'a workplace for one craft (a forge, a still)'}
- {id: hold.shop, buy: 800, build_weeks: 10, upkeep_week: 3, staff: 2, yield_week: 'd6 x 5 gross in a town, x10 in a city, before wages (11 runs it)', what: a shop selling made or bought goods}
- {id: hold.tavern, buy: 1500, build_weeks: 16, upkeep_week: 8, staff: 3, yield_week: d6 x 10 gross before wages, what: an inn; rumors (11) and lodging at cost}
- {id: hold.farmstead, buy: 1000, build_weeks: 12, upkeep_week: 4, staff: 4, yield_week: supply 20/week in season; nothing in winter, what: food and a haven in the country}
- {id: hold.watchtower, buy: 3000, build_weeks: 26, upkeep_week: 10, staff: 4, yield_week: 0, what: a defensible haven; a faction's notice (11)}
- {id: hold.manor, buy: 8000, build_weeks: 52, upkeep_week: 30, staff: 10, yield_week: 'rents: d6 x 20 if the land is held (11)', what: a seat; noble lifestyle included}
- {id: hold.keep, buy: 25000, build_weeks: 104, upkeep_week: 80, staff: 30, yield_week: 'rents and tolls: 11', what: a stronghold; a faction in its own right at tier 1 (11)}
holding_rules: 11 owns holdings as play (improvements, staff, threats, yields as clocks); these are the prices. Building is a craft.building project (08.6) on a 12-segment clock per 13 weeks of build_weeks
  or part, with workers at wage.porter/skilled; buying needs a charter (bi.charter).
carry:
  formula: capacity = 10 + 2 x Might (Might -1 -> 8 ... +4 -> 18); lic.people.great_frame counts Might +1 for this only (02)
  states:
  - {id: unburdened, when: load <= capacity}
  - {id: burdened, when: capacity < load <= 2 x capacity, effects: 'engine-cited Precision snag ''burdened'' on Evade, Sneak and Exert; Move pace one step slower (06); travel pace one step slower (10)'}
  - {id: overloaded, when: load > 2 x capacity, effects: 'cannot Move or travel while holding it all; drop or drag (one band per round, nothing else)'}
  item_share: +4 capacity from items at most (08.2.2)
supply: {unit: 1 supply = one person's food and water for one day (10 owns use and want), price: 'trail rations: 2 supply per coin (a lot); market food 1 coin per supply in a camp', load: 'every 2 supply,
    or part of 2, = 1 load unit', kit_food: a kit's food xN is N supply (02), item_share: items lower daily use by at most 1 (08.2.2)}
light: {torch: 'lot of 5 for 1 coin; each burns intervals:6; bright to band.close, dim to band.near', lantern: '5 coins; a flask of oil burns intervals:24; oil 2 flasks per coin', candle: 'lot of 10 for
    1 coin; each burns intervals:6; dim to band.close', owner: 10 runs h.10.light; these are the goods}
ammunition: {arrows: 20 for 2 coins (1 load), bolts: 20 for 3 coins (1 load), sling_bullets: 20 for 1 coin (1 load), recovery: 'half of those spent, rounded down, after a conflict (06.4.9)'}
mount_upkeep: base_items.yaml upkeep_week per mount stabled; grazing in grassland or farmland in spring-autumn costs nothing; on a venture a mount eats 1 supply per day unless grazing (10)
anti_inflation:
- {id: AI-1, rule: 'Magic never mints coin: anything conjured, summoned or transmuted carries conjured: true, has price 0 and cannot be sold; turning base matter into precious matter is G4 unless the region''s
    canon (12.16.5) allows it, and then the result is conjured'}
- {id: AI-2, rule: 'The labor cap: an item the seller made sells for at most its materials'' price + the maker''s craft wage for the days worked'}
- {id: AI-3, rule: Property items sell for half of list and only through clk.find_buyer; villages and camps never buy them}
- {id: AI-4, rule: 'Market depth per settlement per week caps coin paid to the PC: one depth for trade goods and materials, one for everything else (08.8.5) [revision: I-079]'}
- {id: AI-5, rule: 'Glut: repeated sales of the same good in one place lower its price one notch per sale per week'}
- {id: AI-6, rule: 'Coin enters only from purses, hoards, wages, job fees (job_fees here; a patron''s coin reward for an 11 thread is the job fee of its band) [revision: I-091], sales and holdings'' yields,
    each from a table here or in 11 -- never from a DM''s choice (INV-3)'}
- {id: AI-7, rule: 'Supply-saving and carry-raising items are capped by the item share (08.2.2): -1 supply/day, +4 capacity'}
- {id: AI-8, rule: 'Holdings yield at most the labor of their staff and their land''s rents; a yield table is 11''s and is rolled, never chosen'}
