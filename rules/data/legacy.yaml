# data/legacy.yaml
# Purpose: retirement and legacy (11.13): seams, endings, settlement, legend ranks, apotheosis forms, the three
#   legacy ledgers and their results, timeskips, successor sources and traits, inheritance channels, and the
#   Train-a-Successor activity.
# Owner: 11-living-world (T-00-19). No owner-blocks.
# Schema: data/SCHEMAS.md#legacy.yaml (endings, settlement, inheritance, timeskip_options) plus T-11-1's optional
#   keys (seams, apotheosis_forms, legend_ranks, ledgers, ledger_results, successor_sources,
#   tbl.11.successor_traits, train_successor).
# Every entry lifecycle: provisional (00.16.3).
# Basis: [R6 §D, D-01..D-15, D-R1..D-R6] [R5 P-43, LW-11, HR-11] [02.2.7] [04.11.4] [07.5.11, 07.11.6]
#   [16.16] [DL-11-20] [DL-11-25] [DL-11-26]

schema_version: 1

seams:
  always: "any reflection or session start, out of fiction"
  offered:
    - {id: seam.apotheosis, when: "apotheosis_available(pc) becomes true (04.11.4)"}
    - {id: seam.long_vow, when: "the long vow (02.9.1) is kept"}
    - {id: seam.arc, when: "a thread of rank extreme or epic completed; or formidable completed in the season just ended"}
    - {id: seam.age, when: "the third aging mark, and every Year Turn after; an aging check's critical failure"}
    - {id: seam.scars, when: "the third haunt (07.11.6) or the third brink mark (07.7.3)"}
  forced:
    - {id: seam.road_ends, when: "lc.road_ends (07.5.11)", endings: [retire_to_a_life]}
    - {id: seam.fourth_break, when: "career_end from the fourth dread break (07.11.6), at the next scene_end", endings: [retire_to_a_life, patron, depart]}
    - {id: seam.fifth_aging_mark, when: "the fifth aging mark (11.10.5)", endings: [retire_to_a_life, patron, apotheosis, depart]}
    - {id: seam.death, when: "harm_state.dead (07.3.1; Last Stand 07.5.9; lost Gamble 07.5.10)", endings: [remembered]}
  offer_protocol: "04.7 (accept / decline / defer); out-of-fiction [RETIRE] block then a CHOICE"

endings:
  - {id: end.retire_to_a_life, name: "Retire to a life", available: "always (living)", afterward: "a principal NPC at home, at the settlement lifestyle", writes: ["exists: exists", "home", "standing toward a successor (11.13.7)"], lifecycle: provisional, basis: ["11.13.2", "R6 D-R2"]}
  - {id: end.patron, name: "Become a patron", available: "living, with a holding, a rung-3+ rank, or a faction at +2", afterward: "a principal NPC who stays a power: holdings, reputation, faction ties as a member (not seats)", writes: ["as retire_to_a_life", "may be V2 mentor or patron of the successor"], lifecycle: provisional, basis: ["11.13.2", "R6 D-14"]}
  - {id: end.apotheosis, name: "Apotheosis", available: "apotheosis_available(pc)", afterward: "the calling's authored ending (apotheosis_forms)", writes: ["exists: departed", "a place of the legend with resonance for the calling's key", "legend rank +1 (max 5)"], lifecycle: provisional, basis: ["11.13.2", "R6 D-06, D-07", "04.11.4"]}
  - {id: end.depart, name: "Depart", available: "living", afterward: "gone beyond the map", writes: ["exists: departed", "a legend rumor of where"], lifecycle: provisional, basis: ["11.13.2", "R6 D-R2"]}
  - {id: end.remembered, name: "Remembered", available: "after death", afterward: "dead; a grave, cairn or place of the death", writes: ["exists: dead", "a place of the legend at legend rank 2+"], lifecycle: provisional, basis: ["11.13.2", "R6 D-R2"]}

apotheosis_forms:
  # two forms per deed branch; the player picks; 04 may give a calling its own (read first)
  - {branch: deed.martial, forms: ["the last stand that becomes a song: the hero holds the pass and is not seen again", "the warrior lays down the blade and becomes the land's oath-keeper, a living law"]}
  - {branch: deed.guile, forms: ["vanishes so completely that every lock in the realm is rumored to know the name", "becomes the shadow-king: never seen, always obeyed"]}
  - {branch: deed.wilds, forms: ["walks into the deep wood and becomes its keeper", "goes beyond the last map and sends back a map no one can read"]}
  - {branch: deed.lore, forms: ["finishes the great book and is found asleep on it, smiling, and does not wake as they were", "becomes the oracle of a high place: questions come to them for a hundred years"]}
  - {branch: deed.arcane, forms: ["becomes a storm, a star or a tower that hums at night", "steps through the last door of the art and closes it behind them"]}
  - {branch: deed.divine, forms: ["is taken up in light before witnesses", "becomes the god's saint: a shrine where they stood answers prayers"]}
  - {branch: deed.primal, forms: ["takes the shape of the great beast of their kinship forever", "becomes the spirit of a place: the spring, the hill, the grove"]}
  - {branch: deed.influence, forms: ["founds a dynasty, an order or a city that carries the name", "becomes the voice the realm listens to: a seat at every council"]}
  - {branch: deed.craft, forms: ["makes the masterwork and puts their life into it: it is theirs forever", "becomes the patron of the craft: every guild hall lights a lamp to them"]}

settlement:
  estate: "coin + half the list price of items with a price (08.8.5) + holdings at buy price"
  lifestyle_rule: "the highest 08 lifestyle whose weekly cost x 104 <= estate + 104 x the holdings' average net weekly yield; +1 rung if living in an owned home holding"
  reference_thresholds: {poor: 416, modest: 728, comfortable: 1456, wealthy: 3640, noble: 10400}
  holdings: {persists_if: "a steward; staff >= 1; an ally at Friendly or Devoted; an inheriting successor; or the retired character living there", falls_to: "a site of ch.10 (theme by type) with the legend as its rumor and any hidden room still inside"}
  coin_inherited: "only through inheritance.purse"

legend_ranks:
  - {rank: 5, name: "a myth", when: "a realm entry of score 5, and the ending apotheosis or an epic thread completed", rumors: 3, place: true}
  - {rank: 4, name: "a legend", when: "a realm entry >= 4; or a region entry 5 and a calling confirmed at tier 5", rumors: 3, place: true}
  - {rank: 3, name: "famed", when: "a region entry >= 4, or a realm entry >= 2", rumors: 2, place: true}
  - {rank: 2, name: "known in the region", when: "a region entry >= 2, or breadth >= 3", rumors: 2, place: "for apotheosis and remembered"}
  - {rank: 1, name: "a local name", when: "renown >= 1", rumors: 1, place: false}
  - {rank: 0, name: "unremembered", when: "renown 0", rumors: 0, place: false}
legend_rules:
  apotheosis_bonus: 1
  permanent_epithets: "every epithet of score >= 3"
  period: "one period entry + 3-5 event entries chosen by weight: linchpin fate by the PC's hand; extreme or epic thread; recognition tier 4+; world change; war ended; formidable thread; defeat survived at the brink; then by time"
  legend_rumor_truth: "world_turn.yaml#tbl.11.rumor_truth legend row; each points to a real placement"

ledgers:
  - {id: ledger.deeds, score: "(sum of completed threads' rank points 1/2/3/4/5 + 2 per great project) / 3, round down, cap 10"}
  - {id: ledger.bonds, score: "NPCs and allies at Friendly or Devoted toward the character + factions at +2 or +3, cap 10"}
  - {id: ledger.discoveries, score: "(places discovered / 3, round down) + sites cleared + 2 per world change, cap 10"}
ledger_roll: {die: d20, add: ledger score, strong: ">= 20", opportunity: "12-19", trouble: "<= 11"}
ledger_odds: {0: [5, 40, 55], 3: [20, 40, 40], 5: [30, 40, 30], 7: [40, 40, 20], 10: [55, 40, 5]}
ledger_results:
  ledger.deeds:
    strong: ["one bequeathed thread keeps its full progress", "or: an institution that held the predecessor at rung 2+ offers the successor rung 1 at once (an open V3 offer)"]
    opportunity: ["the bequests at half progress (11.13.6)", "one hook from the predecessor's unfinished business"]
    trouble: ["the faction or NPC most hostile to the predecessor: pursuit +1 toward the successor (or a Nemesis promotion, 09.9.3)", "or: an obligation the predecessor owed falls to the successor (a commitment of kind debt)"]
  ledger.bonds:
    strong: ["an ally or bond NPC of the predecessor serves the successor at old standing - 1 (16.16.2)", "and one faction at +2 or more toward the predecessor is +1 toward the successor"]
    opportunity: ["one of the predecessor's bond NPCs becomes the successor's anchor bond (02.9.2)"]
    trouble: ["someone who loved the predecessor blames the successor: a thorn bond (rival -1 or enemy -2)", "or: the successor rejects one of the predecessor's values (a creed that inverts one of theirs)"]
  ledger.discoveries:
    strong: ["every place the predecessor discovered in the region is discovered by the successor", "their hidden room or cache passes to the successor"]
    opportunity: ["one meaningful place known to the successor, one sealed fact of it unsealed"]
    trouble: ["what they found bites back: a situation from the place they last opened", "or: an enemy faction learns the predecessor's paths (its next strike or hunt finds the successor's haven)"]

timeskip_options:
  - {id: skip.none, length: "none (the next morning)", world_turns: 0, season_turns: 0, year_turns: 0}
  - {id: skip.season, length: "one season", world_turns: 13, season_turns: 1, year_turns: 0}
  - {id: skip.year, length: "one year", world_turns: 52, season_turns: 4, year_turns: 1}
  - {id: skip.five_years, length: "five years", world_turns: 260, season_turns: 20, year_turns: 5}
  - {id: skip.generation, length: "twenty years", world_turns: 1040, season_turns: 80, year_turns: 20, required_when: "the successor is a child of the character not yet grown"}
timeskip_rules:
  runs: "every boundary with every handler (00.7.7, INV-15), under 11.2.6's suspended rules"
  bequests: "opposing clocks advance but stop one segment short of completion"
  narration: "none during; the successor opens with the span's digests (season digests up to a year, year digests beyond) and home-scope news"

successor_sources:
  - {order: 1, source: "a protege (16); an heir or ward (02 ward bond; a recorded child); the subject of a completed Train-a-Successor"}
  - {order: 2, source: "an ally at Friendly or Devoted; a companion who left content (16.16.1)"}
  - {order: 3, source: "a bond NPC (anchor or thorn)"}
  - {order: 4, source: "someone the character rescued, freed or spared, at Warm or better toward it"}
  - {order: 5, source: "a rival's child or a former enemy at Neutral or better"}
successor_rules:
  candidates: 3
  newcomer: "always offered (02's full procedure)"
  ties_within_source: ["higher standing toward the character", "more scenes shared"]
  shown_with: "one tie (+): best faction status or bond; one thorn (-): worst faction status or an owed commitment; tbl.11.successor_traits if the record holds neither"
  made_by: "02.2.7"

tbl.11.successor_traits:
  die: d8
  results:
    - {range: "1", tie: "a friend in the town watch (+1 Warm)", thorn: "a debt of 20 coin to a moneylender (commitment)"}
    - {range: "2", tie: "a cousin in a craft guild (+1)", thorn: "an old rival in the same trade (rival -1)"}
    - {range: "3", tie: "the shrine-keeper's goodwill (+1)", thorn: "a broken betrothal (thorn -1)"}
    - {range: "4", tie: "a carter who owes a favor (+1)", thorn: "a petty theft remembered by the reeve (civic faction -1)"}
    - {range: "5", tie: "a neighbor who would vouch for them (+1)", thorn: "a rival at the market (rival -1)"}
    - {range: "6", tie: "a hunter who taught them the woods (+1)", thorn: "a feud with a family over a field (enemy -2)"}
    - {range: "7", tie: "an innkeeper's trust (+1)", thorn: "a secret they keep from their kin (a sealed fact)"}
    - {range: "8", tie: "a soldier who served with them (+1)", thorn: "a deserter's mark (military faction -1)"}

inheritance:
  renown_share: {when: "predecessor entry score >= 3 in a scope the successor is connected to", gives: "a `legacy` entry at score 1; 2 if the predecessor's score is 5 and the successor is kin or protege"}
  heirloom: {count: 1, rule: "any item of the predecessor's; properties and bound ability kept; attunement reset; gifted_by kept; beyond 02's kit limits"}
  ledgers: "ledger_results, as hooks, bonds, places known or trouble owed"
  training: {rule: "each tag banked by Train-a-Successor -> one 03.2.8 backstory event (24 points), at most 3"}
  predecessor_npc: {standing: "02.9.2's bond row: kin or ward +2; friend +2; mentor +1; any other successor +1", roles: ["anchor bond", "V2 mentor", "patron"], never: "retinue (16.16.3)"}
  standing_transfer: {who: "kin, ward, protege or ally successors", rule: "each faction's status toward the predecessor moved one step toward 0"}
  home: {who: "kin, ward or protege", inherits: "the home holding if cottage, townhouse, workshop, shop, tavern or farmstead (at the predecessor's death if they still live in it)", manor_or_keep: "passes to the household (the domain faction, or a new org.clan.family faction at tier 1); the successor holds rung 1 and a claim thread"}
  purse: {who: "kin, ward or protege", amount: "10 weeks of the settlement lifestyle, at most 350"}
  nothing_else: "no license, competence, tier, ability, Focus, fate or attribute (02.2.7)"

train_successor:
  id: dt.11.train_successor
  duration: week
  requires: "a named candidate NPC present and willing (Warm or better); a deed tag at level 2 or 3 where the PC's competence is +3 or more"
  check: "d20 + the PC's base modifier on the tag vs Moderate (15), Safe"
  clock: {kind: progress, segments: 12, visibility: public, ticks: delivered_reach}
  banks: "one tag per 4 ticks (the one taught most in that stretch among tags not yet banked; none if only banked tags were taught), at most 3, each a different tag; the clock then closes (revision I-087)"
  used_only_if: "the candidate becomes the successor"
  lifecycle: provisional
  basis: ["11.13.10", "R6 D-03 (The One Ring's Raise an Heir)", "02.2.7 item 4", "03.2.8"]
