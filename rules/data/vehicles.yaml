# Out-of-fiction texts (04.7.2). Ch.12 owns the block formats (12.15.6 CHOICE, 12.15.3 RESULT); ch.14 renders.
# <...> are filled by the engine from state; nothing in them is sealed.
# ---------------------------------------------------------------------------------------------------------------
markers:
  crisis_marker: "[RECOGNITION] An offer is open (see below). Nothing is lost by waiting; play continues when you answer or move on."
  offer_choice: |
    [CHOICE] Recognition — <vehicle name>: <calling name>, tier <n> (<tier name>)
      (a) Accept — you gain: <competence line> · <training grade line> · <capability name> · <k> pick(s) · <composite / boon / focus trigger line>
                   price: <price text> · provisional until <confirmation rule>
      (b) Decline — nothing changes; not raised again until <re-offer condition> (you may ask for it at any reflection)
      (c) Defer — the offer stands; it returns <represent_when><; expires <expiry>>
      If you move on without choosing: (c) defer
  multi_choice: |
    [CHOICE] Recognition — more than one road is open (choose any, all, or none; seats free: <s>)
      (1) <vehicle name>: <calling name>, tier <n> — <one-line gains> · price: <price>
      (2) ...
      Accept by number · decline by number · anything unanswered is deferred
  replace_choice: |
    [CHOICE] Recognition — <calling name>, tier 1, and no seat is free. Accepting it means one of:
      (a) Consolidate <calling A> + <calling B> into <target calling> (you keep every pick and specialty; 04.8.5), then accept
      (b) Narrow / broaden <held calling> into <candidate> (a fork: one replaces the other at tier <n>)
      (c) Release <held calling> (its picks return to the pool; its training stays), then accept
      (d) Decline · (e) Defer
      If you move on without choosing: (e) defer
  grant_result: "[RESULT] Changed: calling — <calling name>, tier 1 (Called), provisional · <gains> · you may set it aside at any rest (say 'renounce <calling name>')"
  pick_choice: |
    [CHOICE] A pick for <calling name> — (a) <ability name>: <literal text> · (b) ... · (c) ... · (d) keep the pick for later
             If you move on without choosing: (d)
  confirm_result: "[RESULT] Changed: <calling name> tier <n> — confirmed (no longer provisional)"
  lapse_warning: "[RESULT] Notice: <calling name> tier <n> is provisional and is not being lived; it will lapse at <boundary> unless that changes. Nothing else is at risk."
  lapse_result: "[RESULT] Changed: <calling name> tier <n> — lapsed (never confirmed). Returned: <what>. Your deeds stand; it may be recognized again."
  fraying_result: "[RESULT] Changed: <calling name> — <stage name> (stage <k> of 3). Now inactive: <list>. Clears by: <atonement options>. Next stage if: <plain condition>."
  fraying_choice: |
    [CHOICE] <calling name> — The Choice (stage 3). The calling is suspended until you answer.
      (a) Atone — <form 1> · <form 2> · <form 3> (a <4|6>-segment clock; the calling returns at stage 2 while it runs)
      (b) Turn — take <shadow calling name> in its place at tier <n> · price: <bane / oath>
      (c) Release — let the calling go; its picks return to the pool; your training stays
      (d) Defer — it stays suspended; it lapses at <season boundary name> if nothing is done
      If you move on without choosing: (d) defer
