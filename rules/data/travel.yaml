# data/travel.yaml
# Purpose: travel and exploration data for ch.10: danger rings, the pace ladder and its steps, vessel
#   paces, the march allowance, watch activities, journey roles, the overloaded time-tick check for travel
#   (watch_check) and sites (site_check), the pending-threat record, the face result tables (depletion,
#   find, opportunity, veer, encounter distance), terrain defaults (nav, forage, game, openness, grazing,
#   water), the generic encounter tables by terrain branch and home band (used where a region provides none;
#   a world seed's regional tables are built by PR-10-10, 12.16.13), archetype omen
#   signs, the exploration activity catalog (T-10-20), navigation and supply summaries.
# Owner: 10-exploration-travel-sites (owner-block 13 for regional encounter tables, events and signs).
# Schema: data/SCHEMAS.md#travelyaml (pace, activities, watch_check {die, results}, navigation, supply,
#   exploration_activities) plus ch.10's optional keys listed above (the exploration activity catalog is
#   the key `activities`; the per-watch activity list is `activities_by_watch`).
# Encounter tables: one threat sub-table per home band (`threat_by_home`, d20, rows at home-1 / home / home+1 =
#   6/11/3 faces = 30/55/15, 09.8.2; bands checked by gen10_travel.py, words by 10-word-audit.py, PR-10-8) and one
#   non-threat sub-table d6; the danger rating's threat_share_d12 picks the sub-table (10.9.4-10.9.5) [revision: I-029].
# Basis: [10.3-10.10, 10.15] [R5 P-30..P-36] [R6 B-14, B-15, B-R5] [09.8] [DL-10-02..10]

schema_version: 1
rings:
- {ring: 0, distance: the haven and its fields, home_band: null, danger: safe, words: safe under the walls}
- ring: 1
  distance: up to 1 day
  home_band: [1]
  danger: settled
  words: farm country; trouble is rare and small
- ring: 2
  distance: 1-3 days
  home_band: [1, 2]
  danger: wild
  words: 'the borderland: wild, but folk pass through'
- ring: 3
  distance: 3-6 days
  home_band: [2, 3]
  danger: wild or perilous
  words: 'the deep wilds: dangerous things live here'
- ring: 4
  distance: 6-10 days
  home_band: [3, 4]
  danger: perilous
  words: 'the old lands: only the strong travel here'
- ring: 5
  distance: beyond
  home_band: [4, 5]
  danger: deadly
  words: 'the far reaches: legends live here, and so do the things that killed them'
pace:
  points_per_leg_watch: 6
  ladder:
  - {id: crawl, points: 2}
  - {id: slow, points: 4}
  - {id: normal, points: 6}
  - {id: fast, points: 8}
  - {id: ride, points: 9}
  - {id: hard_ride, points: 12}
  chosen:
    walkers: {slow: slow, normal: normal, fast: fast}
    riders: {slow: normal, normal: ride, fast: hard_ride}
  base_by_travel_pace: {walk: normal (max normal for walk-pace mounts and carts), ride: ride ladder for an all-mounted party,
    river: vessel_pace, sea: vessel_pace}
  steps:
  - {cause: burdened (08.9.2), steps: 1}
  - {cause: overloaded (08.9.2), steps: no travel}
  - {cause: weather off roads, steps: 'weather.yaml#states[].pace_steps'}
  - {cause: snow_lying off roads, steps: 1}
  - {cause: 'night (evening, night watches) without road, light or clear sky', steps: 1}
  - {cause: a slowing hazard on the leg, steps: hazards.yaml pace_steps}
  - {cause: darkness without light or night-sight, steps: crawl}
  effects:
  - pace: slow
    march_units: 1
    roles: [navigator, lookout, scout, forager]
    way_lever: true
    stealth: a party Sneak may be made
  - pace: normal
    march_units: 1
    roles: [navigator, lookout, scout]
  - pace: fast
    march_units: 2
    roles: [navigator]
    way_snag: true
  - pace: ride
    march_units: 1
    roles: [navigator, lookout, scout]
    mount_units: 1
  - pace: hard_ride
    march_units: 1
    roles: [navigator]
    way_snag: true
    mount_units: 2
vessel_pace:
- {vessel: bi.raft, calm: null, downstream: 8, upstream: null, sea: null, watches_per_day: 2}
- {vessel: bi.rowboat, calm: 6, downstream: 8, upstream: 4, sea: 'coast only, 4 in calm weather', watches_per_day: 2}
- {vessel: bi.keelboat, calm: 6, downstream: 9, upstream: 6, sea: null, watches_per_day: 3}
- {vessel: bi.river_barge, calm: 6, downstream: 8, upstream: 4, sea: null, watches_per_day: 3}
- {vessel: bi.cog, calm: null, downstream: null, upstream: null, sea: 16, watches_per_day: 4}
march:
  walker_allowance: 2
  mount_allowance: 2
  reset: day boundary (dawn)
  unit_cost: {slow: 1, normal: 1, fast: 2, ride: 1, hard_ride: 2}
  mount_loaded_over_half: +1 per watch
  over_allowance: one stack of cond.exhausted per unit over, at the watch end (h.10.travel_progress); 07.8.10 push-on may
    defer it
  mount_at_three_stacks: cannot be ridden or loaded until a long rest
activities_by_watch:
- {range: '1', id: travel, result: 'move along the journey: earn pace points (h.10.travel_progress)', rest: false}
- {range: '2', id: camp, result: 'make and keep camp: eat, tend gear, mounts graze; a lookout may watch; the rest site is
    set (07.8.2)', rest: rest_short possible inside it}
- {range: '3', id: sleep, result: 'a long rest (07.8.1: a watch, at least 4 hours asleep, once a day)', rest: rest_long}
- {range: '4', id: forage, result: act.forage (10.6.4), rest: false}
- {range: '5', id: hunt, result: act.hunt / act.fish (10.6.5), rest: false}
- {range: '6', id: scout, result: act.scout an adjacent area (10.15), rest: false}
- {range: '7', id: map, result: act.map the area (a way-finding lever), rest: false}
- {range: '8', id: rest, result: 'rest without sleeping (short rests, 07.8.1)', rest: rest_short}
- {range: '9', id: keep_watch, result: the lookout role over a resting camp, rest: false}
- {range: '10', id: other, result: 'any listed activity with a duration of a watch or less, or a free-mode scene', rest: false}
roles:
- id: navigator
  allowed_at: [slow, normal, fast, ride, hard_ride]
  effect: makes the day's way-finding beat (10.4.2)
  evidence_tag: deed.wilds.navigation.wayfinding
- id: lookout
  allowed_at: [slow, normal, ride, camp]
  effect: arrivals never surprise the party; distance +1 band in open and broken country; omens carry the archetype family;
    sleepers woken in time
  evidence_tag: deed.wilds.survival.weathersense
- id: scout
  allowed_at: [slow, normal, ride]
  effect: perceives arrivals first (other side unaware unless its notice beats the scout's stored Sneak); may slip away; on
    a discovery face finds the nearest undiscovered site or landmark; starts encounters at band.far from the party
  evidence_tag: deed.wilds.tracking.sign
- id: forager
  allowed_at: [slow]
  effect: a forage beat at the watch end with an engine-cited Precision snag "on the move", yield delivered reach - 1
  evidence_tag: deed.wilds.foraging.food
- id: quartermaster             # ch.16's fifth role (16.8.3), added at integration
  allowed_at: [slow, normal, fast, ride, hard_ride, camp]
  held_by: an ally with kn.quartermaster, or a holder of lic.training.wilds_survival
  effect: once per day, one depletion face (tbl.10.depletion rows 1-4) is prevented and counts as a lull without its progress point
  evidence_tag: deed.wilds.survival.provisioning
watch_check:
  die: d12
  handler: h.10.watch_check
  boundary: watch
  phase: 7
  night_watch_rung: +1 (cap deadly)
  faces:
    settled: {E: '1', O: '2', V: '3', D: '4', W: '5', F: '6', P: '7', L: 8-12}
    wild: {E: '1', O: 2-3, V: '4', D: '5', W: '6', F: '7', P: '8', L: 9-12}
    perilous: {E: 1-2, O: 3-4, V: '5', D: '6', W: '7', F: '8', P: '9', L: 10-12}
    deadly: {E: 1-3, O: 4-5, V: '6', D: '7', W: '8', F: '9', P: '10', L: 11-12}
  meanings: {E: encounter (10.9.4), O: omen, V: 'local event: tbl.<region>.events else tbl.event_focus (12.6.5 d)', D: 'depletion:
      tbl.10.depletion', W: 'weather shift: tbl.10.weather_shift', F: 'discovery: nearest undiscovered place, else tbl.10.find',
    P: 'opportunity: tbl.10.opportunity', L: 'lull: +1 point if travelling; pending timer does not advance'}
  threat_share_d12: {settled: 1-3, wild: 1-7, perilous: 1-9, deadly: 1-10, rule: 'an E or O face with nothing pending first
      rolls d12 against the rating: on the range, the threat sub-table; else the non-threat sub-table'}
  interrupting_results: [arrival, omen, local event perceivable now, weather shift into an exposure for the exposed, a recurring
      hazard exposure]
site_check:
  die: d12
  handler: h.10.site_check
  boundary: interval
  phase: 7
  cadence_intervals: {settled: 3, wild: 2, perilous: 2, deadly: 1, dark_without_light: one step faster, roused: 'every interval,
      rating +1'}
  faces:
    settled: {E: '1', O: '2', S: '3', D: '4', H: '5', F: '6', P: '7', L: 8-12}
    wild: {E: '1', O: 2-3, S: '4', D: '5', H: '6', F: '7', P: '8', L: 9-12}
    perilous: {E: 1-2, O: 3-4, S: 5-6, D: '7', H: '8', F: '9', P: '10', L: 11-12}
    deadly: {E: 1-2, O: 3-5, S: 6-7, D: '8', H: '9', F: '10', P: '11', L: '12'}
  meanings: {E: denizen encounter (site table), O: omen, S: 'stir: the danger clock +1', D: depletion (site rows), H: 'shift:
      the domain''s shift table', F: 'discovery: theme/domain discoveries', P: tbl.10.site_opportunity, L: lull}
pending_threat:
  record: '{id, row, adversary_refs, count, sign_stage, checks_since, created_at, place}'
  arrives: [the next E face, 'the next O face (second sign, then arrival)', the 4th check after creation (lulls do not count)]
  relax_opt_in: during 12's RELAX or a recovery window the 4th-check timer does not run (10.9.7)
  one_at_a_time: true
  answers: [avoid, investigate, prepare, seek, ignore]
tables:
- id: tbl.10.depletion
  name: Depletion (face D, travel)
  die: d6
  results:
  - {range: '1', result: 'one supply spoils or is spilled (-1); if none carried, a waterskin leaks: no water source this day
      in arid country'}
  - {range: '2', result: 'one supply spoils or is spilled (-1); if none carried, a waterskin leaks: no water source this day
      in arid country'}
  - {range: '3', result: 'a burning light gutters (-2 intervals); if none is lit, one stored source is found damp and loses
      half its remaining intervals, rounded down'}
  - {range: '4', result: 'a strap, string or boot gives: one carried item (engine draw among non-relic, non-cost_immune gear)
      is damaged (08.1.9)'}
  - {range: '5', result: 'a mount goes lame for the day (pace one step slower); if no mount, ammunition -2; with neither,
      one more supply spoils (as 1-2) [revision: I-056]'}
  - {range: '6', result: 'a hard stretch: the next travel watch earns 2 fewer points'}
- id: tbl.10.depletion_site
  name: Depletion (face D, site)
  die: d6
  results:
  - {range: '1', result: a burning light gutters (-2 intervals)}
  - {range: '2', result: a burning light gutters (-2 intervals)}
  - {range: '3', result: one supply spoils in the damp (-1)}
  - {range: '4', result: 'a strap or string gives: one carried item damaged'}
  - {range: '5', result: a rope or pole frays (one damaged)}
  - {range: '6', result: 'the air turns bad for a moment: a burning light -2 intervals'}
- id: tbl.10.find
  name: A find (face F with nothing undiscovered)
  die: d12
  results:
  - {range: '1', result: a spring, writes: landmark; water_source for the area}
  - {range: '2', result: a waymark cairn, writes: landmark; a way-finding lever in this area}
  - {range: '3', result: an old campsite, writes: a camp rest site with a fire ring}
  - {range: '4', result: a roadside shrine, writes: landmark; resonance per the region's seed or an Oracle question}
  - {range: '5', result: a cache, writes: '08.3.12 hoard at band - 1, coin and goods only'}
  - {range: '6', result: a fallen statue, writes: landmark; lore (act.study)}
  - {range: '7', result: a carcass worth harvesting, writes: a fresh body of a beast of the area's table (08.3.10)}
  - {range: '8', result: a wreck or abandoned cart, writes: 'act.scavenge: 08.3.11 gear and coin by band'}
  - {range: '9', result: a signpost, writes: 'a known link: a route name and direction (a known route link)'}
  - {range: '10', result: fresh sign of passage, writes: a track link; act.track Easy to follow}
  - {range: '11', result: a viewpoint, writes: 'a vantage: adjacent areas'' danger words; recognition if lost'}
  - {range: '12', result: a lone grave, writes: landmark; a name (a rumor seed for 11)}
- id: tbl.10.opportunity
  name: Opportunity (face P, travel)
  die: d8
  results:
  - {range: '1', result: 'windfall: +1 supply'}
  - {range: '2', result: 'game sighted: a Precision lever for a hunt in this area today'}
  - {range: '3', result: 'a better line: +2 points to the next travel watch'}
  - {range: '4', result: 'shelter found: the next camp in this area is camp, not rough, and keeps out S2 weather'}
  - {range: '5', result: 'a vantage: adjacent areas'' danger words, the nearest undiscovered landmark, recognition if lost'}
  - {range: '6', result: 'others'' trail marks: a Precision lever on way-finding today'}
  - {range: '7', result: 'water: a water_source for the day'}
  - {range: '8', result: 'a quiet hour: a breather boundary at the watch end'}
- id: tbl.10.veer
  name: Veer when off course (10.4.6)
  die: d6
  results:
  - {range: '1', result: the link nearest the intended bearing on its left}
  - {range: '2', result: the link nearest the intended bearing on its left}
  - {range: '3', result: the link nearest the intended bearing on its right}
  - {range: '4', result: the link nearest the intended bearing on its right}
  - {range: '5', result: a link back the way the party came}
  - {range: '6', result: 'circling: no link; the watch''s points go nowhere'}
- id: tbl.10.encounter_distance
  name: Encounter distance (T-10-15)
  die: d6
  by_openness:
    open: [band.near, band.near, band.far, band.far, band.distant, band.distant]
    broken: [band.close, band.near, band.near, band.far, band.far, band.distant]
    closed: [band.close, band.close, band.close, band.near, band.near, band.far]
  modifiers: ['lookout: +1 band farther (open, broken)', 'scout: +1 band farther', 'fog or night without light: read as closed',
    'ambush rows: the ambush ground''s distance (usually band.close)']
