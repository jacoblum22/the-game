terrain_defaults_rule: 'a place takes the entry of its primary terrain tag, else its nearest ancestor with an entry (00.5.4b
  most-specific-wins). forage_tier "none" = G4 for foraging (nothing grows); game_tier "none" = G4 for hunting. water_source:
  true / false / foul (haz.foul_water) / with_fire (melting snow at a fire) / oracle_<rung> (ask once per area, 00.12.7).
  grazing applies spring to autumn only.'
encounter_tables:
- id: tbl.10.enc.road
  terrain: terrain.road
  threat_die: d20
  threat:
  - range: 1-3
    kind: adversary
    ref: [arch.brigand]
    band: home-1
    count: group
    threat: true
    ambush: true
    complication: false
    when: any
    note: footpads at a narrows
  - range: 4-6
    kind: adversary
    ref: [arch.wolf]
    band: home-1
    count: group
    threat: true
    ambush: false
    complication: false
    when: any
  - range: 7-10
    kind: adversary
    ref: [arch.brigand]
    band: home
    count: group
    threat: true
    ambush: false
    complication: true
    when: any
    note: highwaymen with a captain
  - range: 11-12
    kind: adversary
    ref: [arch.soldier]
    band: home
    count: 2-4
    threat: true
    ambush: false
    complication: false
    when: any
    note: deserters or corrupt toll-men
  - range: 13-14
    kind: adversary
    ref: [arch.orc]
    band: home
    count: group
    threat: true
    ambush: false
    complication: false
    when: any
    note: raiders on the road
  - range: 15-17
    kind: adversary
    ref: [arch.goblin]
    band: home
    count: group
    threat: true
    ambush: true
    complication: false
    when: any
  - range: 18-19
    kind: adversary
    ref: [arch.ogre]
    band: home+1
    count: '1'
    threat: true
    ambush: false
    complication: false
    when: any
  - range: '20'
    kind: adversary
    ref: [arch.troll]
    band: home+1
    count: '1'
    threat: true
    ambush: false
    complication: false
    when: any
    note: under a bridge
  non_threat_die: d6
  non_threat:
  - {range: '1', kind: people, result: merchants with hired guards (12.11 reaction roll; trade), threat: false}
  - {range: '2', kind: people, result: pilgrims bound for a shrine (news; a rumor), threat: false}
  - range: '3'
    kind: people
    result: a patrol of the road wardens (reaction roll; questions)
    threat: false
    ref: [arch.soldier]
  - {range: '4', kind: people, result: 'a messenger riding hard (news: a rumor from 11)', threat: false}
  - {range: '5', kind: people, result: a tinker with a cart (trade; repair), threat: false}
