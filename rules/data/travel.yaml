terrain_defaults_rule: 'a place takes the entry of its primary terrain tag, else its nearest ancestor with an entry (00.5.4b
  most-specific-wins). forage_tier "none" = G4 for foraging (nothing grows); game_tier "none" = G4 for hunting. water_source:
  true / false / foul (haz.foul_water) / with_fire (melting snow at a fire) / oracle_<rung> (ask once per area, 00.12.7).
  grazing applies spring to autumn only.'
encounter_tables:
- id: tbl.10.enc.road
  terrain: terrain.road
  threat_die: d20
  threat_by_home:
    1:
    - range: 1-3
      kind: adversary
      ref: [arch.brigand]
      band: home-1
      count: 1-2
      threat: true
      ambush: true
      complication: false
      when: any
      note: a pair of footpads at a narrows
    - range: 4-6
      kind: adversary
      ref: [arch.wolf]
      band: home-1
      count: 1-2
      threat: true
      ambush: false
      complication: false
      when: any
      note: a hungry wolf shadowing the carts
    - range: 7-9
      kind: adversary
      ref: [arch.goblin]
      band: home
      count: 5-7
      variant: minion
      threat: true
      ambush: true
      complication: false
      when: any
      note: goblins rolling a log across the road
    - range: 10-12
      kind: adversary
      ref: [arch.brigand]
      band: home
      count: 5-7
      variant: minion
      threat: true
      ambush: false
      complication: true
      when: any
      note: a mob of hungry men at a toll they invented
    - range: 13-15
      kind: adversary
      ref: [arch.orc]
      band: home
      count: 5-7
      variant: minion
      threat: true
      ambush: false
      complication: false
      when: any
      note: an orc raiding party on the road
    - range: 16-17
      kind: adversary
      ref: [arch.ghost]
      band: home
      count: '1'
      threat: true
      ambush: false
      complication: false
      when: night
      note: a hanged man at the crossroads gibbet
    - range: 18-19
      kind: adversary
      ref: [arch.ogre]
      band: home+1
      count: '1'
      threat: true
      ambush: false
      complication: false
      when: any
      note: an ogre demanding a toll at a ford
    - range: '20'
      kind: adversary
      ref: [arch.orc]
      band: home+1
      count: '1'
      threat: true
      ambush: false
      complication: false
      when: any
      note: an orc outrider ahead of a raid
    2:
    - range: 1-3
      kind: adversary
      ref: [arch.brigand]
