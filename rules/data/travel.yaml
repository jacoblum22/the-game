archetype_signs:
  arch.wolf: [wolf scat full of hair on the trail, a howl answered from two directions]
  arch.great_cat: [claw-scores high on a tree, a deer carcass dragged up into a fork]
  arch.bear: [a stump torn open for grubs, a smell of musk and the crack of a branch]
  arch.herd_beast: [hoofprints by the hundred, a rumble felt through the ground]
  arch.giant_vermin: ['webs across the path, thick as rope', husks of things sucked dry]
  arch.vermin_swarm: ['droppings everywhere, fresh', a squeaking in the walls that keeps pace]
  arch.reptile: [a smooth wide track through mud, a hiss from the reeds]
  arch.raptor: [a shadow crossing the sun twice, a carcass picked clean on a high rock]
  arch.water_beast: [something large rolling under the surface, the water birds all lifting at once]
  arch.monstrous_beast: [tracks of no animal you know, 'a scream like a woman''s, then silence']
  arch.brigand: [a cold fire with too many bootprints, a glint from the ridge where no one should be]
  arch.soldier: [the tramp of marching feet, a discarded ration tin with a regiment's mark]
  arch.knight: ['hoofprints of a heavy horse, shod', a pennon seen over a rise]
  arch.cultist: [a symbol daubed in blood on a stone, chanting carried on the wind at dusk]
  arch.folk_mage: [a ring of scorched grass, lights moving where there is no fire]
  arch.elf_warden: ['an arrow in a tree, a warning', birdcalls that are not birds]
  arch.dwarf_holdguard: [a stone marker in an old script, the sound of iron-shod boots in a gully]
  arch.orc: [a stake with a skull on it, 'drums at dusk, then smoke']
  arch.goblin: [crude snares by the dozen, giggling in the dark that stops when you stop]
  arch.gnoll: [bones cracked for marrow, 'a hyena laugh, many voices']
  arch.lizardfolk: ['a fish-trap of woven reed, newly set', eyes at water level watching]
  arch.ogre: [a footprint as long as your arm, a tree pulled up by its roots for a club]
  arch.troll: [a stench of rot from under the bridge, 'gnawed bones of a cow, and a man']
  arch.giant: [a boulder thrown into a field, the ground shaking in a slow rhythm]
  arch.skeleton: [old bones scattered and then gathered, 'a clatter in the dark, rhythmic']
  arch.zombie: [a smell of the grave on the wind, a figure standing very still in a field]
  arch.ghoul: [graves dug up from beneath, a smell of old meat and wet earth]
  arch.wight: [frost on the grass in summer, a barrow door standing open]
  arch.vampire: [livestock found bloodless, a pale figure watching from a window that should be empty]
  arch.ghost: [a cold spot that moves, a voice calling a name over and over]
  arch.wraith: [the warmth going out of the air, shadows that move against the light]
  arch.lich: ['a land of grey, dead things', the dead walking in ordered ranks]
  arch.deathlord: [a banner of bone on the horizon, every bird in the sky flying away]
  arch.fey_noble: [music from under a hill, a feast laid in a glade with no one there]
  arch.wild_fey: [knots in your gear you did not tie, laughter in the leaves]
  arch.hag: [charms of bone and hair hung from branches, a cottage that was not there yesterday]
  arch.place_spirit: [the land holding its breath, stones arranged where no hand placed them]
  arch.ancestor: [a grave-gift left fresh on an old mound, a voice in an old tongue]
  arch.celestial: [a light with no source, a feeling of being judged]
  arch.lesser_demon: [a smell of sulphur, scorched hoofprints that end in the air]
  arch.greater_demon: [the sky darkening at noon, animals fleeing in a flood]
  arch.tempter: [a stranger who knows your name, a gift on the path that you wanted]
  arch.enforcer: [chains dragged over stone, a seal burned into a door]
  arch.possessor: [a villager acting wrong, eyes that are not the person's own]
  arch.hellbeast: [paw-prints burned into the ground, a baying with a crackle of fire in it]
  arch.golem: ['heavy, perfectly regular footprints', a grinding of stone on stone]
  arch.animated: [things not quite where you left them, a rattle of armor in an empty hall]
  arch.clockwork: [a ticking in the walls, a brass gear dropped on the path]
  arch.homunculus: [tiny footprints in the dust, something small watching from a shelf]
  arch.fire_elemental: [grass burning in a line with no fire behind it, heat-shimmer moving against the wind]
  arch.earth_elemental: [the ground cracking in a line, rocks rolling uphill]
  arch.water_elemental: [a wave on a still pool, water standing in a shape]
  arch.air_elemental: [a whirlwind with no weather, a howl in a still sky]
  arch.frost_elemental: [frost spreading in a line, ice forming on running water]
  arch.great_dragon: [a shadow the size of a field, a burned village on the skyline]
  arch.drake: [scorched stones and a reek of brimstone, a roar from a crag]
  arch.wyvern: [a sheep carried off whole, a shriek from above]
  arch.wyrm: [a furrow through the land as wide as a road, a hiss like a forge]
  arch.aberration: [tracks that do not make sense, a headache that comes with a smell of copper]
  arch.ooze: [a slick trail that has eaten the stone, bones polished clean]
  arch.fungal: [puffballs bursting as you pass, a soft grey carpet where there was rock]
  arch.monstrous_plant: [vines across the path that were not there, a sweet smell and a drowsiness]
  arch.abomination: [things stitched together and left to rot, a lowing that is almost words]
