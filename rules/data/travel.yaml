  beat: act.find_way (10.4.2)
  tiers: [easy, moderate, hard, very_hard]
  reach: {0: 'off course: sealed nav.lost, veer by tbl.10.veer', 1: 'on course, the day''s pace one step slower', 2: on course,
    3: 'on course, +2 points per travel watch of the leg today', 4: 'as 3, and one undiscovered place in the area discovered'}
  levers: [map of the area, area mapped by the PC, slow pace, stars at night, a guide's Help]
  snags: [night without stars, 'fog, storm, snow, blizzard', fast pace]
  take_the_time: 'easy, moderate, hard: no roll, reach standard, each travel watch of the day earns half points'
  lost_reveal: [expected arrival + 1 travel watch, a way-finding beat while lost, recognition, 'a license or ability (stonesense:
      Certain underground)']
supply:
  unit: 1 supply = one person-day of food and water (08.9.4)
  load: 2 supply per load unit
  need: 1 per consumer per day; +1 in heat, scorching or arid without water_source
  half_rations: half need, rounded up per two consumers; long rest at best partial; a second consecutive day counts as without
    food
  want: one cond.exhausted stack per unfed consumer per day; 07.8.10 deprivation warning at three stacks; then S3 harm, no
    reduction
  order: [pc, companions, hirelings, mounts]
