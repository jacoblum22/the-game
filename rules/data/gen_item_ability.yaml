# data/gen_item_ability.yaml
# Purpose: the item-ability domain of the gate->fill generator (00.11): which active ability an item holds.
#   Pool = ch.04's absorbed natural powers (creature-gated) and ch.05's calling techniques (deed-gated); never authored anew.
# Owner: 08-items-loot-crafting (T-00-19). Schema: data/SCHEMAS.md#gen_item_abilityyaml plus the optional fields
#   documented in chapter 08's Tables section (T-08-1).
# GENERATED by rules/_process/simulation/08-gen_data08.py (validated against tags.yaml, effects.yaml + contrib,
#   conditions.yaml, licenses.yaml + contrib, abilities.yaml and gen_absorb.yaml). Edit the script, not this file.
# Every entry lifecycle: provisional (00.16.3).

schema_version: 1
lifecycle: provisional
domain: gen.item_ability
output_kind: ability
called_by: generate(gen.loot | gen.craft | gen.gift) when prop.bound_power fills a signature slot; the parent's source, circumstance and degree pass through
pool_gate:
  natural: entries sourced from gen_absorb.yaml gate on creature tags directly (a beast's trophy holds a beast's power)
  technique: entries sourced from abilities.yaml gate on deed tags; a source with no deed tags of its own uses source_to_deed (most specific matching key)
  never: [oath-gated or conduct-gated abilities (requires_conduct), adversary_only entries, 'passive abilities (an item passive is a property, not an ability)', 'an ability the bearer already holds (05.2.9:
      it stays dormant)']
source_to_deed:
  creature.beast: [deed.wilds, deed.martial.unarmed]
  creature.folk: [the archetype's evidence_tags (09)]
  creature.undead: [deed.arcane.necromancy, deed.divine.exorcism]
  creature.spirit: [deed.primal.spirits, deed.divine.revelation]
  creature.spirit.fey: [deed.arcane.illusion, deed.guile.deception, deed.primal.growth]
  creature.spirit.celestial: [deed.divine.healing, deed.divine.warding, deed.divine.smiting]
  creature.fiend: [deed.arcane.fire, deed.divine.pact, deed.influence.intimidation]
  creature.construct: [deed.arcane.warding, deed.craft.artifice]
  creature.elemental.fire: [deed.arcane.fire, deed.primal.elements]
  creature.elemental.frost: [deed.arcane.frost, deed.primal.elements]
  creature.elemental.air: [deed.arcane.storm, deed.primal.weather]
  creature.elemental.earth: [deed.arcane.earth, deed.primal.elements]
  creature.elemental.water: [deed.primal.elements, deed.primal.weather]
  creature.dragon: [deed.arcane.fire, deed.influence.intimidation, deed.martial.unarmed]
  creature.horror: [deed.arcane.mind, deed.arcane.alteration]
  org.faith: [deed.divine]
  org.order.knightly: [deed.martial, deed.divine.oaths]
  org.order.arcane: [deed.arcane]
  org.order.druidic: [deed.primal]
  org.order.hunters: [deed.wilds, deed.martial.archery]
  org.order.monastic: [deed.lore, deed.martial.unarmed]
  org.guild: [deed.craft, deed.influence.trade]
  org.crown.military: [deed.martial.tactics, deed.influence.command]
  org.outlaw: [deed.guile]
  org.cult: [deed.divine.pact, deed.arcane.necromancy]
  material.essence: [deed.arcane]
  material.wood.witchwood: [deed.arcane, deed.primal]
circumstances: 'inherited from the parent call (loot: decisive/costly/merciful/scavenged; craft: crafted/commissioned/improvised; gift: earned/favored/bargained)'
fill_map:
- {circumstance: decisive, fill_method: signature, note: 'the archetype''s signature_of absorbed power if one passes the gate, else weighted'}
- {circumstance: costly, fill_method: biased, bias_tag: ward}
- {circumstance: merciful, fill_method: chosen}
- {circumstance: scavenged, fill_method: weighted}
- {circumstance: crafted, fill_method: chosen}
- {circumstance: commissioned, fill_method: biased, bias_tag: the named bias}
- {circumstance: improvised, fill_method: weighted}
- {circumstance: earned, fill_method: chosen}
- {circumstance: favored, fill_method: signature}
- {circumstance: bargained, fill_method: chosen}
quality_rungs:
- {id: bound, signature_slots: 1, magnitude_slots: 0}
quality_map:
- {circumstance: any, degree: any, quality_rung: bound}
degree_effects: {critical_success: none (the parent's Greater already raised the tier), critical_failure: none}
tier_rule: {signature: the parent property's tier (prop.bound_power's tier), rank: tier 3 -> rank 1; 4 -> rank 2; 5+ -> rank 3; capped at the ability's authored ranks; an absorbed power uses its highest
    authored tier row <= the item tier}
recency_window: 5
slot_cap: 1
binding: {partition: 'equipped (05.2.8): one slot while the item is equipped and attuned', rank: 'the item''s stated rank, never a calling''s', cost: the ability's Focus at that rank + 1 relic surcharge
    when the holder has no training license at or above its first tag (05.6.3), evidence: 'feeds_evidence: false (00.11.5; 04 request 11): deeds done through it write no deed evidence', uses: 'its own limits,
    counted by the engine (00.10.9)'}
