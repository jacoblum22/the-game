# data/basic_verbs.yaml
# Purpose: the closed tier of fifteen basic verbs, always legal for every character (Principle VII);
#   the spine of the anchor library; plus the free activities.
# Owner: 00-architecture (ids, coverage, exclusions, attributes: 00.12.5, T-00-11) / 01-resolution
#   (anchor fields: knobs, degree tables, crude-fallback use, per entry, added under `anchor:`).
#   ch.01 anchor fields (optional keys beyond SCHEMAS' rule_id/knobs/degree_table, documented in 01 T-01-11):
#   intent_verbs, against, dc_default, reach_ladder, consequences, distinguish, and per-verb extras
#   (secret_frame_when, misleadable, claim_plausibility, eligibility, trigger_rule). degree_table.base
#   'generic' = 01.18.2, 'resisted' = 01.18.3; listed keys override the base row.
# Schema: data/SCHEMAS.md#basic_verbsyaml.
# Admission test: any able-bodied adult in the setting could attempt this with no training and a real chance.
# Basis: [C:VII]; [C:V]; [R7 §4.1]; [R6 §C.3 C-R4]; [DL-00A-19]

schema_version: 1

verbs:
  - id: verb.move
    name: Move
    covers: [reposition, dash, withdraw, slip through a crowd, travel on foot, "retreat (withdraw from a conflict; outcome per ch.07)"]
    excludes: [{what: flying or teleporting, needs: "a license (movement_mode or spell)"}]
    attribute: agility
    alt_attributes: [{attribute: might, when: "forcing a way through"}, {attribute: endurance, when: "long hauls"}]
    reach_unit: position or distance
    traits: [trait.action.move]
    anchor:
      rule_id: 01.18.4
      intent_verbs: [reposition, get past, dash, withdraw, slip through, retreat, travel on foot]
      against: 'an entity blocking the way: the higher of its agility or might defense; otherwise terrain tier (unopposed
        passable ground is trivial)'
      dc_default: tier
      obstacle_classes:   # 01.6.5 rubric [revision: R2-C; DL-01-29]: the obstacle class base sets the tier; one-rung nudge only with a cited intrinsic fact
      - {id: open_ground, base: trivial, examples: [walk a dry road, cross an empty yard]}
      - {id: crowd, base: easy, examples: [slip or push through a market crowd, find a seat in a packed inn]}
      - {id: rough_ground, base: easy, examples: [push through a thicket, cross mud or scree]}
      - {id: obstructed, base: moderate, examples: [get past a mob blocking a bridge, pick a way through a collapsed hall]}
      - {id: hazardous, base: by_hazard, examples: [dash across a burning hall (tier by the hazard's severity, 00.3.8)]}
      reach_ladder: {1: partway (one band or half the distance), 2: the intended position, 3: 'the position plus a favorable
          flag (flag.in_cover, flag.elevated) or without provoking a reaction', 4: as 3 plus a follow-up Precision lever}
      knobs:
      - knob: dc
        default: tier
        allowed_deltas: [opposed]
      - knob: attribute
        default: agility
        allowed_deltas: [might (forcing a way through), endurance (long haul)]
      - knob: action_cost
        default: 06 default
        allowed_deltas: [+1 through difficult ground]
      - knob: targets
        default: one obstacle
        allowed_deltas: ['a line of foes, each a snag']
      - knob: time_cost
        default: mode default
        allowed_deltas: [listed travel duration]
      - knob: reach_unit
        default: bands
        allowed_deltas: [place-graph steps]
      degree_table: {base: generic, failure: stays put or stops partway; threatened cost (usually footing or exposure)}
      consequences: [may provoke reactions (06), Retreat's outcome is ch.07's]
      distinguish:
      - {vs: verb.exert, test: 'passable ground (move) or a climb, jump or swim (exert)'}
      - {vs: verb.evade, test: going where you choose (move) or getting out of the way of a specific threat (evade)}
    lifecycle: provisional
  - id: verb.observe
    name: Observe
    covers: [search, study, listen, track by sight, read a person or a scene]
    excludes: [{what: reading an unknown script, needs: "a language or training license"}, {what: magical sight, needs: "a license"}]
    attribute: wits
    alt_attributes: [{attribute: intellect, when: "sustained study of a thing"}]
    reach_unit: information units (P17)
    traits: []
    anchor:
      rule_id: 01.18.5
      intent_verbs: [search, look for, study, listen, track, spot, read a person, read a scene, appraise]
      against: 'a hiding entity: its stored Sneak total; a person concealing a feeling or lie: the higher of their presence
        or wits defense (15 composes); an object or trail: its stored tier'
      dc_default: stored_or_tier
      obstacle_classes:   # 01.6.5 rubric [revision: R2-C; DL-01-29]: the obstacle class base sets the tier; one-rung nudge only with a cited intrinsic fact
      - {id: in_plain_view, base: trivial, examples: [read a posted notice in a known tongue, see who is in the room]}
      - {id: careless_concealment, base: easy, examples: [spot a carelessly hidden coin purse, hear voices through a door]}
      - {id: deliberate_concealment, base: moderate, examples: [find a hidden drawer in a desk, a letter tucked in a book]}
      - {id: clear_trail, base: moderate, examples: [follow a clear trail across hard ground]}
      - {id: expert_concealment, base: hard, examples: [a smuggler's false compartment, a hidden catch in a vault]}
      - {id: faint_trail, base: very_hard, examples: [track a ranger over rock in rain]}
      reach_ladder: {per: 'deliver_count(N, delivered reach), 01.10.4; a single question is answered at reach >= 1'}
      knobs:
      - knob: dc
        default: stored_or_tier
        allowed_deltas: [opposed]
      - knob: attribute
        default: wits
        allowed_deltas: [intellect (sustained study)]
      - knob: time_cost
        default: 1 interval per room in site mode
        allowed_deltas: [1 hour per building]
      - knob: targets
        default: one thing
        allowed_deltas: [an area]
      - knob: reach_unit
        default: information items
        allowed_deltas: [clock ticks (extended)]
      degree_table: {base: generic, failure: one vague impression of the top-ranked item, critical_failure: nothing
          reliable plus the heavier cost; a plausible falsehood only when the observed source can mislead}
      secret_frame_when: the target's existence, truth or nature is sealed or undetermined (01.4.7)
      consequences: [a thorough search of someone's place leaves traces]
      distinguish:
      - {vs: verb.recall, test: the answer is in front of you (observe) or in your head (recall)}
      - {vs: passive noticing, test: casual looking is free and only compares notice to concealment (01.4.6)}
    lifecycle: provisional
  - id: verb.recall
    name: Recall
    covers: [common knowledge of one's origin, culture and trade]
    excludes: [{what: specialist lore, needs: "a training license"}]
    attribute: intellect
    alt_attributes: []
    reach_unit: information units
    traits: []
    anchor:
      rule_id: 01.18.6
      intent_verbs: [remember, know, recognize, recall]
      against: 'tier by obscurity within common knowledge: easy (widely known in your culture), moderate (known to your
        trade), hard (the edge of common knowledge)'
      dc_default: tier
      obstacle_classes:   # 01.6.5 rubric [revision: R2-C; DL-01-29]: the obstacle class base sets the tier; one-rung nudge only with a cited intrinsic fact
      - {id: own_knowledge, base: trivial, examples: [your own name for a thing, your village's saint's day]}
      - {id: widely_known, base: easy, examples: [widely known in your culture]}
      - {id: trade_knowledge, base: moderate, examples: [known to your trade, a rival house's crest]}
      - {id: edge_of_common, base: hard, examples: [the edge of common knowledge, an old treaty's terms]}
      reach_ladder: {per: 'deliver_count(N, delivered reach)'}
      knobs:
      - knob: dc
        default: tier
        allowed_deltas: []
      - knob: attribute
        default: intellect
        allowed_deltas: [wits (in-the-moment recognition)]
      - knob: time_cost
        default: none
        allowed_deltas: [1 interval with reference works (a Precision lever)]
      degree_table: {base: generic, failure: a vague impression, critical_failure: 'a plausible falsehood (misleadable:
          true), small and correctable, plus the heavier cost'}
      misleadable: true
      distinguish:
      - {vs: free knowledge, test: 'the character certainly knows (free, 01.3.8) or might misremember (recall)'}
      - {vs: licensed lore, test: any adult of that background (recall) or a scholar (training license)}
    lifecycle: provisional
  - id: verb.talk
    name: Talk
    covers: [inform, persuade, deceive, intimidate, bargain, taunt, perform, "yield (surrender on terms; outcome per ch.07)"]
    excludes: [{what: speaking a language not held, needs: "a language license (fallback: gesture, tone, shared nouns)"}]
    attribute: presence
    alt_attributes: [{attribute: intellect, when: "reasoned argument"}, {attribute: might, when: "physical menace"}]
    reach_unit: standing steps or the NPC's action (ch.15)
    traits: [trait.action.speech]
    anchor:
      rule_id: 01.18.7
      intent_verbs: [persuade, convince, deceive, lie, intimidate, threaten, bargain, haggle, taunt, provoke, perform,
        inform, ask, surrender, yield]
      against: the listener's resolve defense (persuasion, intimidation, taunts) or wits defense (deception), composed
        by ch.15 with standing and claim plausibility
      dc_default: opposed
      obstacle_classes:   # 01.6.5 rubric [revision: R2-C; DL-01-29]: the obstacle class base sets the tier; one-rung nudge only with a cited intrinsic fact
      - {id: be_heard, base: easy, examples: [call out to travellers over wind, get a busy server's attention; nobody resists (any listener who resists: 15.3.3)]}
      reach_ladder: {1: a small concession or one standing step, 2: the listener does the reasonable thing asked, 3: 'more
          than asked (help, information, a favor)', 4: as 3 plus a follow-up Precision lever}
      knobs:
      - knob: dc
        default: opposed
        allowed_deltas: [tier (a crowd's mood)]
      - knob: attribute
        default: presence
        allowed_deltas: [intellect (reasoned argument), might (physical menace)]
      - knob: targets
        default: one listener
        allowed_deltas: ['a crowd (scale: reach limited unless a lever)']
      - knob: time_cost
        default: a few words
        allowed_deltas: ['a scene of negotiation (extended: tug clock)']
      - knob: reach_unit
        default: standing steps or the NPC's action
        allowed_deltas: [clock ticks]
      degree_table: {base: generic, failure: 'the listener says no (always a legitimate outcome); threatened cost, usually
          cost.closed_door', critical_failure: 'closed door one rung heavier (S3: standing -1)'}
      claim_plausibility: {doubtful: one snag, outrageous: reach limited, known_false_to_listener: G4 for the belief
          intent}
      consequences: [a successful lie leaves a commitment in the world (someone now believes it)]
      distinguish:
      - {vs: verb.setup, test: seeking the listener's decision (talk) or a moment's distraction to exploit (setup)}
      - {vs: verb.sneak, test: making them believe something false (talk) or making them not notice (sneak)}
    lifecycle: provisional
  - id: verb.strike
    name: Strike
    covers: [hit with body, weapon or improvised object, shoot, throw]
    excludes: [{what: weapon techniques, needs: "an ability license"}]
    attribute: might
    alt_attributes: [{attribute: agility, when: "finesse, aimed or thrown"}]
    reach_unit: harm severity steps
    traits: [trait.action.attack]
    anchor:
      rule_id: 01.18.8
      intent_verbs: [hit, attack, stab, cut, shoot, throw at, punch, bash, cut down, knock out]
      against: 'the target''s attack defense (06; default agility defense); an object: tier by size and distance'
      dc_default: opposed
      obstacle_classes:   # 01.6.5 rubric [revision: R2-C; DL-01-29]: the obstacle class base sets the tier; one-rung nudge only with a cited intrinsic fact
      - {id: large_near_object, base: easy, examples: [hit a barrel or a door at arm's length]}
      - {id: small_or_far_object, base: moderate, examples: [hit a hanging sack at 30 ft]}
      - {id: tiny_and_far, base: hard, examples: [cut a hanging rope with an arrow at 60 ft]}
      reach_ladder: {per: 'harm severity = weapon base (08; unarmed S1; improvised = the weapon it resembles, else S1)
          shifted by (delivered reach - 2): 1 -> -1 step, 2 -> base, 3 -> +1, 4 -> +2'}
      knobs:
      - knob: harm_severity
        default: weapon base
        allowed_deltas: [improvised by resemblance, a dropped hazard's severity]
      - knob: harm_tags
        default: weapon's
        allowed_deltas: [the hazard's]
      - knob: dc
        default: opposed
        allowed_deltas: [object tier]
      - knob: targets
        default: one
        allowed_deltas: [an object whose fall affects the one beneath]
      - knob: reach_unit
        default: harm
        allowed_deltas: [object state]
      - knob: action_cost
        default: 06 default
        allowed_deltas: []
      degree_table: {base: generic, failure: a miss (in conflict usually Safe), critical_failure: 'heavier cost, often
          footing or gear'}
      consequences: [repeated-attempt window (01.14.3), ammunition used, audible; loud with metal on metal]
      distinguish:
      - {vs: verb.force, test: harm (strike) or position/object state (force)}
      - {vs: effects beyond harm, test: 'pin, disarm or trip are not free riders: force, grapple or setup, or a declared
          Great-reach clause'}
    lifecycle: provisional
  - id: verb.grapple
    name: Grapple
    covers: [seize, hold, pin, restrain, snatch a held item, mount a large creature]
    excludes: []
    attribute: might
    alt_attributes: [{attribute: agility, when: "slipping or breaking a hold"}]
    reach_unit: condition on the target
    traits: [trait.action.attack]
    anchor:
      rule_id: 01.18.9
      intent_verbs: [grab, seize, hold, wrestle, pin, restrain, snatch, tackle and hold, climb onto, break free]
      against: the higher of the target's might or agility defense; to break a hold, the holder's might defense
      dc_default: opposed
      reach_ladder: {1: cond.grabbed S1 (held; may still act), 2: cond.grabbed S2, 3: cond.restrained, 4: cond.pinned,
        snatch: reach >= 2 takes the item; 1 knocks it loose, mount: reach >= 2 sets flag.mounted on the creature}
      knobs:
      - knob: condition
        default: cond.grabbed
        allowed_deltas: [cond.restrained, cond.pinned, cond.choking (a choking method only)]
      - knob: dc
        default: opposed
        allowed_deltas: []
      - knob: attribute
        default: might
        allowed_deltas: [agility (slip or break a hold)]
      - knob: targets
        default: one
        allowed_deltas: ['a large creature (scale: reach limited unless levers)']
      - knob: duration
        default: until released or broken
        allowed_deltas: []
      degree_table: {base: generic, failure: no hold; threatened cost usually footing}
      consequences: []
      distinguish:
      - {vs: verb.force, test: the actor keeps hold (grapple) or the target is moved away or down (force)}
    lifecycle: provisional
  - id: verb.force
    name: Force
    covers: [shove, trip, topple, break, burst, pry]
    excludes: [{what: picking a lock, needs: "lic.training.guile_thievery (or equivalent)"}]
    attribute: might
    alt_attributes: []
    reach_unit: condition or object state
    traits: []
    anchor:
      rule_id: 01.18.10
      intent_verbs: [shove, push, trip, topple, knock over, break, smash, burst, pry, bend, lift a bar off]
      against: 'a creature: the higher of its might or agility defense; an object: stored tier by hardness and make'
      dc_default: opposed_or_tier
      obstacle_classes:   # 01.6.5 rubric [revision: R2-C; DL-01-29]: the obstacle class base sets the tier; one-rung nudge only with a cited intrinsic fact
      - {id: flimsy, base: easy, examples: [kick in a rotten board, burst a wicker gate]}
      - {id: sound_fitting, base: moderate, examples: [force an iron hasp set in old oak]}
      - {id: reinforced, base: hard, examples: [break down a barred door, prise open an iron-bound chest]}
      reach_ladder:
        creature: {1: cond.off_balance, 2: pushed one band or cond.prone, 3: 'pushed two bands, or prone and off-balance',
          4: as 3 plus a follow-up lever}
        object: {1: weakened (next force gains a Precision lever), 2: 'broken, burst or open', 3: open and usable, 4: as
            3 plus a follow-up lever}
      knobs:
      - knob: dc
        default: opposed_or_tier
        allowed_deltas: []
      - knob: condition
        default: cond.off_balance
        allowed_deltas: [cond.prone]
      - knob: targets
        default: one
        allowed_deltas: [a stack or shelf onto several]
      - knob: time_cost
        default: one action
        allowed_deltas: [an interval of prying (hard objects)]
      - knob: reach_unit
        default: bands or condition
        allowed_deltas: [object state]
      degree_table: {base: generic, failure: it holds, critical_failure: 'heavier cost, often gear (the bar snaps) or
          footing'}
      consequences: [breaking is trait.sense.loud whatever the degree, a broken thing stays broken]
      distinguish:
      - {vs: verb.handle, test: overcoming the object's resistance (force) or using it as meant (handle)}
    lifecycle: provisional
  - id: verb.exert
    name: Exert
    covers: [climb, jump, swim, lift, balance, run far]
    excludes: []
    attribute: might
    alt_attributes: [{attribute: agility, when: "balance or a precise leap"}, {attribute: endurance, when: "sustained effort"}]
    reach_unit: success or position
    traits: []
    anchor:
      rule_id: 01.18.11
      intent_verbs: [climb, jump, leap, vault, swim, lift, carry, haul, balance, run far, hold a door shut, push through
          a current]
      against: tier, stored per obstacle and signature (a climb and a vault of one wall are separate DCs)
      dc_default: tier
      obstacle_classes:   # 01.6.5 rubric [revision: R2-C; DL-01-29]: the obstacle class base sets the tier; one-rung nudge only with a cited intrinsic fact
      - {id: easy_holds, base: trivial, examples: [climb a knotted rope with handholds, nothing below]}
      - {id: ordinary_effort, base: easy, examples: [climb a rough stone wall with good holds, carry a sack of grain or a wounded adult a short way]}
      - {id: hard_climb, base: moderate, examples: [climb a crumbling wall, swim a strong current, cross a rope bridge]}
      - {id: gap_leap, base: hard, examples: [leap a 12-ft gap from a running start]}
      - {id: extreme, base: very_hard, examples: [swim a flooded river in spate in full clothes]}
      - {id: limit, base: legendary, examples: [hold a collapsing gate alone for a minute, climb a smooth well shaft without gear]}
      reach_ladder: {1: 'partway (half the height, a ledge)', 2: the whole distance, 3: the whole distance with time
          saved or a favorable position, 4: as 3 plus a follow-up lever}
      knobs:
      - knob: dc
        default: tier
        allowed_deltas: [tier re-derived for a tool-changed obstacle]
      - knob: attribute
        default: might
        allowed_deltas: [agility (balance, precise leap), endurance (sustained)]
      - knob: time_cost
        default: one action
        allowed_deltas: [rounds per 10 ft on long climbs (10)]
      - knob: stakes
        default: height
        allowed_deltas: [current, cold water]
      - knob: reach_unit
        default: distance
        allowed_deltas: [clock ticks (long climbs, swims, runs)]
      degree_table: {base: generic, failure: does not get there; threatened cost usually harm from the height or footing}
      consequences: [audible when heavy]
      distinguish:
      - {vs: verb.endure, test: acting in a burst (exert) or holding out (endure)}
      - {vs: verb.force, test: the body's own movement or burden (exert) or defeating an object's resistance (force)}
    lifecycle: provisional
  - id: verb.evade
    name: Evade
    covers: [dodge, duck, take cover, get clear of a hazard]
    excludes: []
    attribute: agility
    alt_attributes: []
    reach_unit: stakes reduction
    traits: [trait.action.move]
    anchor:
      rule_id: 01.18.12
      intent_verbs: [dodge, duck, dive clear, take cover, get out of the way, jump aside]
      against: the effect DC of what is evaded; tier for reaching cover under threat
      dc_default: effect
      obstacle_classes:   # 01.6.5 rubric [revision: R2-C; DL-01-29]: the obstacle class base sets the tier; one-rung nudge only with a cited intrinsic fact
      - {id: cover_near, base: easy, examples: [duck behind the cart beside you]}
      - {id: cover_far, base: moderate, examples: [reach cover across an open yard under threat]}
      reach_ladder:
        resisting: 01.18.3
        cover: {1: partial cover (a Protective fact next beat), 2: flag.in_cover, 3: cover plus a clear line of retreat,
          4: as 3 plus a follow-up lever}
      knobs:
      - knob: dc
        default: effect
        allowed_deltas: [tier]
      - knob: targets
        default: self
        allowed_deltas: [self and one adjacent ally]
      - knob: time_cost
        default: reaction or action (06)
        allowed_deltas: []
      - knob: stakes
        default: the effect's severity
        allowed_deltas: []
      degree_table: {base: resisted}
      consequences: []
      distinguish:
      - {vs: verb.endure, test: getting out of the way (evade) or taking it and holding out (endure)}
    lifecycle: provisional
  - id: verb.sneak
    name: Sneak
    covers: [hide, move quietly, conceal an object, palm]
    excludes: [{what: disguise as a specific person, needs: "a license"}]
    attribute: agility
    alt_attributes: [{attribute: wits, when: "blending into a crowd or picking the moment"}]
    reach_unit: exposure-clock effect
    traits: []
    anchor:
      rule_id: 01.18.13
      intent_verbs: [hide, sneak, creep, slip past unseen, conceal, palm, shadow, lift from a pocket]
      against: 'the highest notice (wits defense) among observers who could perceive the actor; no observer and no listening
        clock: not costly, no roll'
      dc_default: opposed
      reach_ladder: {1: unnoticed for part of the stretch, 2: unnoticed for the whole stretch (one ride), 3: unnoticed
          and in position (flag.hidden at the chosen spot), 4: as 3 plus a follow-up lever}
      knobs:
      - knob: dc
        default: opposed
        allowed_deltas: []
      - knob: attribute
        default: agility
        allowed_deltas: [wits (blend in, pick the moment)]
      - knob: targets
        default: one watcher
        allowed_deltas: [a watched area (highest notice)]
      - knob: time_cost
        default: mode default
        allowed_deltas: []
      - knob: reach_unit
        default: stretch
        allowed_deltas: [clock ticks against an alarm]
      degree_table: {base: generic, failure: 'threatened cost, almost always cost.exposure'}
      consequences: []
      distinguish:
      - {vs: verb.observe, test: avoiding notice (sneak) or gaining it (observe)}
    lifecycle: provisional
  - id: verb.handle
    name: Handle
    covers: [use an object as its nature suggests, crude making and repair, "first aid (stabilize only)", calm or lead an animal, ride]
    excludes: [{what: surgery, needs: "a medicine license"}, {what: smithing and fine crafts, needs: "a craft license"}, {what: lockpicking, needs: "a training license"}, {what: mounted combat, needs: "a license"}]
    attribute: agility
    alt_attributes: [{attribute: wits, when: "improvised use"}, {attribute: intellect, when: "knowledge-driven use"}, {attribute: presence, when: "animals"}, {attribute: by_license, when: "a small working of magic (05.7.6): the school's casting attribute (integration: IR ch.05 to 01)"}]
    reach_unit: object or condition state
    traits: [trait.action.manipulate]
    anchor:
      rule_id: 01.18.14
      intent_verbs: [use, operate, light, tie, rig, patch, mend, bandage, stabilize, calm an animal, lead, ride, cook,
        improvise a tool]
      against: 'objects: tier; an animal: its resolve defense with disposition (15); a dying character: ch.07''s stabilize
        DC'
      dc_default: tier
      obstacle_classes:   # 01.6.5 rubric [revision: R2-C; DL-01-29]: the obstacle class base sets the tier; one-rung nudge only with a cited intrinsic fact
      - {id: ordinary_use, base: trivial, examples: [open an unlocked or unbarred door, light a lamp, saddle a calm horse]}
      - {id: awkward, base: easy, examples: [lift a sticking latch quietly, mend a torn strap]}
      - {id: crude_work, base: moderate, examples: [crude repair of a wagon wheel on the road]}
      reach_ladder: {1: works partly or briefly, 2: works as intended, 3: works well (holds for the scene; the animal
          follows willingly), 4: as 3 plus a follow-up lever, repair: 'crude repair removes damaged, never broken'}
      knobs:
      - knob: dc
        default: tier
        allowed_deltas: [opposed (animals)]
      - knob: attribute
        default: agility
        allowed_deltas: [wits (improvised use), intellect (knowledge-driven), presence (animals), "the license's attribute (a small working, 05.7.6)"]
      - knob: time_cost
        default: one action
        allowed_deltas: [1 interval for a crude repair]
      - knob: duration
        default: one use
        allowed_deltas: [the scene]
      degree_table: {base: generic}
      consequences: []
      distinguish:
      - {vs: verb.force, test: using it as meant (handle) or overcoming its resistance (force)}
      - {vs: craft licenses, test: 'a result anyone could cobble together (handle) or a made thing needing skill (license;
          fallback handle, reach limited)'}
    lifecycle: provisional
  - id: verb.endure
    name: Endure
    covers: [resist cold, resist poison, resist disease, resist fear, resist pain, hold breath, keep going]
    excludes: []
    attribute: endurance
    alt_attributes: [{attribute: resolve, when: "fear, pain, temptation, domination"}]
    reach_unit: avoids or reduces a condition
    traits: []
    anchor:
