    - guard_me
    - hold_him
    - harry_that_one
    - hold_this_ground
    - stay_back
    default: guard_me
    fallback: stay_back
journey_roles:
- id: navigator
  allowed_at: any pace; any moving watch
  source: travel.yaml#roles
- id: lookout
  allowed_at: slow, normal, ride, camp
  source: travel.yaml#roles
  kn.keen_eyes: +1 band
- id: scout
  allowed_at: slow, normal, ride
  source: travel.yaml#roles
  note: starts encounters at band.far from the party
- id: forager
  allowed_at: slow (normal with kn.forager)
  source: travel.yaml#roles
- id: quartermaster
  allowed_at: any pace; any camp watch
  requires: kn.quartermaster or lic.training.wilds_survival
  effect: 'once per day, a depletion face rows 1-4 (tbl.10.depletion) is prevented: the face counts as a lull without its
    progress point'
  evidence_tag: deed.wilds.survival.provisioning
role_defaults:
  navigator: highest base on deed.wilds.navigation
  lookout: highest Wits base among the rest
  scout: 'slow/normal pace: an ally with lic.training.wilds_tracking or lic.training.guile_stealth'
  forager: 'slow pace: an ally with lic.training.wilds_foraging'
  night_rota_max_watches: 2
downtime_duties:
- id: rest
  effect: 'convalesce: heals as haven bed rest (07.8.7)'
- id: work
  effect: its keep is paid by its work; a hireling on work is owed no wage this week
- id: train
  effect: trains toward a knack under a teacher (15.11; fees 7/25/100 a week)
- id: gather_word
  effect: 15's dt.ask_around once, with the ally's Talk numbers
- id: assist
  effect: one Precision lever on the PC's week activity roll, if eligible (01.14.8)
- id: tend
  effect: Treat the PC or another daily (07.8.8); needs kn.healer or the medicine license
- id: keep
  effect: minds a holding (managed_this_week, 11) or a posted task
- id: errands
  effect: buys and sells at list price; carries messages
- id: leave
  effect: its grievance clock -1 more than its decay
upkeep:
  hireling: wage by template (economy.yaml#wages); on a venture accrues, paid at the next haven
  companion_follower_keep_week: 4
  keep_free_when:
  - lodged at the PC's holding or haven
  - its downtime duty is work
  beast: upkeep_week from base_items.yaml when stabled; nothing when grazing
  venture_supply_per_day: 1
  large_beast_not_grazing_supply_per_day: 2
  unpaid_hireling_leaves_after_weeks: 2
  shares:
    half: 1/2 of one equal part
    full: one equal part
  handler: h.16.retinue_upkeep (week, phase 4, after h.08.upkeep)
follower_templates:
  deed.martial: cmp.sworn_sword
  deed.guile: cmp.thief
  deed.wilds: cmp.scout
  deed.lore: cmp.sage
  deed.arcane: cmp.apprentice
  deed.divine: cmp.acolyte
  deed.primal: cmp.hedge_witch
  deed.influence: cmp.minstrel
  deed.craft: cmp.apprentice
  oath: cmp.zealot
follower_offers:
  trigger: reflection, phase 8, after h.04.recognition_pass
  max_per_season: 1
  conditions:
  - a confirmed calling tier >= 2 with a carrier witness in the last season
  - a rank granting followers (11)
  own_band: max(1, band_cap - 1)
  standing: 2
  joining: oath
  first_value: the calling's conduct evidence axis when it has one
growth:
  season_band_rise: 1
  conditions:
  - own band below the template max_band
  - served the whole season
  - two conflicts defeating a foe of threat band >= its own band, or one hard/lethal conflict
  knacks_max: 3
  abilities_max: 3
  train_knacks_per_season: 1
  protege:
    seats: 1
    oath_seat: false
    max_tier: 3
    band_from_tier: tier + 1
    competence_clamp: c_b + 1
    replace_beyond: 3
advisory:
  rule: one word gentler with at least one able ally (09.6.3)
  able: conscious; Warm or better or its contract hazard covers the stakes; serving band >= band_cap
  hard_exception: a hard estimate whose no-ally win is below 75 stays hard
  max_shift: 1
