knacks:
- id: kn.trained
  name: Trained hand
  scope: holds one named training license at grade trained (expert from serving band 3)
  effects:
  - effect_id: eff.grant_license
    params:
      license: per template or training
      grade: trained|expert
      duration: permanent
- id: kn.shieldbearer
  name: Shieldbearer
  scope: while under guard_me and in the PC's group, the PC has +1 Guard edge
  effects:
  - effect_id: eff.defense_edge
    params:
      amount: 1
      attribute: guard
      applies_when: the shieldbearer ally is in the PC's group under the order guard_me
      target: pc
- id: kn.steadfast
  name: Steadfast
  scope: never takes the automatic stay_back of 16.7.4
  flag: steadfast
- id: kn.healer
  name: Healer
  scope: holds lic.training.lore_medicine (trained) and a healer's kit (three uses a week)
  effects:
  - effect_id: eff.grant_license
    params:
      license: lic.training.lore_medicine
      grade: trained
      duration: permanent
- id: kn.keen_nose
  name: Keen nose
  scope: Observe to track or find by scent, and Help on it, holds a Precision lever
  effects:
  - effect_id: eff.grant_lever
    params:
      type: precision
      for_verbs:
      - verb.observe
      - verb.help
      for_tags:
      - deed.wilds.tracking
      duration: permanent
- id: kn.keen_eyes
  name: Keen eyes
  scope: as lookout, arrivals seen one band farther again; Observe to spot at distance holds a Precision lever
  effects:
  - effect_id: eff.grant_lever
    params:
      type: precision
      for_verbs:
      - verb.observe
      for_tags: []
      duration: permanent
- id: kn.sentinel
  name: Sentinel
  scope: in camp, sleepers are never unaware at an arrival
  effects:
  - effect_id: eff.write_fact
    params:
      subject: camp
      predicate: alarm
      value: true while the sentinel is in the camp
- id: kn.war_trained
  name: War-trained
  scope: 'a mount: steady in conflict, no Handle beat each round (16.15.4); a beast of family beast: may take harry_that_one
    and hold_this_ground'
  flag: war_trained
- id: kn.pack_beast
  name: Pack beast
  scope: carries its template's carry for the party; forage-fed on grass (10.8.2)
  flag: pack
- id: kn.quartermaster
  name: Quartermaster
  scope: may hold the journey role quartermaster (16.8.3)
  flag: role.quartermaster
- id: kn.sign_trained
  name: Signs
  scope: hears commands by hand signs within sight (06.14.2)
  flag: hears.signs
- id: kn.rally
  name: Rally
  scope: 'once per conflict, when the PC is first Staggered and this ally is Friendly or warmer, conscious and within band.near:
    cond.frightened and cond.broken end on the PC'
  effects:
  - effect_id: eff.cleanse
    params:
      condition_or_category: cond.frightened, cond.broken
      target: pc
    hook: on_vitality_threshold
    limits:
      per: conflict_end
      uses: 1
- id: kn.bodyguard
  name: Bodyguard
  scope: may Intercept while bloodied; harm taken by an Intercept reduced by 1 more (cap 4)
  effects:
  - effect_id: eff.harm_reduction
    params:
      amount: 1
      harm_tags:
      - harm
      applies_when: intercepting for the PC
- id: kn.loyal
  name: Loyal
  scope: cannot be courted or turned (11's suborn; 16.6.6) while Neutral or warmer
  flag: loyal
- id: kn.forager
  name: Forager
  scope: may hold the forager role at normal pace (10.5.3)
  flag: role.forager_normal
loyalty_contract:
- standing: 3
  accepts: lethal
  guard_me: yes, even bloodied; may Intercept with no order
  unpaid_grace_weeks: 4
  loses_heart: never
  leaves: never by loyalty
- standing: 2
  accepts: lethal
  guard_me: 'yes while not bloodied (kn.bodyguard: even bloodied)'
  unpaid_grace_weeks: 2
  loses_heart: never
  leaves: null
- standing: 1
  accepts: dire_not_lethal
  guard_me: yes while not bloodied
  unpaid_grace_weeks: 0
  loses_heart: when the PC is Staggered
  leaves: null
- standing: 0
  accepts: risky
  guard_me: no (unless its contract duty is to guard the PC)
  unpaid_grace_weeks: 0
  loses_heart: first bloodied; another ally falls in sight; the PC is Staggered
  leaves: hireling unpaid two weeks
- standing: -1
  accepts: safe (and Defend, Withdraw, stay_back)
  guard_me: 'no'
  default_order: stay_back
  leaves: departure clock completes (16.6.2)
- standing: -2
  accepts: withdraw and stay_back only
  guard_me: 'no'
  default_order: stay_back
  leaves: next scene_end not in danger, announced
- standing: -3
  accepts: nothing
  guard_me: 'no'
  leaves: at once, or betrays (16.6.6)
contract_acceptance:
  R1: risky
  R2: risky
  R3: dire_not_lethal
  R4: lethal
  R5: lethal
oath_acceptance: a follower at Warm or warmer accepts lethal
loyalty_clocks:
- id: clk.16.regard
  name: <Name>'s regard
  kind: progress
  segments: 6
  visibility: sensed
  direction: fill
  decay: []
  on_complete:
    effects:
    - effect_id: eff.15.standing_step
      params:
        target: <ally>
        toward: pc
        steps: 1
        cap: friendly
        reason: 16.5.3 regard
    interrupting: false
    then: reset
  weekly_cap: counts against 15.1.7's +1 per NPC per week unless the cycle held an R3 tick; a capped completion waits at 5
- id: clk.16.grievance
  name: <Name>'s grievance
  kind: danger
  segments: 6
  visibility: sensed
  direction: fill
  decay:
  - boundary: week
    ticks: -1
    only_if: no tick since last week
  on_complete:
    effects:
    - effect_id: eff.15.standing_step
      params:
        target: <ally>
        toward: pc
        steps: -1
        cap: devoted
        reason: 16.5.3 grievance
    interrupting: false
    then: reset
  then_scene: confrontation (16.5.9)
- id: clk.16.departure
  name: <Name> means to leave
  kind: countdown
  segments: 4
  visibility: public
  direction: fill
  auto_ticks:
  - boundary: day
    ticks: 1
    condition: null
  tick_sources:
  - 'on': clk.16.grievance tick
    ticks: 1
  void_when: standing >= 0
  on_complete:
    effects:
    - effect_id: eff.write_fact
      params:
        subject: <ally>
        predicate: departs_at
        value: next scene_end not in danger
    interrupting: false
    then: close
- id: clk.16.held_line
  name: The line at <place>
  kind: tug
  segments: 6
  start: 3
  visibility: public
  direction: tug
  tick_sources:
  - 'on': round end fortune check of the holders
    ticks: CS +3; S +delivered reach; F -1; CF -2
  - 'on': a PC beat against the held group
    ticks: delivered_reach
  links:
  - when: complete
    action: the held foes are defeated or flee
  - when: reaches:0
    action: the held foes join the PC's fight next round
  sizes:
    skirmish: 4
    default: 6
    battle_corner: 8
loyalty_sources:
- id: R1
  clock: regard
  ticks: 1
  when: an evidence event on one of the ally's value axes with its pole, witnessed by the ally
  cap: once per axis per scene
- id: R2
  clock: regard
  ticks: 2
  when: a resolved deed serves the ally's recorded want (15.3.5 Want test)
  cap: once per want per season
- id: R3
  clock: regard
  ticks: 1
  star: true
  when: the ally fought on the PC's side in a conflict advised hard or lethal and both stood or were stabilized at conflict_end
  cap: once per scene
- id: R4
  clock: regard
  ticks: 1
  when: coin, goods or share beyond what is owed, worth >= 1 Unit of the ally's weekly lifestyle
  cap: once per week
  absent_too: true
- id: R5
  clock: regard
  ticks: 1
  when: venture_end of a venture the ally completed that held a conflict or a day of want
  cap: once per venture
- id: R6
  clock: regard
  ticks: 1
  when: 'the ally''s counsel (16.5.7) was heeded: the PC withdrew or changed the declaration'
  cap: once per scene
- id: R7
  clock: regard
  ticks: 1
  when: a resolved beat ticked the ally's personal thread
  cap: once per scene
- id: G1
  clock: grievance
  ticks: 1 (2 when the ally was commanded to do it)
  when: an evidence event on one of the ally's value axes against its pole, witnessed by the ally
  cap: once per axis per scene
- id: G2
  clock: grievance
  ticks: 3
  when: the ally was made to act across its line by leverage or intimidation
- id: G3
  clock: grievance
  ticks: 1
  when: at scene_end, the ally faced stakes above its contract hazard and rung acceptance because the PC brought it there
  cap: once per scene
- id: G4
  clock: grievance
  ticks: 1 (hireling 2)
  when: at the week boundary a wage or keep due was not paid
  cap: once per week
  absent_too: true
- id: G5
  clock: grievance
  ticks: 2
  when: a contract share due at venture_end was not paid
  cap: once per venture
- id: G6
  clock: grievance
  ticks: 2
  when: a lie by the PC about the job or the danger was exposed to the ally
  cap: once per lie
- id: G7
  clock: grievance
  ticks: 1 (3 if left among enemies and later returns)
  when: the ally was Down or bleeding out and was not tended or carried out by the PC or on the PC's command before scene_end
  cap: once per scene
- id: G8
  clock: grievance
  ticks: 1
  when: the ally went without food a day, or without a long rest two days, while the PC did not
  cap: once per day
- id: G9
  clock: grievance
  ticks: 1
  when: an ally toward whom it stands Unfriendly or worse stayed in the retinue all week; or a cohort's named leader stands
    Wary or worse
  cap: once per week
- id: G10
  clock: grievance
  ticks: 1
  when: another ally died after being commanded into a lethal frame or left behind, witnessed by this ally
  cap: once per death
beast_sources:
- id: B1
  clock: regard
  ticks: 1
  when: fed and watered every day of the week
  cap: once per week
- id: B2
  clock: regard
  ticks: 1
  when: groomed and kept by the PC's own hand at least one day this week
  cap: once per week
- id: B3
  clock: regard
  ticks: 3
  when: stabilized or carried out by the PC or on the PC's command (also 15's rescue +2)
- id: B4
  clock: regard
  ticks: 1
  when: fought beside the PC in a hard or lethal conflict and both stood at the end
  cap: once per scene
- id: G-B1
  clock: grievance
  ticks: 1
  when: went without food or water a day
  cap: once per day
- id: G-B2
  clock: grievance
  ticks: 2
  when: struck or harmed by the PC
- id: G-B3
  clock: grievance
  ticks: 1
  when: ridden at hard ride or loaded over half for two consecutive watches
- id: G-B4
  clock: grievance
  ticks: 1
  when: left Down or bleeding (G7's test)
loyalty_omens:
  regard:
    stirring:
    - a nod
    - a joke at the PC's expense that is really affection
    - it shares its water first
    building:
    - it tells a small story from its past unasked
    - it uses the PC's name
    - it takes the worse watch unasked
    imminent:
    - it says something it has never said
    - it gives the PC something of its own
  grievance:
    stirring:
    - silence where there was talk
    - a look held a beat too long
    - it eats apart
    building:
    - an open complaint naming the cause
    - it does its duty slowly
    imminent:
    - an ultimatum naming the cause and what it will do if it happens again
hire_sizes:
- rung: R1
  name: camp work
  when: day labor in a settlement or haven
- rung: R2
  name: safe road
  when: safe or settled country, nights in havens or camps, no fight expected
- rung: R3
  name: venture
  when: wild or perilous country, a site, or a fight with no recorded lethal context
- rung: R4
  name: deadly
  when: deadly country, a foe with a recorded lethal context, or a site whose danger clock is known imminent
- rung: R5
  name: forlorn
  when: near-certain death or against its own kin, faction or faith; wages never buy it
hire_terms:
  wage_in_advance: one Payment term, no price test
  hazard_pay: 'wage doubled: a second term'
  max_terms: 2
  r5_not_reducible_by_wages: true
  settlement_max_band:
    camp: 1
    village: 1
    town: 2
    city: 3
  champion: 'band 4: needs a Want term on a thread they believe in'
  legend: 'band 5: never for coin'
join_sizes:
- rung: R2
  when: following costs nothing they value
- rung: R3
  when: a season away from a trade, a post or a home they can return to
- rung: R4
  when: leaving home or family duty for good, or walking into a known lethal danger
- rung: R5
  when: betraying lord, kin or faith, or abandoning dependents
drives:
  tbl.16.drive_values:
    axis_d10:
    - conduct.mercy
    - conduct.honesty
    - conduct.courage
    - conduct.loyalty
    - conduct.generosity
    - conduct.justice
    - conduct.humility
    - conduct.restraint
    - conduct.piety
    - conduct.protection
    pole_d6:
      1-5: 1
      '6': -1
    second_roll: reroll a repeated axis
  tbl.16.drive_cunning:
  - d6: 1
    name: greed
    value:
      axis: conduct.generosity
      pole: -1
  - d6: 2
    name: fear
    value:
      axis: conduct.courage
      pole: -1
  - d6: 3
    name: appetite
    value:
      axis: conduct.restraint
      pole: -1
  - d6: 4
    name: pride
    value:
      axis: conduct.humility
      pole: -1
  - d6: 5
    name: spite
    value:
      axis: conduct.mercy
      pole: -1
  - d6: 6
    name: cunning
    value:
      axis: conduct.honesty
      pole: -1
  want: 12.11.1 top-ranked want
  refusal: 12.11.1 refusal (tbl.npc_refusal); rolled at joining if none
tables:
- id: tbl.16.hire_quirk
  die: d12
  results:
  - 'cheap: asks a quarter less and expects to be cheated'
  - 'eager: young and keen, never been farther than the next village'
  - 'scarred: an old wound; knows what a fight costs'
  - 'devout: prays at every shrine; will not work on a holy day'
  - 'a drinker: steady until there is drink'
  - 'knows the country: one route link known (a lever on way-finding there)'
  - 'quiet: says little, sees much'
  - 'a talker: knows every rumor in the last three towns'
  - 'owes money: someone will come asking'
  - 'proud: was something more once'
  - 'superstitious: reads omens in everything (and is sometimes right)'
  - 'kin nearby: a family it sends its pay to'
- id: tbl.16.posted_task
  die: d6
  results:
    '1': a complication at the place (a thread hook, 11)
    2-5: the task kept
    '6': the task kept and one rumor learned (11)
- id: tbl.16.personal_thread
  die: d12
  results:
  - a lost kinsman to find
  - a debt to someone dangerous
  - a wrong done to its family
  - a home to win back
  - a name to clear
  - a vow it cannot keep alone
  - a teacher to find
  - a rival to face
  - a thing it stole and must return
  - a place it fled
  - a child it left
  - a faith it lost
  rule: sealed truth; >= 3 clue placements; a proactive fallback (a person from its past arrives)
tbl.16.betrayal:   # keyed by its table id so roll_table resolves it (integration)
- d6: 1
  opportunity: valuables in its reach
  betrayal: steals the most valuable non-relic item it can carry and leaves by night
- d6: 2
  opportunity: a secret of the PC's it knows
  betrayal: sells it to whoever would pay most
  writes: record_knowledge(buyer); 11 attention/notice +U(S2)
- d6: 3
  opportunity: a faction courting it
  betrayal: joins them with what it knows
- d6: 4
  opportunity: a crime of the PC's it witnessed
  betrayal: informs the authority of the place
  writes: wanted fact (15/11)
- d6: 5
  opportunity: on watch while the PC sleeps
  betrayal: 'slips away: no lookout that night'
- d6: 6
  opportunity: a conflict where its leaving matters
  betrayal: Withdraws and leaves the fight
  writes: advisory recomputed
betrayal_conditions:
- standing Hostile
- its grievance imminent omen was rendered at least once
- not kn.loyal
- an opportunity fact exists
departure_causes:
- dismissed
- contract_end
- unpaid
- loyalty_wary
- loyalty_unfriendly
- loyalty_hostile
- want_fulfilled
- overflow
- death
- working_ended
- pc_retired
command_scope:
  person: any basic verb within its line; its knacks' licenses; its abilities; Help, Setup, Flank, Screen; first aid (Treat
    with kn.healer); carry a fallen body
  cohort: Strike, Grapple (holds one), Force, Move, Defend, Screen, Help, carry the fallen; Sneak only as a group (all must)
  beast: Strike, Grapple, Move, Setup (bark, harass, flush, swoop), Help on Strike/Grapple/Observe, carry (large beasts)
  mount: its rider's Move; one attack when commanded
  bound: what its working allows; otherwise as a beast
  scene_ally_led: as a person of its template, by its standing's acceptance
