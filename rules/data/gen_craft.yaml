# data/gen_craft.yaml
# Purpose: the crafting domain of the gate->fill generator (00.11; constitution P5 sixth pass): the material
#   gates the property pool (00.11.2), the manner of making picks the fill; type-tier x quality-tier per R2 #13.
# Owner: 08-items-loot-crafting (T-00-19). Schema: data/SCHEMAS.md#gen_craftyaml plus the optional fields
#   documented in chapter 08's Tables section (T-08-1).
# GENERATED by rules/_process/simulation/08-gen_data08.py (validated against tags.yaml, effects.yaml + contrib,
#   conditions.yaml, licenses.yaml + contrib, abilities.yaml and gen_absorb.yaml). Edit the script, not this file.
# Every entry lifecycle: provisional (00.16.3).

schema_version: 1
lifecycle: provisional
domain: gen.craft
output_kind: item
pool_ref: item_properties.yaml#properties where domains contains craft
source: 'the material set: one primary material (mat.*, which must carry a material tag of the base item''s make) plus at most one reagent (an essence, gem or special stock); gate tags = the union of their
  gates + creature.folk (the maker''s hand: folk-made mundane properties are open to every crafted thing) + the harvested parts'' provenance source tags'
circumstances:
- {id: crafted, true_only_when: 'the PC (or a companion under the PC''s command) makes it under the base item''s make.license (any grade), with that trade''s tools, at a workplace (a forge for metal, a
    bench for wood or leather, a still for alchemy)', false_for: 'work without the license, the tools or the workplace (improvised); work done by a paid crafter (commissioned)'}
- {id: commissioned, true_only_when: 'an NPC crafter holding the make.license is paid to make it; the player names the base, the materials, the target rung and one bias tag', false_for: 'a companion''s
    work (crafted, under the PC''s command); a gift (gen.gift)'}
- {id: improvised, default: true, true_only_when: 'anything made without one of the license, the trade tools or a workplace: field work with a knife and what is at hand (the license''s crude_fallback, 01)',
  false_for: licensed work at a workplace with tools}
fill_map:
- {circumstance: crafted, fill_method: chosen}
- {circumstance: commissioned, fill_method: biased, bias_tag: the player's named bias tag}
- {circumstance: improvised, fill_method: weighted}
recipe_override: 'when the maker knows a recipe for a property (fact knows_recipe: prop.* or a held text with teaches: prop.*), that property may be named for one slot and is filled by recipe (deterministic)
  in place of the circumstance''s method'
signature_rule: 'the signature slot of a crafted or commissioned masterwork or wondrous item is filled by the PRIMARY material''s signature: for a harvested part, the signature of the archetype it was taken
  from (its provenance: Monster Hunter''s carve-to-craft model); for bought stock, materials.yaml fallback_signature; if neither exists, by the circumstance''s fill among signature_eligible entries in the
  gated pool; an improvised item never has a signature slot'
target_rungs:
- {rung: worn, obstacle_tier: easy, clock: 4}
- {rung: common, obstacle_tier: easy, clock: 4}
- {rung: fine, obstacle_tier: moderate, clock: 6}
- {rung: masterwork, obstacle_tier: hard, clock: 8}
- {rung: wondrous, obstacle_tier: very_hard, clock: 12}
grade_caps:
  none (improvised): {max_rung: common, note: 'fine only with a critical completing beat (Greater raises the rung by one, not a tier)'}
  trained: {max_rung: masterwork, tier_cap: 2}
  expert: {max_rung: wondrous, tier_cap: 4}
  master: {max_rung: wondrous, tier_cap: 5}
quality_map_mode: relative_to_target
quality_map:
- {circumstance: any, degree: progress clock completes first, quality_rung: the declared target}
- {circumstance: any, degree: spoilage clock completes first, quality_rung: 'none: the work is ruined; primary material consumed, reagent kept'}
quality_rungs:
- {id: worn, index: 1, signature_slots: 0, magnitude_slots: 0}
- {id: common, index: 2, signature_slots: 0, magnitude_slots: 0}
- {id: fine, index: 3, signature_slots: 0, magnitude_slots: 1}
- {id: masterwork, index: 4, signature_slots: 1, magnitude_slots: 1}
- {id: wondrous, index: 5, signature_slots: 1, magnitude_slots: 2}
degree_effects: {critical_success: greater, critical_failure: flawed}
degree_effect_rules: {greater: 'the completing beat is a critical success: one property +1 tier (may exceed tier_cap by 1); for an improvised item, the rung rises one (common -> fine) instead', flawed: 'the
    spoilage clock stands at its last-but-one segment or later (3 of 4; 5 of 6) when the progress clock completes: one property slot holds a flaw from the primary material''s flaws, else from item_properties.yaml#flaws
    (engine-drawn among those that apply)'}
tier_rule: {tier_cap: 'min(the grade cap''s tier_cap, the highest rarity_band among the materials, 5); a band-0 stock material counts as band 1', signature: tier_cap, magnitude: 'tier_cap - 1, minimum 1'}
recency_window: 5
slot_cap: the base item's slot_cap
project_clock:
  kind: project
  visibility: public
  segments: by target rung (4/6/8/12)
  tick_sources:
  - {'on': a resolved crafting step (the maker's frame), ticks: delivered_reach}
  decay:
  - {boundary: week, ticks: -1, only_if: no tick since last week}
  time_per_tick: the base item's make.time_per_tick
  racing:
    name: spoilage
    segments: 4 (6 for a wondrous target)
    kind: danger
    visibility: public
    tick_sources:
    - {'on': a failed crafting step, ticks: U(severity of the step's cost)}
step_frame: {verb: 'verb.handle (crafted, improvised) -- the make license''s methods', attribute: 'the make license''s attribute (smithing Might, woodcraft Agility, alchemy and enchanting Intellect ...)',
  deed_tag: the base item's make.deed_tag, dc: the target rung's obstacle tier, stakes: 'risky (a failed step ticks spoilage U(S2) = 1 and takes one cost: cost.time or cost.gear on the materials; a critical
    failure ticks U(S3) = 2; a near miss may be taken as success at a cost with cost.time, which ticks no spoilage)', levers: 'the trade''s tools (Precision, required for licensed work), a master''s workshop
    (Precision), a recipe for the named property (Amplifying)'}
materials_consumed: {primary: 'price units: a common item consumes stock worth half its base price (rounded down, minimum 1); fine x1; masterwork x2; wondrous x4 -- in the material''s own coins', reagent: 'one
    unit, consumed on completion or ruin'}
