# data/traps.yaml
# Purpose: traps (10.14): trigger, telltale (the no-gotcha rule, 10.14.3), detection and disarm tiers by
#   site band, the victim's resisted check, harm by band, effects and afflictions, alarm ticks on the site's
#   danger clock, reset, ways round (bypass rows), lethal context, aftermath; plus the eight ways of dealing
#   with a perceived trap (T-10-19), the springing rule, and PC-made traps.
# Owner: 10-exploration-travel-sites (owner-block 13 for regional traps).
# Schema: data/SCHEMAS.md#trapsyaml (id, detect {verb, dc_tier}, disarm {license, dc_tier}, trigger, harm
#   {severity, harm_tags}, effects) with ch.10's band-indexed forms dc_tier_by_band and severity_by_band
#   (index 0 = band 1) and optional keys kind, telltale, telltale_kind_by_band (subtle only where the band's harm is S1-S2), resist, affliction, alarm_ticks,
#   reset, bypass, lethal_context, aftermath, notes; top-level ways, springing, telltale_rule, pc_made.
# Basis: [10.14] [07.3.3, 07.10] [R5 AV-08] [R1 §07 traps that always counter the players] [DL-10-17]

schema_version: 1
traps:
- id: trap.pit
  name: Covered pit
  kind: mechanical
  tags: [deed.guile.thievery.traps]
  trigger: weight on the false floor
  telltale: a stretch of floor cleaner than the dust around it, and a faint seam
  telltale_kind_by_band: [subtle, subtle, plain, plain, plain]
  detect:
    verb: verb.observe
    attribute: wits
    dc_tier_by_band: [easy, moderate, hard, very_hard, legendary]
  disarm:
    license: lic.training.guile_thievery
    verb: verb.handle
    dc_tier_by_band: [moderate, hard, very_hard, legendary, legendary]
  resist: {verb: verb.evade, attribute: agility}
  harm:
    severity_by_band: [S2, S2, S3, S3, S4]
    harm_tags: [harm.physical.crush]
  effects:
  - effect_id: eff.apply_condition
    params: {condition: cond.prone, severity: S1, duration: scene, target: victim}
  affliction: null
  alarm_ticks: 0
  reset: manual
  bypass:
  - {method: jump the seam, verb: verb.exert, tier: 'by width: 5 ft easy, 10 ft moderate'}
  - {method: spike the lid shut, verb: verb.handle, tier_delta: -1}
  - {method: walk the edge, verb: verb.exert, tier: moderate}
  lethal_context: false
  aftermath: at the bottom of the pit (10 ft at band 1-2, 20 ft at 3-4, 40 ft at 5); climbing out is act.climb
  lifecycle: provisional
  basis: &id001 ['10.14', 07.3.3, '07.10', R5 AV-08]
