# data/item_properties.yaml
# Purpose: the shared property pool of the gate->fill generator (00.11): every item property any domain
#   (gen.loot, gen.craft, gen.gift) can place on an item, as effect references with tiers, mod groups, gate tags,
#   excluded tags and base kinds; plus the flaws used by the Flawed degree effect.
# Owner: 08-items-loot-crafting (T-00-19). Schema: data/SCHEMAS.md#item_propertiesyaml plus the optional fields
#   documented in chapter 08's Tables section (T-08-1).
# Optional PoolEntry fields (T-08-1): kind (mundane | passive | license | item_ability), family (the modifier
#   family or behavior class, for the item share of 08.2), item_share (what one instance contributes to a capped
#   family), bias (ward | strike | sense | move | social | craft | arcane: the closed bias-tag list of biased
#   fills), domains, place_gated (eligible when the scene's place tags match even if the source's do not, 08.3.4),
#   signature_only, relic, saturated_by, per-tier trigger {hook, chance, params} and limits, value_by_tier.
#   Gate matching is 00.5.4c: an entry gated on G matches a source tag S when G == S or G is an ancestor of S.
# GENERATED by rules/_process/simulation/08-gen_data08.py (validated against tags.yaml, effects.yaml + contrib,
#   conditions.yaml, licenses.yaml + contrib, abilities.yaml and gen_absorb.yaml). Edit the script, not this file.
# Every entry lifecycle: provisional (00.16.3).

schema_version: 1
lifecycle: provisional
bias_tags: [ward, strike, sense, move, social, craft, arcane]
tier_rule: 'a property at tier t uses its highest authored tier row <= t (00.11.3 step 8: fixed values per tier, no rolled ranges)'
