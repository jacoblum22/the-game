# data/rituals.yaml
# Purpose: the rites (rituals): magic too large for one beat, run as clocked extended tasks (01.14.6; 00.8).
#   A rite is KNOWN, not held: it takes no ability slot (05.2.3). 24 authored rites, and the tables by which a
#   new rite is designed in play (05.8.4): four scales, eight conditions.
# Owner: 05-abilities-focus-magic (T-00-19). Rules: 05.8. Schema: data/SCHEMAS.md#ritualsyaml (License fields +
#   clock, components, time_per_tick, failure_costs, effects). Optional fields added by ch.05: scale, grade,
#   requires, dc_tier, strain_clock, miscast, canon_check. Each rite creates TWO racing clocks: `clock`
#   (progress, ticked by delivered reach) and `strain_clock` (danger, 4 segments, ticked by U(severity) of a
#   failed step); the first to fill decides the rite (00.8.5).
# Generated by rules/_process/simulation/05-gen_data05/gen_data05.py; every effect is validated against effects.yaml.
# Basis: [00.17.1 Q7, Q20] [R5 MG-04] [R: https://www.dungeonworldsrd.com/classes/wizard/]
#   [R: https://earthdawn.fandom.com/wiki/Spellcasting] [DL-05-24]

schema_version: 1
lifecycle: provisional
procedure: PR-05-5 (perform), PR-05-6 (design)
scales:
- {id: personal, anchor: one willing being or one object in hand; lasts a scene to a day, research_clock: 8, grade: trained, segments: 4, dc_tier: moderate, focus: 1, conditions: 1}
- {id: local, anchor: 'a room, a small group, or one unwilling being; lasts days', research_clock: 8, grade: trained, segments: 6, dc_tier: hard, focus: 2, conditions: 2}
- {id: site, anchor: 'a building, a grove, a company of people; lasts a season', research_clock: 12, grade: expert, segments: 8, dc_tier: very_hard, focus: 3, conditions: 3}
- {id: regional, anchor: 'a valley, a town, a host; lasts a season or leaves a permanent mark', research_clock: 12, grade: master, segments: 12, dc_tier: legendary, focus: 4, conditions: 4}
design_conditions:
  id: tbl.05.rite_conditions          # the table's own id, so roll_table resolves it (integration)
  table: tbl.05.rite_conditions
  die: d8
  draw: the scale's number of conditions, without repeats (roll_table)
  results:
  - {range: 1, id: time, text: The rite's time_per_tick is one step longer (interval -> hour -> watch -> day).}
  - {range: 2, id: first_you_must, text: A prerequisite deed must be done first; it is written as a thread (ch.11).}
  - {range: 3, id: help, text: Two more participants who hold the rite's training license are required.}
  - {range: 4, id: material, text: One component of the price band above the rite's row is required and consumed.}
  - {range: 5, id: lesser, text: 'The rite''s reach is capped at Limited: its effects apply at one rung or one step less.'}
  - {range: 6, id: danger, text: 'The strain clock has 3 segments, not 4.'}
  - {range: 7, id: sacrifice, text: 'A relic or enchanted item is consumed, or the leader''s maximum Focus is 1 lower until the next season boundary (the player chooses).'}
  - {range: 8, id: place, text: The rite can be performed only at one named place of resonance.}
custom_rites: {id_form: rit.custom.<n>, lifecycle: provisional; permanent when completed twice; retired at the second season boundary if never completed, effects: 'one to three effect references with parameters inside their declared ranges, or an existing ability''s effects at larger scale'}
learn_clock:
  name: learning <rite>
  kind: project
  segments: 6
  visibility: public
  tick_sources:
  - {'on': a training week with one who knows it, ticks: 3}
  - {'on': a week of study from its text, ticks: 2}

rituals:
- id: rit.ward_threshold
  name: Ward the Threshold
  kind: spell
  tags: [deed.arcane.divination.detection, trait.nature.magical, trait.action.concentrate, trait.duration.lasting]
  principle: Set a watch on an opening that tells its maker when it is crossed.
  scope: Ward up to three doors, windows or gates of one building for a week. When a being crosses a warded opening you know it at once, wherever you are, and which opening; a crosser who did not speak the pass-word rolls Endure (Resolve) against your effect DC or is dazed until the end of its next turn.
  excludes:
  - {what: knowing who crossed, needs: rit.scrying_pool; investigation (15)}
  - {what: barring the opening, needs: rit.seal_the_way}
  scale: local
  grade: trained
  attribute: intellect
  requires: {license: lic.training.arcane_divination, knowledge: 'the rite''s text (an item with the fact teaches: rit.ward_threshold) or a teacher; learned on a 6-segment project clock (05.8.7)', participants: 1, place: null}
  cost: {focus: 2}
  components: ['silver dust or thread enough to line the opening (price band 1, ch.08)']
  time_per_tick: intervals:1
  dc_tier: hard
  clock:
    name: Ward the Threshold
    kind: progress
    owner: '05'
    segments: 6
    visibility: public
    direction: fill
    tick_sources:
    - {'on': a resolved step of the rite (the leader's frame), ticks: delivered_reach, condition: null}
    auto_ticks: []
    decay:
    - {boundary: watch, ticks: -1, only_if: no tick since last watch}
    on_complete:
      effects:
      - {effect_id: eff.write_fact, params: {subject: each warded opening, predicate: warded_by, value: 'the leader, for days:7'}}
      - {effect_id: eff.tick_clock, params: {clock: an alarm the leader perceives, ticks: 1}}
      - {effect_id: eff.force_check, params: {verb: endure, effect_dc_source: the leader's effect DC, degree_table: 01.18.3}}
      - {effect_id: eff.apply_condition, params: {condition: cond.dazed, severity: S1, duration: 'rounds:1', target: a crosser who fails}}
      interrupting: false
      then: close
    races_with: the rite's strain clock
    links:
    - {when: 'reaches:0', action: 'void:the rite''s strain clock'}
  strain_clock:
    name: 'Ward the Threshold: the working frays'
    kind: danger
    owner: '05'
    segments: 4
    visibility: public
    direction: fill
    tick_sources:
    - {'on': a failed step of the rite, ticks: U(severity), condition: null}
    auto_ticks: []
    decay: []
    on_complete:
      effects:
      - {effect_id: eff.write_fact, params: {subject: the rite, predicate: failed, value: components consumed; the leader suffers the backlash miscast at S3 (05.7.5)}}
      interrupting: false
      then: close
    races_with: the rite's progress clock
    links: []
  failure_costs: [cost.time, cost.drain, cost.exposure]
  effects:
  - {effect_id: eff.write_fact, params: {subject: each warded opening, predicate: warded_by, value: 'the leader, for days:7'}}
  - {effect_id: eff.tick_clock, params: {clock: an alarm the leader perceives, ticks: 1}}
  - {effect_id: eff.force_check, params: {verb: endure, effect_dc_source: the leader's effect DC, degree_table: 01.18.3}}
  - {effect_id: eff.apply_condition, params: {condition: cond.dazed, severity: S1, duration: 'rounds:1', target: a crosser who fails}}
  miscast: backlash
  crude_fallback: none
  stretch: null
  emulate: null
  acquisition_paths:
  - {type: mentor, detail: 'taught by one who knows it: 3 ticks per training week', clock: 'clk.learn_rite (6 segments, project, public)', requires: the training license at the rite's grade}
  - {type: project, detail: 'studied from its text: 2 ticks per week', clock: 'clk.learn_rite (6 segments, project, public)', requires: the training license at the rite's grade; the text}
  - {type: discovery, detail: 'found as a text, an inscription or a spirit''s teaching (ch.10, ch.13)', clock: null, requires: null}
