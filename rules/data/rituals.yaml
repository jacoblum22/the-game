  kind: spell
  tags: [deed.arcane.summoning.binding, trait.nature.magical, trait.action.concentrate, trait.duration.lasting]
  principle: Hold one otherworldly being inside a drawn boundary.
  scope: Draw a circle that holds one spirit, fiend, elemental or summoned being for a day. While the circle is whole the being cannot leave it, cannot harm or work on anything outside it, and can be spoken with; each watch it may roll Endure (Resolve) against your effect DC to break the circle. A break of the line by anyone ends the binding.
  excludes:
  - {what: compelling its service, needs: bargain with it (verb.talk; ab.spirit_bargain)}
  - {what: a being native to this world, needs: G4 for this rite}
  scale: local
  grade: expert
  attribute: intellect
  requires: {license: lic.training.arcane_summoning, knowledge: 'the rite''s text (an item with the fact teaches: rit.circle_of_binding) or a teacher; learned on a 6-segment project clock (05.8.7)', participants: 1, place: null}
