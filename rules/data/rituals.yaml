      - {effect_id: eff.restrict, params: {forbid: {methods: [leaving the circle, acting on anything outside the circle]}, target: the bound being, duration: 'days:1'}}
      - {effect_id: eff.force_check, params: {verb: endure, effect_dc_source: the leader's effect DC, degree_table: 'success by the bound being at a watch boundary: the circle breaks'}}
      - {effect_id: eff.write_fact, params: {subject: the circle, predicate: holds, value: the bound being}}
      interrupting: false
      then: close
    races_with: the rite's strain clock
