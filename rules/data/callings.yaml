# data/callings.yaml
# Purpose: every calling (the ruleset's word for class) and every number of the recognition and growth system:
#   the requirement sets (Delve-style dual thresholds), the confidence confirmations and policy cutoffs, the tier
#   ladder and what each tier grants, picks, seats, provisional status, the Fraying, consolidation and power_band.
#   A calling is a DERIVED LABEL over the character's evidence (constitution P5). It hands out no ability list:
#   a tier grants competence values, grades in the shared training licenses, the five universal capability
#   licenses, picks into the shared tag-gated ability pool of data/abilities.yaml (ch.05), and (hybrids only) one
#   bounded named composite.
# Owner: 04-recognition-and-growth (T-00-19). Rules: 04-recognition-and-growth.md. Generated by the scratchpad
#   script gen_data04.py from compact tables (copied to rules/_process/simulation/04-gen_data04.py); every key
#   tag is validated against data/tags.yaml (one proposed tag: data/tags.yaml (adopted from the 04 proposals at integration)).
# Schema: data/SCHEMAS.md#callingsyaml. Required fields are present on every entry. Optional fields added by
#   ch.04 (documented in 04 Tables, T-04-2): breadth, family, pole, attributes, pool_gate, variant_of,
#   variant_requirement, hybrid, roads, consolidates_from, special_capability, generator, price, boon, org_tags;
#   per tier: name, training_grade, picks_total, band, focus_generation_rank, boon_rank.
#   `thresholds` and `tiers[].crystallization.requirement` hold ids that resolve in `requirements` below.
#   A hybrid's `competence` tags are written "road:<branch>": the value applies to the road chosen for that branch.
# Calibration: rules/_process/simulation/04-recognition-sim.md (scripts 04-recog04.py, 04-feat04.py).
# Basis: [C:P2] [C:P5] [C:V] [C:VI] [C:VII] [R2 04, #1, #2, #5, #6, #10] [R3 04.1-04.21, #4, #5, #6, #10, #11]
#   [R6 A, V1-V14] [03.9] [DL-04-01..DL-04-24]

schema_version: 1
lifecycle: provisional

# ---------------------------------------------------------------------------------------------------------------
# Tier ladder (04.5). The maximum tier is 5. Names are out-of-fiction codex words, never spoken in the world.
# ---------------------------------------------------------------------------------------------------------------
tier_ladder:
  max_tier: 5
  names: [Called, Proven, Tempered, Exalted, Paragon]
  competence:                      # value at the calling's competence tag(s), by tier (00.3.6; cap +6)
    fine:   [3, 4, 5, 5, 6]        # key at level 3
    narrow: [3, 4, 5, 5, 6]        # key at level 2
    broad:  [2, 3, 4, 4, 5]        # key at level 1 (a whole branch)
    hybrid: [2, 3, 4, 4, 5]        # on two roads: one level-2 tag in each branch
    vow:    [0, 0, 0, 0, 0]
    dark:   [0, 0, 0, 0, 0]
  training_grade:                  # grade held in every training license (05) whose first tag is at or under the key
    fine:   [trained, trained, expert, expert, master]
    narrow: [trained, trained, expert, expert, master]
    broad:  [trained, trained, trained, expert, expert]
    hybrid: [trained, trained, trained, expert, expert]   # on the two roads only
  capabilities:                    # universal; license definitions in data/licenses.yaml owner-block 04
    1: [lic.call.mark]
    2: [lic.call.proof]
    3: [lic.call.sure_hand]
    4: [lic.call.masters_eye]
    5: [lic.call.open_art]
  picks_total:                     # cumulative picks into the calling partition (04.8.4)
    deed: [2, 3, 4, 5, 6]          # specialists and hybrids
    oath: [1, 1, 2, 2, 3]          # vows and dark callings
  ability_rank: "1 + floor((calling tier - ability min_tier) / 2), capped at the ability's highest authored rank"
  attribute_increase: {at_tier: 4, amount: 1, once_per_lifetime: true, cap: 4, from: "the calling's `attributes` list (player's choice)"}
  focus_generation_rank: {tier_2: 1, tier_4: 2}          # specialists only; restated, never added
  composite_rank: {tier_1: 1, tier_3: 2, tier_5: 3}      # hybrids only; restated, never added
  boon_rank: {tier_1: 1, tier_3: 2, tier_5: 3}           # vows and dark callings; restated, never added
  permanence_at: 5                 # a Paragon calling cannot lapse and cannot be revoked (04.9.6)

power_band:                        # 04.5.6: power_band(pc) = max over held, unsuspended callings (provisional included), minimum 1
  by_tier:
    fine:   [1, 2, 3, 4, 5]
    narrow: [1, 2, 3, 4, 5]
    broad:  [1, 2, 3, 4, 4]
    hybrid: [1, 2, 3, 4, 4]
    vow:    [1, 1, 1, 2, 2]
    dark:   [1, 1, 1, 2, 2]
  unrecognized: 1

# ---------------------------------------------------------------------------------------------------------------
# Requirement sets (04.3). Every value is read through ch.03's sealed functions (03.9). "weighted", "recent":
# tally(); "counted": counted().units; "quality_events": detail().by_quality.difficult + .challenging;
# "distinct_scenes": detail().distinct.scenes; "great_deeds": settled deeds at the key with challenge_band >= the
# tier being entered (detail().by_band), at least one of them a success (detail().peak_band >= the tier);
# "crises": detail().crises; "contexts": detail().distinct.contexts. For tiers 2-5 the non-cumulative fields are
# measured SINCE the calling's last crystallization (detail(tag, since)).
# ---------------------------------------------------------------------------------------------------------------
requirements:
  counted_rule: "counted = weighted threshold / 10, rounded down; cnt.training units count for at most half of it (03.5.5)"
  req.fine.1:   {primary: {weighted: 60,   quality_events: 6, distinct_scenes: 5}, secondary: {counted: 6}}
  req.fine.2:   {primary: {weighted: 150,  since: {quality_events: 10, distinct_scenes: 8,  great_deeds: 5, crises: 0, contexts: 0}}, secondary: {counted: 15}}
  req.fine.3:   {primary: {weighted: 330,  since: {quality_events: 14, distinct_scenes: 10, great_deeds: 6, crises: 2, contexts: 0}}, secondary: {counted: 33}}
  req.fine.4:   {primary: {weighted: 600,  since: {quality_events: 18, distinct_scenes: 12, great_deeds: 6, crises: 3, contexts: 5}}, secondary: {counted: 60}}
  req.fine.5:   {primary: {weighted: 975,  since: {quality_events: 22, distinct_scenes: 14, great_deeds: 4, crises: 4, contexts: 5}}, secondary: {counted: 97}}
  req.narrow.1: {primary: {weighted: 80,   quality_events: 6, distinct_scenes: 5}, secondary: {counted: 8}}
  req.narrow.2: {primary: {weighted: 200,  since: {quality_events: 10, distinct_scenes: 8,  great_deeds: 5, crises: 0, contexts: 0}}, secondary: {counted: 20}}
  req.narrow.3: {primary: {weighted: 440,  since: {quality_events: 14, distinct_scenes: 10, great_deeds: 6, crises: 2, contexts: 0}}, secondary: {counted: 44}}
  req.narrow.4: {primary: {weighted: 800,  since: {quality_events: 18, distinct_scenes: 12, great_deeds: 6, crises: 3, contexts: 5}}, secondary: {counted: 80}}
  req.narrow.5: {primary: {weighted: 1300, since: {quality_events: 22, distinct_scenes: 14, great_deeds: 4, crises: 4, contexts: 5}}, secondary: {counted: 130}}
  req.broad.1:  {primary: {weighted: 120,  quality_events: 6, distinct_scenes: 5, children: {count: 3, each_weighted: 30}, top_child_share_max: {num: 2, den: 3}}, secondary: {counted: 12}}
  req.broad.2:  {primary: {weighted: 300,  since: {quality_events: 10, distinct_scenes: 8,  great_deeds: 5, crises: 0, contexts: 0}}, secondary: {counted: 30}}
  req.broad.3:  {primary: {weighted: 660,  since: {quality_events: 14, distinct_scenes: 10, great_deeds: 6, crises: 2, contexts: 0}}, secondary: {counted: 66}}
  req.broad.4:  {primary: {weighted: 1200, since: {quality_events: 18, distinct_scenes: 12, great_deeds: 6, crises: 3, contexts: 5}}, secondary: {counted: 120}}
  req.broad.5:  {primary: {weighted: 1950, since: {quality_events: 22, distinct_scenes: 14, great_deeds: 4, crises: 4, contexts: 5}}, secondary: {counted: 195}}
  # hybrids: `min` is cooccurrence(a, b).min over the two branches; counted is required on EACH branch;
  # tiers 2-5 sum the since-fields over both branches and need at least one great deed on each.
  req.hybrid.1: {primary: {min: 60,  balance_min: {num: 2, den: 5}, joint_scenes: 5, recent_min: 15, per_branch: {quality_events: 4, distinct_scenes: 4}}, secondary: {counted_each: 6}}
  req.hybrid.2: {primary: {min: 150, balance_min: {num: 2, den: 5}, since: {quality_events: 10, distinct_scenes_each: 4, great_deeds: 5, great_deeds_each: 1, crises: 0, contexts: 0}}, secondary: {counted_each: 15}}
  req.hybrid.3: {primary: {min: 330, balance_min: {num: 2, den: 5}, since: {quality_events: 14, distinct_scenes_each: 5, great_deeds: 6, great_deeds_each: 1, crises: 2, contexts: 0}}, secondary: {counted_each: 33}}
  req.hybrid.4: {primary: {min: 600, balance_min: {num: 2, den: 5}, since: {quality_events: 18, distinct_scenes_each: 6, great_deeds: 6, great_deeds_each: 1, crises: 3, contexts: 5}}, secondary: {counted_each: 60}}
  req.hybrid.5: {primary: {min: 975, balance_min: {num: 2, den: 5}, since: {quality_events: 22, distinct_scenes_each: 7, great_deeds: 4, great_deeds_each: 1, crises: 4, contexts: 5}}, secondary: {counted_each: 97}}
  # vows: conduct(axis). net_share = net / pos compared as a rational pair.
  req.vow.1: {primary: {pos: 16,  net_share_min: {num: 3, den: 4}, recent_net: 6, strain: 0, forbidden: 0}}
  req.vow.2: {primary: {pos: 40,  net_share_min: {num: 3, den: 4}, recent_net: 6, strain: 0, forbidden: 0}}
  req.vow.3: {primary: {pos: 80,  net_share_min: {num: 3, den: 4}, recent_net: 6, strain: 0, forbidden: 0, scenes_since_negative: 24}}
  req.vow.4: {primary: {pos: 140, net_share_min: {num: 3, den: 4}, recent_net: 6, strain: 0, forbidden: 0, scenes_since_negative: 24}}
  req.vow.5: {primary: {pos: 220, net_share_min: {num: 3, den: 4}, recent_net: 6, strain: 0, forbidden: 0, scenes_since_negative: 48}}
  # dark callings: the mirror on the negative pole. neg = unatoned negative points.
  req.dark.1: {primary: {neg: 16,  neg_share_min: {num: 3, den: 4}, recent_net_max: -6}}
  req.dark.2: {primary: {neg: 40,  neg_share_min: {num: 3, den: 4}, recent_net_max: -6}}
  req.dark.3: {primary: {neg: 80,  neg_share_min: {num: 3, den: 4}, recent_net_max: -6}}
  req.dark.4: {primary: {neg: 140, neg_share_min: {num: 3, den: 4}, recent_net_max: -6}}
  req.dark.5: {primary: {neg: 220, neg_share_min: {num: 3, den: 4}, recent_net_max: -6}}
  # variants: the narrow requirement of the same tier AND the added requirement (written "req.narrow.N+<variant>")
  req.variant.monk:     {added: {conduct: {axis: conduct.restraint, net: 8, strain: 0, forbidden: 0}}}
  req.variant.devourer: {added: {opponent_kinds_non_folk_at_root: 5, counted_defeat_at_root: 20, crisis_against_non_folk: 1}, offered_only_by: [veh.V13]}
  # the shadow shows (04.9.1); the Fraying stages (04.9.2)
  req.shadow:           {any_shadow_axis: {recent_net_max: -6}, or_strain_min: 4}
  req.fraying.1:        {strain_min: 4}
  req.fraying.2:        {strain_min: 8}
  req.fraying.3:        {strain_min: 12, or_forbidden_min: 1}
  req.fraying_dark.1:   {recent_net_min: 4}
  req.fraying_dark.2:   {recent_net_min: 8}
  req.fraying_dark.3:   {recent_net_min: 12}

# ---------------------------------------------------------------------------------------------------------------
# Confidence and the three-valued policy (04.4)
# ---------------------------------------------------------------------------------------------------------------
policy:
  confidence:                      # for an ELIGIBLE deed-keyed candidate: the count of confirmations that hold, 0..5
    confirmations:
      - {id: K1, name: Current, test: "2 * recent(key) >= W1", meaning: "the character is living this now"}
      - {id: K2, name: Rising,  test: "2 * recent(key) >= weighted(key)", meaning: "at least half of all the evidence is recent"}
      - {id: K3, name: Central, test: "5 * weighted(key) >= weighted(deed)", meaning: "the key holds at least a fifth of everything the character has done"}
      - {id: K4, name: Leading, test: "weighted(key) is among the three largest in profile(deed, level of key)", meaning: "one of the character's three strongest nodes at its level"}
      - {id: K5, name: Margin,  test: "4 * weighted(key) >= 5 * W(tier)", meaning: "a quarter past the line: no single event (max 16, 03.4.2) put it there"}
    currency_floor: "4 * recent(key) >= W1"        # below it the candidate is stale: abstain
    W1: "the candidate ladder's tier-1 weighted threshold (fine 60, narrow 80, broad 120)"
  cutoffs:
    grant: {confidence_min: 4, also: [tier_1_only, breadth_fine_or_narrow, not_a_variant, no_oath, clear_field, free_seat, no_lineage_conflict, never_declined_or_renounced]}
    offer: {confidence_min: 1}
    abstain: {when: [not_eligible, stale, confidence_0, decline_cooldown]}
  clear_field: "no other candidate keyed in the same deed branch is eligible in this pass, and no hybrid containing that branch is eligible"
  offer_only: "tier-ups, hybrids, variants, oath-bearing callings, vows, dark callings, forks and consolidations are always offers (C:P2; C:P5)"
  offers_per_reflection: 3
  crisis_offers_per_scene: 1
  decline_cooldown: {evidence_bearing_scenes: 24, and_weighted_gain: "W1 / 2 since the decline", or: "the player asks at a reflection"}
  simulated_calibration:           # 04-recognition-sim.md R7 (1,723 level-2 candidates over six play styles)
    would_confirm_by_confidence: {0: "37 in 100", 1: "59 in 100", 2: "64 in 100", 3: "73 in 100", 4: "91 in 100", 5: "97 in 100"}
    would_confirm_by_policy: {grant: "91 in 100", offer: "74 in 100", abstain: "38 in 100"}

# ---------------------------------------------------------------------------------------------------------------
# Seats, picks, provisional status, consolidation, the Fraying, readiness (04.6-04.9)
# ---------------------------------------------------------------------------------------------------------------
seats: {deed: 3, oath: 1, lineage_rule: "two callings whose keys are ancestor-related or identical never hold two seats: the later one is a fork offer"}
picks:
  partition_assumed: 12            # ch.05 owns the calling partition's size (00.17 Q2 reference 12); the rules use S
  allowance: "A = min(S, sum over held callings of picks_total[tier] + legacy picks)"
  candidates_shown: 3
  ranking: [awakened_tag_match, replaces_held_ability, own_before_kin, evidence_weight_of_first_tag, shown_and_passed_last_time_halved, engine_tiebreak]
  eligibility: "slot_class calling; not held; min_tier <= the calling's tier; first tag under pool_gate.own or pool_gate.kin, or a conduct axis in pool_gate.conduct; mod_group not already held unless it replaces"
  at_cap: "a new pick must replace a held calling-partition ability (fork-replacement)"
  season_repick: {per_calling: 1}
  retrain_activity: {duration_weeks: 1, per_pick: 1}
provisional:
  applies_to: [first_recognition, tier, pick, consolidation, fork]
  lived: "detail(pc, key, since: granted_at).weighted (hybrid: the smaller of the two branches' values; vow: recent_net >= 3 at Fraying stage 0; dark: recent_net <= -3)"
  confirm: {at: [reflection, season], min_evidence_bearing_scenes_since_grant: 12, lived_min: {fine: 18, narrow: 24, broad: 36, hybrid: 18}}
  lapse: {at: [reflection, season], when: "24 or more evidence-bearing scenes since the grant and not confirmed", requires_earlier_warning: true}
  warning: {at: reflection, when: "8 or more evidence-bearing scenes since the grant and lived < half of lived_min"}
  renounce: {when: any_reflection, cost: none}
  attribute_increase_applies: on_confirmation_of_tier_4
consolidation:
  kinds: [branch, hybrid, fold, fork, release]
  result_tier: "the highest tier <= the highest constituent tier whose weighted threshold the new key meets (minimum 1)"
  legacy_picks: "picks held - picks_total[new tier]; each later tier's new pick first cancels one legacy pick"
  specialties: "constituent competence entries persist at their value and no longer grow on their own"
  offered_at: [season, when_a_recognition_needs_a_seat]
  fold: {player_may: "fold any confirmed calling at a season boundary", engine_offers_when: "a permanent calling below tier 5 has recent(key) = 0 over 48 evidence-bearing scenes", keeps: {training_grade: trained, specialty_value: 2}, releases: [tier_capabilities, family_mechanic, picks]}
  fork: {kinds: [narrow, broaden, variant, turn], rule: "replacement inside a lineage; 04.8.5 steps 1-7 with one constituent"}
  blocked_when: "any constituent is at Fraying stage 1 or higher"
fraying:
  applies_to: "callings with an `oath` block (divine-keyed callings, oath-bearing hybrids, the monk, vows, dark callings)"
  stages:
    - {stage: 1, name: Dimmed,     when: req.fraying.1, effects: [composite_or_boon_or_focus_generation_inactive, no_tier_up]}
    - {stage: 2, name: Fraying,    when: req.fraying.2, effects: [as_stage_1, highest_tier_suspended]}
    - {stage: 3, name: The Choice, when: req.fraying.3, effects: [calling_suspended, choice_atone_or_turn_or_release]}
  atonement:
    forms: [restitution, penance, service]
    clock: {segments_stage_1_2: 4, segments_stage_3: 6, kind: progress, visibility: public}
    ticks: {positive_conduct_event_magnitude_2: 1, positive_conduct_event_magnitude_4: 2, penance_week: 3, restitution_thread_completed: fill}
    on_complete: "record_evidence(op: atonement) superseding the unatoned negative events on the axis (03.8.4); stage 0"
  lapse: {when: "stage 3 holds at the second season boundary after it began, with no atonement completed", never_for_tier: 5}
readiness:                         # the Seer's Reading (V6) bands; voiced, never numbered
  bands:
    - {id: unformed,         when: "weighted < W / 4"}
    - {id: leaning,          when: "W / 4 <= weighted < W / 2"}
    - {id: becoming,         when: "W / 2 <= weighted < 3 W / 4"}
    - {id: on_the_threshold, when: "weighted >= 3 W / 4 and the requirement set is not yet met, or it is met and the policy abstains"}
    - {id: ready,            when: "an offer is open or standing"}
  W: "the weighted threshold of the next tier (first recognition: tier 1)"
  codex_view: {name: Leanings, shows: [key_tag_name, band_word], never: [calling_name, numbers, thresholds], max_rows: 3}

# ---------------------------------------------------------------------------------------------------------------
# Families (04.2.2): defaults shared by every calling of a deed branch, and the two conduct families.
# focus_trigger (specialists, from tier 2): one bounded Focus-generation trigger per family (C:P9 companion;
# R3 T-1). Units and limits are within ch.05's envelope; ch.05 may retune them (04 Interface requests).
# ---------------------------------------------------------------------------------------------------------------
families:
  - {id: martial, branch: deed.martial, attributes_default: [might, agility], org_tags: [org.order.knightly, org.company.mercenary, org.crown.military], shadow_default: {name: "The Butcher", conduct: [conduct.mercy, conduct.restraint], turns_to: call.dark_wrath}, vehicles: {grant: [veh.V8, veh.V1, veh.V7], offer: [veh.V2, veh.V3, veh.V5, veh.V7], tier: [veh.V5, veh.V2, veh.V9, veh.V7], abstain: [veh.V6], revocation: [veh.V14]}, focus_trigger: {id: fg.martial, effect_id: eff.restore, params: {quantity: focus, units: 1, target: self}, hook: on_defeat, when: "the defeated foe's threat band >= your power band and the defeating beat's deed tag is under your calling key", limits_by_rank: {rank_1: {per: scene_end, uses: 1}, rank_2: {per: scene_end, uses: 2}}, text: "When you defeat a foe at or above your own band with a deed of your calling, regain 1 Focus."}}
  - {id: guile, branch: deed.guile, attributes_default: [agility, wits], org_tags: [org.outlaw.thieves, org.outlaw.smugglers, org.outlaw.assassins], shadow_default: {name: "The Faithless", conduct: [conduct.honesty, conduct.loyalty], turns_to: call.dark_betrayal}, vehicles: {grant: [veh.V8, veh.V7, veh.V1], offer: [veh.V3, veh.V2, veh.V5, veh.V7], tier: [veh.V5, veh.V2, veh.V3, veh.V7], abstain: [veh.V6], revocation: [veh.V14]}, focus_trigger: {id: fg.guile, effect_id: eff.restore, params: {quantity: focus, units: 1, target: self}, hook: on_degree, when: "degree = critical_success and deed_tag under your calling key and the obstacle's defender was unaware or you held flag.hidden", limits_by_rank: {rank_1: {per: scene_end, uses: 1}, rank_2: {per: scene_end, uses: 2}}, text: "When a deed of your calling critically succeeds against one who never saw it coming, regain 1 Focus."}}
  - {id: wilds, branch: deed.wilds, attributes_default: [wits, endurance], org_tags: [org.order.hunters, org.company.exploring, org.clan.tribe], shadow_default: {name: "The Feral", conduct: [conduct.protection, conduct.generosity], turns_to: call.dark_cold}, vehicles: {grant: [veh.V1, veh.V7], offer: [veh.V7, veh.V11, veh.V2, veh.V5], tier: [veh.V5, veh.V11, veh.V2, veh.V7], abstain: [veh.V6], revocation: [veh.V14]}, focus_trigger: {id: fg.wilds, effect_id: eff.restore, params: {quantity: focus, units: 1, target: self}, hook: on_boundary, when: "boundary = breather and your location is not under terrain.settlement", limits_by_rank: {rank_1: {per: scene_end, uses: 1}, rank_2: {per: scene_end, uses: 2}}, text: "When you complete a breather outside any settlement, regain 1 Focus in addition to what the rest restores."}}
  - {id: lore, branch: deed.lore, attributes_default: [intellect, wits], org_tags: [org.guild.scholarly, org.order.arcane, org.faith.temple], shadow_default: {name: "The Hoarder of Secrets", conduct: [conduct.generosity, conduct.humility], turns_to: call.dark_pride}, vehicles: {grant: [veh.V1, veh.V7], offer: [veh.V3, veh.V2, veh.V9, veh.V7], tier: [veh.V9, veh.V2, veh.V5, veh.V7], abstain: [veh.V6], revocation: [veh.V14]}, focus_trigger: {id: fg.lore, effect_id: eff.restore, params: {quantity: focus, units: 1, target: self}, hook: on_fact_set, when: "pattern = clu.*.found or an unseal delivered by your frame whose deed tag is under your calling key", limits_by_rank: {rank_1: {per: scene_end, uses: 1}, rank_2: {per: scene_end, uses: 2}}, text: "When a deed of your calling uncovers a clue or a sealed fact, regain 1 Focus."}}
