# data/tags.yaml
# Purpose: the single hierarchical tag vocabulary of the game (evidence, competence, callings, pool
#   gates, harm types, materials, items, places, rule-card loading, action traits, organizations).
# Owner: 00-architecture (levels 0-2, seeded here) / 03-tags-and-evidence (this file; all deeper
#   content). Stewards per facet propose additions to 03 via Interface requests (00.5.5).
# Schema: data/SCHEMAS.md#tagsyaml. Rules: 00.5 (cascade, most-specific-wins, adding tags).
# Conventions: ids are dot paths beginning with the facet; snake_case; max 5 segments; ids never
#   reused; level-2 entries are append-only (retire with lifecycle: retired + superseded_by).
#   Definitions are written "True only when ... False for ..." (SG-04), positive-scoped (SG-15).
# Basis: [C:P5] hierarchy cascade; [R3 §00.3-00.4, §03.1, §03.6]; [R1 §00.D]; [R2 #6]; [DL-00A-13..15]

schema_version: 1

facets:
  - id: deed
    name: Deed
    steward: "03"
    domain: [beat, evidence, competence, license, ability, calling]
    definition: "What an actor does. The nine branches are the calling axes; hybrids key only on pairs of distinct deed branches."
  - id: conduct
    name: Conduct
    steward: "03"
    domain: [evidence, calling, oath, shadow]
    signed: true
    definition: "The value an act expresses. Each branch is a signed axis with a positive and a negative pole; evidence carries a sign of +1 or -1."
  - id: creature
    name: Creature
    steward: "09"
    domain: [entity, adversary, pool_gate, absorbable_pool, evidence_context]
    definition: "The fundamental nature of a being. Adversary archetype families."
  - id: harm
    name: Harm
    steward: "07"
    domain: [effect, attack, hazard, resistance, condition, entity]
    definition: "The kind of harm or energy an effect deals or a being embodies."
  - id: material
    name: Material
    steward: "08"
    domain: [item, material, pool_gate]
    definition: "What a thing is made of."
  - id: item
    name: Item
    steward: "08"
    domain: [item, base_item, kit]
    definition: "What kind of object a thing is."
  - id: terrain
    name: Terrain
    steward: "10"
    domain: [place, scene, hazard, encounter_table, site_theme]
    definition: "The kind of place."
  - id: situation
    name: Situation
    steward: "12"
    domain: [rule_card, scene]
    definition: "Which rules load. Every rule card declares the situation tags it loads in (SG-18)."
  - id: trait
    name: Trait
    steward: "01"
    domain: [beat, ability, effect, item]
    definition: "A property of an action or effect that pulls in general rules automatically (anchor property 5)."
  - id: org
    name: Organization
    steward: "11"
    domain: [faction, institution, recognition_vehicle, npc]
    definition: "The kind of organization."

tags:
  # ============================ DEED ============================
  - {id: deed.martial, name: Martial, parent: deed, level: 1, lifecycle: provisional,
     definition: "True only when the method is fighting with weapons, shield, armor or body, directing a fight, or a feat of physical prowess (lifting, climbing, swimming, tumbling). False for striking from concealment where concealment is the point (guile.ambush).",
     distinguish: "vs guile.ambush: is the hidden approach the point? -> guile."}
  - {id: deed.martial.blade, name: Blades, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when fighting with swords, daggers or knives. False for axes."}
  - {id: deed.martial.axe, name: Axes, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when fighting with axes of any size."}
  - {id: deed.martial.bludgeon, name: Bludgeons, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when fighting with maces, hammers, clubs, flails or staves used as clubs."}
  - {id: deed.martial.polearm, name: Polearms, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when fighting with spears, halberds, glaives or quarterstaffs used for reach. False for a thrown spear (martial.thrown)."}
  - {id: deed.martial.archery, name: Archery, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when shooting bows, crossbows or slings."}
  - {id: deed.martial.thrown, name: Thrown weapons, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when throwing a weapon or improvised missile to harm."}
  - {id: deed.martial.unarmed, name: Unarmed, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when fighting with fists, feet, grapples or the body alone."}
  - {id: deed.martial.shield, name: Shield, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when the shield is the method: blocking, bashing, covering an ally."}
  - {id: deed.martial.armor, name: Armored fighting, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when bearing and using heavy armor is the point of the deed (enduring blows in plate, fighting encumbered)."}
  - {id: deed.martial.tactics, name: Tactics, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when reading or directing a fight: positioning, timing, flanking, choosing ground. False for commanding troops by force of personality (influence.command)."}
  - {id: deed.martial.mounted, name: Mounted combat, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when fighting from a mount. False for riding to travel (wilds.animals)."}
  - {id: deed.martial.athletics, name: Athletics, parent: deed.martial, level: 2, lifecycle: provisional, definition: "True only when the deed is a feat of the body: lifting, breaking, climbing, jumping, swimming, running, tumbling."}

  - {id: deed.guile, name: Guile, parent: deed, level: 1, lifecycle: provisional,
     definition: "True only when the method makes others not notice, or believe something false: stealth, thievery, deception, disguise, ambush, poisons, escapes, the underworld. False for moving someone with truth, emotion or authority (influence).",
     distinguish: "vs influence: false belief or unnoticed -> guile; persuaded knowingly -> influence."}
  - {id: deed.guile.stealth, name: Stealth, parent: deed.guile, level: 2, lifecycle: provisional, definition: "True only when moving or hiding unseen and unheard."}
  - {id: deed.guile.thievery, name: Thievery, parent: deed.guile, level: 2, lifecycle: provisional, definition: "True only when picking locks or pockets, disarming traps, palming, or stealing."}
  - {id: deed.guile.deception, name: Deception, parent: deed.guile, level: 2, lifecycle: provisional, definition: "True only when making someone believe a falsehood by words or acts. False for disguise of appearance (guile.disguise)."}
  - {id: deed.guile.disguise, name: Disguise, parent: deed.guile, level: 2, lifecycle: provisional, definition: "True only when altering appearance, voice or papers to pass as someone else."}
  - {id: deed.guile.ambush, name: Ambush, parent: deed.guile, level: 2, lifecycle: provisional, definition: "True only when striking from concealment or surprise is the point of the deed."}
  - {id: deed.guile.poisoncraft, name: Poisoncraft, parent: deed.guile, level: 2, lifecycle: provisional, definition: "True only when using poison on a target. False for brewing it (craft.alchemy)."}
  - {id: deed.guile.escape, name: Escape, parent: deed.guile, level: 2, lifecycle: provisional, definition: "True only when slipping bonds, cells, holds or pursuit by trickery."}
  - {id: deed.guile.streetwise, name: Streetwise, parent: deed.guile, level: 2, lifecycle: provisional, definition: "True only when working the underworld: fences, informers, black markets, criminal custom."}

  - {id: deed.wilds, name: Wilds, parent: deed, level: 1, lifecycle: provisional,
     definition: "True only when the method is mundane skill in the untamed world: survival, tracking, navigation, animals, foraging, seafaring. False for nature magic (primal).",
     distinguish: "vs primal: skill -> wilds; magic -> primal."}
  - {id: deed.wilds.survival, name: Survival, parent: deed.wilds, level: 2, lifecycle: provisional, definition: "True only when keeping alive in the wild: shelter, fire, weather sense, enduring the elements by knowledge."}
  - {id: deed.wilds.tracking, name: Tracking, parent: deed.wilds, level: 2, lifecycle: provisional, definition: "True only when following or reading traces of creatures or people."}
  - {id: deed.wilds.navigation, name: Navigation, parent: deed.wilds, level: 2, lifecycle: provisional, definition: "True only when finding the way across land, sea or underground."}
  - {id: deed.wilds.animals, name: Animals, parent: deed.wilds, level: 2, lifecycle: provisional, definition: "True only when handling, riding, training or calming animals by mundane means."}
  - {id: deed.wilds.foraging, name: Foraging, parent: deed.wilds, level: 2, lifecycle: provisional, definition: "True only when finding food, water, herbs or materials in the wild."}
  - {id: deed.wilds.seafaring, name: Seafaring, parent: deed.wilds, level: 2, lifecycle: provisional, definition: "True only when sailing, rowing or working a vessel."}

  - {id: deed.lore, name: Lore, parent: deed, level: 1, lifecycle: provisional,
     definition: "True only when the method is knowing or finding out: recalling, researching, deducing, diagnosing, reading. False for working magic (arcane, divine, primal) or making things (craft).",
     distinguish: "vs arcane/divine/primal: knows about -> lore; works -> magic branch. vs craft: knows how it works -> lore; makes it -> craft."}
  - {id: deed.lore.history, name: History, parent: deed.lore, level: 2, lifecycle: provisional, definition: "True only when drawing on knowledge of past events, peoples, heraldry and ruins."}
  - {id: deed.lore.languages, name: Languages, parent: deed.lore, level: 2, lifecycle: provisional, definition: "True only when reading, translating or deciphering tongues and scripts."}
  - {id: deed.lore.bestiary, name: Bestiary, parent: deed.lore, level: 2, lifecycle: provisional, definition: "True only when drawing on knowledge of creatures' natures, habits and weaknesses."}
  - {id: deed.lore.medicine, name: Medicine, parent: deed.lore, level: 2, lifecycle: provisional, definition: "True only when diagnosing or treating illness and wounds by mundane knowledge. False for first aid (basic Handle) and magical healing (divine.healing)."}
  - {id: deed.lore.engineering, name: Engineering, parent: deed.lore, level: 2, lifecycle: provisional, definition: "True only when understanding mechanisms, structures, siegecraft or architecture."}
  - {id: deed.lore.law, name: Law and custom, parent: deed.lore, level: 2, lifecycle: provisional, definition: "True only when drawing on laws, rights, customs, protocol and precedent."}
  - {id: deed.lore.arcana, name: Arcana, parent: deed.lore, level: 2, lifecycle: provisional, definition: "True only when knowing about magic: identifying spells, wards, enchanted items and their workings."}
  - {id: deed.lore.religion, name: Religion, parent: deed.lore, level: 2, lifecycle: provisional, definition: "True only when knowing about gods, rites, holy orders, the dead and the profane."}
  - {id: deed.lore.investigation, name: Investigation, parent: deed.lore, level: 2, lifecycle: provisional, definition: "True only when deducing from evidence, searching records or reconstructing events."}

  - {id: deed.arcane, name: Arcane, parent: deed, level: 1, lifecycle: provisional,
     definition: "True only when the method is learned, formulaic sorcery worked by the caster's own knowledge. False for power granted by a power served (divine) or drawn from living nature and spirits (primal).",
     distinguish: "vs divine: study and formula -> arcane; granted by a power -> divine."}
  - {id: deed.arcane.fire, name: Fire sorcery, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when working flame and heat by sorcery."}
  - {id: deed.arcane.frost, name: Frost sorcery, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when working cold and ice by sorcery."}
  - {id: deed.arcane.storm, name: Storm sorcery, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when working lightning, thunder and wind by sorcery."}
  - {id: deed.arcane.earth, name: Earth sorcery, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when working stone, metal and soil by sorcery."}
  - {id: deed.arcane.illusion, name: Illusion, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when creating false sights, sounds or sensations."}
  - {id: deed.arcane.divination, name: Divination, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when learning hidden things by sorcery: scrying, reading traces, foresight."}
  - {id: deed.arcane.warding, name: Warding, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when shielding, sealing, dispelling or countering by sorcery."}
  - {id: deed.arcane.mind, name: Mind sorcery, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when influencing thoughts, emotions or will by sorcery."}
  - {id: deed.arcane.summoning, name: Summoning, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when calling, binding or dismissing beings by sorcery."}
  - {id: deed.arcane.necromancy, name: Necromancy, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when working death, the dead or life force by sorcery."}
  - {id: deed.arcane.alteration, name: Alteration, parent: deed.arcane, level: 2, lifecycle: provisional, definition: "True only when changing the form or properties of things or bodies by sorcery."}

  - {id: deed.divine, name: Divine, parent: deed, level: 1, lifecycle: provisional,
     definition: "True only when the method is power, rite or blessing drawn from a god, oath, pact or the sacred. False for sorcery (arcane) or spirits of the living world (primal).",
     distinguish: "vs primal: a named power or oath -> divine; the land's spirits -> primal."}
  - {id: deed.divine.healing, name: Healing, parent: deed.divine, level: 2, lifecycle: provisional, definition: "True only when mending body or spirit by sacred power."}
  - {id: deed.divine.warding, name: Sacred warding, parent: deed.divine, level: 2, lifecycle: provisional, definition: "True only when protecting, consecrating or sanctifying by sacred power."}
  - {id: deed.divine.smiting, name: Smiting, parent: deed.divine, level: 2, lifecycle: provisional, definition: "True only when striking with sacred power."}
  - {id: deed.divine.rites, name: Rites, parent: deed.divine, level: 2, lifecycle: provisional, definition: "True only when performing ceremonies, blessings, funerals, marriages, consecrations."}
  - {id: deed.divine.oaths, name: Oaths, parent: deed.divine, level: 2, lifecycle: provisional, definition: "True only when swearing, keeping or enforcing a sacred vow."}
  - {id: deed.divine.revelation, name: Revelation, parent: deed.divine, level: 2, lifecycle: provisional, definition: "True only when receiving visions, prophecy or divine guidance."}
  - {id: deed.divine.exorcism, name: Exorcism, parent: deed.divine, level: 2, lifecycle: provisional, definition: "True only when turning, banishing or binding undead and fiends by sacred power."}
  - {id: deed.divine.pact, name: Pact, parent: deed.divine, level: 2, lifecycle: provisional, definition: "True only when drawing on a bargain with a power (fiend, fey lord, dark god)."}

  - {id: deed.primal, name: Primal, parent: deed, level: 1, lifecycle: provisional,
     definition: "True only when the method is magic of living nature and spirits: growth, beast-kinship, weather, shapeshifting, spirits, the raw elements, hexes. False for mundane wilderness skill (wilds).",
     distinguish: "vs wilds: magic -> primal."}
  - {id: deed.primal.growth, name: Growth, parent: deed.primal, level: 2, lifecycle: provisional, definition: "True only when working plants, soil fertility and living growth by magic."}
  - {id: deed.primal.beastkin, name: Beast-kinship, parent: deed.primal, level: 2, lifecycle: provisional, definition: "True only when speaking with, calling or sharing senses with animals by magic."}
  - {id: deed.primal.weather, name: Weather-working, parent: deed.primal, level: 2, lifecycle: provisional, definition: "True only when calling or calming weather by nature magic."}
  - {id: deed.primal.shapeshifting, name: Shapeshifting, parent: deed.primal, level: 2, lifecycle: provisional, definition: "True only when taking another creature's form by magic."}
  - {id: deed.primal.spirits, name: Spirit-speaking, parent: deed.primal, level: 2, lifecycle: provisional, definition: "True only when speaking with, bargaining with or binding spirits of place and ancestors."}
  - {id: deed.primal.elements, name: Raw elements, parent: deed.primal, level: 2, lifecycle: provisional, definition: "True only when working fire, water, earth or air as living forces (not formula)."}
  - {id: deed.primal.hexcraft, name: Hexcraft, parent: deed.primal, level: 2, lifecycle: provisional, definition: "True only when laying or lifting curses, charms and folk-magic bindings."}

  - {id: deed.influence, name: Influence, parent: deed, level: 1, lifecycle: provisional,
     definition: "True only when the method moves or reads people with truth, emotion, authority, art or bargain. False for making someone believe a falsehood (guile.deception).",
     distinguish: "vs guile: persuaded knowingly -> influence."}
  - {id: deed.influence.persuasion, name: Persuasion, parent: deed.influence, level: 2, lifecycle: provisional, definition: "True only when convincing by argument, appeal or charm."}
  - {id: deed.influence.command, name: Command, parent: deed.influence, level: 2, lifecycle: provisional, definition: "True only when leading, ordering or rallying others."}
  - {id: deed.influence.performance, name: Performance, parent: deed.influence, level: 2, lifecycle: provisional, definition: "True only when moving an audience by music, story, oratory or spectacle."}
  - {id: deed.influence.intimidation, name: Intimidation, parent: deed.influence, level: 2, lifecycle: provisional, definition: "True only when compelling by threat or menace."}
  - {id: deed.influence.intrigue, name: Intrigue, parent: deed.influence, level: 2, lifecycle: provisional, definition: "True only when working politics, alliances, rumor networks and leverage."}
  - {id: deed.influence.trade, name: Trade, parent: deed.influence, level: 2, lifecycle: provisional, definition: "True only when bargaining, buying, selling or appraising in commerce."}
  - {id: deed.influence.etiquette, name: Etiquette, parent: deed.influence, level: 2, lifecycle: provisional, definition: "True only when navigating courtly or formal social custom."}
  - {id: deed.influence.insight, name: Insight, parent: deed.influence, level: 2, lifecycle: provisional, definition: "True only when reading motives, lies and feelings in people."}

  - {id: deed.craft, name: Craft, parent: deed, level: 1, lifecycle: provisional,
     definition: "True only when the method is making, mending or preparing a thing. False for knowing how it works without making it (lore.engineering).",
     distinguish: "vs lore.engineering: makes it -> craft."}
  - {id: deed.craft.smithing, name: Smithing, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when working metal: weapons, armor, tools."}
  - {id: deed.craft.woodcraft, name: Woodcraft, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when working wood: bows, carpentry, carving."}
  - {id: deed.craft.leathercraft, name: Leathercraft, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when tanning and working hide and leather."}
  - {id: deed.craft.textiles, name: Textiles, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when spinning, weaving, sewing, rope-making."}
  - {id: deed.craft.alchemy, name: Alchemy, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when brewing potions, poisons, reagents and remedies."}
  - {id: deed.craft.cookery, name: Cookery, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when preparing food and drink, preserving, brewing ale."}
  - {id: deed.craft.building, name: Building, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when constructing with stone and timber: masonry, fortification, shelters beyond crude."}
  - {id: deed.craft.artifice, name: Artifice, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when making mechanisms: locks, traps, clockwork, devices."}
  - {id: deed.craft.jewelcraft, name: Jewelcraft, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when cutting gems and working fine metal into jewelry."}
  - {id: deed.craft.enchanting, name: Enchanting, parent: deed.craft, level: 2, lifecycle: provisional, definition: "True only when imbuing an item with a lasting magical property (requires a magic license to attempt)."}

  # ============================ CONDUCT (signed axes; no level 2 in 00) ============================
  - {id: conduct.mercy, name: Mercy, parent: conduct, level: 1, lifecycle: provisional, positive_pole: merciful, negative_pole: cruel,
     definition: "Treatment of those in one's power, especially foes. +1 when sparing, healing or easing a defeated or helpless foe at cost or risk; -1 when causing needless suffering or killing the helpless.",
     distinguish: "vs protection: mercy concerns those at your mercy; protection concerns the vulnerable in danger from others."}
  - {id: conduct.honesty, name: Honesty, parent: conduct, level: 1, lifecycle: provisional, positive_pole: truthful, negative_pole: deceitful,
     definition: "+1 when telling a costly truth or refusing a useful lie; -1 when deceiving for gain.", distinguish: "vs loyalty: honesty is about truth; loyalty about keeping faith."}
  - {id: conduct.courage, name: Courage, parent: conduct, level: 1, lifecycle: provisional, positive_pole: brave, negative_pole: craven,
     definition: "+1 when facing a declared danger for a purpose; -1 when abandoning a charge or companion out of fear."}
  - {id: conduct.loyalty, name: Loyalty, parent: conduct, level: 1, lifecycle: provisional, positive_pole: faithful, negative_pole: treacherous,
     definition: "+1 when keeping faith with a person, oath-bond or cause at cost; -1 when betraying one."}
  - {id: conduct.generosity, name: Generosity, parent: conduct, level: 1, lifecycle: provisional, positive_pole: generous, negative_pole: greedy,
     definition: "+1 when giving away wealth, food or advantage that matters to the giver; -1 when taking or hoarding at others' clear expense."}
  - {id: conduct.justice, name: Justice, parent: conduct, level: 1, lifecycle: provisional, positive_pole: just, negative_pole: unjust,
     definition: "+1 when upholding fairness or righting a wrong at cost; -1 when punishing the innocent or excusing the guilty for gain.", distinguish: "vs mercy: justice weighs deserts; mercy tempers them."}
  - {id: conduct.humility, name: Humility, parent: conduct, level: 1, lifecycle: provisional, positive_pole: humble, negative_pole: proud,
     definition: "+1 when yielding credit, rank or pride for another's good; -1 when demanding deference or scorning the lowly."}
  - {id: conduct.restraint, name: Restraint, parent: conduct, level: 1, lifecycle: provisional, positive_pole: temperate, negative_pole: wrathful,
     definition: "+1 when mastering anger, appetite or vengeance at a moment of temptation; -1 when giving in to rage or excess at others' cost."}
  - {id: conduct.piety, name: Piety, parent: conduct, level: 1, lifecycle: provisional, positive_pole: reverent, negative_pole: profane,
     definition: "+1 when honoring the sacred, the dead or a power's rites at cost; -1 when desecrating them."}
  - {id: conduct.protection, name: Protection, parent: conduct, level: 1, lifecycle: provisional, positive_pole: protective, negative_pole: callous,
     definition: "+1 when shielding the vulnerable from harm by others at cost or risk; -1 when abandoning the helpless to harm one could have prevented."}

  # ============================ CREATURE ============================
  - {id: creature.beast, name: Beast, parent: creature, level: 1, lifecycle: provisional, definition: "True only when a natural or monstrous animal without speech or culture. False for talking beastfolk (folk.beastfolk)."}
  - {id: creature.beast.predator, name: Predator, parent: creature.beast, level: 2, lifecycle: provisional, definition: "Hunting animals: wolves, great cats, bears, hounds."}
  - {id: creature.beast.herd, name: Herd beast, parent: creature.beast, level: 2, lifecycle: provisional, definition: "Grazing and herd animals: deer, boar, cattle, horses."}
  - {id: creature.beast.vermin, name: Vermin, parent: creature.beast, level: 2, lifecycle: provisional, definition: "Rats, insects, spiders, swarms."}
  - {id: creature.beast.reptile, name: Reptile, parent: creature.beast, level: 2, lifecycle: provisional, definition: "Snakes, lizards, crocodiles (not dragons)."}
  - {id: creature.beast.avian, name: Avian, parent: creature.beast, level: 2, lifecycle: provisional, definition: "Birds and flying beasts."}
  - {id: creature.beast.aquatic, name: Aquatic, parent: creature.beast, level: 2, lifecycle: provisional, definition: "Fish, sharks, eels and water-dwelling beasts."}
  - {id: creature.beast.monstrous, name: Monstrous beast, parent: creature.beast, level: 2, lifecycle: provisional, definition: "Magical or composite animals: chimeras, owlbears, griffons."}
  - {id: creature.folk, name: Folk, parent: creature, level: 1, lifecycle: provisional, definition: "True only when a being with speech and culture of a living people."}
  - {id: creature.folk.human, name: Human, parent: creature.folk, level: 2, lifecycle: provisional, definition: "Humans."}
  - {id: creature.folk.elf, name: Elf, parent: creature.folk, level: 2, lifecycle: provisional, definition: "Elves."}
  - {id: creature.folk.dwarf, name: Dwarf, parent: creature.folk, level: 2, lifecycle: provisional, definition: "Dwarves."}
  - {id: creature.folk.halfling, name: Halfling, parent: creature.folk, level: 2, lifecycle: provisional, definition: "Halflings and other small folk."}
  - {id: creature.folk.orc, name: Orc, parent: creature.folk, level: 2, lifecycle: provisional, definition: "Orcs and their kin."}
  - {id: creature.folk.goblin, name: Goblin, parent: creature.folk, level: 2, lifecycle: provisional, definition: "Goblins, hobgoblins and kin."}
  - {id: creature.folk.giant, name: Giant, parent: creature.folk, level: 2, lifecycle: provisional, definition: "Giants, ogres, trolls and other giant-kin."}
  - {id: creature.folk.beastfolk, name: Beastfolk, parent: creature.folk, level: 2, lifecycle: provisional, definition: "Talking animal-peoples: gnolls, lizardfolk, and the like."}
  - {id: creature.undead, name: Undead, parent: creature, level: 1, lifecycle: provisional, definition: "True only when the dead made to move or linger."}
