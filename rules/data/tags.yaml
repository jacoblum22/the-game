# ============================ CH.03 CONTENT (levels 2-3 added by 03-tags-and-evidence) ============================
# Owner: 03. Rules: 03.1 (depth policy 03.1.2; additions 03.1.3; classification 03.1.5; grounding 03.1.6).
# Every entry: definition 'True only when ... False for ...', a distinguish test against its nearest
# sibling or cousin, and aliases (retrieval hints only; an alias is never a tag). lifecycle: provisional.
# Level-4 tags are reserved (03.1.2): add only by PR-03-6. Basis: [00.5.5] [DL-03-15] [DL-03-16].

  # ---- DEED level-2 additions (03.1.3, DL-03-16) ----
  - id: deed.influence.teaching
    name: "Teaching"
    parent: deed.influence
    level: 2
    lifecycle: provisional
    definition: "True only when the method is passing a skill, technique or understanding to another person so that they can use it afterward: instruction, demonstration with correction, mentoring. False for persuading someone to act (influence.persuasion) or giving an order (influence.command)."
    distinguish: "vs influence.persuasion: does the other person leave able to DO something new? -> teaching; leave believing or agreeing to something? -> persuasion."
    aliases: ["teach", "train someone", "mentor", "tutor", "instruct", "apprentice"]
  - id: deed.craft.scribing
    name: "Scribing"
    parent: deed.craft
    level: 2
    lifecycle: provisional
    definition: "True only when the method is making a written or drawn work by hand: fair copies, illuminated pages, maps and charts, bound books. False for composing the content (lore, performance) and for writing magic into an object or scroll (craft.enchanting.inscription)."
    distinguish: "vs lore.languages: making the document -> scribing; reading or translating it -> lore. vs craft.enchanting.inscription: the writing carries a magical effect -> enchanting."
    aliases: ["copy", "calligraphy", "illuminate", "draw a map", "chart", "bookbinding", "scribe"]

  # ---- DEED level 3: deed.martial ----
  - id: deed.martial.blade.sword
    name: "Sword fighting"
    parent: deed.martial.blade
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a one-handed sword (arming sword, sabre, short sword, falchion, cutlass) by cut and thrust. False for two-handed swords (blade.greatsword), light dueling swords used point-first (blade.fencing), and daggers or knives (blade.dagger)."
    distinguish: "vs blade.fencing: a light point-weapon with lunges and footwork decides it -> fencing; cuts and a heavier blade -> sword."
    aliases: ["sword", "sabre", "shortsword", "cutlass", "falchion", "arming sword"]
  - id: deed.martial.blade.greatsword
    name: "Greatsword fighting"
    parent: deed.martial.blade
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a sword held in both hands (longsword two-handed, greatsword, claymore). False for a hand-and-a-half sword used one-handed (blade.sword)."
    distinguish: "vs blade.sword: both hands on the hilt for the stroke -> greatsword."
    aliases: ["greatsword", "longsword", "claymore", "two-handed sword", "bastard sword"]
  - id: deed.martial.blade.fencing
    name: "Fencing"
    parent: deed.martial.blade
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a light thrusting sword (rapier, smallsword) where distance, footwork and the point decide the exchange. False for cutting swordplay (blade.sword)."
    distinguish: "vs blade.sword (above). vs martial.tactics.single_combat: the blade method -> fencing; out-thinking a matched opponent over the bout -> single_combat (usually a secondary)."
    aliases: ["rapier", "smallsword", "fence", "lunge", "riposte"]
  - id: deed.martial.blade.dagger
    name: "Dagger fighting"
    parent: deed.martial.blade
    level: 3
    lifecycle: provisional
    definition: "True only when fighting at close quarters with a dagger or knife, including a parrying dagger in the off hand. False for throwing it (thrown.blades) and for a strike on an unaware victim that is rolled against the victim's awareness (guile.ambush.assassination)."
    distinguish: "vs guile.ambush.assassination: rolled against Guard -> dagger; against awareness -> assassination."
    aliases: ["dagger", "knife", "dirk", "stiletto", "main gauche", "shiv"]
  - id: deed.martial.axe.hand
    name: "Hand axe"
    parent: deed.martial.axe
    level: 3
    lifecycle: provisional
    definition: "True only when fighting in melee with a one-handed axe or hatchet, including hooking a shield or limb with the beard. False for throwing it (thrown.blades) and for two-handed axes (axe.great)."
    distinguish: "vs axe.great: one hand on the haft -> hand."
    aliases: ["hatchet", "hand axe", "bearded axe", "tomahawk"]
  - id: deed.martial.axe.great
    name: "Great axe"
    parent: deed.martial.axe
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with an axe swung in both hands (greataxe, Dane axe, woodsman's felling axe used as a weapon). False for long-hafted axe-bladed polearms used for reach or hooking (polearm.halberd)."
    distinguish: "vs polearm.halberd: reach and hooking from a long haft -> halberd; a heavy chopping swing -> great axe."
    aliases: ["greataxe", "dane axe", "battleaxe", "two-handed axe"]
  - id: deed.martial.bludgeon.club
    name: "Club"
    parent: deed.martial.bludgeon
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a club, cudgel, staff swung as a club, or any improvised blunt object (a chair leg, a bottle held, a torch used to strike). False for a made metal-headed weapon (bludgeon.mace, bludgeon.hammer) and for staff-fighting with both ends and reach (polearm.staff)."
    distinguish: "vs polearm.staff: a staff swung like a club once -> club; a trained art with both ends, blocks and sweeps -> polearm.staff."
    aliases: ["club", "cudgel", "cosh", "improvised weapon", "chair", "bottle"]
  - id: deed.martial.bludgeon.mace
    name: "Mace"
    parent: deed.martial.bludgeon
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a mace, morning star or other one-handed weapon with a flanged or spiked head made to crush armor."
    distinguish: "vs bludgeon.hammer: a striking head made to concentrate force on a face or spike, often two-handed -> hammer."
    aliases: ["mace", "morning star", "flanged mace"]
  - id: deed.martial.bludgeon.hammer
    name: "Hammer"
    parent: deed.martial.bludgeon
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a war hammer, maul or sledge, one- or two-handed."
    distinguish: "vs bludgeon.mace (above)."
    aliases: ["warhammer", "maul", "sledge", "lucerne hammer"]
  - id: deed.martial.bludgeon.flail
    name: "Flail"
    parent: deed.martial.bludgeon
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a weapon whose striking head swings on a chain or hinge (flail, chain, nunchaku-like threshing flail)."
    distinguish: "vs bludgeon.mace: a rigid haft -> mace."
    aliases: ["flail", "chain", "threshing flail"]
  - id: deed.martial.polearm.spear
    name: "Spear"
    parent: deed.martial.polearm
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a spear or pike held in the hands, thrusting from reach or bracing against a charge. False for a thrown spear (thrown.javelin) and for a couched lance on horseback (mounted.charge)."
    distinguish: "vs thrown.javelin: it leaves the hand -> javelin. vs mounted.charge: carried by a charging mount -> charge."
    aliases: ["spear", "pike", "boar spear", "trident"]
  - id: deed.martial.polearm.halberd
    name: "Halberd"
    parent: deed.martial.polearm
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a hafted cutting or hooking polearm (halberd, glaive, bill, poleaxe), including pulling riders down."
    distinguish: "vs axe.great: long haft, reach and hooks -> halberd."
    aliases: ["halberd", "glaive", "bill", "poleaxe", "bardiche"]
  - id: deed.martial.polearm.staff
    name: "Staff fighting"
    parent: deed.martial.polearm
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with a quarterstaff as a trained art: both ends, blocks, sweeps and trips at reach. False for a staff swung once as a club (bludgeon.club) and for casting through a staff (the magic branch; the staff is an implement)."
    distinguish: "vs bludgeon.club (above)."
    aliases: ["quarterstaff", "bo", "staff fighting"]
  - id: deed.martial.archery.bow
    name: "Bow"
    parent: deed.martial.archery
    level: 3
    lifecycle: provisional
    definition: "True only when shooting a hand-drawn bow (short, long, recurve or composite). False for crossbows (archery.crossbow) and slings (archery.sling). A shot at an unaware target that is rolled against the target's Guard or the shot's difficulty keeps this tag as primary, with guile.ambush.sniping as a grounded secondary."
    distinguish: "vs guile.ambush.sniping: the frame rolls against the target's awareness (the approach decides) -> sniping is primary; against Guard or the shot's difficulty -> bow is primary."
    aliases: ["bow", "longbow", "shortbow", "arrow", "loose", "shoot"]
  - id: deed.martial.archery.crossbow
    name: "Crossbow"
    parent: deed.martial.archery
    level: 3
    lifecycle: provisional
    definition: "True only when shooting a crossbow, light or heavy, including spanning it under pressure."
    distinguish: "vs archery.bow: drawn by hand at the moment of shooting -> bow."
    aliases: ["crossbow", "arbalest", "bolt"]
  - id: deed.martial.archery.sling
    name: "Sling"
    parent: deed.martial.archery
    level: 3
    lifecycle: provisional
    definition: "True only when hurling stones or bullets with a sling or staff-sling."
    distinguish: "vs thrown.improvised: thrown from the hand -> thrown."
    aliases: ["sling", "slingshot", "staff-sling"]
  - id: deed.martial.thrown.javelin
    name: "Javelin"
    parent: deed.martial.thrown
    level: 3
    lifecycle: provisional
    definition: "True only when throwing a spear, javelin or dart made for throwing."
    distinguish: "vs polearm.spear: kept in the hand -> spear."
    aliases: ["javelin", "dart", "throwing spear", "pilum"]
  - id: deed.martial.thrown.blades
    name: "Thrown blades"
    parent: deed.martial.thrown
    level: 3
    lifecycle: provisional
    definition: "True only when throwing knives, throwing axes or edged throwing weapons."
    distinguish: "vs blade.dagger: kept in the hand -> dagger."
    aliases: ["throwing knife", "throwing axe", "hurl a dagger", "chakram"]
  - id: deed.martial.thrown.improvised
    name: "Improvised missiles"
    parent: deed.martial.thrown
    level: 3
    lifecycle: provisional
    definition: "True only when throwing an object not made as a weapon to harm or strike (a rock, a bottle, a lantern, a stool). False for a lantern or flask thrown for its fire or contents' effect, which is also this tag unless an alchemical license is used (craft.alchemy.incendiaries governs making it, not throwing it)."
    distinguish: "vs archery.sling: a sling did the throwing -> sling."
    aliases: ["throw a rock", "hurl", "throw a bottle", "throw a chair"]
  - id: deed.martial.thrown.entangling
    name: "Entangling throws"
    parent: deed.martial.thrown
    level: 3
    lifecycle: provisional
    definition: "True only when throwing a net, bola or lasso to bind or trip a target. False for roping a calm animal (wilds.animals.training)."
    distinguish: "vs wilds.animals: a fleeing or fighting target -> entangling."
    aliases: ["net", "bola", "lasso", "lariat"]
  - id: deed.martial.unarmed.striking
    name: "Striking"
    parent: deed.martial.unarmed
    level: 3
    lifecycle: provisional
    definition: "True only when hitting with fists, feet, knees, elbows or head. False for holds and throws (unarmed.wrestling)."
    distinguish: "vs unarmed.wrestling: does the deed hold or throw the body? -> wrestling."
    aliases: ["punch", "kick", "headbutt", "boxing", "brawl"]
  - id: deed.martial.unarmed.wrestling
    name: "Wrestling"
    parent: deed.martial.unarmed
    level: 3
    lifecycle: provisional
    definition: "True only when seizing, holding, throwing, pinning or choking with the body (the martial side of the Grapple verb)."
    distinguish: "vs guile.escape.bonds: getting out of a hold by trickery and contortion -> escape; by strength and technique -> wrestling."
    aliases: ["wrestle", "grapple", "pin", "throw", "chokehold", "tackle"]
  - id: deed.martial.unarmed.natural
    name: "Natural weapons"
    parent: deed.martial.unarmed
    level: 3
    lifecycle: provisional
    definition: "True only when fighting with claws, fangs, horns, a tail or another body part a being has by nature or by its current shape. False for taking the shape (primal.shapeshifting)."
    distinguish: "vs primal.shapeshifting: the change of form -> shapeshifting; using the form's claws in the fight -> natural."
    aliases: ["claws", "bite", "gore", "tail lash"]
  - id: deed.martial.shield.block
    name: "Shield block"
    parent: deed.martial.shield
    level: 3
    lifecycle: provisional
    definition: "True only when using a shield to stop or turn blows aimed at oneself."
    distinguish: "vs shield.cover: protecting someone else -> cover."
    aliases: ["block", "parry with shield", "shield wall (self)"]
  - id: deed.martial.shield.bash
    name: "Shield bash"
    parent: deed.martial.shield
    level: 3
    lifecycle: provisional
    definition: "True only when striking, shoving or pinning with a shield."
    distinguish: "vs unarmed.wrestling: the shield is the tool -> bash."
    aliases: ["shield bash", "shield slam", "shove with shield"]
  - id: deed.martial.shield.cover
    name: "Shield cover"
    parent: deed.martial.shield
    level: 3
    lifecycle: provisional
    definition: "True only when interposing a shield to protect another being, or holding a shield line with others."
    distinguish: "vs shield.block (above). vs conduct.protection: this is the method; protection is the value, recorded separately if its test is met."
    aliases: ["cover an ally", "shield wall", "interpose"]
  - id: deed.martial.armor.bulwark
    name: "Bulwark"
    parent: deed.martial.armor
    level: 3
    lifecycle: provisional
    definition: "True only when the deed is deliberately taking blows on armor to hold a place, wear down attackers or shield others by standing in the way. False for simply being hit while wearing armor."
    distinguish: "vs shield.cover: a shield interposed -> cover; the armored body itself -> bulwark."
    aliases: ["hold the line", "stand in the breach", "take the blow"]
  - id: deed.martial.armor.encumbered
    name: "Fighting encumbered"
    parent: deed.martial.armor
    level: 3
    lifecycle: provisional
    definition: "True only when performing a feat of movement (climbing, swimming, running, riding hard, tumbling) in medium or heavy armor where the armor is what makes it hard. False for the same feat unarmored (athletics.*)."
    distinguish: "vs martial.athletics: remove the armor and the feat becomes easy? -> encumbered."
    aliases: ["climb in armor", "swim in mail", "march in plate"]
  - id: deed.martial.tactics.ground
    name: "Choosing ground"
    parent: deed.martial.tactics
    level: 3
    lifecycle: provisional
    definition: "True only when the deed is picking or exploiting terrain to gain an edge: a chokepoint, height, cover, footing, light or wind. False for moving to flank a foe (tactics.maneuver)."
    distinguish: "vs tactics.maneuver: the place does the work -> ground; the relative position to a foe does -> maneuver."
    aliases: ["high ground", "chokepoint", "use the terrain", "sun at my back"]
  - id: deed.martial.tactics.maneuver
    name: "Maneuver"
    parent: deed.martial.tactics
    level: 3
    lifecycle: provisional
    definition: "True only when the deed is repositioning against foes to gain an edge: flanking, cutting off, drawing a foe out, splitting a group. False for misleading a foe about one's intent (guile.deception.feint)."
    distinguish: "vs guile.deception.feint: a false intent sold to the foe -> feint; a real change of position -> maneuver."
    aliases: ["flank", "outmaneuver", "cut off", "draw out"]
  - id: deed.martial.tactics.reading
    name: "Reading a fight"
    parent: deed.martial.tactics
    level: 3
    lifecycle: provisional
    definition: "True only when the deed is observing a foe or a melee to anticipate it: spotting a habit, a weak side, the next move. False for knowledge of a creature kind (lore.bestiary)."
    distinguish: "vs lore.bestiary: known in advance about the kind -> lore; seen now in this foe -> reading."
    aliases: ["read the fight", "spot his tell", "watch for an opening"]
  - id: deed.martial.tactics.single_combat
    name: "Single combat"
    parent: deed.martial.tactics
    level: 3
    lifecycle: provisional
    definition: "True only when the deed is winning a one-on-one bout against a matched opponent by out-thinking them over the exchange (duels, champion fights, trials by combat). Usually a secondary tag grounded by the weapon's primary tag. False for any fight with more than two combatants."
    distinguish: "vs blade.fencing and others: the weapon method is primary; the duel craft is this."
    aliases: ["duel", "single combat", "champion", "trial by combat"]
  - id: deed.martial.tactics.battle
    name: "Battle direction"
    parent: deed.martial.tactics
    level: 3
    lifecycle: provisional
    definition: "True only when the deed is planning and positioning a group (companions, allies, soldiers) in a fight. False for moving them by voice, authority or morale (influence.command)."
    distinguish: "vs influence.command: the plan -> battle; the voice that makes them follow it -> command."
    aliases: ["battle plan", "deploy", "formation", "position the troops"]
  - id: deed.martial.tactics.siege
    name: "Siegecraft in the field"
    parent: deed.martial.tactics
    level: 3
    lifecycle: provisional
    definition: "True only when the deed is attacking or defending a fortification: approaches, breaches, sorties, holding walls. False for knowing how walls work (lore.engineering.siegecraft) and building engines (craft.artifice.siege_engines)."
    distinguish: "vs lore.engineering.siegecraft: knowledge -> lore; the fight at the walls -> siege."
    aliases: ["siege", "storm the walls", "sortie", "breach"]
  - id: deed.martial.mounted.charge
    name: "Mounted charge"
    parent: deed.martial.mounted
    level: 3
    lifecycle: provisional
    definition: "True only when attacking as part of a mount's charge, with lance, spear or sword."
    distinguish: "vs mounted.skirmish: wheeling and striking at speed without a straight charge -> skirmish."
    aliases: ["lance", "couched lance", "cavalry charge", "joust"]
  - id: deed.martial.mounted.skirmish
    name: "Mounted skirmish"
    parent: deed.martial.mounted
    level: 3
    lifecycle: provisional
    definition: "True only when fighting from a moving mount: wheeling, riding down, striking or shooting from the saddle. A shot from the saddle has archery as primary and this as a grounded secondary."
    distinguish: "vs wilds.animals.riding: riding without fighting -> riding."
    aliases: ["horse archery", "ride down", "mounted fighting"]
  - id: deed.martial.mounted.beast
    name: "Monstrous mounts"
    parent: deed.martial.mounted
    level: 3
    lifecycle: provisional
    definition: "True only when fighting from a mount that is not a horse or kin (a griffon, warg, war-elephant, giant lizard) where handling that beast in battle is the point."
    distinguish: "vs mounted.skirmish: a horse, mule or camel -> skirmish."
    aliases: ["griffon rider", "warg rider", "war elephant"]
  - id: deed.martial.athletics.climbing
    name: "Climbing"
    parent: deed.martial.athletics
    level: 3
    lifecycle: provisional
    definition: "True only when climbing walls, cliffs, trees, ropes or rigging."
    distinguish: "vs athletics.acrobatics: swinging, balancing or falling well -> acrobatics."
    aliases: ["climb", "scale", "scramble up"]
  - id: deed.martial.athletics.jumping
    name: "Jumping"
    parent: deed.martial.athletics
    level: 3
    lifecycle: provisional
    definition: "True only when leaping gaps, heights or obstacles."
    distinguish: "vs athletics.acrobatics: a vault, roll or swing -> acrobatics."
    aliases: ["jump", "leap", "long jump"]
  - id: deed.martial.athletics.swimming
    name: "Swimming"
    parent: deed.martial.athletics
    level: 3
    lifecycle: provisional
    definition: "True only when swimming, diving or staying afloat in moving or deep water."
    distinguish: "vs wilds.seafaring: working a vessel -> seafaring."
    aliases: ["swim", "dive", "tread water"]
  - id: deed.martial.athletics.running
    name: "Running"
    parent: deed.martial.athletics
    level: 3
    lifecycle: provisional
    definition: "True only when sprinting, running far or pursuing or fleeing on foot as a contest of speed or wind. False for losing pursuers by trickery (guile.escape.evasion)."
    distinguish: "vs guile.escape.evasion: speed -> running; trickery -> evasion."
    aliases: ["sprint", "run", "chase on foot", "outrun"]
  - id: deed.martial.athletics.lifting
    name: "Lifting and breaking"
    parent: deed.martial.athletics
    level: 3
    lifecycle: provisional
    definition: "True only when lifting, carrying, hauling, bending or breaking by bodily force (the Force verb's martial side)."
    distinguish: "vs unarmed.wrestling: an opponent's body -> wrestling."
    aliases: ["lift", "break down a door", "bend bars", "haul"]
  - id: deed.martial.athletics.acrobatics
    name: "Acrobatics"
    parent: deed.martial.athletics
    level: 3
    lifecycle: provisional
    definition: "True only when tumbling, balancing, vaulting, swinging, rolling out of a fall or moving through a tight space with the body's control."
    distinguish: "vs athletics.jumping: distance or height -> jumping."
    aliases: ["tumble", "balance", "vault", "swing on a rope", "roll"]

  # ---- DEED level 3: deed.guile ----
  - id: deed.guile.stealth.hiding
    name: "Hiding"
    parent: deed.guile.stealth
    level: 3
    lifecycle: provisional
    definition: "True only when staying unseen in one place: blending, holding still, using cover and shadow."
    distinguish: "vs stealth.sneaking: moving while unseen -> sneaking."
    aliases: ["hide", "lie low", "blend in"]
  - id: deed.guile.stealth.sneaking
    name: "Sneaking"
    parent: deed.guile.stealth
    level: 3
    lifecycle: provisional
    definition: "True only when moving quietly and unseen past or toward watchers."
    distinguish: "vs stealth.infiltration: getting inside a guarded or closed place -> infiltration; vs stealth.shadowing: following a moving person -> shadowing."
    aliases: ["sneak", "creep", "move silently", "slip past"]
  - id: deed.guile.stealth.shadowing
    name: "Shadowing"
    parent: deed.guile.stealth
    level: 3
    lifecycle: provisional
    definition: "True only when following a moving person or group without being noticed."
    distinguish: "vs wilds.tracking.trailing: following traces, not the person in view -> tracking."
    aliases: ["tail", "follow unseen", "shadow"]
  - id: deed.guile.stealth.infiltration
    name: "Infiltration"
    parent: deed.guile.stealth
    level: 3
    lifecycle: provisional
    definition: "True only when getting into a guarded, locked or closed place without being noticed (over walls, through windows, past posts). False for opening a lock (thievery.lockpicking), which is its own beat."
    distinguish: "vs stealth.sneaking: crossing open ground past watchers -> sneaking; entering a secured place -> infiltration."
    aliases: ["break in quietly", "get inside unseen", "slip in"]
  - id: deed.guile.thievery.lockpicking
    name: "Lockpicking"
    parent: deed.guile.thievery
    level: 3
    lifecycle: provisional
    definition: "True only when opening a lock or latch mechanism with picks or improvised tools, without the key. False for breaking it (martial.athletics.lifting)."
    distinguish: "vs athletics.lifting: forcing it -> lifting."
    aliases: ["pick a lock", "lockpicks", "open the safe"]
  - id: deed.guile.thievery.pickpocketing
    name: "Pickpocketing"
    parent: deed.guile.thievery
    level: 3
    lifecycle: provisional
    definition: "True only when taking or planting something on a person without their noticing."
    distinguish: "vs thievery.sleight: the object is in one's own hands -> sleight."
    aliases: ["pick a pocket", "lift a purse", "plant"]
  - id: deed.guile.thievery.sleight
    name: "Sleight of hand"
    parent: deed.guile.thievery
    level: 3
    lifecycle: provisional
    definition: "True only when palming, swapping, concealing or manipulating small objects in plain view without it being seen (including cheating at games)."
    distinguish: "vs thievery.pickpocketing (above)."
    aliases: ["palm", "swap", "cheat at cards", "conceal in hand"]
  - id: deed.guile.thievery.traps
    name: "Trap work"
    parent: deed.guile.thievery
    level: 3
    lifecycle: provisional
    definition: "True only when finding, disarming, bypassing or resetting a mechanical trap in place. False for building one (craft.artifice.traps)."
    distinguish: "vs craft.artifice.traps: making it -> craft."
    aliases: ["disarm a trap", "bypass the tripwire"]
  - id: deed.guile.deception.lying
    name: "Lying"
    parent: deed.guile.deception
    level: 3
    lifecycle: provisional
    definition: "True only when telling someone a spoken or written falsehood so that they believe it."
    distinguish: "vs deception.con: a sustained scheme across several beats -> con."
    aliases: ["lie", "bluff", "deceive"]
  - id: deed.guile.deception.misdirection
    name: "Misdirection"
    parent: deed.guile.deception
    level: 3
    lifecycle: provisional
    definition: "True only when drawing attention elsewhere by acts (a noise, a decoy, a staged accident) so that something goes unnoticed."
    distinguish: "vs stealth.*: the attention is drawn away by an act -> misdirection; one simply is not seen -> stealth."
    aliases: ["distract", "decoy", "create a diversion"]
  - id: deed.guile.deception.feint
    name: "Feint"
    parent: deed.guile.deception
    level: 3
    lifecycle: provisional
    definition: "True only when, in a fight, selling a false attack or a false opening so that the foe commits wrongly."
    distinguish: "vs martial.tactics.maneuver (real repositioning)."
    aliases: ["feint", "false opening", "bait"]
  - id: deed.guile.deception.con
    name: "Con"
    parent: deed.guile.deception
    level: 3
    lifecycle: provisional
    definition: "True only when running a scheme of several beats or scenes on a mark, under a cover story, to make them act on a falsehood."
    distinguish: "vs deception.lying (single falsehood)."
    aliases: ["con", "swindle", "long con", "grift"]
  - id: deed.guile.disguise.costume
    name: "Costume"
    parent: deed.guile.disguise
    level: 3
    lifecycle: provisional
    definition: "True only when altering one's appearance, clothes or manner to pass as some kind of person (a guard, a pilgrim, a noble)."
    distinguish: "vs disguise.impersonation: a specific individual -> impersonation."
    aliases: ["disguise", "pose as a guard", "dress as"]
  - id: deed.guile.disguise.impersonation
    name: "Impersonation"
    parent: deed.guile.disguise
    level: 3
    lifecycle: provisional
    definition: "True only when passing as a specific, known individual."
    distinguish: "vs disguise.costume (above)."
    aliases: ["impersonate", "pass as him"]
  - id: deed.guile.disguise.forgery
    name: "Forgery"
    parent: deed.guile.disguise
    level: 3
    lifecycle: provisional
    definition: "True only when making or altering documents, seals, signatures or tokens to pass as genuine."
    distinguish: "vs craft.scribing.copying: an honest copy -> scribing."
    aliases: ["forge", "fake seal", "false papers"]
  - id: deed.guile.ambush.assassination
    name: "Assassination"
    parent: deed.guile.ambush
    level: 3
    lifecycle: provisional
    definition: "True only when a close strike on a single target unaware of the attacker is decided by the approach: the frame rolls against the target's awareness, not its Guard. False once the target knows a fight is on, or when the strike is rolled against Guard (the weapon's own tag, with this tag as a grounded secondary)."
    distinguish: "vs blade.dagger: rolled against the victim's awareness -> assassination; against Guard -> dagger."
    aliases: ["assassinate", "backstab", "kill in his sleep", "cut a throat"]
  - id: deed.guile.ambush.waylaying
    name: "Waylaying"
    parent: deed.guile.ambush
    level: 3
    lifecycle: provisional
    definition: "True only when springing a prepared ambush on a group or travelers from concealment."
    distinguish: "vs ambush.assassination: one unaware target -> assassination."
    aliases: ["ambush", "waylay", "spring the trap"]
  - id: deed.guile.ambush.sniping
    name: "Sniping"
    parent: deed.guile.ambush
    level: 3
    lifecycle: provisional
    definition: "True only when a ranged strike (bow, crossbow, sling, thrown, or a spell) on a target unaware of the shooter is decided by the approach: the frame rolls against the target's awareness. Then the weapon or spell tag is its grounded secondary. When the frame rolls against Guard or the shot's difficulty, the weapon or spell tag is primary and this tag is the grounded secondary."
    distinguish: "vs martial.archery.bow: which contest does the frame roll: the approach -> sniping; the shot -> bow."
    aliases: ["snipe", "shoot from hiding", "shoot from cover"]
  - id: deed.guile.poisoncraft.envenoming
    name: "Envenoming"
    parent: deed.guile.poisoncraft
    level: 3
    lifecycle: provisional
    definition: "True only when applying poison to a blade, missile or trap and using it on a target."
    distinguish: "vs craft.alchemy.poisons: brewing it -> craft."
    aliases: ["poison a blade", "envenom", "poisoned arrows"]
  - id: deed.guile.poisoncraft.dosing
    name: "Dosing"
    parent: deed.guile.poisoncraft
    level: 3
    lifecycle: provisional
    definition: "True only when getting poison or a drug into a target through food, drink, air or touch."
    distinguish: "vs guile.poisoncraft.envenoming: delivered by a weapon -> envenoming."
    aliases: ["poison the wine", "drug", "dose"]
  - id: deed.guile.escape.bonds
    name: "Slipping bonds"
    parent: deed.guile.escape
    level: 3
    lifecycle: provisional
    definition: "True only when getting free of ropes, chains, manacles or holds by contortion and trickery. False for breaking them by strength (athletics.lifting)."
    distinguish: "vs athletics.lifting and unarmed.wrestling: by force -> those."
    aliases: ["slip the ropes", "escape manacles", "wriggle free"]
  - id: deed.guile.escape.breakout
    name: "Breakout"
    parent: deed.guile.escape
    level: 3
    lifecycle: provisional
    definition: "True only when getting out of a cell, locked room or confinement by trickery."
    distinguish: "vs thievery.lockpicking: picking the cell lock is its own beat."
    aliases: ["break out", "jailbreak", "escape the cell"]
  - id: deed.guile.escape.evasion
    name: "Evasion"
    parent: deed.guile.escape
