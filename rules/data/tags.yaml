    distinguish: "vs animals.training: is the bird being taught, or being worked at a task it already knows? Worked -> falconry. vs tracking.hunting: is the PC pursuing the game, or the bird? The bird -> falconry."
    aliases: ["hawking", "falconer", "fly the hawk", "cast off the falcon", "austringer"]
