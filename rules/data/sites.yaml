- {id: small, progress: 6, danger: 8, note: 'a barrow, a tower, a lair'}
- {id: medium, progress: 8, danger: 8, note: 'a crypt, a cave system, a temple'}
- {id: large, progress: 12, danger: 12, note: 'an underkeep, a warren, a stronghold'}
