  progress: [12, 12]
  danger: 12
  note: two progress clocks in sequence (the halls, then the deep)
clock_templates:
- id: clk.10.site_progress
  name: The heart of <site>
  kind: progress
  segments: by size
  visibility: public
  direction: fill
  tick_sources:
  - {'on': 'frame:act.explore_onward', ticks: delivered_reach, condition: null}
  - {'on': 'table:tbl.10.site_opportunity rows 2 and 5', ticks: 1, condition: null}
  - {'on': 'fact:site map acquired (once)', ticks: 2, condition: once per site}
  - {'on': 'on_defeat:gatekeeper', ticks: 1, condition: a denizen placed by a theme danger row of kind gatekeeper}
  auto_ticks: []
  decay: []
  omens: null
  on_complete:
    effects:
    - effect_id: eff.write_fact
      params: {subject: site, predicate: next_area_is_heart, value: true}
    interrupting: false
    then: close
  races_with: null
  lifecycle: provisional
- id: clk.10.site_danger
  name: <site> wakes
  kind: danger
  segments: by size
  visibility: sensed
  direction: fill
  tick_sources:
  - {'on': trait.sense.loud, ticks: 1, condition: a beat inside the site}
  - {'on': cost.exposure, ticks: U(severity), condition: null}
  - {'on': cost.time, ticks: U(severity), condition: null}
  - {'on': 'face:S (site check)', ticks: 1, condition: null}
  - {'on': 'boundary:conflict_start', ticks: 1, condition: the conflict is inside the site}
  - {'on': trap.alarm_ticks, ticks: the trap's listed ticks, condition: null}
  - {'on': 'table:theme dangers kind clock', ticks: the row's listed ticks, condition: null}
  auto_ticks: []
  decay:
  - {boundary: day, ticks: -2, only_if: no tick since last day}
  omens: the theme's danger_clock_omens
  links:
  - {when: 'reaches:half', action: roll the theme dangers table once (a written danger)}
  on_complete:
    effects:
    - effect_id: eff.write_fact
      params: {subject: site, predicate: roused, value: true}
    interrupting: true
    then: reset
  races_with: null
  lifecycle: provisional
tables:
- id: tbl.10.area_contents
  name: What is in a new area (10.13.7)
  die: d12
  results:
  - {range: '1', result: nothing more than the feature}
  - {range: '2', result: nothing more than the feature}
  - {range: '3', result: nothing more than the feature}
  - {range: '4', result: 'a discovery (theme or domain discoveries, engine picks the card by d6: 1-3 domain, 4-6 theme)'}
  - {range: '5', result: 'denizens (site denizen table; omen-first: a pending threat arrives here, else a threat row becomes
      pending and its sign is here)'}
  - {range: '6', result: denizens (as 5)}
  - {range: '7', result: 'a trap (the domain trap list, theme-weighted)'}
  - {range: '8', result: a hazard (the domain hazard list)}
  - {range: '9', result: 'an obstacle on the way on (a barrier, a rubble choke, or a gap with a recorded drop; tier = explore
      tier)'}
  - {range: '10', result: 'a branch: a side passage to a side area (side areas do not advance progress; their contents roll
      +2, max 12)'}
  - {range: '11', result: 'a cache (08.3.12 hoard at site band - 1, coin and goods; or one gen.loot item if found by a Search
      beat)'}
  - {range: '12', result: a theme danger (roll the theme dangers)}
- id: tbl.10.site_opportunity
  name: Site opportunity (face P, critical success on Explore onward)
  die: d8
  results:
  - {range: '1', result: 'a secure corner: this area becomes rest_site camp (secured)'}
  - {range: '2', result: 'a clue toward the heart: progress clock +1'}
  - {range: '3', result: 'a forgotten cache: 08.3.12 hoard at site band - 1, coin and goods only'}
  - {range: '4', result: 'an unguarded moment: the next denizen met is unaware'}
  - {range: '5', result: 'a short way: progress clock +1'}
  - {range: '6', result: 'old marks of earlier delvers: a Precision lever on Explore onward in this site (fact)'}
  - {range: '7', result: 'a light source: a lantern with 12 intervals of oil, or three torches'}
  - {range: '8', result: 'a way out: a new exit link from this area to the surface or a known area'}
- id: tbl.10.site_generation
  name: A site generated in play (no regional table)
  die: d8
  results:
  - range: '1'
    result: theme by d8
    values: [ancient, corrupted, fortified, hallowed, haunted, infested, ravaged, wild]
  rule: 'theme: d8 over the eight themes (13 weights regionally); domain: d12 over the domains whose terrain_tags match the
    area''s terrain or terrain.ruin / terrain.underground (re-roll non-matching up to twice, then take the nearest); band:
    the area''s home band (d6: 1 = home - 1, 6 = home + 1 as a known lair); size: d6 1-2 small, 3-4 medium, 5 large, 6 the
    domain''s typical size'
denizen_table_rule: {gate: 'archetype creature_tags match a theme creature_gate_tag (ancestor match, 00.5.4c) AND archetype
    encounter.terrain matches a domain terrain tag (either direction of ancestry)', weights: theme creature_weights by the
    deepest matching tag (default 1), bands: home band = site band; 30/55/15 across band-1/band/band+1 (10.10.2), build: 'PR-10-10
    (10_table_builder.py): eight slots, start shapes T-10-25, stepped down until each row is at most fair (home+1: hard);
    passes PR-10-8 by construction (10-site-tables.py: all 560 pair x band tables)', fallback: PR-10-10 builds the table from
    the pair pool (denizen_pools). A slot no pool archetype can fill at its band draws from the theme gate alone (the creatures
    came from elsewhere to this place); only if that also fails does it take the nearest band a pool archetype has.}
