# data/sites.yaml
# Purpose: the Delve-style site cards (10.13): eight themes (what happened to the place) and fourteen
#   domains (what kind of place it is). The theme x domain pair gates the denizens, the dangers, the
#   discoveries, the features, the hazards and traps met inside, and the place axis of the loot pool gate
#   (08.3.4 item 4; 08.3.12 hoards). Also: site sizes and their clocks, the two clock templates, the
#   area-contents and site-opportunity tables, and the rule for generating a site in play.
# Owner: 10-exploration-travel-sites (owner-block 13 for regional cards and authored sites).
# Schema: data/SCHEMAS.md#sitesyaml (site_themes, site_domains: id, terrain_tags, creature_gate_tags,
#   loot_gate_tags, features, dangers, clock_templates) plus ch.10's optional keys (documented in 10.13.2):
#   description, danger, creature_weights, discoveries, climax, danger_clock_omens, regrowth, place_facts,
#   light, explore_tier, typical_size, rest_site, openness, shift, hazards, traps; top-level sizes, tables,
#   denizen_table_rule, denizen_pools (one per theme x domain pair: its gated archetypes with weights and the
#   number fielded at each band; PR-10-10 builds the per-band table from it) [revision: I-022].
# Rows: every die table is a list of {range, result, kind?, ref?} rows; features carry 06.3.8 feature_kind
#   and, for heights, drop_ft (10.12.5: 20 ft+ is a Heavy source).
# Validation: gen10_sites.py checks every tag, archetype, hazard and trap id, and fails if any theme x domain
#   pair's terrain-filtered denizen gate holds fewer than 3 archetypes (none does since revision B, I-022).
# Basis: [R5 P-28 (Ironsworn: Delve themes x domains)] [C:P5] [R2 #13] [DL-10-13..16]

schema_version: 1
site_themes:
- id: site.theme.ancient
  name: Ancient
  tags: []
  description: Forgotten by all; old works, old wards, old guardians that still keep their charge.
  danger: wild
  creature_gate_tags: [creature.construct, creature.spirit.ancestor, creature.undead.mindless, creature.beast.vermin, creature.horror.ooze]
  creature_weights: {creature.construct: 3, creature.spirit.ancestor: 2, creature.undead.mindless: 2, creature.beast.vermin: 2,
    creature.horror.ooze: 1}
  loot_gate_tags: [creature.construct, material.gem.crystal, org.order.arcane, material.stone.fine]
  dangers:
  - {range: '1', kind: gatekeeper, result: 'a guardian construct wakes at a threshold (a gatekeeper: +1 progress when defeated)',
    ref: creature.construct}
  - {range: '2', kind: trap, result: 'an old ward-trap still armed (a glyph or a mechanism, band-scaled)'}
  - {range: '3', kind: barrier, result: 'a sealed door whose mechanism is a puzzle (Understand first: a lever)'}
  - {range: '4', kind: hazard, result: 'the floor gives onto a lower hall (a height: fall by the drop)', ref: haz.fall_20}
  - {range: '5', kind: hazard, result: 'stale, dead air in a sealed room', ref: haz.bad_air}
  - {range: '6', kind: denizen, result: vermin pour from a burst wall}
  - {range: '7', kind: dread, result: the faces carved on the walls all turn to follow you (dread S1)}
  - {range: '8', kind: clock, result: 'something deep below begins to grind: the danger clock +1'}
  - {range: '9', kind: patrol, result: a construct walks its ancient round (a pending threat on the path behind)}
  - {range: '10', kind: hazard, result: a ceiling held up by one cracked pillar, ref: haz.cave_in}
  - {range: '11', kind: barrier, result: 'the way on is a shaft with rusted rungs (a climb, recorded height)'}
  - {range: '12', kind: denizen, result: an ooze that has eaten everything else here}
  discoveries:
  - {range: '1', result: 'a wall map of the whole site (progress +2, once)'}
  - {range: '2', result: 'the builders'' script: a language clue (15)'}
  - {range: '3', result: an intact mechanism worth salvage (08.6.8)}
  - {range: '4', result: 'a dead delver''s journal (a clue toward the heart: progress +1)'}
  - {range: '5', result: a still-burning everlamp (a glowing light source)}
  - {range: '6', result: a sealed niche of grave goods (a cache)}
  climax:
  - {range: '1', kind: guardian, result: a great construct bound to the heart, ref: arch.golem}
  - {range: '2', kind: sealed_way, result: a vault door of the old makers}
  - {range: '3', kind: guardian, result: 'the ancestor-spirit of the builders, who asks a question first', ref: arch.ancestor}
  - {range: '4', kind: place_of_power, result: 'the engine or altar the place was built around (resonance: arcane)'}
  - {range: '5', kind: hoard, result: 'the makers'' treasury, unguarded but trapped'}
  - {range: '6', kind: the_lost, result: the remains of the last expedition and what they carried}
  danger_clock_omens:
    stirring: ['a click deep in the walls, like a lock turning', dust falling in a thin line from a seam]
    building: [a rhythmic grinding far below, every carved eye in the hall seems newer than it was]
    imminent: [a great weight shifting somewhere ahead, lights kindling one after another down a hall no one entered]
  regrowth: {range: null}
  place_facts: []
  lifecycle: provisional
  basis: &id001 ['10.13', R5 P-28, 'C:P5', 'R2 #13']
