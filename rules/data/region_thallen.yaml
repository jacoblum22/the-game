clocks:
- id: clk.thallen.harrowby_stillness
  name: Before the stillness sets in Harrowby
  kind: countdown
  owner: 13 / sit.thallen.harrowby_quiet
  segments: 6
  filled: 1
  visibility: public
  direction: fill
  tick_sources: []
  auto_ticks:
  - boundary: watch
    ticks: 1
    condition: null
  decay: []
  omens:
