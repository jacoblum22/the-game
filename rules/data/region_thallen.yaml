  - rit.great_exorcism
  - rit.purification
  can_bargain: true
  wants:
  - that the dead be given to the ford (a body buried, burned or given to running water with the rite)
  - that a restless dead be laid
  - that one stilled by the Hush be woken or given to the ford
  - that a coin be carried to the Ford-garden for one who died unburied in the Hem
  bargain_asks: 'the d6 of tbl.bargain_asks (07.5.5) read through her wants: 1 return a body taken from a grave; 2 bring a named restless dead to rest; 3 end a named necromancer
    or a thing that keeps the dead from crossing; 4 serve her one season in four for a year as a fordwarden; 5 carry her ford-stone and her message to a named grave in the
    Hem; 6 give up a named possession taken from the dead'
  tags:
