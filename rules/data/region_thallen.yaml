rumor_tables:
- id: tbl.thallen.rumors
  name: Rumors of the March
  die: d20
  rule: each rumor's truth is SEALED here at authoring (11.6.1); 11.6.3's distortion applies as it spreads
  results:
  - range: '1'
    text: The Last Bell is cracked, and the Prior knows it.
    truth: 'true'
    points_to: sec.brede.crack
  - range: '2'
    text: 'The Margravine has a letter from the crown: if the vale is not settled in three years, she loses it.'
    truth: 'true'
    points_to: sec.vantry.term
  - range: '3'
    text: Mother Pell has found a road to Sael under the water.
    truth: 'true'
    points_to: 'sec.pell.causeway (gate: Pell''s trust at Friendly, her linchpin fate, or following her boats from Bellhollow: surveillance)'
  - range: '4'
    text: Lady Orsolin is no lady at all.
    truth: 'true'
    points_to: case.orsolin_signet
  - range: '5'
    text: The Woken are not people any more; something else woke up in them.
    truth: 'false'
    points_to: the Waking House (Abel Marrow can show otherwise)
  - range: '6'
    text: Ringsilver is just silver the dwarves lie about.
    truth: 'false'
    points_to: loc.gorrund_delve
  - range: '7'
    text: There's a hag in the fen who'll give you anything for a promise.
    truth: partial
    points_to: loc.sallow_hollow (she gives a great deal, and takes more)
  - range: '8'
    text: Ashgorge sleeps on the tribute of a hundred years of Orrow.
    truth: 'true'
    points_to: loc.ashgorge_lair
  - range: '9'
    text: The Kingsbarrows have opened from the inside.
    truth: 'true'
    points_to: loc.kingsbarrows
  - range: '10'
    text: Someone in Tolling is buying bell-wright's files.
    truth: 'true'
    points_to: clu.silent_bells.n2.p3 (Lark Mossbank)
  - range: '11'
    text: A true bell rung at the Mere would wake the whole of Sael.
    truth: partial
    points_to: obj.mother_bell (only the Mother Bell, whole)
  - range: '12'
    text: The goblins of the Rookwood steal children.
    truth: 'false'
    points_to: loc.tinkettle
  - range: '13'
    text: There was a treaty that gave the Woken their land, and the Margravine burned it.
    truth: partial
    points_to: case.treaty_of_the_ford (removed, not burned)
  - range: '14'
    text: The Lingerers in the Gloaming were never stilled because they made a bargain with the Quiet.
    truth: 'false'
    points_to: loc.hollin_hall (the Heart-tree held it back)
  - range: '15'
    text: The Bell-Prior of Sael rang the silence on purpose.
    truth: 'true'
    points_to: sec.brede.confession / sec.aude.why
  - range: '16'
    text: The hush-hounds are led by a she-wolf as big as a pony.
    truth: 'true'
    points_to: adv.thallen.hush_hound_alpha (the Standing Downs)
  - range: '17'
    text: Clan Ruvag means to take the Eastholt this autumn.
    truth: partial
    points_to: fac.thallen.ruvag goal (the grazing, not the hold)
  - range: '18'
    text: Bellhollow's tower bell is borrowed, and the Bellwardens want it back.
    truth: 'true'
    points_to: loc.bellhollow
  - range: '19'
    text: A bell-mage of Sael is still awake out there, ringing.
    truth: 'true'
    points_to: adv.thallen.sael_bellmage
  - range: '20'
    text: The Reeve takes a tenth of every smuggled cart.
    truth: 'true'
    points_to: sec.hask.bribes
tables:
- id: tbl.thallen.events
  name: Local events in the Thallen March
  die: d12
  replaces: tbl.11.local_events
  results:
  - range: '1'
    result: a traveller with the newest news of the region (11.6.6)
  - range: '2'
    result: 'a faction''s people pass on its business (a full faction, by list weight): Vantry outriders, a Pell crew, Bellwardens with handbells, or (sealed) Choir singers
      humming'
  - range: '3'
    result: a sign of a situation's next step (its trace, 11.6.2)
  - range: '4'
    result: a rumor told around a fire (tbl.thallen.rumors)
  - range: '5'
    result: an omen of a hidden clock (no tick; a repeat of its last omen)
  - range: '6'
    result: the distant toll of the Last Bell carries further than it should; for an hour every Stilled in sight seems about to turn its head
    writes: []
  - range: '7'
    result: 'someone in trouble (a hook: tbl.11.hook.thallen)'
  - range: '8'
    result: the weather turns (10's shift table)
  - range: '9'
    result: a newly Woken stumbles out of the north, forty years late (a recurring NPC; a hook of kind npc)
  - range: '10'
    result: 'a hush-pool has moved in the night: a place the PC knows now carries haz.thallen.hush_pool for a week (a written world change)'
    writes:
    - effect_id: eff.write_fact
      params:
