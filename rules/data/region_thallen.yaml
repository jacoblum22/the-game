    item_8_schools:
      closed: []
      opened: []
      notes: No school is closed. deed.arcane.necromancy.raising and deed.divine.pact write conduct evidence when used on the unwilling (05's default kept). Necromancy that
        raises the dead is a crime in Vantry lands (canon.magic_lawful). In hushed ground every arcane and divine working is impossible (no speech); primal workings of the
        elements and growth work where their source is present; deed.primal.spirits workings fail there (no spirits).
  components: &id120
  - band: 1
    name: bell-dust
    what: filings from a cracked Orrowan bell, sold by the pinch at Pell's yard
    stands_for: silver dust or thread; chalk, salt and iron filings (warding and sealing rites)
  - band: 1
    name: Wend water from the Ford-garden
    what: river water drawn at Weyla's ford in Tolling
    stands_for: running or blessed water (purification, lift curse)
  - band: 1
    name: hearth-ash
    what: ash from a hearth that has not gone out in a year
    stands_for: the keeper's customary offering (Aumbry)
  - band: 2
    name: Thallow's oil
    what: lamp oil blessed at the Last Bell
    stands_for: water, salt or oil blessed at a shrine of the keeper (consecrate ground)
  - band: 2
    name: moss from a Stilled
    what: lichen grown on one of the Stilled for forty years; the hedge-wise say it holds the Hush
    stands_for: a thing the land would miss; a token of the cursed (hexcraft)
  - band: 3
    name: ringsilver
    what: the pale metal of the Eastholt deeps that remembers sound; one ingot casts a handbell
    stands_for: a material that gates a property (imbue); a gift the land would miss (call rain)
  spirits: Spirits of place in the March understand heartfelt speech in any tongue, and gesture and offering where there is no speech; they do not understand lies (a Deceive
    aimed at a spirit is G4 by canon), written words, or anything said inside hushed ground (where they cannot be). The vale's spirits were stilled by the Hush and return slowly
    behind the Hem; the Rookwood's and the Fen's never left (13.3.5).
  hybrid_none_pairs:
    holds: true
    pairs:
      wilds x arcane: 'holds: Orrow''s bell-grammar is learned in a study, not the field'
      arcane x primal: 'holds: the Unsounding is the proof (a formula that tried to command the living silence)'
      divine x primal: 'holds: the keepers are named powers; the land''s spirits and the Quiet are nameless; no servant has both'
      primal x influence: 'holds: spirits are bargained with, not persuaded; the Spirit-talker covers it'
    dl: DL-13-09
  relics_and_refusal: a relic or storied item counts as magic for refusal.magic only when its use is a visible working (trait.sense.visible) or the NPC knows its properties
    (a fact); carrying one does not trigger the refusal (DL-13-13)
  the_waking_rule: 13.2.4
  the_quiet: 'a sleeping power, not a keeper and not a creature: nameless (no divine servant), bodiless (ci.harming_the_quiet), and the reason hushed ground stills spirits'
