        subject: npc.nell_cask
        predicate: stilled
        value: set
    - effect_id: eff.write_fact
      params:
        subject: npc.hester_tenney
        predicate: stilled
        value: set
    - effect_id: eff.write_fact
      params:
        subject: npc.miller_boy
        predicate: stilled
        value: set
    - effect_id: eff.11.seed_hook
      params:
        text: Harrowby's three set Stilled; the village divides over whether to give them to the ford
        source: sit.thallen.harrowby_quiet
        entities:
        - loc.harrowby
        - fac.thallen.fordwardens
        delivery: person
    interrupting: false
    then: close
  races_with: null
  links: []
  public_reason: 'Gammer Thrush and Abel Marrow both know the rule: a day, and then they set (canon.stilled)'
- id: clk.thallen.quiet_wakes
  name: The Quiet stirs
  kind: danger
  owner: 13 / the region
  segments: 12
  filled: 5
  visibility: hidden
  direction: fill
  tick_sources:
  - 'on': year_turn
    ticks: 1
    condition: not clk.thallen.quiet_wakes.skip_next_year_tick
  - 'on': fact loc.tolling.belltower.last_bell = silent
    ticks: 3
    condition: null
  - 'on': a true bell destroyed or a great bell silenced (a fact)
    ticks: 1
    condition: null
  - 'on': the Mother Bell rung cracked (a fact)
    ticks: 2
    condition: null
  auto_ticks: []
  decay:
  - boundary: season
    ticks: -1
    only_if: a great bell was hung or recast that season (a fact)
  omens:
    stirring:
    - the Hem's spring ebb is a little smaller than last year's
    - a hush-pool forms where none was
    building:
    - the Hem advances a mile in the summer, for the first time in forty years
    - the Last Bell's peal sounds thin even to lowland ears
    imminent:
    - the Standing Folk of Copple Field all turn their heads north on the same night
    - the White Wall of the Mere visible from the Brightfields
  on_complete:
    effects:
    - effect_id: eff.write_fact
      params:
        subject: loc.the_hem
        predicate: hushed
        value: true
    - effect_id: eff.write_fact
      params:
        subject: loc.standing_downs
        predicate: danger
        value: perilous
    interrupting: true
    then: close
  races_with: null
  links:
  - when: complete
    action: create:clk.thallen.quiet_rises
  note: 'the long horizon (13.17.3): 5/12 at the start; +1 a Year Turn; seven years to complete untouched, four if the Last Bell falls silent (+3)'
- id: clk.thallen.quiet_rises
  name: The Quiet rises
  kind: danger
  owner: 13 / the region
  segments: 12
  filled: 0
  visibility: hidden
  direction: fill
  created_by: clk.thallen.quiet_wakes completing
  tick_sources:
  - 'on': season_turn
    ticks: 2
    condition: null
  auto_ticks: []
  decay: []
  omens:
    stirring:
    - Woken falling still again where they stand
    building:
    - the Hem at the Brightfields' edge
    imminent:
    - Harrowby's people standing in their lanes
  on_complete:
    effects:
    - effect_id: eff.write_fact
      params:
        subject: loc.brightfields
        predicate: hushed
        value: true
    - effect_id: eff.write_fact
      params:
        subject: loc.tolling
        predicate: threatened_by_the_hush
        value: true
    interrupting: true
    then: close
  races_with: null
  links: []
  note: the second half of a realm-scale situation (12+12, 00.8.1 sizes); never runs unless the first completes
situations:
- id: sit.thallen.harrowby_quiet
  name: The quiet in Harrowby
  template: null
  place: loc.harrowby
  what: Harrowby's bell fell silent before midnight on Ringing-eve when its clapper was stolen; a hush-pool crept over the north lane and the green, and three villagers caught
    in it stand stilled
  facts:
  - subject: loc.harrowby.green
    predicate: hazard
    value: haz.thallen.hush_pool (the north lane and the green's edge) until Harrowby's bell or another true bell is rung there for a watch
  - subject: obj.thallen.harrowby_bellframe
    predicate: clapper
    value: missing
  clock: clk.thallen.harrowby_stillness
  default_timeline:
  - at: the next dawn
    event: the three set (the clock completes)
  - at: day 2
    event: Merrin Cask accuses Tobin before the village; Tobin is beaten (a fact) unless someone stands between them
  - at: day 3
    event: the hush-hounds come to the pool's edge at night and take a dog
  - at: week 1
    event: half of Harrowby's lowland families move to Tolling (refugees at the Waking House); Vantry outriders arrive 'to keep order'
  - at: week 2
    event: the Wakeful petition to seat a steward in Harrowby's empty hall (their goal ticks +1)
  ends_when: the pool is ended (a true bell rung there for a watch) or the default timeline runs out
  threads:
  - case.silent_bells
  lifecycle: provisional
- id: sit.thallen.harrowby_feud
  name: Cask and Reave
  template: sit_t.feud
  place: loc.harrowby
  what: the Casks have farmed Cask Farm for thirty years; Tobin Reave, Woken last spring, farmed it before the Hush and wants it back; Merrin Cask believes Tobin stole the
    bell to drive her off
  roles:
    side_a: npc.merrin_cask
    side_b: npc.tobin_reave
    stake: loc.harrowby.cask_farm
  default_timeline:
  - at: day 2
    event: Merrin accuses Tobin publicly
  - at: week 2
    event: the Wakeful take up Tobin's claim (Wakeful status toward the Casks -1)
  - at: week 4
    event: the Margravine's reeve rules for the Casks under the charter; Tobin is turned out
  lifecycle: provisional
