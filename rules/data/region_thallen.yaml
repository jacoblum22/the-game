canon_impossible:
- No working, rite or power returns the truly dead to life. A soul that has crossed Weyla's ford does not come back; the Stilled are not dead and are not covered by this line.
- No one travels in time, or undoes what has happened.
- No one makes a soul. A made thing (a golem, a bell-warden, a homunculus) has none, whatever it says.
- No one reads or speaks into a mind that is not present in the scene (a sending rite carries words, not thoughts).
- No one destroys a keeper. A keeper may be forgotten, starved of worship, bound or bargained with; never slain.
- No working makes gold, silver, ringsilver or any metal from another substance, and no working conjures lasting food, coin or goods from nothing. Conjured things vanish at
  the scene's end.
- No working or rite regrows a lost limb, eye or organ (07's maims stand; prosthesis is the road back).
- In hushed ground no sound is made or heard by any means, save the peal of a true bell and what is spoken within its peal (13.2.3).
- No spirit, ghost or summoned servant can be present or called in hushed ground; the Quiet stills them. Only the Quiet itself is there.
- 'Nothing wakes one of the Stilled except true sound by the Waking rule (13.2.4: a true bell within a day of the stilling; after that, a watch of true sound or the spring
  ebb, at Oracle odds Remote; or the Mother Bell rung whole). No medicine, working or rite does it.'
- 'The Quiet cannot be struck, wounded or slain by weapon or working: it has no body. It can be lulled (by true sound), bound (by the Mother Bell), bargained with, or woken.'
- No one flies in their own shape without magic, wings or a mount that flies.
