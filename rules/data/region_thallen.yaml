      default: Unlikely in any given place
      resonance: Likely at a place with resonance
      forest_or_fen: Even in the Rookwood, the Gloaming and the Sallow Fen (the spirits held the Hush back there)
      hushed: Impossible on hushed ground (ci.spirits_in_the_hush)
