  facts:
  - id: canon.hush.cause
    value: the Quiet, a sleeping power under the Mere of Sael, half-woke when the Mother Bell cracked on Hush-eve, year 0
    visibility: sealed
    gate: 'case: the Prior''s archive (the Bell-Prior''s confession) or reaching the Mother Bell'
  - id: canon.hush.ebb
    value: the Hem retreats about one ring every ten to twelve years; each spring a strip of land a few hours' walk deep wakes
    visibility: shown
  - id: canon.hush.pools
    value: pockets of the Hush (hush-pools) linger behind the Hem in rings 3-4 and re-form wherever a true bell that has rung over a place for years falls silent
    visibility: shown
  - id: canon.true_bell
    value: 'a bell cast with ringsilver in Orrow''s old alloy (or consecrated to Saint Thallow by rit.consecrate_ground cast with the bell in the circle) rings through the
      Hush: its peal opens hushed ground within band.far while it is rung'
    visibility: shown
  - id: canon.stilled
    value: 'the Stilled do not age, eat or breathe; they are not dead; moss and lichen grow on them; they are heavy as stone (moving one is Exert vs Hard); a Stilled wakes
      by the Waking rule (13.2.4) and only by it: at once to a true bell rung over them within a day of their stilling; after that day they are SET, and wake only to a full
      watch of true sound or the spring ebb passing them (Oracle Remote, once per Stilled per season; 13.1.5 T2 changes the odds) or to the Mother Bell rung whole'
    visibility: shown
  - id: canon.woken
    value: a Woken remembers nothing of the stilled years; their body is as it was the night they were stilled; they age from waking
    visibility: shown
  - id: canon.last_bell
    value: the Last Bell of Tolling is a true bell; it has rung every hour, day and night, since Hush-eve, rung by the Bellwardens in turn
    visibility: shown
  - id: canon.default_bargainer
    value: keeper.weyla
    visibility: available
    note: '07.5.5: Weyla at the Ford answers at the door of death in the March for anyone dying outside hushed ground'
  - id: canon.magic_lawful
    value: magic is lawful in the March; necromancy that raises the dead is a hanging crime in Vantry lands (fac.thallen.vantry duties); a working with trait.sense.visible
      inside Tolling's market or the bell-tower close is a method consequence (01.11.2) that reaches the Bellwardens
    visibility: available
  - id: canon.no_cities
    value: 'the March has no city: Tolling is its largest settlement (a town); Esterlow''s cities lie beyond the region'
    visibility: shown
