    pole: '-'
  sign: 'a ford-stone: a river pebble worn through, on a thong (item.tool.implement.holy_symbol)'
  faith: fac.thallen.fordwardens
  schools:
  - deed.divine.rites
  - deed.divine.exorcism
  - deed.divine.healing
  rites_known:
