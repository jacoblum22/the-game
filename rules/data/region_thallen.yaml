opening:
  start:
    date: Ringing Day (the spring quarter day), year 42 S.H.
    watch: dawn
    place: loc.tolling.bridge
    weather:
      fact: weather.today
      value: clear and cold; frost on the bridge parapets; a light north wind
      source: data
      note: the first day's weather is data; from the next dawn h.10.weather rolls (10.11.3) in the temperate spring regime
    moon: 'new (day 1 of the year: 11.10.3)'
    festival: 'fest.quarter_spring (Ringing Day: market, sitting, hiring fair)'
  inciting:
    scene: scn.thallen.open.bridge
    frame: 'in medias res (12.4.3: the session''s strong start)'
    moment: 'Ringing Day''s dawn on the Wend Bridge: market carts queued at the toll-house, frost on the parapets, the whole town waiting for the Last Bell''s great peal'
    impetus: 'the Last Bell rings the hour, and misses the third stroke; for a breath the whole town stands as still as the Stilled. Then hooves on the bridge: a farm-boy on
      a lathered pony (Cob Tenney) shouting that Harrowby''s bell has gone quiet, and the quiet came with it, and his mother is standing in the lane and will not move'
    pairs_with_drive: 'every pregen''s drive touches the incident or what it opens: Tamsin (the Wakeful and the Hem), Pip (Pell''s road north), Corin (the Last Bell), Orla
      (true bells), Ithren (why the Hush moves), Bee (the ballad of the Mother Bell); a player-built PC''s drive is bound by PR-13-3 step 6'
    present:
    - npc.cob_tenney
    - npc.dace_wollin
    - npc.mabry_cotter
    - Bellwarden novices on the tower stair
    - Vantry tithe-men at the toll-house
    - pilgrims, carters, a Pell & Daughters wagon
    open_prompt: What do you do?
  teaching_arc:
  - beat: T1 talk
    where: the bridge or the Cracked Clapper
    teaches: describing what you want in plain words; the OFFER (01.7) before a roll
    natural_trigger: the PC questions Cob, calms the crowd, or asks Mother Dace or a Bellwarden what the missed stroke means
    oof_line: '[HOW THIS WORKS] Just say what your character does or says. When the outcome is uncertain I''ll show you the odds and what''s at stake before anything is rolled,
      and you can change your mind.'
    anchors:
    - 15.4.1
    - '01.7'
  - beat: T2 a journey choice
    where: leaving Tolling
    teaches: 'the journey OFFER: routes in watches, danger in words, pace, the watch die (10.3.4)'
    natural_trigger: 'the PC sets out for Harrowby: the north road (2 watches, road) or straight across the Brightfields (1 watch, way-finding Easy)'
    oof_line: '[JOURNEY] Two ways to Harrowby: the road (about a day, can''t get lost) or across the fields (half that, but you have to find the way). Farm country: trouble
      is rare and small.'
    anchors:
    - 10.3.4
    - 10.4.2
  - beat: T3 explore and find a clue
    where: Harrowby green, the bell-frame, the bell-pit stair
    teaches: searching a place; clues as things you find, not conclusions (15.9.3)
    natural_trigger: the PC looks at the bell, the lane, the stair behind the frame
    oof_line: '[CLUE] Clues go in your journal as what you found. Putting them together is up to you; when you think you know something, say so and I''ll tell you whether what
      you hold supports it.'
    anchors:
    - 15.9.5
    - 15.9.9
  - beat: T4 a social knot
    where: Merrin Cask and Tobin Reave on the green
    teaches: 'standing, refusals and terms: a person will not talk until a condition changes (15.2.3)'
    natural_trigger: the PC tries to question Tobin while Merrin is accusing him
    oof_line: '[REFUSAL] Tobin won''t talk while someone''s calling him a thief. That''s a wall no roll gets through, but you can change the situation.'
    anchors:
    - 15.2.3
    - 15.3.5
  - beat: T5 the first fight, with exits
    where: the pool's edge at dusk
    teaches: threat words, omens before a fight, conflict turns, retreat and morale
    natural_trigger: the pending threat of the hush-hounds (dogs whining at nothing; then paw-prints ending at the silence) arrives at dusk if the PC is still in Harrowby
    encounter:
      ref:
      - adv.thallen.hush_hound
      count: '2'
      advisory_vs_P1: computed by the generator (13.15.4)
      exits:
      - the alehouse door (shelter, band.near)
      - 'fire: the hounds'' nerve is skittish'
      - a true bell rung (a Protective lever and their morale clock +1)
      - leaving them the sheep-pen
    oof_line: '[WARNING] Two hounds, silent. My read: easy for you. You can fight, run for the alehouse, or try something else entirely.'
    anchors:
    - '06.1'
    - '09.6'
    - '07.3'
  - beat: T6 a deed that counts
    where: anywhere in the first scenes
    teaches: 'nothing out loud: evidence is hidden (03); the world remembers deeds under pressure'
    natural_trigger: 'any resolved beat with real stakes: the fight, carrying a child out of the pool, facing down the mob, ringing the bell in time'
    oof_line: null
    anchors:
    - '03.2'
  - beat: T7 ringing true
    where: Harrowby green (or wherever a true bell is)
    teaches: 'the setting''s one idea: true sound pushes back the Quiet; the clock was public, and beating it matters'
    natural_trigger: the PC rehangs the stolen clapper (found in the bell-pit), borrows a true handbell from the Bellwardens, or buys one on credit from Pell's yard, and rings
      it over the three before the next dawn
    oof_line: '[CLOCK] Before the stillness sets: 4 of 6. When it fills, the three in the lane are set for good, or near enough.'
    anchors:
    - 13.2.4
    - 00.8.4
  leads:
  - where: Tolling, any time
    lead: 'Mother Dace at the Cracked Clapper: ''Tobin Reave saw something that night, but he''ll not speak to Merrin''s lot; and Gammer Thrush says the stilled set by the
      next dawn'''
    points_to:
    - clu.silent_bells.n1.p3
    - clk.thallen.harrowby_stillness
  - where: Tolling, the bell-tower
    lead: 'Prior Brede, at Neutral or better, asks the PC privately to find out who has been in his tower: an offer (a thread; reward earned per 08.7.2)'
    points_to:
    - clu.silent_bells.n4.p2
    - clu.silent_bells.n5.p2
  - where: the road or the fields
    lead: 'Cob Tenney rides with the PC if asked, and talks: the bell went quiet before midnight; Tobin was out late'
    points_to:
    - clu.silent_bells.n1.p3
  - where: Harrowby
    lead: Jessamy Cask humming an Orrowan lullaby, alone by the duck-pond, if her mother is elsewhere
    points_to:
    - clu.silent_bells.n1.p4
  - where: Harrowby green
    lead: 'the bell-frame itself and the stair behind it (core clues: no roll to find)'
    points_to:
    - clu.silent_bells.n1.p1
    - clu.silent_bells.n2.p1
  - where: anywhere, stalled
    lead: the case's fallbacks (15.9.12) and 12.8.2's lead injection
    points_to:
    - case.silent_bells fallbacks
  starting_state:
    faction_goal_clocks:
      clk.thallen.vantry_goal: 3/12
      clk.thallen.bellwardens_goal: 2/8
      clk.thallen.pell_goal: 4/12
      clk.thallen.choir_goal: 1/8
    petty_goal_clocks: each petty faction's goal on a 6-segment clock at its start value (factions.13.yaml)
    region_clocks:
      clk.thallen.quiet_wakes: 5/12 (hidden)
      clk.thallen.harrowby_stillness: 1/6 (public)
      clk.thallen.vantry_digs: 0/8 (hidden; +1 a fortnight)
      clk.thallen.treaty_burned: 0/6 (dormant until vantry.alerted_treaty)
    situations:
    - sit.thallen.harrowby_quiet
    - sit.thallen.harrowby_feud
    seeded_hooks:
    - the PC's creation hooks bound by PR-13-3
    - one row of tbl.11.hook.thallen at the first World Turn if fewer than three hooks are known (11.5.10)
    relations: factions.13.yaml relations
  first_fight:
    vs_reference_P1: trivial
    win: 100.0
    staggered: 0.0
