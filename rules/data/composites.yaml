# data/composites.yaml
# Purpose: named composites (constitution P6): hand-authored combinations keyed to EXACTLY TWO low-cardinality
#   keys, and the companion mechanism for everything else: the priority-rank bands of the behavioral slots and
#   the ordered spread tags. Chapter 05 authors three key kinds: harm_branch (8), conduct_axis (5) and
#   composite_key_license (9: pairs of abilities flagged composite_key in abilities.yaml). The 32 deed_branch
#   composites (one per named hybrid calling) are ch.04's owner-block, data/composites.yaml owner-block 04.
# Owner: 05-abilities-focus-magic (T-00-19; owner-block 04). Rules: 05.10. Schema: data/SCHEMAS.md#compositesyaml.
#   Optional fields added by ch.05: name, text, limits, budget. Every composite is at most 4 effect units
#   (05.11.4) and is built from effects of effects.yaml or the 05 owner-block.
# Basis: [C:P6] [C:P5] [00.10.7] [R3 05.4, 05.5, B-1, B-5, E-3] [R2 4c Three Lashings, Compounding] [DL-05-17]

schema_version: 1
lifecycle: provisional
presence_rules: {harm_branch: a depth-0 harm event of one key's branch lands on a target carrying a condition tagged with the other key's branch (cascade applies), conduct_axis: 'the actor holds, unsuspended, at least one oath-gated ability on each axis at the positive pole', composite_key_license: the actor holds both abilities and the entry's stated circumstance holds, deed_branch: 'ch.04: the actor holds the named hybrid calling (data/composites.yaml owner-block 04)', suppressed: a suppressed priority-exclusive claimant never counts as present (WE-00-6)}
priority_rank_bands:
- {band: 10-12, source: 'an ability: 10 at rank 1, 11 at rank 2, 12 at rank 3'}
- {band: '12', source: an absorbed power (gen_absorb.yaml uses 12)}
- {band: 15-19, source: an item's intrinsic property (ch.08 assigns within the band)}
- {band: 20-24, source: 'an applied consumable: an oil, a draught, a poultice (ch.08)'}
- {band: 30-34, source: a named composite or a rite}
- {band: 40-49, source: a claim imposed by another being (a curse that forces a shape; a foe's hold on how you move)}
priority_rules: [the highest rank owns the slot; lower claimants are fully suppressed unless cosmetic_merge, ties go to the earlier-acquired effect, the holder may drop a running claim of their own as a free activity, a suppressed claim keeps counting down its duration and resumes if the owner ends first]
spread_tags:
- {id: pierce, order: 1, selection: 'the primary target and each further being carrying flag.lined_up with it, nearest first', cap: 4, harm: full to each}
- {id: burst, order: 2, selection: 'the primary target and each being within band.engaged of it (or of the named point), friend and foe', cap: 6, harm: full to each}
- {id: cone, order: 3, selection: 'each being at band.engaged with the source, then each at band.close in the primary target''s group; friend and foe', cap: 4, harm: full to each, note: 'ch.06 T-06-15 (inserted at integration so both files carry one order; spell-delivery form cone)'}
- {id: fork, order: 4, selection: the primary target and one more eligible being within band.close of it per extra target the text grants, cap: 5, harm: full to each}
- {id: chain, order: 5, selection: 'after the primary resolves, the nearest other being within band.close of the last target, friend or foe', cap: 3, harm: one severity rung lighter at each leap}
- {id: linger, order: 6, selection: 'the place itself: a being that enters it or ends its turn there, until the duration ends', cap: 5, harm: as the ability states for the lingering effect}
spread_form_map: {line: pierce, burst: burst, cone: cone, chain: chain, zone: linger, bolt: null, touch: null}   # eff.05.spell_delivery forms as shapes (06's request, integration)
spread_total_cap: 6
spread_rule: a working carries at most one spread tag natively; when flares, items or composites add others they resolve in `order`, each applied to the targets the previous produced, never above spread_total_cap in total

composites:
- id: comp.thermal_shock
  name: Thermal Shock
  tags: [harm.fire, harm.frost]
  keys: [harm.fire, harm.frost]
  key_kind: harm_branch
  active_when: a depth-0 harm event deals harm.fire to a target carrying cond.chilled or cond.frozen, or deals harm.frost to a target carrying cond.burning; neither key suppressed (00.10.7)
  effects:
  - {effect_id: eff.harm_severity_step, params: {ladder: severity, steps: 1, applies_when: that harm event}}
  - {effect_id: eff.cleanse, params: {condition_or_category: 'cond.chilled, cond.frozen and cond.burning', target: the target}}
  suppresses: []
  text: 'Fire on the frozen, or frost on the burning: that harm is one severity rung heavier, and the target''s chill, freezing and burning all end.'
  budget: {value: 4, cap: 4}
  lifecycle: provisional
  basis: [05.10.6, 'C:P6', DL-05-17]
- id: comp.shatter
  name: Shatter
  tags: [harm.frost, harm.physical]
  keys: [harm.frost, harm.physical]
  key_kind: harm_branch
  active_when: a depth-0 harm event deals harm.physical.crush to a target carrying cond.frozen; neither key suppressed (00.10.7)
  effects:
  - {effect_id: eff.harm_severity_step, params: {ladder: severity, steps: 1, applies_when: that harm event}}
  - {effect_id: eff.cleanse, params: {condition_or_category: cond.frozen, target: the target}}
  - {effect_id: eff.apply_condition, params: {condition: cond.prone, severity: S1, duration: 'rounds:1', target: the target}}
  suppresses: []
  text: A crushing blow on a frozen target is one severity rung heavier, ends the freezing and knocks it prone.
  budget: {value: 4, cap: 4}
  lifecycle: provisional
  basis: [05.10.6, 'C:P6', DL-05-17]
- id: comp.cauterize
  name: Cauterize
  tags: [harm.fire, harm.physical]
  keys: [harm.fire, harm.physical]
  key_kind: harm_branch
  active_when: harm.fire of any severity is applied to a target carrying cond.bleeding; neither key suppressed (00.10.7)
  effects:
  - {effect_id: eff.cleanse, params: {condition_or_category: cond.bleeding (every stack), target: the target}}
  suppresses: []
  text: Fire applied to a bleeding body ends its bleeding. The fire's own harm still lands.
  budget: {value: 2, cap: 4}
  lifecycle: provisional
  basis: [05.10.6, 'C:P6', DL-05-17]
- id: comp.flashfire
  name: Flashfire
  tags: [harm.fire, harm.venom]
  keys: [harm.fire, harm.venom]
  key_kind: harm_branch
  active_when: a depth-0 event deals harm.fire to a target or in a place carrying an effect or condition tagged harm.venom.gas; neither key suppressed (00.10.7)
  effects:
