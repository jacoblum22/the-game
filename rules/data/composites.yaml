  - {effect_id: eff.cleanse, params: {condition_or_category: the gas effect and cond.choking it caused, target: the place}}
  suppresses: []
  text: 'Fire in a gas: each being engaged with it takes Moderate fire harm, and the gas and the choking it caused are gone.'
  budget: {value: 4, cap: 4}
  lifecycle: provisional
  basis: [05.10.6, 'C:P6', DL-05-17]
- id: comp.searing_purge
