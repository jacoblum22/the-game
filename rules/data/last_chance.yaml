# data/last_chance.yaml
# Purpose: the nine options of the last-chance menu, offered at the Threshold in place of any death roll (07.5).
#   The engine evaluates `requires` against state, the DM may strike an option only for a reason on its closed
#   `struck_when` list (citing a fact id), and the engine validates that at least three options remain and at least one
#   is not death (always true: lc.maimed or lc.road_ends, lc.last_stand, lc.gamble). There is no default choice.
#   Death is written only by lc.last_stand, or by lc.gamble on a failure (the Two-Key rule, 07.3.1).
# Owner: 07-harm-recovery-death. Schema: data/SCHEMAS.md#last_chanceyaml (Option: id, name, requires, outcome,
#   world_writes, fate_cost?, always_available?). Optional fields added by ch.07 (documented in 07 Tables): order,
#   struck_when, text, death, stays_in_scene, brink_wound, mark, once_per, fate_cost_range, degrees, check, ends_career.
# fate_cost: ch.01's spend_fate(n) (01.16.4); n = min(3, 1 + reprieves already taken in this character's life).
# Generated and validated by rules/_process/simulation/07-gen_data07.py.
# Basis: [07.5] [R6 C.3 C-R3] [R4 9 07 item 5] [INV-6] [01.16.4] [DL-07-05] [DL-07-06] [DL-07-07]

schema_version: 1
validation: {min_options: 3, min_not_death: 1, default_choice: none, pause_point: true}
options:

- id: lc.captured
  name: Captured
  order: 1
  tags: []
  requires: a victor is present AND (victor.defeat_disposition in [capture, ransom, rob, drag_to_lair] OR victor.objective
    == capture(pc))
  struck_when: ['the victor''s disposition changed to kill this scene (a recorded behavior change, 09)', 'quarter was
      offered and refused this scene (fact quarter_refused), unless capture is the victor''s own objective']
  outcome:
  - effect_id: eff.07.stabilize
    params: {target: the PC, brink_wound: true}
  - effect_id: eff.write_fact
    params: {subject: pc, predicate: defeated.manner, value: captured}
  world_writes: ['run disposition capture, defeated column (T-07-11; PR-07-7)', setback.threshold, setback.captured, a
      brink mark (07.7.3), chronicle line]
  text: 'You live, in their hands: taken, stripped, held somewhere with a clock and three ways out.'
  always_available: false
  death: false
  stays_in_scene: false
  brink_wound: true
  mark: 'chosen: one of three'
  lifecycle: provisional
  basis: [07.5.2, T-07-10, R6 C.3 C-R3, DL-07-05]
- id: lc.maimed
  name: Maimed
  order: 2
  tags: []
  requires: NOT chosen this scene AND some attribute has no maim and is above -2
  struck_when: []
  outcome:
  - effect_id: eff.07.stabilize
    params: {target: the PC, brink_wound: true}
  - effect_id: eff.restore
    params: {quantity: vitality, units: to ceil(vitality.max / 4), target: the PC}
  - effect_id: eff.07.maim
    params: {attribute_order: the drawn maim entry's, amount: -1}
  - effect_id: eff.write_fact
    params: {subject: pc, predicate: wound_load, value: 0}
  world_writes: ['a maim entry drawn by the site of the worst fresh wound (07.7.4; injuries.yaml kind: maim)', setback.threshold,
    chronicle line]
  text: The blow that should have killed takes something else, for life. You stand, with a quarter of your Vitality.
  always_available: true
  once_per: scene
  death: false
  stays_in_scene: true
  brink_wound: true
  mark: the maim
  lifecycle: provisional
  basis: [07.5.2, T-07-10, R6 C.3 C-R3, DL-07-05]
- id: lc.bargain
  name: Death's Bargain
  order: 3
  tags: []
  requires: a bargainer exists (07.5.2 decision 2) AND the PC carries no aff.deaths_debt
  struck_when: ['the bargainer is the foe at the Threshold and holds a recorded refusal (15): the PC''s death is its sworn
      duty']
  outcome:
  - effect_id: eff.07.stabilize
    params: {target: the PC, brink_wound: true}
  - effect_id: eff.restore
    params: {quantity: vitality, units: to 1, target: the PC}
  - effect_id: eff.force_check
    params: {verb: none, effect_dc_source: none, degree_table: 'afflictions.yaml#aff.deaths_debt at stage 1, no exposure
        check'}
  world_writes: [vow thread for the ask (11) with clk.deaths_debt (harm.yaml#clock_templates), the mark inj.mark.deaths_debtor,
    setback.threshold, the bargainer ends the danger in its own way (a fact naming how), chronicle line]
  text: A power spares you for a price it names. You carry its curse until the debt is paid; forfeit, and you stand here
    again.
  always_available: false
  death: false
  stays_in_scene: false
  brink_wound: true
  mark: inj.mark.deaths_debtor
  lifecycle: provisional
  basis: [07.5.2, T-07-10, R6 C.3 C-R3, DL-07-05]
- id: lc.left_for_dead
  name: Left for Dead
  order: 4
  tags: []
  requires: (a victor is present AND victor.defeat_disposition NOT in [kill, drag_to_lair]) OR (no victor AND the source
    is a hazard or affliction)
  struck_when: ['the hazard is one nothing is left in: a flow of molten rock, a sealed and flooding vault (a recorded
      fact of the place)']
  outcome:
  - effect_id: eff.07.stabilize
    params: {target: the PC, brink_wound: true}
  - effect_id: eff.restore
    params: {quantity: vitality, units: to 1, target: the PC}
  world_writes: [advance_time one watch (every boundary runs), objective_lost, a folk victor takes all carried coin and
      the most valuable carried item to a cache (07.6.4), what was in hand lies where the PC fell, 'the belief pc.dead
      on the victor (truth: false)', setback.threshold, setback.defeated, a brink mark (07.7.3), chronicle line, 'position:
      where the PC fell, or the nearest place downstream or below when the source was water or a fall']
  text: They take you for dead and go. You wake a watch later with what they did not want.
  always_available: false
  death: false
  stays_in_scene: false
  brink_wound: true
  mark: 'chosen: one of three'
  lifecycle: provisional
  basis: [07.5.2, T-07-10, R6 C.3 C-R3, DL-07-05]
- id: lc.rout
  name: Rout
  order: 5
  tags: []
  requires: (a route exists (07.4.3 decision 1) AND the PC is not cornered, restrained or pinned) OR an able companion
    can carry the PC
  struck_when: [every recorded route is held (facts naming who holds each)]
  outcome:
  - effect_id: eff.07.stabilize
    params: {target: the PC, brink_wound: true}
  - effect_id: eff.restore
    params: {quantity: vitality, units: to 1, target: the PC}
  - effect_id: eff.tick_clock
    params: {clock: the clock chosen by 07.4.3, ticks: U(S4)}
  world_writes: ['position: the nearest safe place the route reaches', fallen companions carried along, objective_lost,
    setback.threshold, 'setback.retreated {severity: S4}', a brink mark (07.7.3), chronicle line]
  text: 'You are carried or drag yourself clear, and the world pays: three ticks on the clock this fight was about.'
  always_available: false
  death: false
  stays_in_scene: false
  brink_wound: true
  mark: 'chosen: one of three'
  lifecycle: provisional
  basis: [07.5.2, T-07-10, R6 C.3 C-R3, DL-07-05]
- id: lc.reprieve
  name: Reprieve
  order: 6
  tags: []
  requires: fate.current >= fate_cost
  struck_when: []
  outcome:
  - effect_id: eff.07.stabilize
    params: {target: the PC, brink_wound: false}
  - effect_id: eff.restore
    params: {quantity: vitality, units: to ceil(vitality.max / 4), target: the PC}
  - effect_id: eff.write_fact
    params: {subject: pc, predicate: wound_load, value: 0}
  world_writes: [spend_fate(fate_cost) (01.16.4), the event that passed the Threshold is undone (its harm and step are
      not applied), reprieves_taken + 1, setback.threshold, chronicle line]
  text: Luck, spent. The blow goes wide. You stand with a quarter of your Vitality and owe nothing.
  fate_cost: min(3, 1 + reprieves_taken)
  fate_cost_range: [1, 3]
  always_available: false
  death: false
  stays_in_scene: true
  brink_wound: false
  mark: none
  lifecycle: provisional
  basis: [07.5.2, T-07-10, R6 C.3 C-R3, DL-07-05]
- id: lc.last_stand
  name: Last Stand
  order: 7
  tags: []
  requires: none
  struck_when: []
  outcome:
  - effect_id: eff.write_fact
    params: {subject: pc, predicate: last_stand, value: one turn of three actions; every rolled beat is a critical success
        at its framed reach; abilities cost no Focus (07.5.9)}
  - effect_id: eff.write_fact
    params: {subject: pc, predicate: harm_state, value: 'dead (at the end of that turn; Key 1 on record, Key 2 a)'}
  world_writes: [a legend line in the chronicle with its witnesses (11), ch.11's legacy procedure begins]
  text: One last turn in which nothing you attempt fails. Then you die.
  always_available: true
  death: true
  stays_in_scene: true
  brink_wound: false
  mark: none
  lifecycle: provisional
  basis: [07.5.2, T-07-10, R6 C.3 C-R3, DL-07-05]
- id: lc.gamble
  name: Gamble
  order: 8
  tags: []
  requires: none
  struck_when: []
  outcome:
  - effect_id: eff.force_check
    params: {verb: endure, effect_dc_source: 'tier: moderate', degree_table: last_chance.yaml#lc.gamble.degrees}
  world_writes: [a lethal frame with its own OFFER (exact odds shown; auto_commit never applies), setback.threshold, chronicle
      line]
  text: One roll, odds shown. You may walk away having paid nothing. You may die.
  always_available: true
  death: on failure and critical failure
  stays_in_scene: by result
  brink_wound: by result
  mark: by result
  degrees: {critical_success: 'as lc.reprieve at no cost (no fate spent, no brink wound)', success: 'stabilized where
      the PC lies and overlooked: as lc.left_for_dead with nothing taken and no mark; a brink wound', failure_within_3: 'the
      player chooses one still-available option of lc.captured, lc.maimed, lc.bargain, lc.left_for_dead, lc.rout and pays
      it in full', failure: harm_state.dead (Key 2 b), critical_failure: harm_state.dead (Key 2 b)}
  check: {verb: verb.endure, attribute: endurance, dc_tier: moderate, levers: none, status: none, fate_reroll: true}
  lifecycle: provisional
  basis: [07.5.2, T-07-10, R6 C.3 C-R3, DL-07-05]
- id: lc.road_ends
  name: The Road Ends
  order: 9
  tags: []
  requires: none
  struck_when: []
  outcome:
  - effect_id: eff.07.stabilize
    params: {target: the PC, brink_wound: true}
  - effect_id: eff.restore
    params: {quantity: vitality, units: to 1, target: the PC}
  world_writes: ['ch.11''s retirement procedure runs at once, ending: retire to a life; the character becomes an NPC',
    carried from the scene by whoever the fiction provides (a fact naming who), setback.threshold, chronicle line]
  text: You live, and never take the road again. Your story passes to those who come after.
  always_available: true
  death: false
  stays_in_scene: false
  brink_wound: true
  mark: none
  ends_career: true
  lifecycle: provisional
  basis: [07.5.2, T-07-10, R6 C.3 C-R3, DL-07-05]
