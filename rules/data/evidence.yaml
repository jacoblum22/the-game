# --------------------------------------------------------------------------------------------------
# the sealed functions (03.9) and their access
# --------------------------------------------------------------------------------------------------
functions:
  - {id: tally, args: [actor, tag, include_pending], returns: [raw, weighted, recent], access: ["04"], visibility: sealed}
  - {id: detail, args: [actor, tag, since], returns: [raw, weighted, recent, secondary_weighted, successes, failures, by_quality, by_band, success_by_band, peak_band, crises, peaks, distinct, first_at, last_at, scenes_since_last], since: "a time or a scene index", notes: "peak_band = highest band among successes; distinct adds opponent_kinds_nonfolk (integration: IR ch.04)", access: ["04"], visibility: sealed}
  - {id: share, args: [actor, tag], returns: [num, den], access: ["04"], visibility: sealed}
  - {id: dominance, args: [actor, tag], returns: [lead, rival, num, den], access: ["04"], visibility: sealed}
  - {id: profile, args: [actor, facet, level], returns: ["[{tag, weighted, recent, raw}]"], access: ["04"], visibility: sealed}
  - {id: cooccurrence, args: [actor, a, b], returns: [weighted_a, weighted_b, min, balance, joint_events, joint_scenes, recent_min], access: ["04"], visibility: sealed}
  - {id: diversity, args: [actor, tag], returns: [scenes, days, contexts, opponent_kinds, places, children], access: ["04"], visibility: sealed}
  - {id: conduct, args: [actor, axis], returns: [pos, neg, atoned, net, recent_net, strain, forbidden, last_negative_at, scenes_since_negative, witnessed_pos, witnessed_neg, pos_events, pos_events_m4], access: ["04"], visibility: sealed}
  - {id: counted, args: [actor, tag], returns: [units, recent_units, by_counter], access: ["04"], visibility: sealed}
  - {id: public, args: [actor, tag, scope], returns: [weighted, events, last_at], access: ["04", "11"], visibility: background}
  - {id: last_exercised, args: [actor, tag], returns: [scenes_since, time_since], access: ["04", "12"], visibility: background}
  - {id: evidence_for_frame, args: [frame_id], returns: ["[{event_id, tags}]"], access: ["04", "07", "11"], visibility: background}
ledger_view:                      # 03.11.1: what the codex may show (visibility: available)
  shows: [deed, primary_tag, secondary_tags, conduct_axis_and_sign, scene, time, known_witnesses, status]
  never_shows: [points, magnitude, tallies, recent, thresholds, nearness]

