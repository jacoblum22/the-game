  - owner: '13'
    entries:
    - id: haz.thallen.hush_pool
      name: Hush-pool
      tags: []
      terrain_tags: []
      harm_tags:
      - harm.mind.strain
      severity: S1
      resist:
        verb: verb.endure
        attribute: resolve
        dc_tier: moderate
        stakes: risky
      cadence: watch
      conditions:
      - effect_id: eff.apply_condition
        params:
          condition: cond.silenced
          target: every creature inside
          duration: while inside the hazard's area
      - effect_id: eff.apply_condition
        params:
          condition: cond.deafened
          target: every creature inside
          duration: while inside the hazard's area
      affliction: null
      no_reduction: true
      perceived_on_sight: false
      detect:
        tier: easy
        note: 'felt the moment one steps in: one''s own footfall makes no sound'
      signs:
      - birdsong stops at a line in the grass
      - a dropped stone lands without a sound
      - moss on the shoulders of someone standing very still
      omens: []
      lethal_context: false
      aftermath: a creature Down inside is stilled (13.2.4) unless carried out before the next watch
      protections:
      - means: a true bell rung within band.far (a fact true_bell on an item rung as one action each round, or each interval out of conflict)
        effect: negate
      - means: the peal of a true bell rung over the place for one full watch
        effect: ends the hazard there (written as a world change)
      pace_steps: 0
      feature_kind: hazard
      avoid:
      - go round it (the edge is a sign)
      - ring a true bell
      notes: 'Rules effects, not harm: inside, cond.silenced and cond.deafened hold (no speech, so no Talk, no arcane or divine working; trait.sense.loud beats make no noise,
        a lever on Sneak). A dread exposure at S1 each watch spent inside (07.11.2). A creature Staggered or Down inside at a watch boundary is stilled. ci.sound_in_the_hush
        and ci.spirits_in_the_hush apply.'
      lifecycle: provisional
      basis:
      - 13.2.3
      - 10.12.8
      - 07.11.2
      - cond.silenced
      - cond.deafened
    - id: haz.thallen.deep_hush
      name: The deep Hush
      tags: []
      terrain_tags: []
      harm_tags:
      - harm.mind.strain
      severity: S2
      resist:
        verb: verb.endure
        attribute: resolve
        dc_tier: hard
        stakes: dire
      cadence: watch
      conditions:
      - effect_id: eff.apply_condition
        params:
          condition: cond.silenced
          target: every creature inside
          duration: while inside the hazard's area
      - effect_id: eff.apply_condition
        params:
          condition: cond.deafened
          target: every creature inside
          duration: while inside the hazard's area
      affliction: null
      no_reduction: true
      perceived_on_sight: true
      signs:
      - no wind moves the grass though clouds race overhead
      - whole villages standing in their lanes
      - the light itself seems to wait
      omens: []
      lethal_context: true
      aftermath: a creature Down inside is stilled at once (13.2.4)
      protections:
      - means: a true bell rung within band.far
        effect: step -1 (to a hush-pool's effects) while rung
      - means: the Mother Bell rung
        effect: negate across the region
      pace_steps: 0
      feature_kind: hazard
      avoid:
      - turn back
      - carry a true bell and a ringer to spare
      notes: 'As haz.thallen.hush_pool, at S2 dread each watch, Hard; lethal_context true because a creature Down here is stilled at once with no carry-out: stilling is a defeat
        with a recorded lethal context (07.2), and the last-chance menu applies. Covers ring 4''s Quietlands and ring 5''s Mere.'
      lifecycle: provisional
      basis:
      - 13.2.3
      - 10.12.8
      - '07.2'
      - 07.11.2
