# data/gen_loot.yaml
# Purpose: the loot domain of the gate->fill generator (00.11): what a defeated source or a found cache
#   yields. Pool gate = the source's nature (and, for place_gated entries, the place); fill = the manner of winning.
# Owner: 08-items-loot-crafting (T-00-19). Schema: data/SCHEMAS.md#gen_lootyaml plus the optional fields
#   documented in chapter 08's Tables section (T-08-1).
# GENERATED by rules/_process/simulation/08-gen_data08.py (validated against tags.yaml, effects.yaml + contrib,
#   conditions.yaml, licenses.yaml + contrib, abilities.yaml and gen_absorb.yaml). Edit the script, not this file.
# Every entry lifecycle: provisional (00.16.3).

schema_version: 1
lifecycle: provisional
domain: gen.loot
output_kind: item
pool_ref: item_properties.yaml#properties where domains contains loot
trigger: {event: 'on_defeat (manner defeated, yielded or drive_off with a body or a yield) or a resolved search of a found thing', resolved_only: 'an on_defeat carrying a frame id, or a resolved Observe/Handle
    search frame (00.11.2: a narrated kill that was never resolved generates nothing)', per: 'ONE generate() per defeated side (a mob, a pack or a band is one side: 06.10.2) with source = the side''s highest-band
    member; harvest (08.3.10) is per body'}
circumstances:
- {id: decisive, true_only_when: 'the source was defeated (06.13.3 manner: defeated) by the PC''s own resolved beat (a frame id on on_defeat) in a conflict in which the PC was never Staggered or Dying and
    no frame against the PC was lethal', false_for: 'a foe finished by an ally, a companion or a hazard; any fight in which the PC was Staggered; a foe that yielded and was spared (merciful); the same as
    gen_absorb''s decisive (04.10)'}
- {id: costly, true_only_when: 'the source was defeated by the PC''s own resolved beat AND during that conflict the PC was Staggered or Dying, or a frame against the PC was lethal (gen_absorb''s narrow_survival:
    one classification serves both domains)', false_for: a hard fight the PC came through above 0 Vitality with no lethal frame (decisive)}
- {id: merciful, true_only_when: 'the source yielded, was subdued nonlethally or broke and was let go by the PC''s own resolved beat AND a mercy fact is written (it is spared); the item is given or surrendered',
  false_for: 'a creature bound and then killed (decisive or nothing); a mindless creature (creature.undead.mindless, creature.construct, creature.horror.ooze), which cannot yield'}
- {id: scavenged, default: true, true_only_when: 'none of the above: the source was found dead, killed by another or by a hazard, or the thing is found rather than won (a cache, a corpse, a hoard after
    its keeper fled); the degree is the SEARCH beat''s', false_for: any defeat by the PC's own resolved beat}
fill_map:
- {circumstance: decisive, fill_method: signature}
- {circumstance: costly, fill_method: biased, bias_tag: ward}
- {circumstance: merciful, fill_method: chosen}
- {circumstance: scavenged, fill_method: weighted}
drop_check:
  rule: before rung lookup, the engine rolls d100 against the source's yield; a miss means NO property item (materials, coin and the source's own gear only)
  yield:
    none: 0
    trophy: {T1: 10, T2: 15, T3: 30, T4: 40, T5: 55}
    hoard: 100
    always: 100
  principal: 'a principal NPC (12.11.1) or an archetype marked loot.yield: always drops on every defeat'
  basis: ['Diablo II treasure classes'' NoDrop weight, R3 08.1/A-1', DL-08-08]
quality_rungs:
- {id: worn, index: 1, signature_slots: 0, magnitude_slots: 0}
- {id: common, index: 2, signature_slots: 0, magnitude_slots: 0}
- {id: fine, index: 3, signature_slots: 0, magnitude_slots: 1}
- {id: masterwork, index: 4, signature_slots: 1, magnitude_slots: 1}
- {id: wondrous, index: 5, signature_slots: 1, magnitude_slots: 2}
quality_map:
- {circumstance: decisive, degree: critical_success, quality_rung: masterwork}
- {circumstance: decisive, degree: success, quality_rung: masterwork}
- {circumstance: costly, degree: critical_success, quality_rung: masterwork}
- {circumstance: costly, degree: success, quality_rung: masterwork}
- {circumstance: merciful, degree: critical_success, quality_rung: masterwork}
- {circumstance: merciful, degree: success, quality_rung: masterwork}
- {circumstance: scavenged, degree: critical_success, quality_rung: fine}
- {circumstance: scavenged, degree: success, quality_rung: fine}
- {circumstance: scavenged, degree: failure, quality_rung: common}
- {circumstance: scavenged, degree: critical_failure, quality_rung: common}
hoard_map:
  rule: 'a hoard (yield: hoard, or a site''s treasure with source = the place) generates by band, circumstance as classified (usually scavenged or decisive); a hoard is found where it is kept: a hoard-keeper
    defeated away from its lair or vault drops as trophy, and its hoard waits there (08.3.12) [revision: I-018]'
  T1:
  - {rung: fine, count: 1}
  T2:
  - {rung: masterwork, count: 1}
  T3:
  - {rung: masterwork, count: 1}
  T4:
  - {rung: wondrous, count: 1}
  T5:
  - {rung: wondrous, count: 1}
  - {rung: masterwork, count: 1}
  coin_table: economy.yaml#hoard_coin
  goods_table: economy.yaml#hoard_goods
degree_effects: {critical_success: greater, critical_failure: flawed}
degree_effect_rules: {greater: 'one property (the signature first, else the first magnitude) gains +1 tier, which may exceed tier_cap by at most 1 (00.11.3 step 5)', flawed: 'loot: the item''s one magnitude
    slot is removed (a fine find becomes a common one) and the item is created damaged'}
tier_rule: {signature: tier_cap, magnitude: 'tier_cap - 1, minimum 1', tier_cap: 'the source''s threat band (T1 -> 1 ... T5 -> 5); a place''s tier_cap is its site band (10; a region''s seed, 12.16.12)'}
recency_window: 5
slot_cap: the base item's slot_cap (base_items.yaml)
pool_gate: {source_tags: the archetype's creature_tags (most specific first) + its harm_tags + its evidence_tags (deed.*) + its org tags + loot.pool_gate_tags (09) + the trophy base's material_tags, made_by_hands: 'an
    armament (weapon, armor, shield) taken from a folk or undead source adds creature.folk to the source tags: the folk-made mundane properties are open to it', place_tags: 'the terrain tags of the place
    where it was won (10; a region''s seed, 12.16.8); they open ONLY entries flagged place_gated', base_kinds: an entry is kept only if one of its base_kinds is an ancestor-or-equal of the generated base
    item's tags, excluded: an entry is dropped if any excluded_tag matches the source, signature_only: entries marked signature_only may fill only the signature slot, saturation: 'an entry whose family
    the base item already fills to the item share (e.g. keen on a versatile weapon: harm_edge) is dropped (08.2.4)'}
base_selection:
  rule: 'the item''s base: (1) the archetype''s loot.trophy_base if 09 names one (an item tag or a bi.* id); else (2) the trophy default for the source''s creature branch below; (3) for folk and armed sources,
    one of the source''s own carried items chosen by d6 from its gear list (09); a tag resolves by drawing uniformly among base items carrying it with trophy_eligible not false'
  trophy_defaults:
    creature.beast: [item.jewelry.charm, item.garment.cloak, item.armor.light.leather]
    creature.folk: [the source's own gear]
    creature.undead: [item.jewelry.ring, item.jewelry.amulet, item.weapon]
    creature.spirit: [item.jewelry.charm, item.jewelry.amulet]
    creature.fiend: [item.weapon, item.jewelry.ring]
    creature.construct: [item.shield, item.jewelry.amulet, item.armor.medium]
    creature.elemental: [item.jewelry.charm, item.jewelry.amulet]
    creature.dragon: [item.armor, item.shield, item.jewelry.charm]
    creature.horror: [item.jewelry.charm, item.weapon]
  die: d6 over the list repeated in order (1-2 first, 3-4 second, 5-6 third; a one-entry list is certain)
default_signatures: item_properties.yaml#default_signatures (09 may name another signature_eligible entry whose gate matches)
harvest: '08.3.10 / PR-08-3: materials.yaml entries whose source_tags match the body'
contract_09:
  archetype_fields_read: [creature_tags (most specific first), harm_tags, evidence_tags, org_tags (folk), threat_band (tier_cap; drop chance), 'loot.yield (none | trophy | hoard | always; default trophy
      for anything with a body, none for mindless vermin and swarms)', loot.trophy_base (item tag or bi.* id; optional), loot.pool_gate_tags (optional additions), 'signature_property (prop.*, optional;
      default from default_signatures)', 'loot.flaw (flaw.*, optional: a curse in the source''s nature, e.g. a lich''s rings Binding; sealed until attunement or study, 08.5.4)', 'gear (folk: base item ids
      or tags carried and dropped, mundane, quality worn/common)', purse (coin table id; folk only), harvest (mat.* override; optional), signature_of on gen_absorb entries (used by gen.item_ability's decisive
      fill)]
  validation: every archetype's tag set must leave >= 3 entries in the gated pool for its usual trophy base at tier_cap 1 (the simulation checks the 24 reference archetypes; 09 re-runs it on its own)
