    solution:
    - fact: sol.treaty.exists
      value: the Treaty of the Ford, sealed at the Treaty Stone a hundred and sixty years ago, binds Esterlow's lords to honor the holdings of Orrow's folk under any crown
    - fact: sol.treaty.removed
      value: the Margravine had Tolling's copy taken from the Weigh-house archive two winters ago; it is in the iron chest of her muniment room
    - fact: sol.treaty.copy
      value: a sealed copy lies in Orsolin Manor's muniment chest
    clues:
