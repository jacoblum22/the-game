# data/investigation.yaml
# Purpose: the clue-graph schema and validity rules, investigative method kinds, graduated delivery of
#   findings, deduction, the journal, case-generation tables, and the starter case template used by
#   WE-15-3 (case.mill_fire).
# Owner: 15-social-investigation-downtime (15.9). Canonical for numbers and ids (00.1.4 item 5).
# Schema: data/SCHEMAS.md#investigationyaml. Required keys: clue_graph_template, delivery. Optional keys
#   added by ch.15: validity, methods, core_clues, leads, deduction, confirmation, fallbacks,
#   opposition_omens, research, surveillance, journal, knowledge, tables, cases.
# Ids: clue nodes clu.<case>.<node>; placements clu.<case>.<node>.p<n>; found facts clu.<...>.found
#   (read by 03's cnt.clue); case templates case.* (prefix requested of 00, 15 Interface requests).
# Basis: [15.9] [R4 §5.1-5.2] [R1 #12, G-6] [R5 P-41] [R6 B-13, B-R4]
#   [R: https://thealexandrian.net/wordpress/1118/roleplaying-games/three-clue-rule]
#   [R: https://pelgranepress.com/gumshoe/files/GUMSHOE%20SRD%20CC%20version.pdf] [DL-15-24..DL-15-26]

schema_version: 1

clue_graph_template:       # T-15-14 (15.9.2)
  solution: {facts: "[fact ids]", visibility: sealed, truth: true, written_at: creation}
  nodes:
    - id: "clu.<case>.<node>"
      fields:
        fact: "the solution fact the node asserts"
        necessary: bool
        deducible_from: "[[clue content fact ids | lore keys]]  # alternative sets, each 2-3 items; >= 1 set needs no lore"
        points_to: "[node ids]"
        prerequisites: "[fact ids that must be in PC knowledge before any placement can deliver]"
        sealed_fact: "= fact (SCHEMAS required field name)"
        placements: "[placement ids] (>= 3 when necessary)"
  placements:
    - id: "clu.<case>.<node>.p<n>"
      fields:
        holder: "entity id"
        holder_kind: "person | place | object | document | event | rumor"
        method: "method kind (methods below)"
        access: "core | rolled"
        detect_tier: "obstacle tier (rolled)"
        request_size: "R1..R5 (person holders)"
        content: "the clue fact learned"
        direct: "bool: the content IS the node's fact"
        reveals_lead: "[placement ids]"
        invites: "[lore keys]"
        status: "unfound | found | lost"
        nodes: "[node ids this placement points to]"
  reserve_per_necessary_node: 2
  fallbacks: "[{trigger: stalled | clock_reaches:<n> | scenes_without_clue:<n>, form, delivers: core placement of an unfound necessary node}]"
  opposition_clock: "optional; hidden, with omens; each omen stage names a placement"

validity:                  # 15.9.4 (validated by PR-15-6; audited by h.15.placement_audit)
  per_necessary_node:
    min_placements: 3
    min_holder_kinds: 2
    min_method_kinds: 2
    min_core: 1
    min_places: 2
    reserve: 2
  per_case:
    entry_core_reachable_from_start: true
    min_fallbacks: 1
  audit:
    handler: h.15.placement_audit
    live_placement: "holder exists, not destroyed, dead or departed beyond reach; status not lost"
    min_live: 2
    on_short: "place one reserve placement; when the reserve is spent, PR-15-7 generates one (core, seeded by a rumor)"

methods:                   # T-15-13 (15.9.6)
  - {id: imethod.search, name: search, tags: [deed.lore.investigation.search], anchor: act.search, verb: verb.observe, attribute: wits, alt_attribute: {intellect: papers},
     dc_source: detect_tier, time: {free: "10 min a room, 1 hour a building", site: "1 interval an area"}, holder_kinds: [place, object, document], lifecycle: provisional, basis: ["15.9.6", "10 T-10-20"]}
  - {id: imethod.inquiry, name: inquiry, tags: [deed.lore.investigation.inquiry], anchor: "15.4.1", verb: verb.talk, attribute: presence,
     dc_source: "social DC at the placement's request_size", time: {free: "minutes per person", downtime: "1 day asking around"}, holder_kinds: [person, rumor], lifecycle: provisional, basis: ["15.9.6"]}
  - {id: imethod.read, name: read, tags: [deed.influence.insight], anchor: "15.6.1", verb: verb.observe, attribute: wits, dc_source: mask,
     time: {free: "within the conversation"}, holder_kinds: [person], lifecycle: provisional, basis: ["15.6.1"]}
  - {id: imethod.study, name: study, tags: [deed.lore.investigation.search], anchor: act.study, verb: verb.observe, attribute: intellect,
     tag_by_object: {wound: deed.lore.medicine, mechanism: deed.lore.engineering, inscription: deed.lore.history}, dc_source: "the object's tier", time: {free: "1 interval", site: "1 interval"},
     holder_kinds: [object, place], lifecycle: provisional, basis: ["15.9.6", "10 T-10-20"]}
  - {id: imethod.research, name: research, tags: [deed.lore.investigation.records], anchor: "15.9.14", verb: verb.observe, attribute: intellect,
     dc_source: archive_tier, time: {free: "1 hour a beat", downtime: "a week (dt.research)"}, holder_kinds: [document], lifecycle: provisional, basis: ["15.9.14"]}
  - {id: imethod.surveillance, name: surveillance, tags: [deed.lore.investigation.search, deed.guile.stealth], anchor: "15.9.15", verb: "verb.observe | verb.sneak",
     attribute: "wits (watch) | agility (follow)", dc_source: "the target's Wits defense", time: {free: "1 watch a beat"}, holder_kinds: [person, place, event], lifecycle: provisional, basis: ["15.9.15"]}
  - {id: imethod.recall, name: recall, tags: [deed.lore], anchor: "09.10.2 / verb.recall", verb: verb.recall, attribute: intellect, dc_source: "the lore's tier",
     time: {free: instant}, holder_kinds: [lore_key], lifecycle: provisional, basis: ["15.9.6", "09.10.2"]}
  - {id: imethod.interrogation, name: interrogation, tags: [deed.influence.intimidation.interrogation], anchor: "15.8.4", verb: verb.talk, attribute: by_method,
     dc_source: "social DC at R2", time: {free: "1 interval a beat"}, holder_kinds: [person], lifecycle: provisional, basis: ["15.8.4"]}
  - {id: imethod.deduce, name: deduce, tags: [deed.lore.investigation.deduction], anchor: "15.9.9", verb: none, roll: false,
     time: {site: "1 interval", free: none}, holder_kinds: [conclusion], lifecycle: provisional, basis: ["15.9.9"]}
methods_default_when_uncertain: "the kind whose anchor is a basic verb the beat already uses"

core_clues:                # 15.9.5
  necessity: certain
  reached_tie_break: true
  person_condition: "request_size within the person's ceiling and no refusal covers telling"
  writes: [found_fact_with_frame_id, record_knowledge, unseal_content, leads, journal]

delivery:                  # 15.9.7 (P17 via 01.10 and 12.10.4)
  eligible_set: "unfound placements at the holder whose method kind matches and whose prerequisites are met"
  undirected_items: "the eligible rolled placements, ordered by 12.10.4 preference; count never shown"
  count: "deliver_count(N, delivered reach) (01.10.4)"
  preference: [most_directly_answers, leads_onward, node_with_most_remaining_placements]
  failure: "one vague impression of the top item: true, hedged, recorded believed; it is a lead and a citable Precision lever"
  critical_failure: "nothing reliable; a plausible falsehood only if the holder is misleadable (forged document, lying witness, staged scene)"
  re_ask: "01.10.6: new method, new lever, a passed interval, or the re-attempt cost"
  clock_visibility: {reach_2_or_3: "+1 step (hidden -> sensed -> public)", reach_4: "+2 steps"}

leads:                     # 15.9.8
  sources: [reveals_lead, rumor_points_to, lead_injection, npc_sharing, vague_impression]
  fields: [placement, holder, place, method_hint, live]

deduction:                 # 15.9.9
  roll: false
  node_tie_break: none
  answers: {supported: "Your clues support it.", unsettled: "The clues you hold don't settle it."}
  supported_write: "record_knowledge(pc, node.fact, how: inferred, certainty: believed); theory status supported"
  never_say: ["you're on the right track", "not quite", "close"]
  lore_keys_shown_per_clue_only: true

confirmation:              # 15.9.10
  established_only_by: [direct_placement_found, confession_by_resolved_frame, test_resolved_from_sealed_state, accusation_response]
  refuted_only_by: "a found clue directly contradicting the theory"
  wrong_accusation: "insulted or harmed memory by consequence; reputation (11)"
  solution_immutable: true

fallbacks:                 # 15.9.12
  default_scenes_without_clue: 3
  fired_by: h.11.fallback_counters
  forms_table: tbl.15.fallback_form

research:                  # 15.9.14
  archive_tiers:
    - {tier: easy, when: "a parish register; tax rolls for a name"}
    - {tier: moderate, when: "a guild's private books; a library on a common subject"}
    - {tier: hard, when: "an ancient library on a half-forgotten matter"}
    - {tier: very_hard, when: "a lost topic in a great collection"}
    - {tier: legendary, when: "a subject deliberately expunged"}
  clock_segments: {easy: 4, moderate: 4, hard: 6, very_hard: 8, legendary: 8}
  beats: "one per day, or per downtime week"
  sage: "fortune check: sage intellect + lore competence vs the question's tier; one item; 10 coins (08.8.8)"

surveillance:              # 15.9.15
  routine_segments: {habits: 4, hidden: 6}
  notice_segments: 4
  beat: watch
  failure_ticks_notice: {failure: 1, critical_failure: 2}
  notice_complete: "target alert toward the PC; routine changes; routine placements lost (audit replaces)"

journal:                   # T-15-15 (15.9.16)
  visibility: shown
  sections:
    - {id: journal.cases, shows: [clues_found_with_content_and_invites, live_leads_with_method_hints, theories_with_status, open_questions]}
    - {id: journal.people, shows: [names_learned, standing_rung, known_wants, known_fears, known_refusals, what_the_pc_told_them]}
    - {id: journal.places, shows: [discovered_places, notes]}
    - {id: journal.rumors, shows: [rumor_text, source]}
    - {id: journal.lies, shows: [claim, believers_known_to_pc]}
    - {id: journal.commitments, shows: [debts, promises, agreements, due_conditions]}
  never_shows: [sealed_facts, truth_values, clocks_hidden, patience, alertness, offsets]

knowledge:                 # 15.9.17
  how: [witnessed, told, read, overheard, recalled, inferred, rumor, confided]
  certainty_by_how: {witnessed: established, read: established, confided: established, told: believed, inferred: believed, overheard: believed, recalled: established, rumor: rumored}
  append_only: true

tables:
  - id: tbl.15.placement_holders
    name: Placement holder kinds (PR-15-6, PR-15-7)
    tags: []
    die: d6
    recency: true
    context_filters: []
    results:
      - {range: '1', result: "person: a witness who saw part of it (inquiry; R1-R2)"}
      - {range: '2', result: "person: someone who dealt with the culprit (inquiry; R2-R3)"}
      - {range: '3', result: "place: a trace where it happened or was prepared (search)"}
      - {range: '4', result: "object: something used, left or carried (search or study)"}
      - {range: '5', result: "document: a record, letter, ledger or copy (research or search)"}
      - {range: '6', result: "event: the culprit's next move, observable (surveillance)"}
    lifecycle: provisional
    basis: ["15.9.4", "R6 B-13"]
  - id: tbl.15.fallback_form
    name: Proactive fallback forms (15.9.12)
    tags: []
    die: d6
    recency: true
    context_filters: []
    results:
      - {range: '1', result: "the opposition acts again where it can be seen"}
      - {range: '2', result: "a witness seeks the PC out, frightened or angry"}
      - {range: '3', result: "a new victim or a new loss is discovered"}
      - {range: '4', result: "evidence surfaces: something is found and brought to someone the PC knows"}
      - {range: '5', result: "the culprit makes a mistake: a careless purchase, a boast, a sighting"}
      - {range: '6', result: "a rival investigator or authority shares (or sells) what they found"}
    lifecycle: provisional
    basis: ["15.9.12", "R6 B-13 proactive nodes"]
  - id: tbl.15.carousing_contact
    name: Carousing contacts (15.13.8)
    tags: []
    die: d8
    recency: true
    context_filters: []
    results:
      - {range: '1', result: "a carter who knows the roads"}
      - {range: '2', result: "a guard off duty"}
      - {range: '3', result: "a fence or a smuggler"}
      - {range: '4', result: "a clerk or scribe"}
      - {range: '5', result: "a minstrel who hears everything"}
      - {range: '6', result: "a crafter of a useful trade"}
      - {range: '7', result: "a servant of a great house"}
      - {range: '8', result: "a traveller from far away"}
    lifecycle: provisional
    basis: ["15.13.8"]
  - id: tbl.15.carousing_trouble
    name: Carousing trouble (15.13.8, critical failure)
    tags: []
    die: d6
    recency: true
    context_filters: []
    results:
      - {range: '1', result: "a brawl: S1 harm and a local now Unfriendly"}
      - {range: '2', result: "a debt: a commitment of 1 Unit owed to someone"}
      - {range: '3', result: "a lost item (cost.gear S2)"}
      - {range: '4', result: "an offended local of standing: now Hostile"}
      - {range: '5', result: "a night in the lockup (the next day is lost)"}
      - {range: '6', result: "a rival's attention: an enemy learns where the PC sleeps"}
    lifecycle: provisional
    basis: ["15.13.8", "R5 P-45 (Blades overindulgence)"]

cases:
  - id: case.mill_fire
    name: The mill fire at Ashford
    tags: [situation.investigation, org.guild.merchant]
    atmosphere: "theme: a neighbor paid to ruin a neighbor"
    solution:
      - {fact: sol.mill_fire.arsonist, value: "Odo the cooper set the fire"}
      - {fact: sol.mill_fire.payer, value: "the salt factor's man paid Odo 30 in salt-guild coin"}
      - {fact: sol.mill_fire.motive, value: "the mill's new grain contract undercut the salt factor"}
      - {fact: sol.mill_fire.next, value: "the factor means to burn the tithe granary next"}
    clues:                 # clue content facts (unsealed when found)
      c1: "lamp-oil smell and burn trails at three separate spots in the mill"
      c2: "an oil-soaked rag under Odo's workbench"
      c3: "the millwright swept the grain dust that morning: dust did not start it"
      c4: "the ferryman saw Odo on the mill road at dusk, before the smoke"
      c5: "Odo paid his slate at the Drowned Lamb in new salt-guild coin"
      c6: "the factor's ledger line: 'to O., the mill, 30'"
      c7: "Odo met a man in the salt factor's livery behind the tannery"
    nodes:
      - {id: clu.mill_fire.n1, name: "the fire was set", sealed_fact: sol.mill_fire.arsonist_act, fact: "the mill fire was set deliberately", necessary: true,
         deducible_from: [[c1, c2], [c1, c3]], points_to: [clu.mill_fire.n2], prerequisites: [],
         placements: [clu.mill_fire.n1.p1, clu.mill_fire.n1.p2, clu.mill_fire.n1.p3], lifecycle: provisional}
      - {id: clu.mill_fire.n2, name: "Odo set it", sealed_fact: sol.mill_fire.arsonist, fact: "Odo the cooper set the fire", necessary: true,
         deducible_from: [[c2, c4], [c5, c4]], points_to: [clu.mill_fire.n3], prerequisites: [],
         placements: [clu.mill_fire.n2.p1, clu.mill_fire.n1.p3, clu.mill_fire.n2.p3, clu.mill_fire.n2.p4, clu.mill_fire.n2.p5], lifecycle: provisional}
      - {id: clu.mill_fire.n3, name: "the salt factor paid him", sealed_fact: sol.mill_fire.payer, fact: "the salt factor's man paid Odo", necessary: true,
         deducible_from: [[c5, c7], [c6]], points_to: [], prerequisites: [],
         placements: [clu.mill_fire.n3.p1, clu.mill_fire.n3.p2, clu.mill_fire.n2.p4, clu.mill_fire.n2.p5], lifecycle: provisional}
    placements:
      - {id: clu.mill_fire.n1.p1, holder: loc.ashford.mill, holder_kind: place, method: imethod.search, access: core, content: c1, direct: false, nodes: [clu.mill_fire.n1], reveals_lead: [], invites: [lore.craft.fire_oils], status: unfound}
      - {id: clu.mill_fire.n1.p2, holder: npc.hobb_millwright, holder_kind: person, method: imethod.inquiry, access: core, request_size: R1, content: c3, direct: false, nodes: [clu.mill_fire.n1], reveals_lead: [], status: unfound}
      - {id: clu.mill_fire.n1.p3, holder: obj.odo_workbench, holder_kind: object, method: imethod.search, access: rolled, detect_tier: moderate, content: c2, direct: false, nodes: [clu.mill_fire.n1, clu.mill_fire.n2], reveals_lead: [], status: unfound}
      - {id: clu.mill_fire.n2.p1, holder: npc.sel_ferryman, holder_kind: person, method: imethod.inquiry, access: core, request_size: R2, content: c4, direct: false, nodes: [clu.mill_fire.n2], reveals_lead: [], status: unfound}
      - {id: clu.mill_fire.n2.p3, holder: npc.bett_alewife, holder_kind: person, method: imethod.inquiry, access: core, request_size: R1, content: c5, direct: false, nodes: [clu.mill_fire.n2, clu.mill_fire.n3], reveals_lead: [clu.mill_fire.n2.p4], status: unfound}
      - {id: clu.mill_fire.n2.p4, holder: npc.odo_cooper, holder_kind: person, method: imethod.surveillance, access: rolled, routine: habits, content: c7, direct: false, nodes: [clu.mill_fire.n2, clu.mill_fire.n3], reveals_lead: [clu.mill_fire.n3.p1], status: unfound}
      - {id: clu.mill_fire.n2.p5, holder: npc.odo_cooper, holder_kind: person, method: imethod.interrogation, access: rolled, request_size: R5, content: "Odo's confession", direct: true, nodes: [clu.mill_fire.n2, clu.mill_fire.n3], status: unfound}
      - {id: clu.mill_fire.n3.p1, holder: obj.factor_strongroom_ledger, holder_kind: document, method: imethod.search, access: rolled, detect_tier: hard, content: c6, direct: true, prerequisites: ["pc inside the factor's strongroom"], nodes: [clu.mill_fire.n3], status: unfound}
      - {id: clu.mill_fire.n3.p2, holder: npc.factor_clerk, holder_kind: person, method: imethod.inquiry, access: rolled, request_size: R4, content: c6, direct: true, nodes: [clu.mill_fire.n3], status: unfound}
    reserve:
      - {id: clu.mill_fire.r1, holder_kind: person, holder: "a tanner's boy who saw the meeting", method: imethod.inquiry, access: core, request_size: R1, content: c7, nodes: [clu.mill_fire.n2, clu.mill_fire.n3]}
      - {id: clu.mill_fire.r2, holder_kind: document, holder: "a copy of the ledger line in the guild hall's tithe-book", method: imethod.research, access: rolled, detect_tier: moderate, content: c6, nodes: [clu.mill_fire.n3]}
      - {id: clu.mill_fire.r3, holder_kind: object, holder: "the empty oil flasks Odo bought, in the midden behind his shop", method: imethod.search, access: core, content: "two lamp-oil flasks bought the day of the fire", nodes: [clu.mill_fire.n1, clu.mill_fire.n2]}
      - {id: clu.mill_fire.r4, holder_kind: event, holder: "Odo pays another debt in salt-guild coin", method: imethod.surveillance, access: rolled, content: c5, nodes: [clu.mill_fire.n2]}
      - {id: clu.mill_fire.r5, holder_kind: person, holder: "the factor's dismissed porter, who carried the purse", method: imethod.inquiry, access: core, request_size: R2, content: "the factor's man sent a purse to the cooper", nodes: [clu.mill_fire.n3]}
      - {id: clu.mill_fire.r6, holder_kind: rumor, holder: "talk at the market of the factor's grudge against the mill", method: imethod.inquiry, access: core, request_size: R1, content: "the factor swore the new mill contract would cost the miller dear", nodes: [clu.mill_fire.n3]}
    fallbacks:
      - {trigger: "clock_reaches:4 clk.mill_fire.granary", form: "the culprit makes a mistake", delivers: "event placement: Odo seen buying lamp oil (core, n2)"}
      - {trigger: stalled, form: "a witness seeks the PC out", delivers: clu.mill_fire.r1}
    opposition_clock:
      id: clk.mill_fire.granary
      name: The granary fire
      kind: danger
      segments: 6
      visibility: hidden
      auto_ticks: [{boundary: week, ticks: 1}]
      omens:
        stirring: ["a smell of lamp oil by the tithe granary's door (lead: n2.p4)", "the granary dog barks at night for no reason the watchman can find"]
        building: ["a stranger in the factor's livery asks the watchman when he takes his supper (lead: n2.p4)", "Odo's shop is shut at odd hours (lead: n2.p4)"]
        imminent: ["Odo buys two more flasks of lamp oil (lead: fallback event)", "the granary's back shutter is found unbarred"]
      on_complete: {effects: [{effect_id: eff.write_fact, params: {subject: loc.ashford.granary, predicate: burned, value: true}}], interrupting: true, then: close}
    validity_check: {n1: {placements: 3, kinds: [place, person, object], methods: [search, inquiry], core: 2, places: 3}, n2: {placements: 5, kinds: [person, object], methods: [inquiry, search, surveillance, interrogation], core: 2, places: 4}, n3: {placements: 5, kinds: [document, person], methods: [search, inquiry, surveillance, interrogation], core: 1, places: 3}}
    lifecycle: provisional
    basis: ["WE-15-3", "15.9.4"]
  # ---- moved here at integration from data/region_thallen.yaml#cases (13 -> 15; IR ch.13 to 15) ----
  - id: case.silent_bells
    name: The silent bells
    tags:
    - situation.investigation
    - org.cult.doomsday
    atmosphere: 'theme: a gentle hand that wants everyone asleep'
    begins_at: loc.tolling
    thread_kind: situation
    solution:
    - fact: sol.silent_bells.thief
      value: Dunstan Fell, a Woken drover of the Hushed Choir, stole Harrowby's clapper before midnight on Ringing-eve and hid it in the bell-pit under the green
    - fact: sol.silent_bells.pin
      value: Sister Ysmay, sacristan of the Last Bell, has filed its clapper-pin night by night; the dawn stroke missed when the pin bound
    - fact: sol.silent_bells.choir
      value: both serve the Hushed Choir, which means to silence the Last Bell so the Quiet may take Tolling into its peace
    - fact: sol.silent_bells.cantor
      value: Sister Ysmay Tollard is the Cantor of the Hushed Choir
    - fact: sol.silent_bells.next
      value: the Choir gathers at the Standing Folk of Copple Field at each new moon; its goal clock (clk.thallen.choir_goal) is the Last Bell's countdown
    clues:
      c1: 'Harrowby''s clapper was lifted off its pin, not torn away: the work of someone who knew bells'
      c2: the print of a crook's iron butt and fresh moss scrapings on the bell-pit stair
      c3: Tobin saw a tall Woken drover with a bell-tongue lashed to his crook lift the clapper before midnight, cursing it in Orrowan with a Caddow accent
      c4: Jessamy saw 'the quiet man' carry a sack down behind the bell-frame and come up without it
      c5: the clapper itself, in the bell-pit's casting-hole, with a hand-over-mouth sign drawn in moss beside it and a line of an Orrowan lullaby chalked above
      c6: Dunstan Fell drives Pell's salvage carts from Bellhollow, carries a crook with a bell-tongue lashed to it, and was away on Ringing-eve
      c7: the Cellar Kin sold a bell-wright's fine file and two Orrowan clapper-pins this winter to Dunstan Fell
      c8: 'the Last Bell''s clapper-pin is filed bright along one side: a filed pin binds'
      c9: the pin bound at the dawn stroke; in all his years on the rope the ringer never felt it stick
      c10: a pin that binds like that has been filed; Hrolla has seen it done to sabotage a foundry bell
      c11: only the sacristan handles the Last Bell's clapper and pin; Sister Ysmay oils them every night
      c12: 'Quillon copied an Orrowan fragment for Sister Ysmay last winter: a rite ''to lay a bell to sleep'''
      c13: the hand-over-mouth is the sign of those who serve the silence; the Mossmothers have found it cut into trees at the Hem
      c14: at the new moon a choir gathers among the Standing Folk of Copple Field; its Cantor sings in Orrowan behind a veil of moss
      c15: 'Dunstan Fell''s confession: he took the clapper on the Cantor''s order; the Cantor is Sister Ysmay'
      c16: 'in Ysmay''s cell: a bell-wright''s fine file in her sewing box and a hand-mirror wrapped in moss'
    nodes:
