tbl.11.entanglement:
  die: 'd6 + (status -2: +1; -3: +2), capped 8; column = pursuit (+1 if Hostile), 0-1 | 2 | 3+'
  rows:
  - range: 1-2
    pursuit_0_1:
      name: Questions
      tag: social
      intensity_delta: 1
      content: an officer comes to ask what the PC was doing
      ways_out:
      - answer
      - lie
      - refuse and walk away
      - pay to be left alone
    pursuit_2:
      name: Watchers
      tag: social
      intensity_delta: 1
      content: two of its rank and file shadow the PC; a sensed clock (watchers, 4)
      ways_out:
      - lose them
      - confront them
      - feed them false trails
    pursuit_3:
      name: Warrant
      tag: threat
      intensity_delta: 3
      content: its writ or its price is posted in its scope; its holds closed to the PC
      ways_out:
      - buy it off
      - clear the PC's name (a thread)
      - leave its scope
  - range: 3-4
    pursuit_0_1:
      name: Shakedown
      tag: social
      intensity_delta: 1
      content: it demands a fee or a favor to forget it
      ways_out:
      - pay
      - do the favor
      - refuse (attention +2)
    pursuit_2:
      name: Reprisal
      tag: threat
      intensity_delta: 3
      content: 'it strikes something the PC values: a bond, a holding, an ally''s livelihood'
      ways_out:
      - stop it in time
      - make it whole
      - strike back
    pursuit_3:
      name: Show of force
      tag: threat
      intensity_delta: 3
      content: a band of its rank and file at the PC's lodging
      ways_out:
      - fight
      - flee
      - parley
      - call on a friendly faction
  - range: 5-6
    pursuit_0_1:
      name: Snare
      tag: threat
      intensity_delta: 3
      content: a false plea for help that leads to a place it holds
      ways_out:
      - see through the plea
      - go in prepared
      - send someone else
      - ignore it
    pursuit_2:
      name: Ambush
      tag: threat
      intensity_delta: 3
      content: its fielded rank and file at the next route the PC takes
      ways_out:
      - notice the omen and turn back
      - fight
      - take another road
    pursuit_3:
      name: Champion
      tag: threat
      intensity_delta: 3
      content: its champion is sent with orders
      ways_out:
      - face it
      - outrun it
      - turn it (Talk)
      - set a trap
  - range: 7-8
    pursuit_0_1:
      name: Ultimatum
      tag: social
      intensity_delta: 1
      content: leave its region within a season or face it
      ways_out:
      - leave
      - make peace
      - call its bluff
    pursuit_2:
      name: Bounty
      tag: threat
      intensity_delta: 3
      content: a bounty clock (hunters, 6, public)
      ways_out:
      - buy it off
      - kill or turn the hunters
      - make the faction withdraw it
    pursuit_3:
      name: Abduction
      tag: threat
      intensity_delta: 3
      content: it takes a bond or ally to force a meeting
      ways_out:
      - rescue
      - meet
      - trade
  specificity: faction
  expires: 4 weeks
  if_unmet: the row happens off-screen to what it names (never to the PC's person, carried possessions or licenses)
  basis:
  - 11.3.12
  - R6 B-02 (Blades entanglements)
  - R5 P-18
attention:
  clock:
    kind: danger
    segments: 8
    visibility: hidden
    then: reset
  created_when: status <= -1, or a loud deed against the faction
  tick_sources:
  - venture loudness 0-3 at venture_end (+1 its seat touched, +1 its members died, +1 Hostile)
  - 'cost.exposure S3+ against its members or in its holds: U(severity)'
  - 'a noteworthy public_deed it despises in its scope: 1'
  - 'random_event: 1'
  decay:
  - -1 per week with no tick
  - 'dt.lie_low: -2 in the region'
  - 'lie_low action: -1'
  on_complete: pursuit +1 (max 3); queue an entanglement; reset
  pursuit_decay: -1 at a Season Turn with no completion that season; 0 when status >= 0
  paused_while: the rumor pc.dead circulates in its seat (11.6.8)
tbl.11.vacuum:
  die: d6
  results:
  - range: 1-2
    result: its strongest rival takes its seat (a gain of hold)
  - range: 3-4
    result: 'a new faction rises from its remnants: the template of its org_tags, tier 1, rising, a former officer its head'
  - range: '5'
    result: 'the region is lawless for a season: a situation from sit_t.road_of_knives'
  - range: '6'
    result: 'nobody yet: a seeded hook says so (the PC could fill it: establish, T-11-17)'
tbl.11.faction_tier:
  die: d6
  results:
  - range: 1-2
    tier: 0
  - range: 3-4
    tier: 1
  - range: '5'
    tier: 2
  - range: '6'
    tier: 3
tbl.11.faction_seed:
  die: d12
  context: the region's largest settlement tier and its terrain
  results:
  - range: '1'
    org: org.outlaw.bandits
  - range: '2'
    org: org.faith.shrine
  - range: '3'
    org: org.crown.civic
  - range: '4'
    org: org.guild.merchant
  - range: '5'
    org: org.order.hunters
  - range: '6'
    org: org.clan.family
  - range: '7'
    org: org.cult
  - range: '8'
    org: org.company.trading
  - range: '9'
    org: org.crown.noble
  - range: '10'
    org: org.order.druidic (wild terrain) or org.guild.craft (settled)
  - range: '11'
    org: org.outlaw.thieves (town or city) or org.outlaw.bandits
  - range: '12'
    org: 'org.order.arcane or org.order.knightly (d6: 1-3 / 4-6)'
petty_goals:
  clock:
    segments: 6
    visibility: hidden
  die: 'd6 per World Turn: 1-3 nothing, 4-5 +1, 6 +2; +1 rising, -1 declining'
  draw: 'd6 on kinds by range (PR-11-8 step 5, a faction created petty); scope local; rating: its highest (ties force, cunning,
    wealth, sway)'
  kinds:
  - range: 1-2
    kind: grow
    text: win more of {seat} to it, and a hold of its own
    target: null
    writes: hold; then tier; at tier 2 it becomes full
  - range: '3'
    kind: take
    text: take {place} for its own
    target: the nearest place of its seat's region that no faction holds (ring, then id)
    writes: a place passes to it
  - range: '4'
    kind: stir
    text: stir up trouble at {seat}'s next festival
    target: null
    writes: a situation of template sit_t.festival_trouble at its seat, itself the troublemaker
  - range: 5-6
    kind: feud
    text: settle its quarrel with {neighbor}
    target: the faction with the lowest relation toward it (then the highest tier, then the lowest id)
    writes: relation -2 with the target
  becomes_full: it keeps its petty goal until the goal completes (worked by goal actions at the local DC), then draws from
    its template (11.3.2)
  on_complete: its goal writes and one seeded hook
