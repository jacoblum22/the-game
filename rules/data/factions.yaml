    - a stranger asks the innkeeper which room is yours
    - someone was asking after you at the market
    building:
    - the same two faces at the market two days running
    - your name spoken, then silence, as you enter
    imminent:
    - your door's latch has been tried in the night
    - a mark chalked on your door at dawn
  fate_list:
  - fate: dies
    consequence: the faction loses hold; its stage becomes declining; the next officer is named successor; a situation of
      template succession
    effects:
    - effect_id: eff.11.hold_step
      params:
        faction: self
        steps: -1
    - effect_id: eff.11.stage_set
      params:
        faction: self
        stage: declining
    - effect_id: eff.11.new_situation
      params:
        template: sit_t.succession
        region: faction.seat.region
        roles:
          faction: self
  - fate: captured
    consequence: the faction loses hold; its next action is strike or court against the captor (a rescue); a ransom demand
      is news
    effects:
    - effect_id: eff.11.hold_step
      params:
        faction: self
        steps: -1
    - effect_id: eff.write_fact
      params:
        subject: self
        predicate: next_action
        value: strike_or_court_captor
  - fate: turned
    consequence: the faction loses hold twice; one of its secrets passes to the turned linchpin; a rival gains hold
    effects:
    - effect_id: eff.11.hold_step
      params:
        faction: self
        steps: -2
    - effect_id: eff.reveal
      params:
        sealed_ref: faction.secret[0] to the turned linchpin
  - fate: exposed
    consequence: the faction loses hold; its status toward the exposer -1; news in its seat; a situation of template scandal
    effects:
    - effect_id: eff.11.hold_step
      params:
        faction: self
        steps: -1
    - effect_id: eff.11.new_situation
      params:
        template: sit_t.scandal
        region: faction.seat.region
        roles:
          faction: self
  courtable: true
  sittings:
  - quarter days
  entanglement_flavor: ''
