rank_rungs:
- rung: 1
  seats: unlimited
  requires:
  - status >= +1 or an accepted V3 offer
- rung: 2
  seats: unlimited
  requires:
  - status >= +1
  - a reputation entry of score >= 1 in its scope or seat on a key it honors
  - one season at rung 1 with every obligation kept
- rung: 3
  seats: tier + 1
  requires:
  - status >= +2
  - such an entry of score >= 2
  - a seat free or won
  - a sitting
- rung: 4
  seats: 1 + tier / 2 (round down)
  requires:
  - status >= +2
  - score >= 3
  - a seat free or won
  - a sitting
- rung: 5
  seats: 1
  requires:
  - status +3
  - score >= 4
  - the head's seat empty or won
