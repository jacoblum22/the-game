# data/factions.yaml
# Purpose: faction templates, generic factions, and the faction engine's tables: the agenda by temperament,
#   the faction check and actions, goal clocks, stages and the weight of size, rank ladders and rungs, the
#   entanglement table, attention, vacuums, seeding and petty factions (11.3, 11.8; T-11-2, T-11-4).
# Owner: 11-living-world (T-00-19); owner-block "13" for the starter region's factions.
# Schema: data/SCHEMAS.md#factions.yaml (required: id, name, tags, org_tags, tier, hold, ratings, goal {text,
#   clock}, lifecycle_stage, linchpins [{npc, consequence}], status_to_pc, lifecycle, basis) plus T-11-1's optional
#   keys. Ratings are force, cunning, wealth, sway; each 0..tier+2; sum 4 + 2 x tier (11.3.4).
# GENERATED by rules/_process/simulation/11-gen_factions.py (asserts the rating envelope). Edit the script.
# Generic factions (`generic: true`) carry role slots (role:head) bound when a region's seed (12.16.10, PR-11-8) instantiates them.
# Every entry lifecycle: provisional (00.16.3).
# Basis: [R6 B-01, B-02, B-05, B-08, B-R2] [R5 P-22, P-23, P-25] [DL-11-03..06, DL-11-13, DL-11-18]

schema_version: 1
agenda:
  overrides:
  - order: 1
    when: slip last turn
    action: recover
  - order: 2
    when: relation -3 with a faction whose seat or a hold is in the same region, and d6 <= 3
    action: strike
    target: that faction
  - order: 3
    when: 'status toward the PC >= +2 and (a ransom due, a threat bang naming the PC holding, or a reward owed; or d6 = 1:
      the opportunity bang)'
    action: aid_pc
  dice: 'each override that names a d6 rolls its own, only when its condition holds; the temperament row is a fresh d6 (11.3.7)
    [revision: I-061]'
  rows:
    aggressive:
    - strike if a rival at <= -2
    - strike if a rival at <= -2
    - move_on_pc if status <= -2 and the PC in its region
    - expand
    - goal
    - goal
    cautious:
    - recover if hold weak
    - scheme if a rival at <= -1
    - court
    - goal
    - goal
    - goal
    mercantile:
    - expand
    - scheme if a rival at <= -1
    - court
    - goal
    - goal
    - goal
    zealous:
    - strike if a rival at <= -2
    - court
    - move_on_pc if status <= -2
    - goal
    - goal
    - goal
    secretive:
    - scheme if a rival at <= -1
    - scheme if a rival at <= -1
    - move_on_pc if status <= -1 and its attention clock at half or more
    - lie_low if its attention clock on the PC is imminent
    - goal
    - goal
    steadfast:
    - recover if hold weak
    - aid_pc if status >= +2
    - strike if a rival at -3
    - goal
    - goal
    - goal
  failed_condition_reads_as: goal
  targets:
    strike_scheme:
    - lowest relation
    - fullest goal clock
    - highest tier
    - lowest id
    court:
    - an ally of the PC with a tie to its org_tags at Warm or lower, if courtable and status <= 0 (never a kn.loyal ally at
      Neutral or warmer)
    - the non-rival faction with the highest relation below +2
    - else goal
  basis:
  - 11.3.7
  - R6 B-01
  - R4 W3
  - DL-11-04
check:
  formula: d20 + rating + 2 x tier + stage modifier (+2 scheme lever, at most one); modifier clamped -8..+16
  rating: 'the one the action names (actions[].check); for goal, the goal record''s goal.rating (11.3.5) [revision: I-061]'
  stage_modifier:
    rising: 1
    flourishing: 0
    entrenched:
      goal_expand: -1
      other: 0
      defense: 1
    declining: -1
  dc:
    goal: 10 + 2 x tier + scope term
    scope_term:
      local: 3
      regional: 5
      realm: 7
    against_faction: 10 + defender rating + 2 x defender tier (+1 entrenched, +2 at its seat)
    expand: 10 + 2 x tier + 5
    recover_court: 10 + 2 x tier + 3
  degrees: 00.3.10
  basis:
  - 11.3.5
  - DL-11-03
actions:
- id: goal
  check: goal rating vs goal DC
  critical_success: goal clock +2
  success: goal clock +1
  failure: no tick
  critical_failure: 'slip: no tick; a true trace; next action recover'
- id: strike
  check: force vs the defender's higher of force and cunning
  critical_success: defender loses hold; d6 1-3 one hold place passes to the striker, 4-6 one non-linchpin officer killed
    or taken
  success: defender loses hold
  failure: a trace
  critical_failure: striker loses hold
- id: scheme
  check: cunning vs the defender's cunning
  critical_success: as success, and one sealed fact of the defender unsealed to the schemer and seeded as a true rumor
  success: 'fact fac.<a>.inside.<b>: a +2 lever on its next check against that rival or a goal naming it'
  failure: nothing
  critical_failure: 'discovered: the defender''s relation toward it -1; a trace'
- id: expand
  check: wealth vs 10 + 2 x tier + 5
  critical_success: gain hold and a new hold place in its region
  success: gain hold
  failure: nothing
  critical_failure: wealth -1 until its next completed goal
- id: recover
  check: higher of wealth and sway vs 10 + 2 x tier + 3
  critical_success: hold strong; slip cleared; goal clock +1
  success: hold strong; slip cleared
  failure: nothing
  critical_failure: nothing; the slip stays
- id: court
  check: 'sway vs 10 + 2 x tier + 3 (or a faction: its sway)'
  critical_success: as success, two targets
  success: an ally of the PC is courted (courted_by, sealed, omen); or a faction relation +1
  failure: nothing
  critical_failure: 'the target learns: relation -1 or the ally''s standing toward the faction -1'
- id: move_on_pc
  check: none
  success: queue an entanglement (tbl.11.entanglement) at its pursuit column
- id: aid_pc
  check: none
  success: 'first eligible: pay a due ransom; send help to a threatened holding; gift_due if a reward is owed; an opportunity
    bang (a job pays the job fee of its band, economy.yaml#job_fees) [revision: I-091]'
- id: lie_low
  check: none
  success: its attention clock on the PC decays 1 extra; no trace
goal_clocks:
  local:
    segments: 8
  regional:
    segments: 12
  realm:
    segments: 12
    linked_second: 12
  visibility: hidden (sensed once the PC learns of the goal)
  tick_sources:
  - 'on': faction_action_goal
    ticks: per degree
  - 'on': random_event
    ticks: 1
  - 'on': rout
    ticks: U(S3) (07.4.3; 3 from the Threshold)
  - 'on': pc_milestone
    ticks: 2
    condition: the PC's domain only (11.9.8)
  scopes_by_tier:
    0:
    - local
    1:
    - local
    2:
    - local
    - regional
    3:
    - local
    - regional
    4:
    - regional
    - realm
    5:
    - regional
    - realm
stages:
  transitions:
  - from: rising
    to: flourishing
    when: a goal completed since entering, or 4 Season Turns rising
  - from: flourishing
    to: entrenched
    when: tier >= 4, or 8 Season Turns flourishing
  - from:
    - flourishing
    - entrenched
    to: declining
    when: lost hold twice in the last four seasons; or tier fell; or a linchpin fate names declining (at once)
  - from: declining
    to: rising
    when: it completes a goal (at once)
  - from: declining
    to: collapsed
    when: loses a weak hold at tier 0 (at once); or 4 Season Turns declining at tier 0
  - from: any
    to: collapsed
    when: a linchpin fate names collapse (at once)
  weight_of_size:
    applies: tier >= 3, at each Season Turn
    check: 'd20 + highest rating + stage modifier (entrenched 0: its -1 is on goal and expand only) vs 10 + 2 x tier'
    failure: lose hold
  basis:
  - 11.3.9
  - R6 B-05
  - DL-11-06
