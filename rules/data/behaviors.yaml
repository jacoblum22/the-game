behaviors:
- id: beh.09.pack_hunter
  name: Pack hunter
  tags: []
  instinct: to run down the weakest and drag it from the others
  priority_list:
  - {when: broken, do: flee}
  - {when: held, do: break_free}
  - {when: prone, do: stand}
  - {when: not_engaged, do: move_engage, note: the pack picks the target with fewest allies near it (attention row 2 aside)}
  - {when: ally_engaged_target & target_not_flanked, do: flank}
  - {when: target_prone, do: strike_twice, arg: bite}
  - {when: always, do: strike, arg: bite}
  parley_when: never (animals); a fed or well-fed pack drifts off (a fact)
  yield_when: never
  retreat_when: bloodied and alone
  morale_break: {threshold: the side's nerve (06.11.2), then: the adversary's morale.break_then (06.11.5)}
  lifecycle: provisional
  basis: ['09.7', 06.9.1]
- id: beh.09.ambusher
  name: Ambusher
  tags: []
  instinct: to strike once from hiding and leave if it does not end it
  priority_list:
  - {when: broken, do: flee}
  - {when: held, do: break_free}
  - {when: hidden & target_unaware, do: strike_twice, arg: primary, note: 'the ambush: both actions on the first turn'}
  - {when: bloodied & not_engaged, do: withdraw}
  - {when: bloodied, do: flee, note: ambushers do not fight fair fights}
  - {when: not_engaged, do: move_engage}
  - {when: always, do: strike, arg: primary}
  parley_when: never
  yield_when: never
  retreat_when: first time it is hit for S3 or more
  morale_break: {threshold: the side's nerve (06.11.2), then: the adversary's morale.break_then (06.11.5)}
  lifecycle: provisional
  basis: ['09.7', 06.9.1]
