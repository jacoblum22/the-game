[project]
name = "the-game"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
include = ["engine/**/*.py", "play/**/*.py", "evals/**/*.py", "tests/engine/**/*.py", "tests/golden/**/*.py",
           "tests/contract/**/*.py", "tests/replay/**/*.py", "tests/seeded_errors/**/*.py", "tests/fixtures/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["engine", "play"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
