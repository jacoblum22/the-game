# Plain wording for world setup (the seed) and character creation: what the PLAYER reads.
#
# The rules data keeps its own wording (rules/data/world_seed.yaml, origins.yaml); this table owns only what the
# screens say. Keys are the rules' ids (step numbers, question ids, option ids, creation block ids), so recorded
# answers, events and the Interpret role's options never change. Anything missing here falls back to the old,
# sanitized rules text, and tests/engine/test_setup_text.py lists every missing entry.
#
# {enter} in a footer is what pressing Enter does ("to let the dice decide", "for Soldier").

footer:
  pick: "Type a number to choose, describe your own idea, or press Enter {enter}."
  pick_many: "Type one or more numbers (for example, 2, 5), describe your own idea, or press Enter {enter}."
  number: "Type a number to choose, or press Enter {enter}."
  words: "Describe it in a sentence, or press Enter {enter}."
  dice: "to let the dice decide"

seed:
  header: "Building the world, step {n} of 14: {title}"
  mode:
    header: "First, let's build the world your character will live in."
    prompt: "Would you like to decide what the world is like, or let the dice decide?"
    enter: "for a mix"
    options:
      guided: "I'll answer every question myself."
      oracle: "Let the dice decide everything. (I can re-roll one result at each step.)"
      mixed: "A mix. I'll choose which questions to answer, and the dice will decide the rest."
  pick:
    header: "Choosing your questions"
    prompt: "Which of these questions would you like to answer yourself? The dice will decide the rest."
    footer: "Type the numbers you want (for example, 1, 4, 9), or press Enter to let the dice decide all of them."
    all: "All of them"
  summary:
    prompt: "Would you like to keep this?"
    keep: "Keep it"
    reroll: "Re-roll {what}"
    reroll_step: "Re-roll this step"
    enter: "to keep it"
    rerolled: "That was re-rolled, so this result is final."
    rolled_all: "The dice decided all of this."
    rolled_some: "You chose {mine}, and the dice chose {rolled}."
    rolled_rest: "The dice chose {rolled}, and you chose the rest."
    chose_all: "You chose all of this."
  suggest_note: "The dice will decide this one. You can re-roll it once after you see the result."
  details_head: "Here is a little more about each choice:"
  check:
    title: "Finished"
    ok: "Everything fits together. Welcome to {region}."
    rerun: "The dice re-rolled part of the world so that everything fits together."

  steps:
    1: "What went wrong in this land"
    2: "How magic works"
    3: "Gods and the dead"
    4: "Peoples and languages"
    5: "The lands around your home town"
    6: "Your home town"
    7: "Who holds power"
    8: "People you will meet"
    9: "Dangerous places"
    10: "What roams the wilds"
    11: "Rumors"
    12: "The calendar"
    13: "How the story begins"

  # Each question: prompt (one short question), pick (its line in the mixed-mode list), what (its name in
  # "Re-roll ..." and "You chose ..."), options (plain labels), short (a few words for the recap, optional).
  questions:
    ws.q.wound:
      prompt: "What went wrong in this land, a generation or two ago?"
      pick: "What went wrong in this land"
      what: "the trouble"
      options:
        fallen_realm: "A fallen kingdom, whose roads, castles and heirs still remain"
        plague: "A plague that comes back every hot season"
        invasion: "An invading horde that was driven back, but is coming again"
        curse: "A curse laid on the land for an old wrong"
        sundering: "A great spell that went wrong and broke something"
        silent_god: "A great god who has stopped answering prayers"
        long_winter: "A long winter, because the seasons broke and never mended"
        restless_dead: "The restless dead, who will not stay in their graves"
        frontier: "A frontier, where settlers are pushing into a wild land that was never theirs"
        schism: "A split in the faith, with both sides claiming the temples"
        tyrant: "A cruel tyrant who rules the land beyond your town"
        waking: "Something very old that is waking up under the land"
    ws.q.climate:
      prompt: "What is the weather like here?"
      pick: "The weather"
      what: "the weather"
      options:
        temperate: "Mild, with green summers, wet autumns and snow in some winters"
        northern: "Northern, with short summers and long, hard winters"
        highland: "Highland, with high valleys, cold nights and mountain storms"
        arid: "Dry, with scrubby hills, hot days and cold nights"
        coastal: "Coastal, mild and wet, with fog and storms off the sea"
    ws.q.magic_level:
      prompt: "How common is magic?"
      pick: "How common magic is"
      what: "how common magic is"
      options:
        rare: "Rare. Most villages have never seen a spell."
        uncommon: "Uncommon. Every town has a hedge-witch and a priest who can heal."
        common: "Common. There are wards on the town gates and a mage on the council."
      short:
        rare: "Magic is rare."
        uncommon: "Magic is uncommon."
        common: "Magic is common."
    ws.q.magic_law:
      prompt: "Is casting spells in public allowed?"
      pick: "The law on magic"
      what: "the law on magic"
      options:
        lawful: "Yes. No one minds a spell cast in the market."
        licensed: "Only with a licence from the rulers."
        feared: "It's legal, but any spell in public draws a crowd, a priest or a mob."
      short:
        lawful: "Anyone may cast spells in the open."
        licensed: "Casting in public needs the rulers' licence."
        feared: "Casting is legal but feared; a spell in public draws a crowd."
    ws.q.spirits:
      prompt: "How often do you meet spirits of a place (of springs, stones, old trees)?"
      pick: "Spirits of places"
      what: "the spirits"
      options:
        rare: "Rarely, except at places of old power."
        uncommon: "Sometimes in the wild, and often at places of old power."
        common: "Often anywhere wild, and always at places of old power."
      short:
        rare: "Spirits of places are rare."
        uncommon: "Spirits of places turn up now and then."
        common: "Spirits of places are everywhere in the wild."
    ws.q.arcane_source:
      prompt: "Who can learn to cast spells?"
      pick: "Who can learn magic"
      what: "who can learn magic"
      options:
        anyone_literate: "Anyone who can read, if they have a teacher or a book."
        order_only: "Only members of a wizards' order. Teaching anyone else is a crime."
        gifted_only: "Only those who were born with the gift."
      short:
        anyone_literate: "Anyone who can read can learn spells."
        order_only: "Only a wizards' order may teach spells."
        gifted_only: "Only those born with the gift can cast spells."
    ws.q.extra_impossible:
      prompt: "Some things no magic can do anywhere (raise the dead, turn back time). Is anything else impossible here? Pick up to two."
      pick: "What else magic cannot do"
      what: "what else is impossible"
      options:
        none: "Nothing else is impossible"
        no_teleport: "No one can teleport"
        no_flight: "No one can fly"
        no_conjured_food: "No one can conjure food or drink"
        no_true_names: "No one can be commanded by their true name"
        no_far_speech: "No one can send words further than a day's walk"
        no_undying: "No one can live forever"
        no_gold_making: "No one can make gold, silver or gems"
        no_weather_command: "No one can control the weather of a whole region"
    ws.q.regrowth:
      prompt: "Can magic regrow a lost arm or eye?"
      pick: "Whether magic can regrow a lost limb"
      what: "regrowing limbs"
      options:
        "no": "No. What is lost stays lost."
        great_rite: "Yes, but only through a rare, great ritual at a place of power."
      short:
        "no": "No magic regrows a lost limb."
        great_rite: "Only a rare great ritual regrows a lost limb."
    ws.q.closed_school:
      prompt: "Is any kind of magic lost or unknown here?"
      pick: "A lost kind of magic"
      what: "lost magic"
      options:
        none: "No. Every kind of magic is known."
        necromancy: "Necromancy, the magic of the dead, has been lost."
        summoning: "Summoning has been lost."
        pact: "No power here will make a pact with anyone."
        shapeshifting: "Shapeshifting has been lost."
      short:
        none: ""
        necromancy: "Necromancy is lost."
        summoning: "Summoning is lost."
        pact: "No power here makes pacts."
        shapeshifting: "Shapeshifting is lost."
    # Auto-rolled (never asked): a rules setting about a later character choice (refusing magic).
    ws.q.relics_magic:
      prompt: "Do people who shun magic also shun magic items?"
      pick: "Whether those who shun magic shun magic items"
      what: "magic items"
      options:
        "yes": "Yes, because an enchanted thing is magic too."
        holy_exempt: "Holy relics are fine, but other magic items are not."
    # Auto-taken (never asked): it has only one possible answer.
    ws.q.hybrid_none:
      prompt: "Do some kinds of magic stay unmixable here?"
      pick: "Unmixable magic"
      what: "unmixable magic"
      options:
        hold: "Yes"
    ws.q.keeper_count:
      prompt: "How many gods (keepers) answer prayers here?"
      pick: "How many gods"
      what: "how many gods"
      options:
        "2": "Two"
        "3": "Three"
        "4": "Four"
    ws.q.keepers:
      prompt: "What kinds of gods are they? Pick one for each god (two to four); the dice fill any you leave."
      pick: "What the gods are"
      what: "the gods"
      options:
        kf.sky: "A god of the sky, of oaths and of storms"
        kf.hearth: "A god of the hearth and the harvest, who feeds the hungry"
        kf.death: "A god of death, who meets every soul at the crossing"
        kf.war: "A god of war, who asks for courage and rewards it"
        kf.healer: "A healer who became a god after death"
        kf.saint: "A local hero who became a god for one great deed"
        kf.ancestors: "The ancestors, the land's first people, who watch and judge their descendants"
        kf.land: "The spirit of the land itself, old and slow, honoured at stones and springs"
        kf.knowledge: "A god of knowledge and hidden things"
        kf.justice: "A god of law and justice, who judges every bargain"
        kf.sea: "A god of rivers and the sea, who watches over travellers"
        kf.pact: "A dealmaking power that gives freely but always collects"
      short:
        kf.sky: "god of the sky and oaths"
        kf.hearth: "god of hearth and harvest"
        kf.death: "god of death"
        kf.war: "god of war"
        kf.healer: "a healer made a god"
        kf.saint: "a local hero made a god"
        kf.ancestors: "the ancestors"
        kf.land: "the spirit of the land"
        kf.knowledge: "god of knowledge"
        kf.justice: "god of justice"
        kf.sea: "god of rivers and the sea"
        kf.pact: "a power that bargains"
    ws.q.bargainer:
      prompt: "When someone is dying, does anyone offer them a deal?"
      pick: "Who bargains with the dying"
      what: "the deal at death's door"
      options:
        death_keeper: "The god of death, if there is one."
        none: "No one does."
        fey: "A fey lord does, for a price to be paid later."
        fiend: "A tempter does, and it always collects."
    ws.q.presence:
      prompt: "Which peoples live here?"
      pick: "Which peoples live here"
      what: "who lives here"
      options: {}
    ws.q.second_tongue:
      prompt: "Besides Common, what is the land's other language?"
      pick: "The land's second language"
      what: "the other language"
      options:
        old_tongue: "The Old Tongue, which was spoken by whatever fell"
        people: "The language of the main non-human people here"
    ws.q.haven_site:
      prompt: "Where does your home town (the haven) stand?"
      pick: "Where your home town stands"
      what: "where the town stands"
      options:
        river_ford: "At a river ford"
        river_bridge: "At a bridge over a river"
        crossroads: "Where two roads cross"
        hill: "On a walled hill above the fields"
        harbour: "At a harbour"
        lakeshore: "On a lake shore"
        old_fort: "Inside the walls of an old fort"
        forest_edge: "At the edge of a great wood"
    ws.q.terrain:
      prompt: "What is the land around like?"
      pick: "The land around"
      what: "the land around"
      options: {}
    ws.q.haven_tier:
      prompt: "Is your home a village or a town?"
      pick: "Village or town"
      what: "village or town"
      options:
        village: "A village of a few hundred people, with a shrine and an inn"
        town: "A walled town with a market, a temple and guilds"
    ws.q.rulers:
      prompt: "Who rules your home town?"
      pick: "Who rules your home town"
      what: "who rules"
      # the rulers on offer depend on whether the haven is a village or a town
      options_by_tier:
        village:
          org.clan.family: "An old family, whose head is the headman"
          org.crown.noble: "A lord in a manor above the village"
          org.faith.shrine: "The shrine's priests"
          org.crown.civic: "A council of elders"
        town:
          org.crown.civic: "A town council and its watch"
          org.crown.noble: "A noble house in the castle"
          org.guild.merchant: "The merchants' guild"
          org.faith.temple: "The temple"
    ws.q.fourth_faction:
      prompt: "Who else has power here? The dice add the rest."
      pick: "Another power in the land"
      what: "the other power"
      options:
        org.outlaw.bandits: "Bandits"
        org.faith.shrine: "A shrine and its faithful"
        org.crown.civic: "A council"
        org.guild.merchant: "A merchants' guild"
        org.order.hunters: "Monster hunters"
        org.clan.family: "A powerful family"
        org.cult: "A secret cult"
        org.company.trading: "A trading company"
        org.crown.noble: "A noble house"
        org.order.druidic: "Druids"
        org.outlaw.thieves: "A thieves' guild"
        org.order.arcane: "An order of wizards"
    ws.q.month_names:
      prompt: "Do the months have names?"
      pick: "Month names"
      what: "the month names"
      options:
        named: "Yes, they have names in the land's own words."
        counted: "No, they are just counted (for example, \"the second month of spring\")."
    ws.q.inciting:
      prompt: "How does the story begin?"
      pick: "How the story begins"
      what: "how the story begins"
      options:
        alarm: "The alarm bell sounds, because something is at the gate"
        dying_messenger: "A rider dies in the market with a message for someone else"
        missing: "Someone is missing, and the trail leads out of town"
        offer: "A powerful person offers you work, money and a warning"
        theft: "Something sacred is stolen from the temple"
        omen: "Everyone sees an omen in the sky or in the earth"
        refugees: "Refugees arrive with a story that nobody believes"
        duel: "A quarrel at the inn turns into a challenge from a stranger"

  # words used by the step recaps
  peoples:
    orig.people.human: "humans"
    orig.people.elf: "elves"
    orig.people.dwarf: "dwarves"
    orig.people.halfling: "halflings"
    orig.people.orc_kin: "orc-kin"
    orig.people.goblin_kin: "goblin-kin"
    orig.people.giant_kin: "giant-kin"
    orig.people.beastfolk: "beastfolk"
  tongues:
    lic.lang.common: "Common"
    lic.lang.old_tongue: "the Old Tongue"
    lic.lang.cant: "thieves' cant"
  presence:
    common: "many"
    uncommon: "some"
    rare: "a few"

creation:
  header: "Making your character, step {n} of {total}: {title}"
  header_plain: "Making your character: {title}"
  blocks:
    c0:
      title: "Before we begin"
      lines:
        - "- What would you like plenty of? You can choose up to two: fights, exploring, talking your way through, mysteries, journeys, or building something of your own."
        - "- Is there anything you would rather never see in the story, or see only off-stage?"
        - "- How do you want to make your character?"
      footer: "Answer in a sentence (for example, \"fights and mysteries, no spiders, quick start\"), type a number, or press Enter for a quick start."
      options:
        fast: "Quick start, which takes five questions and a few minutes"
        full: "The full workshop, with every choice (about fifteen questions)"
        ready_made: "A ready-made character, so you can pick one and go"
    c1:
      title: "Who are you?"
      prompt: "What did your character do before this story?"
      lines:
        - "Your character is human unless you say otherwise (for example, \"an elf hunter\")."
      enter: "for Soldier"
      more: "{n} other ways of life"
    c2.people:
      title: "Your people"
      prompt: "Who were you born among?"
      enter: "for Human"
      options:
        orig.people.human: "Human, with no fixed strengths or weaknesses"
        orig.people.elf: "Elf, quick and keen-eyed but a little frail, and able to see by starlight"
        orig.people.dwarf: "Dwarf, tough and steady but a little clumsy, with a feel for stone"
        orig.people.halfling: "Halfling, nimble and brave but not strong, and good at slipping underfoot"
        orig.people.orc_kin: "Orc-kin, strong and stubborn but not bookish, and hard to poison"
        orig.people.goblin_kin: "Goblin-kin, sharp and quick but not charming, and able to see in the dark"
        orig.people.giant_kin: "Giant-kin, big and strong but slow to notice things, and hard to wrestle"
        orig.people.beastfolk: "Beastfolk, quick and with a keen nose, but easily startled"
    c2.rule:
      title: "Your people"
      prompt: "Are you typical of your people, or unusual?"
      enter: "for {default}"
      options:
        typical: "Typical of your people, with their strengths and weaknesses, and a little stronger overall"
        free: "Unusual, with no fixed strengths or weaknesses, and a little weaker overall"
    c3:
      title: "Where did you grow up?"
      prompt: "Where did you grow up?"
      lines:
        - "(Focus is what you spend on special moves and spells.)"
      enter: "for {default}"
      options:
        orig.up.wilds: "In the wilds. You know the outdoors, but you can't read and have almost no money."
        orig.up.village: "In a village. You know animals and a craft, but you can't read and have little money."
        orig.up.streets: "On the streets. You have street smarts and speak thieves' cant, but you have no money."
        orig.up.townhouse: "In a guild quarter. You can read and know a trade and a craft, but you have less Focus."
        orig.up.court: "At court. You can read, have good manners, a second language and money, but less Focus."
        orig.up.cloister: "In a cloister. You can read and have extra Focus, but little else."
        orig.up.road: "On the road. You can find your way and speak a second language, but you have no home."
        orig.up.sea: "On the water. You can sail, speak a second language and have some money."
        orig.up.bonded: "In service. You have extra Focus and one hard-won skill, but little else."
    c4:
      title: "What are you made of?"
      prompt: "How are your strengths shaped?"
      stands: "Here is how {a_life} usually stands:"
      lines:
        - "Pick a shape, and your strengths will be placed to suit your way of life."
      enter: "to keep it as shown"
      options:
        peaked: "Peaked, with one great strength and some good ones"
        even: "Even, with four good strengths but no great one"
        broad: "Broad, with many fair strengths but no great one"
    c5:
      title: "What are you good at?"
      prompt: "How are your skills spread?"
      enter: "for {default}"
      options:
        focused: "Focused, so you are really good at two things"
        gifted: "Gifted, so you are really good at one thing and have a special move or spell"
        rounded: "Rounded, so you are really good at one thing and trained in two more"
        broad: "Broad, so you are trained in five things but expert in none"
    c6:
      title: "Your early years"
      prompt: "Was anything said about your birth or childhood?"
      lines:
        - "For example, \"born in a hard winter\" or \"born under an omen\"."
      enter: "for nothing remarkable"
    c7:
      title: "What you carry"
      prompt: "Which of these do you carry?"
      enter: "for the first"
    c8.drive:
      title: "What do you want?"
      prompt: "What does your character want most? Say it in one sentence, or take one of these:"
      enter: "for the first"
    c8.anchor:
      title: "Who matters to you?"
      prompt: "Who would your character cross the country for? Say who they are to you, or take one of these:"
      enter: "for the first"
    c8.aspiration:
      title: "Who do you hope to become?"
      prompt: "Who does your character hope to become?"
      enter: "to leave it open"
      open: "Leave it open and discover it in play"
    c8.true_thing:
      title: "One true thing"
      prompt: "Tell me one thing about your character that is simply true."
      enter: "to leave it open"
    c9.name:
      title: "Your name"
      prompt: "What is your character called? Add he, she or they if you like."
      footer: "Type a name, or type \"suggest\" to get three ideas."
      retry: "Type a name for your character."
    c9.pronouns:
      title: "Your name"
      prompt: "How should I speak of {name}?"
      footer: "Type a number to choose, or say it your own way."
    rm.pick:
      title: "A ready-made character"
      prompt: "Pick one. You can rename them if you like."
      enter: "for {default}"
    rm.name:
      title: "Their name"
      prompt: "Keep the name {name}, or give another?"
      footer: "Type a number to choose, type another name, or press Enter to keep the name {name}."
      keep: "Keep the name {name}"
    ready:
      title: "Ready to begin?"
      prompt: "Are you ready to begin?"
      lines:
        - "You can still change these choices once, any time before your first night's rest."
      enter: "to begin"
      options:
        begin: "Begin"
        change: "Change something"
    change:
      title: "Change something"
      prompt: "What would you like to change?"
      enter: "to begin"
      begin: "Nothing after all. Let's begin."
  # the character sheet shown before "Ready?"; game terms are introduced once, in brackets
  sheet:
    head: "{name} ({pronouns}) is {a_people} {life} who grew up {grew_up}."
    body: "Health (Vitality) {vitality}, Focus {focus} (spent on special moves and spells), Luck (fate) {fate}"
    guard: "Guard {guard} (how hard you are to hit), dread {dread} (how much fear you can bear)"
    good: "You are good at {deep}, and also trained in {access}."
    technique: "Special move: {name} (costs {focus} Focus)"
    birth: "Since birth, you have had {what}."
    speaks: "You speak {tongues}, and you {letters}."
    reads: "can read"
    cannot_read: "cannot read"
    carries: "You carry {items}, and {coin} coins."
    wants: "What you want: \"{drive}\""
    matters: "Who matters to you: {anchor}"
    hopes: "Who you hope to become: {aspiration}"
    open: "Still to be discovered in play: {what}."
    open_words:
      thorn: "a rival"
      true_thing: "one true thing about you"
      aspiration: "who you hope to become"
    # "who grew up {grew_up}" on the sheet's first line
    grew_up:
      orig.up.wilds: "in the wilds"
      orig.up.village: "in a village"
      orig.up.streets: "on the streets"
      orig.up.townhouse: "in a guild quarter"
      orig.up.court: "at court"
      orig.up.cloister: "in a cloister"
      orig.up.road: "on the road"
      orig.up.sea: "on the water"
      orig.up.bonded: "in service"
