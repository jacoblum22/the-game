# Spec 029, P9: multi-part messages for the clue judgment. Labelled BEFORE any run.
# `about`: the held placement's about line as the engine shows it (the node's question plus the matter, never the
# answer). `qs`: the message's question parts, in order. `label`: yes = at least one part asks what this person holds;
# `part`: the 1-based part that does (none when label is no). 20 messages: 12 yes, 8 no.
# Run: py -3.12 specs/029-lead-terms-clues/clue_eval_multi.py --model haiku
scenarios:
  challenger:
    about: "who the challenger is (the matter: a quarrel in the inn turns to a challenge, and the challenger is more than they seem)"
    items:
      - {qs: ["What are the banners?", "And who is the young man really?"], label: yes, part: 2}
      - {qs: ["Who is the challenger?", "What do the banners mean?"], label: yes, part: 1}
      - {qs: ["What's the ale like here?", "Is the roast any good?"], label: no, part: none}
      - {qs: ["Who owns this inn?", "And who is that swordsman who just threw down the glove?"], label: yes, part: 2}
      - {qs: ["When does the kitchen close?", "How much for a bed?", "Who is the stranger that started the fight?"], label: yes, part: 3}
      - {qs: ["What is the penalty for drawing a blade in the inn?", "Does the watch ever come in here?"], label: no, part: none}
  omen:
    about: "what the omen shows (the matter: an omen of the wound in the sky or the earth, and the whole haven sees it)"
    items:
      - {qs: ["What do you make of the thing in the sky?", "Will it rain later?"], label: yes, part: 1}
      - {qs: ["Is the well safe to drink from?", "Did you see the omen over the walls, and what did it mean?"], label: yes, part: 2}
      - {qs: ["Do you sell cloaks?", "How far is the next town?"], label: no, part: none}
      - {qs: ["What is the price of salt?", "Do you know a good farrier?"], label: no, part: none}
  refugees_leader:
    about: "who leads the refugees (the matter: refugees arrive with a story nobody believes)"
    items:
      - {qs: ["Are there rooms free?", "Who speaks for the newcomers at the gate?"], label: yes, part: 2}
      - {qs: ["Who runs the guard here?", "What time does the market open?"], label: no, part: none}
  missing:
    about: "who is missing (the matter: a child is missing since last night, and the trail leads out of the haven)"
    items:
      - {qs: ["Is the bread fresh?", "Whose child is gone?"], label: yes, part: 2}
      - {qs: ["Who is missing, and when did you last see them?"], label: yes, part: 1}
      - {qs: ["How is the healer?", "Which road leads to the mill?"], label: no, part: none}
  offer:
    about: "who makes the offer (the matter: a powerful person offers the character work, coin and a warning)"
    items:
      - {qs: ["Where is the privy?", "Who sent you with this offer?"], label: yes, part: 2}
      - {qs: ["How much does the work pay?", "Where would I be going?"], label: no, part: none}
  way_on:
    about: "the way on: where the matter leads next (the matter: a rider dies in the market with a message for someone who is not there)"
    items:
      - {qs: ["Do you know where the rider was heading?", "And is the ale watered?"], label: yes, part: 1}
      - {qs: ["What is the weather doing?", "Who is the best smith in town?"], label: no, part: none}
      - {qs: ["Are the guards honest?", "Did anyone see which road the riders took?"], label: yes, part: 2}
