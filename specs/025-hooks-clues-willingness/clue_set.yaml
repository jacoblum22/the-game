# Spec 025, D2 A: the labelled set for the clue judgment (PR-12-10 step 1). Labelled BEFORE any run.
# `about`: the placement's about line as the engine shows it (the derived line for a seeded case: the node's question
# plus the matter, never the answer). `label`: yes = the question is about what this person holds.
# 18 yes, 18 no. Run: py -3.12 specs/025-hooks-clues-willingness/clue_eval.py --model haiku
scenarios:
  ferryman:
    about: "who had cause to want the missing ferryman gone (his debts, quarrels and enemies) (the matter: the ferryman is missing and a reward is posted)"
    items:
      - {q: "Did he have enemies?", label: yes}
      - {q: "Was anyone angry with him lately?", label: yes}
      - {q: "Did he owe anyone money?", label: yes}
      - {q: "Is the river high at the ferry this week?", label: no}
      - {q: "How much is the fare across?", label: no}
      - {q: "Do you need a hand with those nets?", label: no}
  refugees_leader:
    about: "who leads the refugees (the matter: refugees arrive with a story nobody believes)"
    items:
      - {q: "What do you know about the refugees, and where are they now?", label: yes}
      - {q: "Who's in charge of that lot that came in through the gate?", label: yes}
      - {q: "Who speaks for the newcomers?", label: yes}
      - {q: "Who leads the evening prayers at the temple?", label: no}
      - {q: "When does the gate close at night?", label: no}
      - {q: "Is the road north safe this time of year?", label: no}
  omen:
    about: "what the omen shows (the matter: an omen of the wound in the sky or the earth, and the whole haven sees it)"
    items:
      - {q: "What do you make of the thing in the sky last night?", label: yes}
      - {q: "Does the seam mean anything to you?", exchange: "Kerric: \"You saw the seam in the sky too, then.\"", label: yes}
      - {q: "Is the sign a warning, do you think?", label: yes}
      - {q: "Have you signed with Morri's Wolves, or are you still looking for work?", label: no}
      - {q: "Where can I buy a good cloak around here?", label: no}
      - {q: "What's the name of this inn?", label: no}
  offer:
    about: "who makes the offer (the matter: a powerful person offers the character work, coin and a warning)"
    items:
      - {q: "Who's really paying for this work?", label: yes}
      - {q: "Who sent you to me?", label: yes}
      - {q: "Whose coin is this, really?", label: yes}
      - {q: "Can I get some breakfast here?", label: no}
      - {q: "How long have you kept this hall?", label: no}
      - {q: "Is it going to rain today?", label: no}
  missing:
    about: "who is missing (the matter: a child is missing since last night, and the trail leads out of the haven)"
    items:
      - {q: "Who's gone missing?", label: yes}
      - {q: "Which child is it?", label: yes}
      - {q: "Whose kid didn't come home last night?", label: yes}
      - {q: "How many guards walk the walls at night?", label: no}
      - {q: "Is the smith any good?", label: no}
      - {q: "Did you sleep well?", label: no}
  way_on:
    about: "where the matter leads next: the way on (the matter: refugees arrive with a story nobody believes)"
    items:
      - {q: "Which way did they come from?", label: yes}
      - {q: "Where should I look next?", label: yes}
      - {q: "Did you see where the tracks went?", label: yes}
      - {q: "Who is the healer here?", label: no}
      - {q: "What's the price of salt this spring?", label: no}
      - {q: "Do you trust the captain of the gate?", label: no}
