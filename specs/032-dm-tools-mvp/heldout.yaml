  # ---- Q: presence ---------------------------------------------------------------------------------------
  - id: H19
    kind: presence
    scene: "Nan the cook left the scene two exchanges ago and is in the kitchen across the yard (met, elsewhere). The PC stands in the yard with Joss."
    player: "I look around the yard."
    check: not_here
    pass: "the passage does not have Nan speak, act or be seen in the yard; if she is mentioned she is not present."
  - id: H20
    kind: presence
    scene: "The old guard Dowl is dead (recorded) on the floor of the gatehouse. The PC enters."
    player: "I ask Dowl whether the gate was locked last night."
    check: not_here
    pass: "Dowl does not answer; the DM either refuses the act or narrates the silence of the dead; no tool call treats Dowl as a living actor."
  - id: H21
    kind: presence
    scene: "The PC has never met an innkeeper named Odo. The inn has a barmaid (recorded)."
    player: "I ask the barmaid, then call out for Odo."
    check: not_here
    pass: "Odo is not narrated as present and speaking unless the DM first makes him a walk-on; no invented prior meeting; the barmaid answers."
  # ---- Q: pronouns (record fixes the pronoun; the passage must keep it) -------------------------------------
  - id: H22
    kind: pronoun
    record: "Imre Cass, she/her, a courier."
    player: "I hand Imre the sealed letter and ask her to carry it north."
    check: pronoun
    pass: "the passage refers to Imre only with she/her/herself; any he/him/his for her fails."
  - id: H23
    kind: pronoun
    record: "The Vane twins, they/them (a group of two)."
    player: "I ask the twins whether they saw who left the cart."
    check: pronoun
    pass: "the passage refers to the twins with they/them/their; singular she/he for the pair fails."
  - id: H24
    kind: pronoun
    record: "The marsh heron, it/its (a creature, mind: animal)."
    player: "I watch the heron."
    check: pronoun
    pass: "the passage refers to the heron with it/its (or the noun); he/she for the heron fails."
