# Spec 032 held-out set: 24 labelled items, written in P1 BEFORE any fix exists and before any model saw them.
# Only phase P7 runs it (gate C11: at least 80 percent pass, set here, never lowered). No phase tunes on it; if one
# does, P7 says the set is spent. The labels are plain-language checks a scorer (or a person) applies to the DM's
# tool calls, the turn log and the passage. `check` names the thing looked at; `pass` is the whole rule.
# Mix (cases.md): 6 prose-only targets (R), 6 fight exchanges (F), 6 said/told passages (J), 3 presence (Q), 3 pronoun (Q).
# Scenes are fresh: none comes from the traced fighter, talker or explorer saves.
# body_sha256 (below) is the sha256 of every line after "items:"; test_spec032_cases.py::test_heldout_is_24_items... checks it.
# Verbs covered by R: strike, talk, observe, sneak, grapple, force (6 of the 15). Question kinds covered by J: 6 of 7.
body_sha256: 90f162d06276802a779f992ee5da53633564652be906eaf9b03dfd9f9b85989f
items:
  # ---- R: a target who exists only in the DM's prose ------------------------------------------------------
  - id: H01
    kind: prose_target
    verb: verb.strike
    scene: "On the wet quay a wolfhound the DM just described is lunging at the PC. No entity exists for it."
    player: "I swing my cudgel at the hound before it reaches me."
    check: propose_roll
    pass: "a propose_roll for verb.strike is accepted (not REFUSED: no one on record); the hound exists as one creature afterwards."
  - id: H02
    kind: prose_target
    verb: verb.talk
    scene: "At the market the DM described a woman selling eels from a barrel. She is not a recorded person."
    player: "I try to talk the eel seller down to half price for the whole barrel."
    check: propose_roll
    pass: "the roll or the plain answer is about the eel seller as a person (made as a walk-on here, name unknown); no REFUSED line; no second, target-less retry."
  - id: H03
    kind: prose_target
    verb: verb.observe
    scene: "A rider sits motionless on the far ridge, described by the DM in the last passage only."
    player: "I study the rider on the ridge: who are they, what do they carry?"
    check: propose_roll_or_answer
    pass: "if a roll is proposed it is accepted with the rider as target; if not, the passage describes the rider without inventing a name the DM then cannot use. No REFUSED line."
  - id: H04
    kind: prose_target
    verb: verb.sneak
    scene: "A sentry paces the wall above the postern gate (prose only, not recorded)."
    player: "I creep along the wall's shadow and slip past the sentry to the postern."
    check: propose_roll
    pass: "propose_roll with verb.sneak is accepted with the sentry as the opposing person (made as a walk-on); no REFUSED line."
  - id: H05
    kind: prose_target
    verb: verb.grapple
    scene: "A drunk lurched out of the tavern door at the PC in the last passage (prose only)."
    player: "I grab the drunk by the collar and pin him against the wall."
    check: propose_roll
    pass: "propose_roll with verb.grapple is accepted with the drunk as target; no REFUSED line."
  - id: H06
    kind: prose_target
    verb: verb.force
    scene: "The cellar hatch the DM described is stuck fast under a rotten beam (prose only, no item recorded)."
    player: "I put my shoulder to the hatch and heave it open."
    check: propose_roll
    pass: "propose_roll with verb.force is accepted with the hatch as a thing (or no target and the hatch in change_what); no REFUSED line about the hatch."
  # ---- F: fight exchanges (a recorded foe, a conflict on, the PC able) -----------------------------------
  - id: H07
    kind: fight_exchange
    scene: "Conflict on. Marek Voss (bandit, recorded) is engaged with the PC; both able."
    player: "I cut at Marek's sword arm."
    check: foe_turns
    pass: "after the PC's roll resolves (or the pause is answered) Marek takes exactly 1 foe turn this exchange, applied by code; the passage shows its result without inventing harm."
  - id: H08
    kind: fight_exchange
    scene: "Conflict on. A knocked-down PC at 5 of 12 Vitality; Marek stands over them, engaged."
    player: "I roll clear, grab my axe from the dirt, and swing at him again."
    check: propose_roll
    pass: "the DM makes a propose_roll for the swing in this turn (does not stop at a lead-up with zero tool calls); the roll targets Marek."
  - id: H09
    kind: fight_exchange
    scene: "Conflict on. Marek is engaged. The PC is not attacking."
    player: "I shout for the watch at the top of my lungs."
    check: foe_turns
    pass: "a turn was spent, so Marek takes exactly 1 foe turn this exchange; no refused or withdrawn beat spent it."
  - id: H10
    kind: fight_exchange
    scene: "Conflict on. Marek is engaged. A side alley opens to the left."
    player: "I break away and run down the alley."
    check: foe_turns
    pass: "bands widen; Marek closes one band (a foe turn that moves, not a strike); no hit lands while he is not engaged."
  - id: H11
    kind: fight_exchange
    scene: "Conflict on. Marek has 1 of 8 Vitality, engaged."
    player: "I drive my knife into his thigh."
    check: foe_turns
    pass: "if the PC's blow downs or kills Marek, 0 foe turns this exchange and the fight ends (conflict_end); if it fails, exactly 1 foe turn."
  - id: H12
    kind: fight_exchange
    scene: "Conflict on. Two foes: Marek (down already) and Sill Orren (able, engaged)."
    player: "I turn on Sill and hammer at his guard."
    check: foe_turns
    pass: "exactly 1 foe turn this exchange (Sill's); Marek, down, does not act."
  # ---- J: what an NPC says reaches the journal (the DM lists `said` or the code records it) -----------------
