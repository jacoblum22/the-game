# Seeded-error drafts for the claim check (T043; 12.3.1-12.3.2). Each case: a state (a named fixture plus
# `extra`), this turn's writes (`turn`) and adjudication record (`record`), the draft, the claims a Checker would
# extract from it, and the expected verdict per claim. tests/seeded_errors/test_verdicts.py builds each state with
# tests/fixtures/game.py (via world.py) and asserts check_claims. Verdict counts: see test_counts.

fixtures:
  archive:
    entities:
      - {kind: pc, name: Wren, quantities: {vitality: [10, 0, 10], coin: [12, 0, null], arrows: [2, 0, 20]}}
      - {kind: place, name: Old Archive}
      - {kind: place, name: Ferry Landing}
      - kind: npc
        name: Mara Voss
        data: {gender: woman, pronouns: she/her, role: fence, age: middle-aged, demeanor: guarded}
        sealed: {wants: [{text: revenge on the river guild, rank: 1}], secret: she sold the archive keys to smugglers}
        slices: {secret: she avoids any talk of keys}
        gate: standing Devoted
        quantities: {vitality: [5, 0, 5]}
      - kind: npc
        name: Tam Harlan
        data: {gender: man, pronouns: he/him, role: archive guard}
        quantities: {vitality: [3, 0, 6]}
      - {kind: npc, name: Old Ferryman, data: {role: ferryman}}
      - {kind: item, name: Iron Key, data: {holder: pc.wren}}
      - {kind: item, name: Ledger, data: {holder: npc.mara_voss}}
      - {kind: object, name: Archive Door}
    licenses:
      - {entity: pc.wren, license_id: lic.training.martial_blade, grade: trained}
    facts:
      - {subject: obj.archive_door, predicate: locked, value: true}
      - {subject: npc.mara_voss, predicate: deals_in, value: stolen books}
      - {subject: npc.tam_harlan, predicate: is_smuggler, value: true, visibility: sealed, gate: caught in the act}
      - {subject: world, predicate: smugglers_hideout, value: a cellar beneath the old mill, visibility: sealed,
         gate: found by play}
    positions:
      - {entity: pc.wren, location: loc.old_archive}
      - {entity: npc.mara_voss, location: loc.old_archive}
      - {entity: npc.tam_harlan, location: loc.old_archive}
      - {entity: npc.old_ferryman, location: loc.ferry_landing}
      - {entity: obj.archive_door, location: loc.old_archive}
    relationships:
      - {a: npc.mara_voss, b: pc.wren, value: 1}
      - {a: npc.tam_harlan, b: pc.wren, value: -2}
    knowledge:
      - {knower: pc.wren, fact: npc.mara_voss|deals_in, how: told}
    clocks:
      - name: the alarm
        segments: 6
        filled: 2
        omens: {stirring: [a bell rings somewhere above], building: [boots on the upper stairs]}
      - {name: the smugglers' plot, segments: 8, filled: 5, visibility: hidden}
    scene: {place: loc.old_archive, cast: [npc.mara_voss, npc.tam_harlan]}

# A beat the archive door cases share (anchors in YAML keep the cases short).
_beats:
  lock_success: &lock_success
    restatement: Wren picks the lock of the archive door
    actor: pc.wren
    targets: [obj.archive_door]
    rolled: true
    degree: success
    reach: standard
    reach_words: [the lock opens]
  lock_failure: &lock_failure
    restatement: Wren picks the lock of the archive door
    actor: pc.wren
    targets: [obj.archive_door]
    rolled: true
    degree: failure
  lock_cost: &lock_cost
    restatement: Wren picks the lock of the archive door
    actor: pc.wren
    targets: [obj.archive_door]
    rolled: true
    degree: success
    near_miss: true
    success_at_cost: true
    costs: [{menu_id: cost.noise, severity: S2, form: the pick snaps loudly and echoes down the hall}]
  pick_part: &pick_part {text: I pick the lock on the archive door., class: DECLARATION}

cases:
  # ------------------------------------------------------------------ supported
  - id: supported.pronoun
    fixture: archive
    draft: Mara Voss turns, and she sets down her cup.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: identity, predicate: pronoun, value: she}
    expect: [supported]
  - id: supported.arrows
    fixture: archive
    draft: You thumb your last two arrows.
    claims:
      - {sentence: 0, subject: pc.wren, class: quantity, predicate: arrows, value: last two}
    expect: [supported]
  - id: supported.key
    fixture: archive
    draft: The iron key is cold in your hand.
    claims:
      - {sentence: 0, subject: pc.wren, class: possession, predicate: holds, value: the iron key}
    expect: [supported]
  - id: supported.warm
    fixture: archive
    draft: Mara smiles at you, warmly enough.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: attitude, predicate: smiles, value: warmly}
    expect: [supported]
  - id: supported.outcome
    fixture: archive
    record: {parts: [*pick_part], beats: [*lock_success]}
    draft: The lock gives with a soft click. What do you do?
    claims:
      - {sentence: 0, subject: obj.archive_door, class: outcome, predicate: lock, value: gives with a soft click,
         asserts_change: true}
    expect: [supported]
  - id: supported.npc_action
    fixture: archive
    record:
      parts: [*pick_part]
      npc_actions: [{npc: npc.tam_harlan, action: steps aside to let you pass, source: table_row,
                     source_ref: tbl.npc_action}]
    draft: Tam Harlan steps aside.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: action, predicate: steps, value: aside, asserts_change: true}
    expect: [supported]
  - id: supported.omen
    fixture: archive
    turn: [{type: clock_ticked, clock_id: clk.the_alarm, source_ref: cost.noise, amount: 1, filled: 3,
            stage: stirring, omen_key: "stirring:0"}]
    record: {omens: [{clock_id: clk.the_alarm, stage: stirring, omen: a bell rings somewhere above}]}
    draft: Somewhere above, a bell rings.
    claims:
      - {sentence: 0, subject: unknown, class: clock, predicate: bell, value: rings somewhere above,
         asserts_change: true}
    expect: [supported]
  - id: supported.arrow_spent
    fixture: archive
    turn: [{type: quantity_changed, entity: pc.wren, quantity: arrows, delta: -1, new_value: 1, reason: shot}]
    draft: You loose the arrow; one is left.
    claims:
      - {sentence: 0, subject: pc.wren, class: quantity, predicate: arrows left, value: one, asserts_change: true}
    expect: [supported]
  - id: supported.present
    fixture: archive
    draft: Tam Harlan stands by the door.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: existence, predicate: stands, value: by the door}
    expect: [supported]
  - id: supported.slice
    fixture: archive
    draft: Mara avoids any talk of keys.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: attitude, predicate: avoids, value: any talk of keys}
    expect: [supported]
  - id: supported.player_words
    fixture: archive
    record: {parts: [{text: "I tell her: thank you, friend.", class: SPEECH}]}
    draft: '"Thank you, friend," you tell her.'
    claims:
      - {sentence: 0, subject: pc.wren, class: action, predicate: says, value: thank you friend,
         pc_words_or_feelings: true}
    expect: [supported]
  - id: supported.frightened_licensed
    fixture: archive
    extra: {conditions: [{target: pc.wren, condition_id: cond.frightened}]}
    draft: Fear grips you; your heart hammers.
    claims:
      - {sentence: 0, subject: pc.wren, class: harm_condition, predicate: fear, value: grips you,
         pc_words_or_feelings: true}
    expect: [supported]
  - id: supported.knows
    fixture: archive
    draft: You know she deals in stolen books.
    claims:
      - {sentence: 0, subject: pc.wren, class: knowledge, predicate: knows, value: deals in stolen books}
    expect: [supported]

  # ------------------------------------------------------------------ new_element
  - id: new_element.unknown_guard
    fixture: archive
    draft: A second guard leans by the stairs.
    claims:
      - {sentence: 0, subject: unknown, class: existence, predicate: guard, value: leans by the stairs}
    expect: [new_element]
    fix: [write_on_mention]  # [revision: I-127] a guard with no stated want is ordinary
  - id: new_element.window
    fixture: archive
    draft: A narrow window sits high above the shelves.
    claims:
      - {sentence: 0, subject: loc.old_archive, class: existence, predicate: has, value: a narrow window above the shelves}
    expect: [new_element]
    fix: [write_on_mention]
  - id: new_element.invented_secret
    fixture: archive
    draft: Mara secretly works for the duke.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: sealed, predicate: works for, value: the duke}
    expect: [new_element]
    fix: [cut]
  - id: new_element.storm
    fixture: archive
    draft: Somewhere a storm is massing over the hills.
    claims:
      - {sentence: 0, subject: unknown, class: clock, predicate: storm, value: massing over the hills}
    expect: [new_element]

  # ------------------------------------------------------------------ undetermined
  - id: undetermined.ferryman_pronoun
    fixture: archive
    draft: The old ferryman lifts his pole.
    claims:
      - {sentence: 0, subject: npc.old_ferryman, class: identity, predicate: pronoun, value: his}
    expect: [undetermined]
    fix: [oracle]
  - id: undetermined.tam_age
    fixture: archive
    draft: Tam Harlan is grey-bearded and old.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: identity, predicate: age, value: old}
    expect: [undetermined]
  - id: undetermined.sword
    fixture: archive
    draft: Tam wears a short sword at his hip.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: possession, predicate: wears, value: a short sword}
    expect: [undetermined]
  - id: undetermined.door_material
    fixture: archive
    draft: The archive door is heavy oak.
    claims:
      - {sentence: 0, subject: obj.archive_door, class: identity, predicate: material, value: oak}
    expect: [undetermined]

  # ------------------------------------------------------------------ contradicted
  - id: contradicted.pronoun
    fixture: archive
    draft: Mara Voss looks up, and he scowls.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: identity, predicate: pronoun, value: he}
    expect: [contradicted]
    store_value: [she/her]
  - id: contradicted.arrows
    fixture: archive
    draft: You draw one of your three arrows.
    claims:
      - {sentence: 0, subject: pc.wren, class: quantity, predicate: arrows, value: three}
    expect: [contradicted]
    store_value: ["2"]
  - id: contradicted.purse
    fixture: archive
    draft: Your purse holds twenty silver.
    claims:
      - {sentence: 0, subject: pc.wren, class: quantity, predicate: coin, value: twenty silver}
    expect: [contradicted]
  - id: contradicted.dusk
    fixture: archive
    draft: Evening light slants through the dust.
    claims:
      - {sentence: 0, subject: unknown, class: location_time, predicate: time, value: evening}
    expect: [contradicted]
  - id: contradicted.ferryman_here
    fixture: archive
    draft: The old ferryman stands beside Mara.
    claims:
      - {sentence: 0, subject: npc.old_ferryman, class: existence, predicate: stands, value: beside Mara}
    expect: [contradicted]
  - id: contradicted.mara_bleeding
    fixture: archive
    draft: Mara is bleeding from a cut on her arm.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: harm_condition, predicate: bleeding, value: from her arm}
    expect: [contradicted]
  - id: contradicted.lock
    fixture: archive
    record: {parts: [*pick_part], beats: [*lock_failure]}
    draft: The lock gives way under your pick.
    claims:
      - {sentence: 0, subject: obj.archive_door, class: outcome, predicate: lock, value: gives way, asserts_change: true}
    expect: [contradicted]
  - id: contradicted.tam_friendly
    fixture: archive
    draft: Tam greets you, warm and friendly.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: attitude, predicate: greets, value: warm and friendly}
    expect: [contradicted]
  - id: contradicted.ledger
    fixture: archive
    draft: You hold the ledger.
    claims:
      - {sentence: 0, subject: pc.wren, class: possession, predicate: holds, value: the ledger}
    expect: [contradicted]
  - id: contradicted.tam_knows
    fixture: archive
    draft: Tam knows exactly who you are.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: knowledge, predicate: knows, value: who you are}
    expect: [contradicted]
  - id: contradicted.tam_unhurt
    fixture: archive
    draft: Tam stands unhurt.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: harm_condition, predicate: state, value: unhurt}
    expect: [contradicted]

  # ------------------------------------------------------------------ unsourced_change
  - id: unsourced.coins
    fixture: archive
    draft: You spend two coins on a lantern.
    claims:
      - {sentence: 0, subject: pc.wren, class: quantity, predicate: coin, value: spend two, asserts_change: true}
    expect: [unsourced_change]
  - id: unsourced.mara_dies
    fixture: archive
    draft: Mara crumples, dead.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: harm_condition, predicate: dies, value: dead, asserts_change: true}
    expect: [unsourced_change]
  - id: unsourced.tam_attacks
    fixture: archive
    record: {parts: [*pick_part], beats: [*lock_success]}
    draft: Tam draws his sword and lunges at you.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: action, predicate: lunges, value: at you with his sword,
         asserts_change: true}
    expect: [unsourced_change]
  - id: unsourced.mara_moves
    fixture: archive
    draft: Mara moves to the door.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: position, predicate: moves, value: to the door, asserts_change: true}
    expect: [unsourced_change]
  - id: unsourced.pocket_ledger
    fixture: archive
    draft: You pocket the ledger.
    claims:
      - {sentence: 0, subject: pc.wren, class: possession, predicate: pockets, value: the ledger, asserts_change: true}
    expect: [unsourced_change]
  - id: unsourced.mara_softens
    fixture: archive
    draft: Mara softens toward you.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: attitude, predicate: softens, value: toward you, asserts_change: true}
    expect: [unsourced_change]
  - id: unsourced.rat
    fixture: archive
    draft: A rat scurries off with your bread.
    claims:
      - {sentence: 0, subject: unknown, class: action, predicate: scurries off, value: with your bread, asserts_change: true}
    expect: [unsourced_change]
  - id: unsourced.alarm
    fixture: archive
    draft: The alarm spreads through the halls.
    claims:
      - {sentence: 0, subject: unknown, class: clock, predicate: the alarm, value: spreads through the halls,
         asserts_change: true}
    expect: [unsourced_change]
  - id: unsourced.frightened
    fixture: archive
    draft: Tam goes pale with fear.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: harm_condition, predicate: fear, value: goes pale, asserts_change: true}
    expect: [unsourced_change]

  # ------------------------------------------------------------------ overreach
  - id: overreach.blade_lock
    fixture: archive
    draft: Your bladework training lets you pick any lock.
    claims:
      - {sentence: 0, subject: pc.wren, class: capability, predicate: bladework, value: pick any lock}
    expect: [overreach]
  - id: overreach.spellcraft
    fixture: archive
    draft: Your spellcraft unseals the door.
    claims:
      - {sentence: 0, subject: pc.wren, class: capability, predicate: spellcraft, value: unseals the door}
    expect: [overreach]
  - id: overreach.flawless
    fixture: archive
    record: {parts: [*pick_part], beats: [*lock_success]}
    draft: You open it flawlessly, without a sound.
    claims:
      - {sentence: 0, subject: obj.archive_door, class: outcome, predicate: opens, value: flawlessly without a sound,
         asserts_change: true}
    expect: [overreach]
  - id: overreach.no_cost
    fixture: archive
    record: {parts: [*pick_part], beats: [*lock_success]}
    draft: The lock opens, but it costs you your footing.
    claims:
      - {sentence: 0, subject: pc.wren, class: outcome, predicate: costs you, value: your footing}
    expect: [overreach]
  - id: overreach.other_cost
    fixture: archive
    record: {parts: [*pick_part], beats: [*lock_cost]}
    draft: The lock opens, but the price is a gashed hand.
    claims:
      - {sentence: 0, subject: pc.wren, class: outcome, predicate: price, value: a gashed hand}
    expect: [overreach]

  # ------------------------------------------------------------------ leak
  - id: leak.smuggler
    fixture: archive
    draft: Tam is a smuggler, you can tell.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: sealed, predicate: is smuggler, value: "yes"}
    expect: [leak]
  - id: leak.wants
    fixture: archive
    draft: Mara burns for revenge on the river guild.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: attitude, predicate: wants, value: revenge on the river guild}
    expect: [leak]
  - id: leak.hideout
    fixture: archive
    draft: The smugglers keep a cellar beneath the old mill.
    claims:
      - {sentence: 0, subject: unknown, class: location_time, predicate: hideout, value: a cellar beneath the old mill}
    expect: [leak]
  - id: leak.hidden_clock
    fixture: archive
    draft: The smugglers' plot is nearly ripe.
    claims:
      - {sentence: 0, subject: unknown, class: clock, predicate: the smugglers' plot, value: nearly ripe}
    expect: [leak]
  - id: leak.secret_with_slice
    fixture: archive
    draft: Mara sold the archive keys to smugglers.
    claims:
      - {sentence: 0, subject: npc.mara_voss, class: sealed, predicate: sold, value: the archive keys to smugglers}
    expect: [leak]
    fix: [replace_with_slice]

  # ------------------------------------------------------------------ pc_agency
  - id: pc_agency.relief
    fixture: archive
    record: {parts: [*pick_part], beats: [*lock_success]}
    draft: You feel a wave of relief.
    claims:
      - {sentence: 0, subject: pc.wren, class: harm_condition, predicate: feel, value: a wave of relief,
         pc_words_or_feelings: true}
    expect: [pc_agency]
  - id: pc_agency.thanks
    fixture: archive
    record: {parts: [*pick_part], beats: [*lock_success]}
    draft: '"Thank you," you tell Mara.'
    claims:
      - {sentence: 0, subject: pc.wren, class: action, predicate: says, value: thank you, pc_words_or_feelings: true}
    expect: [pc_agency]
  - id: pc_agency.decides
    fixture: archive
    record: {parts: [*pick_part], beats: [*lock_success]}
    draft: You decide to wait by the stairs.
    claims:
      - {sentence: 0, subject: pc.wren, class: action, predicate: decides to wait, value: by the stairs,
         pc_words_or_feelings: true}
    expect: [pc_agency]

  # ------------------------------------------------------------------ several claims in one draft
  - id: mixed.tam_steps_and_lies
    fixture: archive
    record:
      parts: [*pick_part]
      beats: [*lock_success]
      npc_actions: [{npc: npc.tam_harlan, action: steps aside, source: refusal, source_ref: npc.tam_harlan/refusal.1}]
    draft: Tam, a big man, steps aside, and Mara pockets her last three coins.
    claims:
      - {sentence: 0, subject: npc.tam_harlan, class: identity, predicate: gender, value: man}
      - {sentence: 0, subject: npc.tam_harlan, class: action, predicate: steps, value: aside, asserts_change: true}
      - {sentence: 0, subject: npc.mara_voss, class: possession, predicate: pockets, value: three coins, asserts_change: true}
    expect: [supported, supported, unsourced_change]
